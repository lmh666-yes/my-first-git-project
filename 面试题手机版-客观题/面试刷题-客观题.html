dx7zmMc85jGP2cZ89J3HPOYxj3nMY7YxH33nMY95zGMe85htzEffecxjHvOYxzxmG/i6666b9Q+dxzzmMY95zOOgxnzuO495zGMe85gHmmX8f6H0fM91g74sAAAAAElFTkSuQmCC"]}, {"id": "choice-137", "kind": "choice", "kind_name": "单选题", "num": 137, "stem": "参考第 6 题电路，如果 FB=0.5V，RFBB=10K，RFBT=100K，则 VOUT=（　）", "options": [{"key": "A", "text": "5.0V"}, {"key": "B", "text": "5.5V"}, {"key": "C", "text": "6.0V"}, {"key": "D", "text": "6.5V"}], "answer": "B", "explain": "本题考查反馈分压公式。VOUT = VFB×(1 + RFBT/RFBB) = 0.5×(1+100k/10k) = 0.5×11 = 5.5V（B）。推导：FB 节点 VFB = VOUT×RFBB/(RFBT+RFBB)，变形即上式。", "imgs": []}, {"id": "multi-138", "kind": "multi", "kind_name": "多选题", "num": 138, "stem": "单片机最小系统至少包括（　）【多选】", "options": [{"key": "A", "text": "电源"}, {"key": "B", "text": "时钟源电路"}, {"key": "C", "text": "复位电路"}, {"key": "D", "text": "模拟电源"}], "answer": "ABC", "explain": "本题考查单片机最小系统组成（多选）。最小系统 = 电源 + 时钟源 + 复位电路（再加启动/下载电路）即可让 MCU 运行程序（A、B、C）；“模拟电源”不是必需构成（D 错）。", "imgs": []}, {"id": "choice-139", "kind": "choice", "kind_name": "单选题", "num": 139, "stem": "电源的 BOOST 拓扑结构有（　）", "options": [{"key": "A", "text": "升压电路"}, {"key": "B", "text": "降压电路"}, {"key": "C", "text": "升降压电路"}], "answer": "A", "explain": "本题考查 DCDC 拓扑分类。BOOST = 升压（输出高于输入，A）；BUCK = 降压；BUCK-BOOST = 升降压（反相输出）。", "imgs": []}, {"id": "choice-140", "kind": "choice", "kind_name": "单选题", "num": 140, "stem": "在焊接阻容时，下面哪一个温度范围最合适（　）", "options": [{"key": "A", "text": "100~199℃"}, {"key": "B", "text": "200~299℃"}, {"key": "C", "text": "300~399℃"}, {"key": "D", "text": "400~499℃"}], "answer": "C", "explain": "本题考查焊接工艺温度（两种口径题）。手工电烙铁：焊点温度取焊料熔点 +100~150℃（有铅 183℃、无铅 217℃），常用 300~350℃ → 选 300~399℃（C）；100~199℃ 无法可靠焊接，400℃ 以上易损伤元件与烙铁头。回流焊峰值约 235~250℃，按该口径则选 200~299℃（B）。本答案按手工焊口径取 C，请以原卷标准答案为准。", "imgs": []}, {"id": "choice-141", "kind": "choice", "kind_name": "单选题", "num": 141, "stem": "若输入 B，则以下程序运行后的输出结果是（　）\nint main(void)\n{\n    char grade;\n    scanf(\"%c\",&grade);\n    switch(grade)\n    {\n    case 'A':\n        printf(\">=85\");\n    case 'B':\n    case 'C':\n        printf(\">=60\");\n    case 'D':\n        printf(\"<60\");\n    default:\n        printf(\"error\");\n    }\n}", "options": [{"key": "A", "text": "error."}, {"key": "B", "text": ">=60"}, {"key": "C", "text": ">=85"}, {"key": "D", "text": ">=60<60error."}], "answer": "D", "explain": "本题考查 switch 贯穿执行。grade='B' 匹配 case 'B'，因无 break 依次贯穿：输出 \">=60\"（case C）→ \"<60\"（case D）→ \"error\"（default），连起来为 \">=60<60error\"（D）。若输入 'A' 则输出 \">=85>=60<60error\"，可自行验证。", "imgs": []}, {"id": "choice-142", "kind": "choice", "kind_name": "单选题", "num": 142, "stem": "以下代码的输出是？（　）\nint main() {\n    int a = 10, b = 20;\n    printf(\"%d\\n\", (a++) + (++b));\n    return 0;\n}", "options": [{"key": "A", "text": "30"}, {"key": "B", "text": "31"}, {"key": "C", "text": "32"}, {"key": "D", "text": "33"}], "answer": "B", "explain": "本题考查自增的先/后语义。(a++) 取旧值 10、(++b) 先加得 21，10+21 = 31（B）。求值后 a=11、b=21。", "imgs": []}, {"id": "choice-143", "kind": "choice", "kind_name": "单选题", "num": 143, "stem": "以下哪种操作会导致栈溢出？（　）", "options": [{"key": "A", "text": "递归调用未设置终止条件"}, {"key": "B", "text": "定义大型全局数组"}, {"key": "C", "text": "使用 malloc 分配大量内存"}, {"key": "D", "text": "函数返回局部变量指针"}], "answer": "A", "explain": "本题考查栈溢出的成因。递归无终止条件 → 每次调用压栈、栈帧耗尽 → 栈溢出（A）。大型全局数组占静态区（B）；malloc 占堆（C），堆问题表现为分配失败/泄漏；返回局部变量指针（D）是悬空指针问题。", "imgs": []}, {"id": "choice-144", "kind": "choice", "kind_name": "单选题", "num": 144, "stem": "结构体对齐中，以下结构体的大小是？（　）（假设 int=4 字节，char=1 字节）\nstruct Test {\n    char a;\n    int b;\n    char c;\n};", "options": [{"key": "A", "text": "8 字节"}, {"key": "B", "text": "10 字节"}, {"key": "C", "text": "12 字节"}, {"key": "D", "text": "16 字节"}], "answer": "C", "explain": "本题考查结构体对齐（配代码题）。规则：成员偏移必须是其自身大小的整数倍；结构体总大小为最大成员大小的整数倍。布局：a 偏移 0（1B）→填充 3B→ b 偏移 4（4B）→ c 偏移 8（1B）→尾部填充 3B，共 12 字节（C）。调整成员顺序（int→char→char）可省 3 字节。", "imgs": []}, {"id": "choice-145", "kind": "choice", "kind_name": "单选题", "num": 145, "stem": "关于 static 关键字，错误的是？（　）", "options": [{"key": "A", "text": "修饰局部变量时，延长其生命周期"}, {"key": "B", "text": "修饰全局变量时，限制其作用域为当前文件"}, {"key": "C", "text": "修饰函数时，限制其作用域为当前文件"}, {"key": "D", "text": "修饰全局变量时，其内存位于堆区"}], "answer": "D", "explain": "本题考查 static 的存储位置。static 全局/局部变量都位于静态存储区（.data/.bss），不是堆区（D 错）；A（延长生命周期）、B、C（限制链接性为当前文件）均为正确用法。题目选错误项 → D。", "imgs": []}, {"id": "choice-146", "kind": "choice", "kind_name": "单选题", "num": 146, "stem": "关于中断的说法，错误的是（　）", "options": [{"key": "A", "text": "中断可以提高系统的实时性"}, {"key": "B", "text": "中断服务程序必须在规定时间内完成"}, {"key": "C", "text": "中断只能由硬件触发"}, {"key": "D", "text": "中断向量表存储了中断服务程序的入口地址"}], "answer": "C", "explain": "本题考查中断的基本概念。中断源既可以是硬件（定时器、外设、引脚）也可以是软件（SVC 指令、置位软件中断寄存器），“只能由硬件触发”错误（C）；A、B、D（向量表存入口地址）均为正确说法。", "imgs": []}, {"id": "choice-147", "kind": "choice", "kind_name": "单选题", "num": 147, "stem": "电脑系统一般安装在硬盘的哪个磁盘（　）", "options": [{"key": "A", "text": "C盘"}, {"key": "B", "text": "D盘"}, {"key": "C", "text": "E盘"}, {"key": "D", "text": "F盘"}], "answer": "A", "explain": "本题考查计算机基础常识。Windows 默认把系统安装在第一块硬盘的第一个可用主分区，盘符习惯为 C 盘（系统盘），用户数据常放 D/E/F。故选 A。", "imgs": []}, {"id": "choice-148", "kind": "choice", "kind_name": "单选题", "num": 148, "stem": "要做一份简单的工具清单表格，用以下哪个软件做最合适（　）", "options": [{"key": "A", "text": "记事本"}, {"key": "B", "text": "Excel"}, {"key": "C", "text": "Access"}, {"key": "D", "text": "Word"}], "answer": "B", "explain": "本题考查办公软件选型。制作简单工具清单/表格用 Excel 最合适（表格结构、公式、排序筛选直接可用）（B）；记事本无表格结构；Word 适合文档排版、表格能力弱；Access 是数据库软件、门槛高。", "imgs": []}, {"id": "choice-149", "kind": "choice", "kind_name": "单选题", "num": 149, "stem": "设有说明语句：`enum color {red,yellow,blue,white};` 那么 yellow 的值为（　）", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "YELLOW"}, {"key": "D", "text": "yellow"}], "answer": "A", "explain": "本题考查枚举默认值。未显式赋值时首成员 = 0，后续依次 +1：red=0、yellow=1（A）。若定义 enum color {red=5, yellow}; 则 yellow=6（可显式指定起始值）。", "imgs": []}, {"id": "choice-150", "kind": "choice", "kind_name": "单选题", "num": 150, "stem": "i=4，那么语句 `j=i+++1` 执行后的结果应该是（　）", "options": [{"key": "A", "text": "i=4,j=6"}, {"key": "B", "text": "i=5,j=6"}, {"key": "C", "text": "i=5,j=5"}, {"key": "D", "text": "i=6,j=6"}], "answer": "C", "explain": "本题考查运算符贪婪匹配。`i+++1` 按最长匹配解析为 `(i++)+1`：表达式值 = 4+1 = 5，i 自增为 5，故 i=5、j=5（C）。（原卷识别文本 C 选项有重复，正确值为 i=5, j=5。）", "imgs": []}, {"id": "choice-151", "kind": "choice", "kind_name": "单选题", "num": 151, "stem": "设 a,b 为整型数，且 a=2,b=4，则表达式 `(a/b?b:a:b-a)` 的值为（　）", "options": [{"key": "A", "text": "0.5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "2"}, {"key": "D", "text": "此表达式错误"}], "answer": "C", "explain": "本题考查三目运算符。按原题意图（a/b 为假时取 b−a）：a/b = 2/4 = 0 → 条件为假 → 结果 b−a = 4−2 = 2（C）。附注：若严格按字面解析，\"a/b?b:a:b-a\" 含两个冒号、并非合法的条件表达式（这正是选项 D“表达式错误”的来源）；原卷应为 a/b?b:b-a 的转写误差，请对照原卷，按 C 掌握。", "imgs": []}, {"id": "choice-152", "kind": "choice", "kind_name": "单选题", "num": 152, "stem": "设 n=10, i=4，则赋值运算 `n%=i+1` 执行后 n 的值为（　）", "options": [{"key": "A", "text": "0"}, {"key": "B", "text": "1"}, {"key": "C", "text": "2"}, {"key": "D", "text": "3"}], "answer": "A", "explain": "本题考查复合赋值。`n %= i+1` 等价 `n = n % (i+1)`：10 % 5 = 0（A）。注意右侧表达式整体求值后参与取模。", "imgs": []}, {"id": "choice-153", "kind": "choice", "kind_name": "单选题", "num": 153, "stem": "控制单片机输出 PWM 控制信号需要用到的资源（　）", "options": [{"key": "A", "text": "ADC"}, {"key": "B", "text": "看门狗"}, {"key": "C", "text": "定时器"}, {"key": "D", "text": "SPI 接口"}], "answer": "C", "explain": "本题考查 PWM 的实现资源。PWM 由定时器（TIM）产生：计数器循环计数、比较寄存器设定占空比，硬件在比较匹配时翻转输出，不占 CPU（C）。ADC 是模数采集，看门狗是复位监控，SPI 是通信接口，均与 PWM 无直接关系。", "imgs": []}, {"id": "choice-154", "kind": "choice", "kind_name": "单选题", "num": 154, "stem": "计算机能识别的语言是（　）。", "options": [{"key": "A", "text": "汇编语言"}, {"key": "B", "text": "自然语言"}, {"key": "C", "text": "机器语言"}, {"key": "D", "text": "高级语言"}], "answer": "C", "explain": "本题考查计算机语言层次。CPU 只能直接识别和执行机器语言（二进制指令编码，C）；汇编语言需汇编器翻译；高级语言需编译/解释；自然语言是人类的语言。", "imgs": []}, {"id": "choice-155", "kind": "choice", "kind_name": "单选题", "num": 155, "stem": "在中断服务程序中，至少应有一条（　）。", "options": [{"key": "A", "text": "传送指令"}, {"key": "B", "text": "转移指令"}, {"key": "C", "text": "加法指令"}, {"key": "D", "text": "中断返回指令"}], "answer": "D", "explain": "本题考查中断服务程序结构。ISR 执行完必须返回被中断的程序：至少包含一条中断返回指令（51 中为 RETI；Cortex-M 由硬件完成异常返回）（D）。传送/加法指令是可选操作，转移指令只是内部控制流；缺了“返回”则无法回到主程序。", "imgs": []}, {"id": "choice-156", "kind": "choice", "kind_name": "单选题", "num": 156, "stem": "当 AT89C52 单片机系统的振荡晶体频率为 24MHz 时，其一个机器周期的时间是（　）。", "options": [{"key": "A", "text": "0.5μS"}, {"key": "B", "text": "1μS"}, {"key": "C", "text": "2μS"}, {"key": "D", "text": "4μS"}], "answer": "A", "explain": "本题考查 51 单片机的机器周期。传统 51（12T 模式）1 个机器周期 = 12 个振荡周期：12/24MHz = 0.5μs（A）。若为 1T 内核型号则机器周期 = 1/24MHz ≈ 41.7ns，需看芯片规格。", "imgs": []}, {"id": "choice-157", "kind": "choice", "kind_name": "单选题", "num": 157, "stem": "代码生成阶段的主要任务是：（　）", "options": [{"key": "A", "text": "把高级语言翻译成机器语言"}, {"key": "B", "text": "把高级语言翻译成汇编语言"}, {"key": "C", "text": "把中间代码变换成依赖具体机器的目标代码"}, {"key": "D", "text": "把汇编语言翻译成机器语言"}], "answer": "C", "explain": "本题考查编译原理中编译阶段的划分。编译过程：词法 → 语法 → 语义/中间代码 → 优化 → 代码生成。代码生成阶段把中间表示变换为依赖具体机器的目标代码（C）。A/B/D 是整体翻译方向或汇编器的工作，不是“代码生成阶段”的准确职责。", "imgs": []}, {"id": "choice-158", "kind": "choice", "kind_name": "单选题", "num": 158, "stem": "C++ 中关于堆和栈的说法，哪个是错误的：（　）", "options": [{"key": "A", "text": "堆的大小仅受操作系统的限制，栈的大小一般较小"}, {"key": "B", "text": "在堆上频繁的调用 new/delete 容易产生内存碎片，栈没有这个问题"}, {"key": "C", "text": "堆和栈都可以静态分配"}, {"key": "D", "text": "堆和栈都可以动态分配"}], "answer": "C", "explain": "本题考查堆与栈的分配方式（选错误项）。栈一般较小（Windows 默认约 1~8MB）、堆较大受系统限制（A 对）；堆频繁 new/delete 易产生碎片、栈无此问题（B 对）；静态分配的对象位于静态存储区，既不在堆也不在栈——“堆和栈都可以静态分配”错误（C 是本题答案）；栈也可运行期分配（alloca/VLA，D 对）。", "imgs": []}, {"id": "judge-159", "kind": "judge", "kind_name": "判断题", "num": 159, "stem": "构造函数、析构函数能被继承或取地址（　）", "options": [], "answer": "×", "explain": "错误。构造函数与析构函数不能被继承（派生类各需自己的构造/析构），也不能取地址（不允许 &ClassName::ClassName）；派生类构造时基类构造函数被调用，那是“调用”而非继承。", "imgs": []}, {"id": "judge-160", "kind": "judge", "kind_name": "判断题", "num": 160, "stem": "构造函数可以重载，但析构函数只有一个（　）", "options": [], "answer": "√", "explain": "正确。构造函数可带不同参数列表重载（默认构造、带参构造、拷贝构造等）；析构函数不能带参数、不能重载，一个类只有唯一一个析构函数（可为 virtual）。", "imgs": []}, {"id": "judge-161", "kind": "judge", "kind_name": "判断题", "num": 161, "stem": "返回值类型为引用类型的函数可以返回局部变量（　）", "options": [], "answer": "×", "explain": "错误。返回局部变量的引用是悬空引用（局部对象随栈帧销毁，引用指向已失效存储），访问属未定义行为。可行方案：返回值拷贝、返回静态/全局变量引用、返回对象成员引用或返回堆对象/智能指针。", "imgs": []}, {"id": "judge-162", "kind": "judge", "kind_name": "判断题", "num": 162, "stem": "静态成员函数没有 this 指针（　）", "options": [], "answer": "√", "explain": "正确。静态成员函数属于类而非对象，没有隐含的 this 指针，因此不能直接访问非静态成员；调用无需对象（ClassName::func() 即可）。", "imgs": []}, {"id": "judge-163", "kind": "judge", "kind_name": "判断题", "num": 163, "stem": "静态成员函数可以直接访问非静态成员变量（　）", "options": [], "answer": "×", "explain": "错误。静态成员函数没有 this，无法确定操作哪个对象 → 不能直接访问非静态成员变量/函数；如需访问必须显式传入对象（对象.成员 或 指针->成员）。", "imgs": []}, {"id": "judge-164", "kind": "judge", "kind_name": "判断题", "num": 164, "stem": "const 类型的变量声明时可以不用初始化（　）", "options": [], "answer": "×", "explain": "错误。const 变量必须在声明时初始化（“只读”语义要求初值），之后不可赋值；类内 const 成员则必须在构造函数的初始化列表中初始化。局部 const 变量亦然。", "imgs": []}, {"id": "judge-165", "kind": "judge", "kind_name": "判断题", "num": 165, "stem": "const 类型的对象只能访问 const 类型的成员函数，构造函数、析构函数除外（　）", "options": [], "answer": "√", "explain": "正确。const 对象的隐含 this 是 const 指针，只能调用带 const 限定的成员函数；构造函数/析构函数例外（它们在对象生死节点必然被调用，不受 cv 限定约束）。", "imgs": []}, {"id": "judge-166", "kind": "judge", "kind_name": "判断题", "num": 166, "stem": "const 类型的对象如果作为实参，只能传递给 const 类型的形参（　）", "options": [], "answer": "√", "explain": "正确（按引用/指针形参理解）。const 对象绑定时不允许丢弃 const 限定：只能传给 const 引用/const 指针形参；若形参是非 const 引用/指针则编译错误。补充：按值传参会捎贝、不涉及限定问题。", "imgs": []}, {"id": "judge-167", "kind": "judge", "kind_name": "判断题", "num": 167, "stem": "volatile 类型的对象只能访问 volatile 类型的成员函数，构造函数、析构函数除外（　）", "options": [], "answer": "√", "explain": "正确。C++ 的 cv 限定与 const 规则对称：volatile 对象只能调用 volatile 成员函数（隐含 this 为 volatile 指针），构造/析构函数同样例外；实际编码中 volatile 成员函数很少用，但语言规则成立。", "imgs": []}, {"id": "judge-168", "kind": "judge", "kind_name": "判断题", "num": 168, "stem": "复合类调用构造函数时，成员对象的构造函数调用顺序取决于复合类的构造函数初始化列表（　）", "options": [], "answer": "×", "explain": "错误。复合类中成员对象的构造顺序由成员在类中的“声明顺序”决定，与构造函数初始化列表的书写顺序无关；但初始化列表最好按声明顺序书写，以免 -Wreorder 警告与误解。", "imgs": []}, {"id": "choice-169", "kind": "choice", "kind_name": "单选题", "num": 169, "stem": "不属于 C++ 面向对象特性的是（　）", "options": [{"key": "A", "text": "封装"}, {"key": "B", "text": "继承"}, {"key": "C", "text": "多态"}, {"key": "D", "text": "指针"}], "answer": "D", "explain": "本题考查面向对象三大特性。封装、继承、多态是 OOP 三大特性（A、B、C）；指针是 C/C++ 的语言机制，与面向对象范式无必然关系。故选 D。", "imgs": []}, {"id": "choice-170", "kind": "choice", "kind_name": "单选题", "num": 170, "stem": "关于静态变量说法错误的是（　）", "options": [{"key": "A", "text": "存储在全…局区"}, {"key": "B", "text": "生命周期贯穿整个程序"}, {"key": "C", "text": "每次函数调用重新初始化"}, {"key": "D", "text": "作用域限于函数 / 文件内"}], "answer": "C", "explain": "本题考查静态变量性质（选错误项）。静态变量：位于静态存储区（A 对）、生命周期贯穿程序（B 对）、只初始化一次（C 错——不会每次调用重新初始化）、作用域限于函数/文件（D 对）。故选 C。", "imgs": []}, {"id": "choice-171", "kind": "choice", "kind_name": "单选题", "num": 171, "stem": "深拷贝的主要目的是（　）", "options": [{"key": "A", "text": "提升执行速度"}, {"key": "B", "text": "避免重复释放与数据冲突"}, {"key": "C", "text": "节省内存"}, {"key": "D", "text": "简化代码"}], "answer": "B", "explain": "本题考查深拷贝的意义。默认浅拷贝仅复制指针值，两个对象共享同一堆内存：一方析构后另一方成悬空指针，还可能重复释放（B）。深拷贝为新对象分配独立资源、逐内容复制，从根本上避免共享冲突；与性能/省内存无关。", "imgs": []}, {"id": "choice-172", "kind": "choice", "kind_name": "单选题", "num": 172, "stem": "以下会造成内存泄漏的是（　）", "options": [{"key": "A", "text": "new 未 delete"}, {"key": "B", "text": "栈变量超出作用域"}, {"key": "C", "text": "指针置空"}, {"key": "D", "text": "局部数组"}], "answer": "A", "explain": "本题考查内存泄漏的成因。new/malloc 分配的堆内存未 delete/free → 无法再回收（A）。栈变量超作用域自动释放（B）；指针置空本身不是泄漏原因（若原堆块未释放且引用丢失才是泄漏，C 不准确）；局部数组在栈上自动回收（D）。故选 A。", "imgs": []}, {"id": "judge-173", "kind": "judge", "kind_name": "判断题", "num": 173, "stem": "malloc 分配的内存不会自动初始化，new 会调用构造函数。（　）", "options": [], "answer": "√", "explain": "正确。malloc/free 只分配/释放原始内存，不调用构造/析构；new/delete 在分配内存的同时调用构造函数、delete 先析构再释放。C++ 中对象分配应优先用 new。", "imgs": []}, {"id": "judge-174", "kind": "judge", "kind_name": "判断题", "num": 174, "stem": "野指针只包含未初始化的指针。（　）", "options": [], "answer": "×", "explain": "错误。“野指针”泛指指向不可用内存的指针：未初始化指针、释放后未置空的悬空指针、越界访问产生的指针都算。故“只包含未初始化指针”不成立。", "imgs": []}, {"id": "judge-175", "kind": "judge", "kind_name": "判断题", "num": 175, "stem": "多线程一定比单线程执行更快。（　）", "options": [], "answer": "×", "explain": "错误。多线程能否更快取决于：可并行比例（Amdahl 定律）、同步/通信开销、CPU 核数与负载均衡；单核上多线程还可能因切换开销更慢。故“一定更快”错误。", "imgs": []}, {"id": "judge-176", "kind": "judge", "kind_name": "判断题", "num": 176, "stem": "栈内存由系统自动分配与释放。（　）", "options": [], "answer": "√", "explain": "正确。栈内存由编译器插入的入栈/出栈指令与运行期栈指针自动管理：函数调用自动分配局部空间、返回自动回收；栈溢出、返回局部指针是常见坑。", "imgs": []}, {"id": "choice-177", "kind": "choice", "kind_name": "单选题", "num": 177, "stem": "你正在完成紧急模块，突然需求细节变更，且需在原截止时间交付，你会：（　）", "options": [{"key": "A", "text": "反复确认变更原因，暂停当前工作"}, {"key": "B", "text": "快速评估影响，调整方案，优先保证交付"}, {"key": "C", "text": "直接表示无法完成，要求延期"}, {"key": "D", "text": "继续按原计划执行，等追问再处理"}], "answer": "B", "explain": "本题考查工程素养（行为判断题）。正确做法：快速评估变更影响、调整方案并优先保证交付（B）——体现主动性与交付意识；A 暂停工作反复确认会耽误进度；C 直接要求延期缺乏建设性；D 无视变更消极等待会放大风险。", "imgs": []}, {"id": "choice-178", "kind": "choice", "kind_name": "单选题", "num": 178, "stem": "代码提交后测试发现问题，但原因不在你的模块，你会：（　）", "options": [{"key": "A", "text": "主动协助定位，推动整体解决"}, {"key": "B", "text": "说明不是自己负责，不参与"}, {"key": "C", "text": "等待负责人自行处理"}, {"key": "D", "text": "明确划分责任，避免背锅"}], "answer": "A", "explain": "本题考查团队协作素养。问题在他人模块：应主动协助定位（提供现象、日志、复现步骤）并推动整体解决（A）；“不是我的不参与/等待/划清责任”都不利于交付，团队目标是让问题被解决而非界定责任。", "imgs": []}, {"id": "choice-179", "kind": "choice", "kind_name": "单选题", "num": 179, "stem": "同一时段收到 3 项优先级相近的任务，你会：（　）", "options": [{"key": "A", "text": "随机挑选一项开始"}, {"key": "B", "text": "评估工作量与依赖，同步负责人确认顺序"}, {"key": "C", "text": "全部并行推进"}, {"key": "D", "text": "只做最简单的任务"}], "answer": "B", "explain": "本题考查任务管理素养。多任务优先级相近时：先评估工作量与依赖关系，再与负责人同步确认优先级（B）；随机开始、全部并行、只做简单任务都不是专业做法。", "imgs": []}, {"id": "choice-180", "kind": "choice", "kind_name": "单选题", "num": 180, "stem": "若有说明：`int a=2，*p=&a，*q=p;`，则以下非法的赋值语句是（　）", "options": [{"key": "A", "text": "`p=q;`"}, {"key": "B", "text": "`*p=*q;`"}, {"key": "C", "text": "`a=*q;`"}, {"key": "D", "text": "`q=a;`"}], "answer": "D", "explain": "本题考查指针与整型的类型匹配。int a=2, *p=&a, *q=p：A：p=q（指针赋值）合法；B：*p=*q（值赋值）合法；C：a=*q（取值赋给 a）合法；D：q=a 把整型赋给指针，类型不匹配、非法。故选 D。", "imgs": []}, {"id": "choice-181", "kind": "choice", "kind_name": "单选题", "num": 181, "stem": "已有定义 `int a=2，*p1=&a，*p2=&a;` 下面不能正确执行的赋值语句是（　）", "options": [{"key": "A", "text": "`a=*p1+*p2;`"}, {"key": "B", "text": "`p1=a;`"}, {"key": "C", "text": "`p1=p2;`"}, {"key": "D", "text": "`a=*p1*(*p2);`"}], "answer": "B", "explain": "本题考查指针赋值规则。p1、p2 均指向 a：A：a=*p1+*p2 = 4 合法；B：p1=a 把整数 2 赋给指针 → 类型错误，不能正确执行；C：p1=p2（同类指针互赋）合法；D：a=*p1*(*p2) = 4 合法。故选 B。", "imgs": []}, {"id": "choice-182", "kind": "choice", "kind_name": "单选题", "num": 182, "stem": "Declare a pointer to the text string \"Hello\" called message.", "options": [{"key": "A", "text": "`char message = \"Hello\";`"}, {"key": "B", "text": "`*message = \"Hello\";`"}, {"key": "C", "text": "`char *message = \"Hello\";`"}, {"key": "D", "text": "`char message = 'Hello';`"}], "answer": "C", "explain": "本题考查字符串指针声明。指向字符串常量的指针：`char *message = \"Hello\";`（c）；a 是单字符赋值（类型错误）；b 缺类型且解引用未初始化指针；d 用单引号包多字符（非法）。", "imgs": []}, {"id": "choice-183", "kind": "choice", "kind_name": "单选题", "num": 183, "stem": "What is the output of the following program segment?\nint count = 10, *temp, sum = 0;\ntemp = &count;\n*temp = 20;\ntemp = &sum;\n*temp = count;\nprintf(\"count = %d, *temp = %d, sum = %d\\n\", count, *temp, sum );", "options": [{"key": "A", "text": "count = 2, *temp = 10, sum = 10"}, {"key": "B", "text": "count = 20, *temp = 20, sum = 20"}, {"key": "C", "text": "count = 10, *temp = 2, sum = 10"}, {"key": "D", "text": "count = 200, *temp = 0.2, sum = 1"}], "answer": "B", "explain": "本题考查指针间接赋值。temp=&count 后 *temp=20 → count=20；temp=&sum 后 *temp=count → sum=20；printf 时 temp 指向 sum。输出 count=20, *temp=20, sum=20（b）。", "imgs": []}, {"id": "choice-184", "kind": "choice", "kind_name": "单选题", "num": 184, "stem": "If data is defined as an array of int, which has 10 items: `int data[10];`. Which one CANNOT give the address of data[1]?", "options": [{"key": "A", "text": "`&data[0]+1`"}, {"key": "B", "text": "`&data[1]`"}, {"key": "C", "text": "`&data[0]++`"}, {"key": "D", "text": "`data+1`"}, {"key": "E", "text": "none of above"}], "answer": "C", "explain": "本题考查地址运算。a、b、d：&data[0]+1 与 data+1 都等于 &data[1]（指针算术按元素步长）；c 的 &data[0]++ 试图自增“取地址表达式”——它是常量表达式，不能自增，语法错误。故选 c。", "imgs": []}, {"id": "choice-185", "kind": "choice", "kind_name": "单选题", "num": 185, "stem": "A structure called record which holds an integer called loop, a character array of 5 elements called word, and a float called sum, looks like", "options": [{"key": "A", "text": "`struct record { int loop; char word[5]; float sum; };`"}, {"key": "B", "text": "`type structure record { loop : integer; word : array[0..4] of char; sum : real; };`"}, {"key": "C", "text": "`type record { integer loop; char word[4]; float sum; }`"}], "answer": "A", "explain": "本题考查 C 结构体定义语法。正确形式：`struct record { int loop; char word[5]; float sum; };`（a）；b 是 Pascal 风格、c 是伪代码风格，均非 C 语法。", "imgs": []}, {"id": "choice-186", "kind": "choice", "kind_name": "单选题", "num": 186, "stem": "What is the output of the following program segment?\nunsigned char v1, v2, v3, v4;\nv1 = 0x3;\nv2 = v1 ^ 0x76;\nv3 = ~0xa | (v2 << 2);\nv4 = v1 & (v3 >> 6);\nprintf(\"v1 = %d, v2 = %x, v3 = %d, v4 = %x\", v1, v2, v3, v4);", "options": [{"key": "A", "text": "v1 = 3, v2 = 117, v3 = 21, v4 = 0"}, {"key": "B", "text": "v1 = 3, v2 = 75, v3 = 33, v4 = 0"}, {"key": "C", "text": "v1 = 3, v2 = 75, v3 = 245, v4 = 3"}, {"key": "D", "text": "v1 = 3, v2 = 117, v3 = f5, v4 = 3"}], "answer": "C", "explain": "本题考查位运算顺序与截断。v2 = 3^0x76 = 0x75；v3 = (~0xA | (0x75<<2)) 截断 8 位：0x75<<2 低 8 位 = 0xD4，~0xA 截断 = 0xF5，0xF5|0xD4 = 0xF5 = 245；v4 = 3 & (0xF5>>6 = 3) = 3。结果 v1=3, v2=75, v3=245, v4=3（c）。注意 %x 下 v2 显示 75（十六进制）。", "imgs": []}, {"id": "choice-187", "kind": "choice", "kind_name": "单选题", "num": 187, "stem": "A structure of type machine contains two fields, an integer called name, and a char pointer called memory. Show what the definition of the structure looks like.", "options": [{"key": "A", "text": "`struct machine { int name; char memory; }`"}, {"key": "B", "text": "`machine { name : integer; memory : char *; };`"}, {"key": "C", "text": "`struct machine { int name; char *memory; };`"}], "answer": "C", "explain": "本题考查含指针成员的结构体定义。char 指针成员写作 `char *memory;`：`struct machine { int name; char *memory; };`（c）；a 的 memory 是 char 值（非指针）；b 是伪代码风格。", "imgs": []}, {"id": "choice-188", "kind": "choice", "kind_name": "单选题", "num": 188, "stem": "嵌入式开发中，用于硬件调试的典型工具是（　）。", "options": [{"key": "A", "text": "J-Link"}, {"key": "B", "text": "VSCode"}, {"key": "C", "text": "Excel"}, {"key": "D", "text": "Word"}], "answer": "A", "explain": "本题考查嵌入式调试工具。J-Link 是 SEGGER 的常用 JTAG/SWD 调试下载器，配合 Keil/IAR 等可给 STM32 等 MCU 下载与在线调试（A）；VSCode 是编辑器，Excel/Word 是办公软件。", "imgs": []}, {"id": "choice-189", "kind": "choice", "kind_name": "单选题", "num": 189, "stem": "在 Git 中，查看提交历史的命令是（　）。", "options": [{"key": "A", "text": "`git status`"}, {"key": "B", "text": "`git log`"}, {"key": "C", "text": "`git diff`"}, {"key": "D", "text": "`git branch`"}], "answer": "B", "explain": "本题考查 Git 常用命令。git log 查看提交历史（作者、时间、提交信息）（B）；git status 看工作区状态、git diff 看差异、git branch 管理分支。", "imgs": []}, {"id": "choice-190", "kind": "choice", "kind_name": "单选题", "num": 190, "stem": "USB HID 协议中，报告描述符（Report Descriptor）的作用是（　）。", "options": [{"key": "A", "text": "定义设备厂商 ID"}, {"key": "B", "text": "定义数据传输格式与用途"}, {"key": "C", "text": "定义电源管理策略"}, {"key": "D", "text": "定义物理连接端口"}], "answer": "B", "explain": "本题考查 USB HID 协议。报告描述符（Report Descriptor）用 HID 描述符语言定义设备上报/接收数据的格式与用途（按键、坐标、LED 等），主机据此解析报告（B）；厂商 ID 在设备描述符中，电源策略由配置描述符负责。", "imgs": []}, {"id": "choice-191", "kind": "choice", "kind_name": "单选题", "num": 191, "stem": "蓝牙协议栈中，负责设备配对与绑定的层是（　）。", "options": [{"key": "A", "text": "物理层"}, {"key": "B", "text": "链路层"}, {"key": "C", "text": "安全管理层"}, {"key": "D", "text": "应用层"}], "answer": "C", "explain": "本题考查 BLE 协议栈层次。配对（Pairing）与绑定（Bonding，保存密钥供下次免配对）由安全管理层（SM）实现（C）；物理层负责射频收发，链路层负责链路调度，应用层是用户业务。", "imgs": []}, {"id": "multi-192", "kind": "multi", "kind_name": "多选题", "num": 192, "stem": "以下哪种情况会导致触摸误触？（　）", "options": [{"key": "A", "text": "采样频率过高"}, {"key": "B", "text": "信号滤波不足"}, {"key": "C", "text": "使用高阻抗材料"}, {"key": "D", "text": "电源电压稳定"}], "answer": "BC", "explain": "本题考查触摸检测的干扰因素（多选）。B：信号滤波不足 → 噪声被误判为触摸；C：高阻抗材料 → 充放电时间变长、抗扰度差，易误触；合理的采样频率（A）与稳定电源（D）不是误触根因。故选 B、C。", "imgs": []}, {"id": "choice-193", "kind": "choice", "kind_name": "单选题", "num": 193, "stem": "C 语言中，防止变量被编译器优化的关键字是（　）。", "options": [{"key": "A", "text": "Volatile"}, {"key": "B", "text": "static"}, {"key": "C", "text": "const"}, {"key": "D", "text": "register"}], "answer": "A", "explain": "本题考查关键字作用。volatile 阻止编译器对该变量的访问做优化（不缓存、不删除、不重排）（A）；static 控制存储期/链接性、const 表示只读、register 只是寄存器建议。", "imgs": []}, {"id": "choice-194", "kind": "choice", "kind_name": "单选题", "num": 194, "stem": "嵌入式系统中，RTOS（实时操作系统）的核心作用是（　）。", "options": [{"key": "A", "text": "提供图形界面"}, {"key": "B", "text": "管理任务调度与资源分配"}, {"key": "C", "text": "替代 MCU 硬件"}, {"key": "D", "text": "优化电源功耗"}], "answer": "B", "explain": "本题考查 RTOS 的定位。RTOS 核心职责是任务调度与资源管理（任务、消息队列、信号量、时间管理），保证高优先级任务及时响应（B）；图形界面、电源优化是可选组件/上层功能，RTOS 更不替代硬件。", "imgs": []}, {"id": "choice-195", "kind": "choice", "kind_name": "单选题", "num": 195, "stem": "以下哪项不属于嵌入式开发基础环境？（　）", "options": [{"key": "A", "text": "MCU（如 STM32）"}, {"key": "B", "text": "RTOS（如 FreeRTOS）"}, {"key": "C", "text": "USB HID 协议栈"}, {"key": "D", "text": "Git 版本控制"}], "answer": "C", "explain": "本题考查嵌入式开发环境构成（选不属于项）。MCU（硬件平台）、RTOS（软件平台）、Git（版本管理）属通用基础环境；USB HID 协议栈是面向 USB 人机设备的专用组件，不属于“基础环境”。故选 C。", "imgs": []}, {"id": "choice-196", "kind": "choice", "kind_name": "单选题", "num": 196, "stem": "在 C 语言中，用于动态内存分配的函数是（　）。", "options": [{"key": "A", "text": "`malloc( )`"}, {"key": "B", "text": "`printf( )`"}, {"key": "C", "text": "`scanf( )`"}, {"key": "D", "text": "`memcpy( )`"}], "answer": "A", "explain": "本题考查常用库函数用途。malloc 动态分配堆内存（A）；printf/scanf 是输入输出、memcpy 是内存拷具，均不分配内存。", "imgs": []}, {"id": "choice-197", "kind": "choice", "kind_name": "单选题", "num": 197, "stem": "软件版本控制中，\"分支（Branch）\"的主要用途是（　）。", "options": [{"key": "A", "text": "备份代码"}, {"key": "B", "text": "并行开发不同功能"}, {"key": "C", "text": "压缩代码体积"}, {"key": "D", "text": "加密代码"}], "answer": "B", "explain": "本题考查版本控制概念。分支用于并行开发不同功能/修复，隔离变更、互不影响，完成后合并（B）；备份靠远程仓库/标签，压缩、加密不是分支的功能。", "imgs": []}, {"id": "choice-198", "kind": "choice", "kind_name": "单选题", "num": 198, "stem": "下面代码输出什么？（　）\nint a = 5;\nprintf(\"%d\", ++a);", "options": [{"key": "A", "text": "5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "7"}, {"key": "D", "text": "编译错误"}], "answer": "B", "explain": "本题考查前置自增。++a 先自增再取值：a 变为 6，printf 输出 6（B）。与后置 a++（输出 5）区分。", "imgs": []}, {"id": "choice-199", "kind": "choice", "kind_name": "单选题", "num": 199, "stem": "sizeof(char) 的值通常是？（　）", "options": [{"key": "A", "text": "8"}, {"key": "B", "text": "4"}, {"key": "C", "text": "1"}, {"key": "D", "text": "与平台有关"}], "answer": "C", "explain": "本题考查 sizeof 的定义。C 标准明确规定 sizeof(char) ≡ 1（字节即 char 的宽度，其它类型以它为单位），与平台无关。故选 C。", "imgs": []}, {"id": "choice-200", "kind": "choice", "kind_name": "单选题", "num": 200, "stem": "`memset(buf, 0, sizeof(buf));` 的作用是？（　）", "options": [{"key": "A", "text": "分配内存"}, {"key": "B", "text": "清零缓冲区"}, {"key": "C", "text": "释放内存"}, {"key": "D", "text": "拷贝字符串"}], "answer": "B", "explain": "本题考查 memset 的用途。memset(buf, 0, sizeof(buf)) 把 buf 起 sizeof(buf) 字节全部写 0（清零）（B），常用于初始化缓冲区/结构体。注意它按字节操作：置 0 才安全，若置非 0 值（如 memset(a,1,…)）会得到 0x01010101 而非 1。", "imgs": []}, {"id": "choice-201", "kind": "choice", "kind_name": "单选题", "num": 201, "stem": "以下哪个是\"后进先出\"结构？（　）", "options": [{"key": "A", "text": "Queue"}, {"key": "B", "text": "Stack"}, {"key": "C", "text": "Array"}, {"key": "D", "text": "Tree"}], "answer": "B", "explain": "本题考查数据结构的进出顺序。栈（Stack）后进先出 LIFO（B）；队列 Queue 先进先出 FIFO；数组与树不定义 LIFO 语义。", "imgs": []}, {"id": "choice-202", "kind": "choice", "kind_name": "单选题", "num": 202, "stem": "malloc() 分配的内存位于？（　）", "options": [{"key": "A", "text": "栈"}, {"key": "B", "text": "堆"}, {"key": "C", "text": "寄存器"}, {"key": "D", "text": "Flash"}], "answer": "B", "explain": "本题考查内存分区。malloc/new 从堆区分配（B）；栈是函数局部变量自动区域，寄存器不存放被分配对象，Flash 只存放代码/常量。", "imgs": []}, {"id": "choice-203", "kind": "choice", "kind_name": "单选题", "num": 203, "stem": "const 的作用是什么？（　）", "options": [{"key": "A", "text": "变量可修改"}, {"key": "B", "text": "定义只读变量"}, {"key": "C", "text": "定义全局变量"}, {"key": "D", "text": "防止优化"}], "answer": "B", "explain": "本题考查 const 语义。const 定义只读变量（不可修改；编译器可据此优化并放入只读段）（B）；A 说反，C 是普通全局定义，D 是 volatile 的作用。", "imgs": []}, {"id": "choice-204", "kind": "choice", "kind_name": "单选题", "num": 204, "stem": "extern 的作用是什么？（　）", "options": [{"key": "A", "text": "定义静态变量"}, {"key": "B", "text": "声明外部变量"}, {"key": "C", "text": "防止优化"}, {"key": "D", "text": "定义局部变量"}], "answer": "B", "explain": "本题考查 extern 语义。extern 声明“变量/函数定义在其它编译单元”，链接时解析引用（B）；它不分配存储、不改作用域、不影响优化。", "imgs": []}, {"id": "choice-205", "kind": "choice", "kind_name": "单选题", "num": 205, "stem": "以下哪个函数通常不能在中断里长时间执行？（　）", "options": [{"key": "A", "text": "GPIO 翻转"}, {"key": "B", "text": "printf"}, {"key": "C", "text": "清中断标志"}, {"key": "D", "text": "读取寄存器"}], "answer": "B", "explain": "本题考查中断中应避免的操作。printf 内部可能阻塞（等待发送）、使用锁与缓冲、耗时长且不可重入，中断中禁用（B）；GPIO 翻转、清中断标志、读寄存器都是快速操作，适合中断内执行。", "imgs": []}, {"id": "choice-206", "kind": "choice", "kind_name": "单选题", "num": 206, "stem": "MCU 的 Flash 通常用于存放？（　）", "options": [{"key": "A", "text": "运行时栈"}, {"key": "B", "text": "程序代码"}, {"key": "C", "text": "DMA 缓存"}, {"key": "D", "text": "网络数据"}], "answer": "B", "explain": "本题考查 MCU 存储布局。Flash 存放程序代码与常量数据（掉电不丢）（B）；栈/堆在 SRAM；DMA 缓冲与网络数据也是运行期在 SRAM 中的数据。", "imgs": []}, {"id": "choice-207", "kind": "choice", "kind_name": "单选题", "num": 207, "stem": "UART 通信至少需要哪两根线？（　）", "options": [{"key": "A", "text": "TX、RX"}, {"key": "B", "text": "SCL、SDA"}, {"key": "C", "text": "MOSI、MISO"}, {"key": "D", "text": "VCC、GND"}], "answer": "A", "explain": "本题考查 UART 接线。UART 全双工最少需 TX（发送）、RX（接收）两根信号线（另需共地 GND）（A）；SCL/SDA 是 I2C、MOSI/MISO 是 SPI、VCC/GND 是电源线，不能通信。", "imgs": []}, {"id": "choice-208", "kind": "choice", "kind_name": "单选题", "num": 208, "stem": "static 局部变量的特点是？（　）", "options": [{"key": "A", "text": "每次重新创建"}, {"key": "B", "text": "生命周期贯穿程序运行期"}, {"key": "C", "text": "存放在栈"}, {"key": "D", "text": "只能在 main 使用"}], "answer": "B", "explain": "本题考查 static 局部变量。只初始化一次、生命周期贯穿程序（B），存于静态区而非栈（C 错）；不是每次重建（A 错）；与是否在 main 使用无关（D 错）。", "imgs": []}, {"id": "choice-209", "kind": "choice", "kind_name": "单选题", "num": 209, "stem": "下面代码输出什么？（　）\nchar str[] = \"abc\";\nprintf(\"%lu\", sizeof(str));", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": "B", "explain": "本题考查字符串数组大小。char str[]=\"abc\" 数组大小含结尾 '\\0'：3+1 = 4 字节（B）。sizeof 得数组长度 4；strlen(str) 才是 3（不含 '\\0'）。", "imgs": []}, {"id": "choice-210", "kind": "choice", "kind_name": "单选题", "num": 210, "stem": "判断字符类型变量 c 是否为大写字母的正确表达式是（　）", "options": [{"key": "A", "text": "`'A'<=c<='Z'`"}, {"key": "B", "text": "`(c>='A') & (c<='Z')`"}, {"key": "C", "text": "`(c>='A') && (c<='Z')`"}, {"key": "D", "text": "`('A'<=c) AND ('Z'>=c)`"}], "answer": "C", "explain": "本题考查布尔表达式写法。必须用逻辑与 &&：`(c>='A') && (c<='Z')`（C）；A 是数学连写，在 C 中语义为 (('A'<=c)<='Z')（比较结果为 0/1 再与 'Z' 比较）恒为真，错误；B 用了位与 &（数值运算，语义不对）；D 的 AND 不是 C 运算符。", "imgs": []}, {"id": "choice-211", "kind": "choice", "kind_name": "单选题", "num": 211, "stem": "malloc 返回值类型是？（　）", "options": [{"key": "A", "text": "void"}, {"key": "B", "text": "void*"}, {"key": "C", "text": "int*"}, {"key": "D", "text": "char*"}], "answer": "B", "explain": "本题考查 malloc 原型。`void *malloc(size_t size);` 返回 void*（B），需转换为目标指针类型使用；分配失败返回 NULL，使用前应判空、使用后配对 free。", "imgs": []}, {"id": "choice-212", "kind": "choice", "kind_name": "单选题", "num": 212, "stem": "以下代码输出？（　）\nchar *p = \"hello\";\nprintf(\"%c\", *p + 1);", "options": [{"key": "A", "text": "h"}, {"key": "B", "text": "i"}, {"key": "C", "text": "e"}, {"key": "D", "text": "o"}], "answer": "B", "explain": "本题考查字符指针取值与整型提升。char *p=\"hello\"：*p 取 'h'（104），+1 得 105，%c 输出 'i'（B）。注意 *p+1 是字符码值加 1，非指针移动（*(p+1) 才是 'e'）。", "imgs": []}, {"id": "choice-213", "kind": "choice", "kind_name": "单选题", "num": 213, "stem": "问：fp 可以怎么调用 add？（　）\nint add(int a, int b) {\n    return a + b;\n}\nint (*fp)(int, int);\nfp = add;", "options": [{"key": "A", "text": "`fp(1,2)`"}, {"key": "B", "text": "`*fp(1,2)`"}, {"key": "C", "text": "两者都可以"}, {"key": "D", "text": "不能调用"}], "answer": "C", "explain": "本题考查函数指针调用语法（存疑题）。C 标准规定 `fp(1,2)` 与先解引用再调用 `(*fp)(1,2)` 完全等价（C）。注意选项 B 若原卷为不带括号的 `*fp(1,2)`：因函数调用优先级高于解引用，会解析为 `*(fp(1,2))`（对 int 解引用）非法，此时只有 A 成立——请对照原卷确认 B 是否带括号。", "imgs": []}];
/* 错误可视化：不遮挡任何操作按钮（顶部横条，可关闭、自动消失） */
function showErrBox(msg, ln){
  try{
    var d=document.getElementById("__errbox");
    if(!d){
      d=document.createElement("div"); d.id="__errbox";
      d.style.cssText="position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;font-size:12px;line-height:1.6;padding:8px 34px 8px 10px;z-index:999";
      var x=document.createElement("span");
      x.textContent="✕";
      x.style.cssText="position:absolute;right:6px;top:6px;font-size:14px;cursor:pointer;padding:2px 8px;";
      x.onclick=function(){ if(d.parentNode)d.parentNode.removeChild(d); };
      d.appendChild(x);
      var t=document.createElement("span"); t.id="__errtext";
      d.appendChild(t);
      document.body.appendChild(d);
      setTimeout(function(){ try{ if(d.parentNode)d.parentNode.removeChild(d); }catch(_){} }, 12000);
    }
    var brief=String(msg||"");
    document.getElementById("__errtext").textContent = (brief.indexOf("Script error")>=0)
      ? "ℹ️ 检测到环境脚本提示（浏览器隐藏了详情，一般是微信/QQ 浏览器自身的提示，不影响使用）"
      : ("⚠ 页面提示："+brief+"（行 "+(ln||"?")+"）");
  }catch(e){}
}
window.onerror=function(msg,src,ln){

/* 防呆：直接打开模板（未嵌入题库）时给出明确提示 */

const EXAM_MIN=40, EXAM_NUM=30, EXAM_CHOICE_NUM=20, EXAM_JUDGE_NUM=10, EXAM_SCORE=5;

function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}} }

function byId(qid){ return BANK.find(x=>x.id===qid) }
function normMulti(s){ return String(s||"").toUpperCase().split("").filter(function(c){return c>="A"&&c<="E"}).sort().join(""); }
function isOk(it,s){ const a=(it.answer||"").toUpperCase().trim(); s=String(s||"").trim();
  if(it.kind==="multi") return normMulti(s)===normMulti(a) && normMulti(a)!=="";
  return s===a || (s==="√"&&["对","T","TRUE","√"].indexOf(a)>=0) || (s==="×"&&["错","F","FALSE","×"].indexOf(a)>=0); }
function examIsOk(it,k){
  const oinfo=(mode==="考试"&&exam&&exam.opts)?exam.opts[it.id]:undefined;
  const a=String((oinfo?oinfo.answer:it.answer)||"").toUpperCase().trim();
  if(it.kind==="multi") return normMulti(k)===normMulti(a) && normMulti(a)!=="";
  if(oinfo) return String(k||"").trim()===a;
  return isOk(it,k);
}
function rec(qid){ return progress[qid]||(progress[qid]={ok:null,wrong_count:0,notes:""}) }

}

function pickPlanned(ids,orderKey,curKey,n){
  // 环形连续段算法：洗牌固定序列，每场沿环连续取 n 个。
  // 同一场绝不重复；连续 ceil(len/n)+1 场必覆盖全部题目（176 题每场 20 → 9 场全覆盖）。
  const plan=progress._exam_plan&&typeof progress._exam_plan==="object"?progress._exam_plan:{};
  let order=plan[orderKey];
  if(!Array.isArray(order)||order.length!==ids.length||ids.some(function(id){return order.indexOf(id)<0})){ order=shuffle(ids); plan[curKey]=0; }
  const m=order.length;
  n=Math.min(n,m);
  if(n<=0) return [];
  let cur=plan[curKey];
  if(typeof cur!=="number"||cur<0||cur>=m) cur=0;
  let picked;
  if(n>=m){ picked=order.slice(); cur=0; }
  else{
    const end=cur+n;
    picked=end<=m?order.slice(cur,end):order.slice(cur).concat(order.slice(0,end-m));
    cur=end%m;
  }
  plan[orderKey]=order; plan[curKey]=cur;
  progress._exam_plan=plan;
  return picked;
}
function startExam(){
  const cIds=BANK.filter(x=>x.kind==="choice"||x.kind==="multi").map(x=>x.id);
  const jIds=BANK.filter(x=>x.kind==="judge").map(x=>x.id);
  const qs=shuffle(pickPlanned(cIds,"c","cc",EXAM_CHOICE_NUM)
                   .concat(pickPlanned(jIds,"j","jc",EXAM_JUDGE_NUM)));
  exam={active:true,finished:false,paused:false,ids:qs,idx:0,left:EXAM_MIN*60,answers:{}};
  progress.exam=exam; save();
  queue=qs.map(byId).filter(Boolean); idx=0; examLeft=EXAM_MIN*60;
  // 考试选项随机化：选择/多选题选项顺序打乱，答案 key 跟随内容（按原位置索引映射）
  const opts={};
  queue.filter(x=>x.kind==="choice"||x.kind==="multi").forEach(q=>{
    const src=(q.options||[]).map(function(o){ var c={}; for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) c[k]=o[k]; } return c; });
    const aKeys=String(q.answer||"").toUpperCase().trim();
    const ansIdx=src.map(function(o,i){return aKeys.indexOf(String(o.key||"").toUpperCase())>=0?i:-1}).filter(function(i){return i>=0});
    const sh=shuffle(src.map(function(o,i){return {o:o,i:i}}));
    const newKeys=[];
    sh.forEach(function(x,j){ x.o.key="ABCDE"[j]||"?"; if(ansIdx.indexOf(x.i)>=0) newKeys.push(x.o.key); });
    opts[q.id]={options:sh.map(x=>x.o), answer:newKeys.sort().join("")};
  });
  exam.opts=opts;
  examBarShow(); tick(); renderQ();
}
function tick(){
  if(mode!=="考试"||!exam||!exam.active||exam.finished||exam.paused){ examTimer=null; return; }
  if(examLeft<=0){ finishExam(); return; }
  examLeft--; exam.left=examLeft;
  const mm=pad2(Math.floor(examLeft/60)), ss=pad2(examLeft%60);
  const curQ=queue[idx]||{};
  $("#head").textContent=`⏱ 模拟考试 · 剩余 ${mm}:${ss} · 第 ${idx+1}/${queue.length} 题${curQ.kind_name?" · "+curQ.kind_name:""}`;
  examTimer=setTimeout(tick,1000);
}
function stopExamTimer(){ if(examTimer){clearTimeout(examTimer);examTimer=null;} }
function examBarShow(){

}

  $("#stem").textContent=`考试已暂停。\n\n剩余时间：${fmt(examLeft)}\n已完成 ${Object.keys(exam.answers).length}/${queue.length} 题\n\n点击顶部「▶ 继续考试」恢复答题。`;

}
function renderQnav(){
  const nv=$("#qnav"); nv.innerHTML="";

function togglePause(){
  if(exam.paused){ exam.paused=false; progress.exam=exam; save(); examBarShow(); tick(); renderQ(); }
  else{ stopExamTimer(); exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); showPaused(); }

function quitExam(){

function restartToReady(){

function renderQ(){

  }else{

function renderOpts(it,examSel){
  const o=$("#opts"); o.innerHTML="";
  (it.imgs||[]).forEach(function(src){ const im=document.createElement("img"); im.className="qimg"; im.src=src; o.appendChild(im); });
  if(it.kind==="choice"||it.kind==="multi"){
    const oinfo=(mode==="考试"&&exam&&exam.opts)?exam.opts[it.id]:undefined;
    const ans=String((oinfo?oinfo.answer:it.answer)||"").toUpperCase().trim();
    const opts=(oinfo?oinfo.options:it.options)||[];
    if(examSel!==undefined){
      const ansSet=ans.split(""), selSet=String(examSel||"").split("");
      opts.forEach(op=>{
        const d=document.createElement("div");
        d.className="opt";
        d.textContent=op.key+". "+op.text;
        if(ansSet.indexOf(op.key)>=0)d.classList.add("right");
        else if(selSet.indexOf(op.key)>=0)d.classList.add("wrong");
        o.appendChild(d);
      });
      return;
    }
    if(it.kind==="multi"){
      const t=document.createElement("div");
      t.style.cssText="font-size:12px;color:#1a5276;font-weight:bold";
      t.textContent="本题为多选题（点击可多选、再点取消）";
      o.appendChild(t);
    }
    opts.forEach(op=>{
      const d=document.createElement("div");
      d.className="opt"; d.textContent=op.key+". "+op.text; d.dataset.k=op.key;
      d.onclick=()=>{
        if(it.kind==="multi"){
          d.classList.toggle("selected");
          d.style.animation="";
          sel=Array.prototype.map.call(document.querySelectorAll("#opts .opt.selected"), function(x){return x.dataset.k||"";}).sort().join("");
        }else{
          forEachNode(document.querySelectorAll("#opts .opt"), function(x){ x.classList.remove("selected"); });
          d.classList.add("selected"); d.style.animation=""; sel=op.key;
        }
      };
      o.appendChild(d);
    });
  }else if(it.kind==="judge"){
    if(examSel!==undefined){
      const ans=(it.answer||"").toUpperCase().trim();
      const d1=document.createElement("div"); d1.className="opt"; d1.textContent=`正确答案：${it.answer}`; d1.classList.add("right"); o.appendChild(d1);
      const d2=document.createElement("div"); d2.className="opt"; d2.textContent=`你的答案：${examSel}`; d2.classList.add(examSel===ans?"right":"wrong"); o.appendChild(d2);
      return;
    }
    // 判断题：先点选（高亮），再点「确认答案」才判分
    const w=document.createElement("div"); w.className="judgeBtns";
    const mk=function(k,txt,cls){
      const b=document.createElement("button"); b.className=cls; b.textContent=txt;
      b.onclick=function(){
        forEachNode(document.querySelectorAll("#opts .judgeBtns button"), function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); b.style.animation=""; sel=k;
      };
      return b;
    };
    w.appendChild(mk("√","✔ 正确","t"));
    w.appendChild(mk("×","✘ 错误","f"));
    o.appendChild(w);
  }else{
    // qa 特殊题（存疑/写结果类）：展示原卷选项 + 查看答案与解析，可标记掌握程度
    (it.options||[]).forEach(op=>{
      const d=document.createElement("div"); d.className="opt";
      d.textContent=op.key+". "+op.text; o.appendChild(d);
    });
    const tip=document.createElement("div");
    tip.style.cssText="font-size:12px;color:#8e44ad;font-weight:bold";
    tip.textContent="本题无固定选项答案（存疑/写结果类），点下方按钮对照说明";
    o.appendChild(tip);
    const b=document.createElement("button"); b.className="chip";
    b.textContent="👀 查看答案与解析";
    b.onclick=()=>showFb(`<b>答案：</b>\n${it.answer||"（无）"}\n\n<b>解析：</b>\n${it.explain||"（无）"}`);
    o.appendChild(b);
    const b2=document.createElement("button"); b2.className="chip";
    b2.style.background="linear-gradient(135deg,#1a7f37,#27ae60)";
    b2.textContent="已掌握 ✔";
    b2.onclick=()=>{ rec(it.id).ok=true; save(); stat(); showFb("✅ 已标记为掌握"); };
    o.appendChild(b2);
    const b3=document.createElement("button"); b3.className="chip";
    b3.textContent="还需复习 ✘";
    b3.onclick=()=>{ rec(it.id).ok=false; save(); stat(); showFb("📖 已标记为需复习"); };
    o.appendChild(b3);
  }
}
function checkAnswer(){
  const it=queue[idx];
  if(!it)return;
  if(mode==="考试"){
    if(exam&&exam.active&&!exam.finished){
      if(!sel){ msg("提示","请先选择答案，再点确认"); return; }
      examAnswer(it,sel);
    }
    return;
  }
  if(it.kind==="qa"){ msg("提示","本题无固定选项答案，请点选项区按钮对照说明。"); return; }
  if(!sel){ msg("提示", it.kind==="choice"?"请先选择一个答案":(it.kind==="multi"?"请先选择答案（可多选）":"请先选择答案（正确/错误）")); return; }
  const ok=isOk(it,sel);
  record(it,sel,ok); showResult(it,sel,ok);
  if(noteOpen){ noteQid=it.id; $("#nnote").value=rec(it.id).notes||""; }
  stat();
}
function answerJudge(key){
  // 判断题选择：只高亮不判分，点「确认答案」后才生效
  var btns=document.querySelectorAll("#opts .judgeBtns button");
  forEachNode(btns, function(x){ x.classList.remove("sel"); });
  var target=Array.prototype.filter.call(btns, function(b){return b.dataset.k===key;})[0];
  if(target)target.classList.add("sel");
  sel=key;
}
function examAnswer(it,k){
  if(exam.answers[it.id]){ msg("提示","本题已作答，不能更改"); return; }
  const ok=examIsOk(it,k); exam.answers[it.id]=k; exam.left=examLeft; save();
  record(it,k,ok); renderQ();
}
function record(it,ans,ok){
  const r=rec(it.id); r.ok=ok; if(!ok)r.wrong_count=(r.wrong_count||0)+1; save();
}
function showResult(it,ans,ok){
  const r=rec(it.id); let txt="";
  txt+= ok?`<span class="tag-ok">✅ 回答正确！</span>`:`<span class="tag-no">❌ 回答错误。正确答案：${it.answer}</span>`;
  if(r.wrong_count)txt+=`\n🔁 本题累计错误：${r.wrong_count} 次`;
  if(it.explain)txt+="\n\n解析：\n"+it.explain;

function nav(d){
  const ni=idx+d;

    if(mode==="考试"){ confirm("交卷","已到最后一题，确定交卷吗？",finishExam); }

}
function finishExam(){
  stopExamTimer();
  if(!exam||!exam.active||exam.finished)return;
  exam.finished=true; exam.paused=false; exam.left=examLeft;
  progress._exam_count=(progress._exam_count||0)+1;   // 完成交卷才计入考试次数
  progress.exam=exam; save(); examBarHide();
  renderResult();
}
function renderResult(){
  if(!exam)return;
  const qs=queue, ans=exam.answers;
  let correct=0, wrong=[], un=0;
  qs.forEach(x=>{ if(ans[x.id]===undefined)un++; else if(examIsOk(x,ans[x.id]))correct++; else wrong.push(x); });
  const score=correct*EXAM_SCORE;
  $("#head").textContent="🏁 考试结束";
  $("#stem").textContent=`🏆 考试成绩：${score} 分 / 满分 ${qs.length*EXAM_SCORE} 分\n\n✅ 答对 ${correct} 题 · ❌ 答错 ${wrong.length} 题 · ⭕ 未答 ${un} 题`;
  let fbTxt=`得分：${score} 分（每题 ${EXAM_SCORE} 分）　答题进度：${Object.keys(ans).length}/${qs.length}\n\n错题已自动进入「错题」板块。`;
  showFb(fbTxt);
  const o=$("#opts"); o.innerHTML="";
  const scoreDiv=document.createElement("div");
  scoreDiv.className="opt"; scoreDiv.textContent=`🏆 成绩：${score} 分（答对 ${correct}/${qs.length}）`;
  scoreDiv.classList.add(score>=qs.length*EXAM_SCORE*0.6?"right":"wrong"); o.appendChild(scoreDiv);
  if(wrong.length){
    const t=document.createElement("div"); t.style.cssText="font-size:13px;color:#c62828;font-weight:bold;margin-top:6px";
    t.textContent="📌 点击错题号回顾："; o.appendChild(t);
    wrong.forEach(x=>{ const c=document.createElement("button"); c.className="chip";
      const ci=qs.indexOf(x)+1; c.textContent=`错题${x.num}#${ci}`;
      c.onclick=()=>reviewWrong(x.id); o.appendChild(c); });
  }else{
    const t=document.createElement("div"); t.className="opt"; t.textContent="🎉 全部答对，太棒了！"; t.classList.add("right"); o.appendChild(t);
  }
  footerBtns([["🔄 重新考试","#b9770e",restartToReady],["返回顺序","#1a5276",()=>setMode("顺序")]]);
  renderQnav();
  stat();
}
function reviewWrong(qid){
  const it=byId(qid); if(!it)return;
  $("#head").textContent=`📖 错题回顾 · 第 ${it.num} 题`;
  $("#stem").textContent=it.stem||"";
  const o=$("#opts"); o.innerHTML="";
  (it.imgs||[]).forEach(function(src){ const im=document.createElement("img"); im.className="qimg"; im.src=src; o.appendChild(im); });
  const oinfo=exam&&exam.opts?exam.opts[qid]:undefined;
  const ans=((oinfo?oinfo.answer:it.answer)||"").toUpperCase().trim(), your=exam.answers[qid];
  if(it.kind==="choice"||it.kind==="multi"){
    const ansSet=ans.split(""), yourSet=String(your||"").split("");
    ((oinfo?oinfo.options:it.options)||[]).forEach(op=>{ const d=document.createElement("div"); d.className="opt"; d.textContent=op.key+". "+op.text;
      if(ansSet.indexOf(op.key)>=0)d.classList.add("right"); else if(yourSet.indexOf(op.key)>=0)d.classList.add("wrong"); o.appendChild(d); });
  }else{
    const d1=document.createElement("div"); d1.className="opt"; d1.textContent=`正确答案：${it.answer}`; d1.classList.add("right"); o.appendChild(d1);
    const d2=document.createElement("div"); d2.className="opt"; d2.textContent=`你的答案：${your}`; d2.classList.add(your===ans?"right":"wrong"); o.appendChild(d2);
  }
  if(it.explain){ const e=document.createElement("div"); e.style.cssText="font-size:13px;color:#555;margin-top:8px"; e.textContent="解析："+it.explain; o.appendChild(e); }
  showFb(`你的答案：${your||"未作答"}　正确答案：${it.answer}`);
  footerBtns([["⬅ 返回成绩","#1a5276",renderResult]]);
}
/* ---------- 笔记 ---------- */
/* ---------- 笔记（独立弹窗） ---------- */
let noteQid="";
function openNote(){
  if(mode==="考试"&&exam&&exam.active&&!exam.finished){ msg("考试中","考试进行中，不能打开笔记！"); return; }
  const it=queue[idx]; if(!it)return;
  noteQid=it.id;
  $("#nnoteTitle").textContent=`📝 我的笔记 · ${it.id}`;
  $("#nnote").value=rec(it.id).notes||"";
  $("#nmodal").classList.add("show"); noteOpen=true;
}
function closeNote(){
  saveNoteNow();
  $("#nmodal").classList.remove("show"); noteOpen=false;
}
function saveNoteNow(){
  if(!noteQid)return;
  rec(noteQid).notes=$("#nnote").value; save();
}
$("#nnote").addEventListener("input",()=>{
  if(!noteQid)return;
  rec(noteQid).notes=$("#nnote").value;
  clearTimeout(noteTimer); noteTimer=setTimeout(save,800);
});
/* ---------- 工具 ---------- */
function $(s){return document.querySelector(s)}
function forEachNode(nodes, fn){ for(var i=0;i<nodes.length;i++) fn(nodes[i], i); }
function toggleCls(el, cls, force){ if(force) el.classList.add(cls); else el.classList.remove(cls); }
function fmt(sec){ return pad2(Math.floor(sec/60))+":"+pad2(sec%60); }
function pad2(n){ n=String(n); return n.length<2?"0"+n:n; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
function showFb(html){ const f=$("#fb"); f.style.display="block"; f.innerHTML=html; }
function hideFb(){ $("#fb").style.display="none"; }
function footerBtns(btns){
  const f=$("#footer"); f.innerHTML="";
  btns.forEach(([t,c,fn])=>{ const b=document.createElement("button"); b.textContent=t; b.style.background=c; b.onclick=fn; f.appendChild(b); });
}
function stat(){
  const done=BANK.filter(x=>rec(x.id).ok!==null), okN=done.filter(x=>rec(x.id).ok===true).length;
  const rate=done.length?Math.round(okN/done.length*100):0;
  const wrong=BANK.filter(x=>rec(x.id).ok===false).length;
  $("#stat").textContent=`已做 ${done.length}/${BANK.length} · 正确率 ${rate}% · 错题 ${wrong}`;
}
/* ---------- 弹窗 ---------- */
let modalCb=null;
function msg(t,p){ $("#mbox").innerHTML=`<h3>${t}</h3><p>${p}</p><div class="btns"><button style="background:#1a5276" onclick="closeModal()">确定</button></div>`; $("#modal").classList.add("show"); }
function confirm(t,p,cb){ modalCb=cb; $("#mbox").innerHTML=`<h3>${t}</h3><p>${p}</p><div class="btns"><button style="background:#c62828" onclick="closeModal()">取消</button><button style="background:#1a5276" onclick="doConfirm()">确定</button></div>`; $("#modal").classList.add("show"); }
function doConfirm(){ closeModal(); if(modalCb)modalCb(); }
function closeModal(){ $("#modal").classList.remove("show"); }
/* ---------- 重置(3次确认) ---------- */
function resetProgress(){ resetStep(1); }function resetStep(n){
  if(n===1) confirm("重置进度（1/3）","确定要清除全部做题记录吗？\n此操作不可恢复！",()=>resetStep(2));
  else if(n===2) confirm("重置进度（2/3）","再次确认：将清空做题记录、错题次数、笔记和考试记录！",()=>resetStep(3));
  else if(n===3) confirm("重置进度（3/3）","最后一次确认：立即清空全部数据并重新开始！",()=>{ progress={}; save(); stopExamTimer(); exam=null; examBarHide(); setMode("顺序"); msg("完成","🗑 已清除全部做题记录，重新开始！"); });
}
/* 考试中关页面自动保存 */
window.addEventListener("beforeunload",()=>{ if(mode==="考试"&&exam&&exam.active&&!exam.finished){ exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); } });
/* 启动:恢复考试 */
forEachNode(document.querySelectorAll("#tabs button"), function(b){
  b.addEventListener("click",function(){ setMode(b.dataset.mode); });
});
function showInitError(e){
  window.__appReady = true;   /* 已自愈回顺序模式，避免环境噪音再报 */
  showErrBox("初始化失败（已自动清除本地旧数据，请刷新页面重试）："+((e&&e.message)?e.message:e), "");
}
(function init(){
  try{
    exam = progress.exam && typeof progress.exam==="object" ? progress.exam : null;
    if(exam&&exam.active){
      // 直接进入考试板块恢复（不走 renderExamReady，避免闪待开始页）
      mode="考试";
      forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode==="考试"); });
      queue=(exam.ids||[]).map(byId).filter(Boolean);
      if(!queue.length){ exam=null; delete progress.exam; throw new Error("考试会话数据异常"); }
      idx=Math.min(exam.idx||0, Math.max(0,queue.length-1));
      examLeft=exam.left;
      if(exam.finished){ renderResult(); }
      else if(exam.paused){ showPaused(); }        // 暂停态：停留，用户手动继续
      else { examBarShow(); tick(); renderQ(); }   // 运行中：恢复倒计时
    } else setMode("顺序");
    window.__appReady = true;
  }catch(e){
    // 初始化失败（多见于旧数据/浏览器兼容问题）：清除本地旧数据并回顺序模式，显示原因
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    progress={}; exam=null; mode="顺序"; idx=0;
    try{
      forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode==="顺序"); });
      examBarHide(); setMode("顺序");
    }catch(_){}
    showInitError(e);
  }
})();
/* 微信/QQ 环境提示（悬浮顶部，可关闭，不影响任何按钮操作） */
if(navigator.userAgent.indexOf("MicroMessenger")>=0 || navigator.userAgent.indexOf("QQBrowser")>=0 || navigator.userAgent.indexOf("MQQBrowser")>=0){
  try{
    var tip=document.createElement("div");
    tip.style.cssText="position:fixed;left:0;right:0;top:0;background:#fff8e1;color:#8a6d3b;font-size:12px;line-height:1.6;padding:7px 34px 7px 10px;z-index:998;text-align:center";
    var tx=document.createElement("span");
    tx.textContent="✕";
    tx.style.cssText="position:absolute;right:6px;top:5px;font-size:14px;cursor:pointer;padding:2px 8px;color:#8a6d3b";
    tx.onclick=function(){ if(tip.parentNode)tip.parentNode.removeChild(tip); };
    tip.textContent="ℹ️ 微信/QQ 内可能显示不全：如按钮缺失或无法操作，请点右上角「…」→「用其他应用打开」→ 选浏览器打开";
    tip.appendChild(tx);
    document.body.appendChild(tip);
  }catch(e){}
}
</script>

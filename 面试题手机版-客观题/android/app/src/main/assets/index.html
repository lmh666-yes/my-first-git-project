，400℃ 以上易损伤元件与烙铁头。回流焊峰值约 235~250℃，按该口径则选 200~299℃（B）。本答案按手工焊口径取 C，请以原卷标准答案为准。", "imgs": []}, {"id": "choice-141", "kind": "choice", "kind_name": "单选题", "num": 141, "stem": "若输入 B，则以下程序运行后的输出结果是（　）\nint main(void)\n{\n    char grade;\n    scanf(\"%c\",&grade);\n    switch(grade)\n    {\n    case 'A':\n        printf(\">=85\");\n    case 'B':\n    case 'C':\n        printf(\">=60\");\n    case 'D':\n        printf(\"<60\");\n    default:\n        printf(\"error\");\n    }\n}", "options": [{"key": "A", "text": "error."}, {"key": "B", "text": ">=60"}, {"key": "C", "text": ">=85"}, {"key": "D", "text": ">=60<60error."}], "answer": "D", "explain": "本题考查 switch 贯穿执行。grade='B' 匹配 case 'B'，因无 break 依次贯穿：输出 \">=60\"（case C）→ \"<60\"（case D）→ \"error\"（default），连起来为 \">=60<60error\"（D）。若输入 'A' 则输出 \">=85>=60<60error\"，可自行验证。", "imgs": []}, {"id": "choice-142", "kind": "choice", "kind_name": "单选题", "num": 142, "stem": "以下代码的输出是？（　）\nint main() {\n    int a = 10, b = 20;\n    printf(\"%d\\n\", (a++) + (++b));\n    return 0;\n}", "options": [{"key": "A", "text": "30"}, {"key": "B", "text": "31"}, {"key": "C", "text": "32"}, {"key": "D", "text": "33"}], "answer": "B", "explain": "本题考查自增的先/后语义。(a++) 取旧值 10、(++b) 先加得 21，10+21 = 31（B）。求值后 a=11、b=21。", "imgs": []}, {"id": "choice-143", "kind": "choice", "kind_name": "单选题", "num": 143, "stem": "以下哪种操作会导致栈溢出？（　）", "options": [{"key": "A", "text": "递归调用未设置终止条件"}, {"key": "B", "text": "定义大型全局数组"}, {"key": "C", "text": "使用 malloc 分配大量内存"}, {"key": "D", "text": "函数返回局部变量指针"}], "answer": "A", "explain": "本题考查栈溢出的成因。递归无终止条件 → 每次调用压栈、栈帧耗尽 → 栈溢出（A）。大型全局数组占静态区（B）；malloc 占堆（C），堆问题表现为分配失败/泄漏；返回局部变量指针（D）是悬空指针问题。", "imgs": []}, {"id": "choice-144", "kind": "choice", "kind_name": "单选题", "num": 144, "stem": "结构体对齐中，以下结构体的大小是？（　）（假设 int=4 字节，char=1 字节）\nstruct Test {\n    char a;\n    int b;\n    char c;\n};", "options": [{"key": "A", "text": "8 字节"}, {"key": "B", "text": "10 字节"}, {"key": "C", "text": "12 字节"}, {"key": "D", "text": "16 字节"}], "answer": "C", "explain": "本题考查结构体对齐（配代码题）。规则：成员偏移必须是其自身大小的整数倍；结构体总大小为最大成员大小的整数倍。布局：a 偏移 0（1B）→填充 3B→ b 偏移 4（4B）→ c 偏移 8（1B）→尾部填充 3B，共 12 字节（C）。调整成员顺序（int→char→char）可省 3 字节。", "imgs": []}, {"id": "choice-145", "kind": "choice", "kind_name": "单选题", "num": 145, "stem": "关于 static 关键字，错误的是？（　）", "options": [{"key": "A", "text": "修饰局部变量时，延长其生命周期"}, {"key": "B", "text": "修饰全局变量时，限制其作用域为当前文件"}, {"key": "C", "text": "修饰函数时，限制其作用域为当前文件"}, {"key": "D", "text": "修饰全局变量时，其内存位于堆区"}], "answer": "D", "explain": "本题考查 static 的存储位置。static 全局/局部变量都位于静态存储区（.data/.bss），不是堆区（D 错）；A（延长生命周期）、B、C（限制链接性为当前文件）均为正确用法。题目选错误项 → D。", "imgs": []}, {"id": "choice-146", "kind": "choice", "kind_name": "单选题", "num": 146, "stem": "关于中断的说法，错误的是（　）", "options": [{"key": "A", "text": "中断可以提高系统的实时性"}, {"key": "B", "text": "中断服务程序必须在规定时间内完成"}, {"key": "C", "text": "中断只能由硬件触发"}, {"key": "D", "text": "中断向量表存储了中断服务程序的入口地址"}], "answer": "C", "explain": "本题考查中断的基本概念。中断源既可以是硬件（定时器、外设、引脚）也可以是软件（SVC 指令、置位软件中断寄存器），“只能由硬件触发”错误（C）；A、B、D（向量表存入口地址）均为正确说法。", "imgs": []}, {"id": "choice-147", "kind": "choice", "kind_name": "单选题", "num": 147, "stem": "电脑系统一般安装在硬盘的哪个磁盘（　）", "options": [{"key": "A", "text": "C盘"}, {"key": "B", "text": "D盘"}, {"key": "C", "text": "E盘"}, {"key": "D", "text": "F盘"}], "answer": "A", "explain": "本题考查计算机基础常识。Windows 默认把系统安装在第一块硬盘的第一个可用主分区，盘符习惯为 C 盘（系统盘），用户数据常放 D/E/F。故选 A。", "imgs": []}, {"id": "choice-148", "kind": "choice", "kind_name": "单选题", "num": 148, "stem": "要做一份简单的工具清单表格，用以下哪个软件做最合适（　）", "options": [{"key": "A", "text": "记事本"}, {"key": "B", "text": "Excel"}, {"key": "C", "text": "Access"}, {"key": "D", "text": "Word"}], "answer": "B", "explain": "本题考查办公软件选型。制作简单工具清单/表格用 Excel 最合适（表格结构、公式、排序筛选直接可用）（B）；记事本无表格结构；Word 适合文档排版、表格能力弱；Access 是数据库软件、门槛高。", "imgs": []}, {"id": "choice-149", "kind": "choice", "kind_name": "单选题", "num": 149, "stem": "设有说明语句：`enum color {red,yellow,blue,white};` 那么 yellow 的值为（　）", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "YELLOW"}, {"key": "D", "text": "yellow"}], "answer": "A", "explain": "本题考查枚举默认值。未显式赋值时首成员 = 0，后续依次 +1：red=0、yellow=1（A）。若定义 enum color {red=5, yellow}; 则 yellow=6（可显式指定起始值）。", "imgs": []}, {"id": "choice-150", "kind": "choice", "kind_name": "单选题", "num": 150, "stem": "i=4，那么语句 `j=i+++1` 执行后的结果应该是（　）", "options": [{"key": "A", "text": "i=4,j=6"}, {"key": "B", "text": "i=5,j=6"}, {"key": "C", "text": "i=5,j=5"}, {"key": "D", "text": "i=6,j=6"}], "answer": "C", "explain": "本题考查运算符贪婪匹配。`i+++1` 按最长匹配解析为 `(i++)+1`：表达式值 = 4+1 = 5，i 自增为 5，故 i=5、j=5（C）。（原卷识别文本 C 选项有重复，正确值为 i=5, j=5。）", "imgs": []}, {"id": "choice-151", "kind": "choice", "kind_name": "单选题", "num": 151, "stem": "设 a,b 为整型数，且 a=2,b=4，则表达式 `(a/b?b:a:b-a)` 的值为（　）", "options": [{"key": "A", "text": "0.5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "2"}, {"key": "D", "text": "此表达式错误"}], "answer": "C", "explain": "本题考查三目运算符。按原题意图（a/b 为假时取 b−a）：a/b = 2/4 = 0 → 条件为假 → 结果 b−a = 4−2 = 2（C）。附注：若严格按字面解析，\"a/b?b:a:b-a\" 含两个冒号、并非合法的条件表达式（这正是选项 D“表达式错误”的来源）；原卷应为 a/b?b:b-a 的转写误差，请对照原卷，按 C 掌握。", "imgs": []}, {"id": "choice-152", "kind": "choice", "kind_name": "单选题", "num": 152, "stem": "设 n=10, i=4，则赋值运算 `n%=i+1` 执行后 n 的值为（　）", "options": [{"key": "A", "text": "0"}, {"key": "B", "text": "1"}, {"key": "C", "text": "2"}, {"key": "D", "text": "3"}], "answer": "A", "explain": "本题考查复合赋值。`n %= i+1` 等价 `n = n % (i+1)`：10 % 5 = 0（A）。注意右侧表达式整体求值后参与取模。", "imgs": []}, {"id": "choice-153", "kind": "choice", "kind_name": "单选题", "num": 153, "stem": "控制单片机输出 PWM 控制信号需要用到的资源（　）", "options": [{"key": "A", "text": "ADC"}, {"key": "B", "text": "看门狗"}, {"key": "C", "text": "定时器"}, {"key": "D", "text": "SPI 接口"}], "answer": "C", "explain": "本题考查 PWM 的实现资源。PWM 由定时器（TIM）产生：计数器循环计数、比较寄存器设定占空比，硬件在比较匹配时翻转输出，不占 CPU（C）。ADC 是模数采集，看门狗是复位监控，SPI 是通信接口，均与 PWM 无直接关系。", "imgs": []}, {"id": "choice-154", "kind": "choice", "kind_name": "单选题", "num": 154, "stem": "计算机能识别的语言是（　）。", "options": [{"key": "A", "text": "汇编语言"}, {"key": "B", "text": "自然语言"}, {"key": "C", "text": "机器语言"}, {"key": "D", "text": "高级语言"}], "answer": "C", "explain": "本题考查计算机语言层次。CPU 只能直接识别和执行机器语言（二进制指令编码，C）；汇编语言需汇编器翻译；高级语言需编译/解释；自然语言是人类的语言。", "imgs": []}, {"id": "choice-155", "kind": "choice", "kind_name": "单选题", "num": 155, "stem": "在中断服务程序中，至少应有一条（　）。", "options": [{"key": "A", "text": "传送指令"}, {"key": "B", "text": "转移指令"}, {"key": "C", "text": "加法指令"}, {"key": "D", "text": "中断返回指令"}], "answer": "D", "explain": "本题考查中断服务程序结构。ISR 执行完必须返回被中断的程序：至少包含一条中断返回指令（51 中为 RETI；Cortex-M 由硬件完成异常返回）（D）。传送/加法指令是可选操作，转移指令只是内部控制流；缺了“返回”则无法回到主程序。", "imgs": []}, {"id": "choice-156", "kind": "choice", "kind_name": "单选题", "num": 156, "stem": "当 AT89C52 单片机系统的振荡晶体频率为 24MHz 时，其一个机器周期的时间是（　）。", "options": [{"key": "A", "text": "0.5μS"}, {"key": "B", "text": "1μS"}, {"key": "C", "text": "2μS"}, {"key": "D", "text": "4μS"}], "answer": "A", "explain": "本题考查 51 单片机的机器周期。传统 51（12T 模式）1 个机器周期 = 12 个振荡周期：12/24MHz = 0.5μs（A）。若为 1T 内核型号则机器周期 = 1/24MHz ≈ 41.7ns，需看芯片规格。", "imgs": []}, {"id": "choice-157", "kind": "choice", "kind_name": "单选题", "num": 157, "stem": "代码生成阶段的主要任务是：（　）", "options": [{"key": "A", "text": "把高级语言翻译成机器语言"}, {"key": "B", "text": "把高级语言翻译成汇编语言"}, {"key": "C", "text": "把中间代码变换成依赖具体机器的目标代码"}, {"key": "D", "text": "把汇编语言翻译成机器语言"}], "answer": "C", "explain": "本题考查编译原理中编译阶段的划分。编译过程：词法 → 语法 → 语义/中间代码 → 优化 → 代码生成。代码生成阶段把中间表示变换为依赖具体机器的目标代码（C）。A/B/D 是整体翻译方向或汇编器的工作，不是“代码生成阶段”的准确职责。", "imgs": []}, {"id": "choice-158", "kind": "choice", "kind_name": "单选题", "num": 158, "stem": "C++ 中关于堆和栈的说法，哪个是错误的：（　）", "options": [{"key": "A", "text": "堆的大小仅受操作系统的限制，栈的大小一般较小"}, {"key": "B", "text": "在堆上频繁的调用 new/delete 容易产生内存碎片，栈没有这个问题"}, {"key": "C", "text": "堆和栈都可以静态分配"}, {"key": "D", "text": "堆和栈都可以动态分配"}], "answer": "C", "explain": "本题考查堆与栈的分配方式（选错误项）。栈一般较小（Windows 默认约 1~8MB）、堆较大受系统限制（A 对）；堆频繁 new/delete 易产生碎片、栈无此问题（B 对）；静态分配的对象位于静态存储区，既不在堆也不在栈——“堆和栈都可以静态分配”错误（C 是本题答案）；栈也可运行期分配（alloca/VLA，D 对）。", "imgs": []}, {"id": "judge-159", "kind": "judge", "kind_name": "判断题", "num": 159, "stem": "构造函数、析构函数能被继承或取地址（　）", "options": [], "answer": "×", "explain": "错误。构造函数与析构函数不能被继承（派生类各需自己的构造/析构），也不能取地址（不允许 &ClassName::ClassName）；派生类构造时基类构造函数被调用，那是“调用”而非继承。", "imgs": []}, {"id": "judge-160", "kind": "judge", "kind_name": "判断题", "num": 160, "stem": "构造函数可以重载，但析构函数只有一个（　）", "options": [], "answer": "√", "explain": "正确。构造函数可带不同参数列表重载（默认构造、带参构造、拷贝构造等）；析构函数不能带参数、不能重载，一个类只有唯一一个析构函数（可为 virtual）。", "imgs": []}, {"id": "judge-161", "kind": "judge", "kind_name": "判断题", "num": 161, "stem": "返回值类型为引用类型的函数可以返回局部变量（　）", "options": [], "answer": "×", "explain": "错误。返回局部变量的引用是悬空引用（局部对象随栈帧销毁，引用指向已失效存储），访问属未定义行为。可行方案：返回值拷贝、返回静态/全局变量引用、返回对象成员引用或返回堆对象/智能指针。", "imgs": []}, {"id": "judge-162", "kind": "judge", "kind_name": "判断题", "num": 162, "stem": "静态成员函数没有 this 指针（　）", "options": [], "answer": "√", "explain": "正确。静态成员函数属于类而非对象，没有隐含的 this 指针，因此不能直接访问非静态成员；调用无需对象（ClassName::func() 即可）。", "imgs": []}, {"id": "judge-163", "kind": "judge", "kind_name": "判断题", "num": 163, "stem": "静态成员函数可以直接访问非静态成员变量（　）", "options": [], "answer": "×", "explain": "错误。静态成员函数没有 this，无法确定操作哪个对象 → 不能直接访问非静态成员变量/函数；如需访问必须显式传入对象（对象.成员 或 指针->成员）。", "imgs": []}, {"id": "judge-164", "kind": "judge", "kind_name": "判断题", "num": 164, "stem": "const 类型的变量声明时可以不用初始化（　）", "options": [], "answer": "×", "explain": "错误。const 变量必须在声明时初始化（“只读”语义要求初值），之后不可赋值；类内 const 成员则必须在构造函数的初始化列表中初始化。局部 const 变量亦然。", "imgs": []}, {"id": "judge-165", "kind": "judge", "kind_name": "判断题", "num": 165, "stem": "const 类型的对象只能访问 const 类型的成员函数，构造函数、析构函数除外（　）", "options": [], "answer": "√", "explain": "正确。const 对象的隐含 this 是 const 指针，只能调用带 const 限定的成员函数；构造函数/析构函数例外（它们在对象生死节点必然被调用，不受 cv 限定约束）。", "imgs": []}, {"id": "judge-166", "kind": "judge", "kind_name": "判断题", "num": 166, "stem": "const 类型的对象如果作为实参，只能传递给 const 类型的形参（　）", "options": [], "answer": "√", "explain": "正确（按引用/指针形参理解）。const 对象绑定时不允许丢弃 const 限定：只能传给 const 引用/const 指针形参；若形参是非 const 引用/指针则编译错误。补充：按值传参会捎贝、不涉及限定问题。", "imgs": []}, {"id": "judge-167", "kind": "judge", "kind_name": "判断题", "num": 167, "stem": "volatile 类型的对象只能访问 volatile 类型的成员函数，构造函数、析构函数除外（　）", "options": [], "answer": "√", "explain": "正确。C++ 的 cv 限定与 const 规则对称：volatile 对象只能调用 volatile 成员函数（隐含 this 为 volatile 指针），构造/析构函数同样例外；实际编码中 volatile 成员函数很少用，但语言规则成立。", "imgs": []}, {"id": "judge-168", "kind": "judge", "kind_name": "判断题", "num": 168, "stem": "复合类调用构造函数时，成员对象的构造函数调用顺序取决于复合类的构造函数初始化列表（　）", "options": [], "answer": "×", "explain": "错误。复合类中成员对象的构造顺序由成员在类中的“声明顺序”决定，与构造函数初始化列表的书写顺序无关；但初始化列表最好按声明顺序书写，以免 -Wreorder 警告与误解。", "imgs": []}, {"id": "choice-169", "kind": "choice", "kind_name": "单选题", "num": 169, "stem": "不属于 C++ 面向对象特性的是（　）", "options": [{"key": "A", "text": "封装"}, {"key": "B", "text": "继承"}, {"key": "C", "text": "多态"}, {"key": "D", "text": "指针"}], "answer": "D", "explain": "本题考查面向对象三大特性。封装、继承、多态是 OOP 三大特性（A、B、C）；指针是 C/C++ 的语言机制，与面向对象范式无必然关系。故选 D。", "imgs": []}, {"id": "choice-170", "kind": "choice", "kind_name": "单选题", "num": 170, "stem": "关于静态变量说法错误的是（　）", "options": [{"key": "A", "text": "存储在全…局区"}, {"key": "B", "text": "生命周期贯穿整个程序"}, {"key": "C", "text": "每次函数调用重新初始化"}, {"key": "D", "text": "作用域限于函数 / 文件内"}], "answer": "C", "explain": "本题考查静态变量性质（选错误项）。静态变量：位于静态存储区（A 对）、生命周期贯穿程序（B 对）、只初始化一次（C 错——不会每次调用重新初始化）、作用域限于函数/文件（D 对）。故选 C。", "imgs": []}, {"id": "choice-171", "kind": "choice", "kind_name": "单选题", "num": 171, "stem": "深拷贝的主要目的是（　）", "options": [{"key": "A", "text": "提升执行速度"}, {"key": "B", "text": "避免重复释放与数据冲突"}, {"key": "C", "text": "节省内存"}, {"key": "D", "text": "简化代码"}], "answer": "B", "explain": "本题考查深拷贝的意义。默认浅拷贝仅复制指针值，两个对象共享同一堆内存：一方析构后另一方成悬空指针，还可能重复释放（B）。深拷贝为新对象分配独立资源、逐内容复制，从根本上避免共享冲突；与性能/省内存无关。", "imgs": []}, {"id": "choice-172", "kind": "choice", "kind_name": "单选题", "num": 172, "stem": "以下会造成内存泄漏的是（　）", "options": [{"key": "A", "text": "new 未 delete"}, {"key": "B", "text": "栈变量超出作用域"}, {"key": "C", "text": "指针置空"}, {"key": "D", "text": "局部数组"}], "answer": "A", "explain": "本题考查内存泄漏的成因。new/malloc 分配的堆内存未 delete/free → 无法再回收（A）。栈变量超作用域自动释放（B）；指针置空本身不是泄漏原因（若原堆块未释放且引用丢失才是泄漏，C 不准确）；局部数组在栈上自动回收（D）。故选 A。", "imgs": []}, {"id": "judge-173", "kind": "judge", "kind_name": "判断题", "num": 173, "stem": "malloc 分配的内存不会自动初始化，new 会调用构造函数。（　）", "options": [], "answer": "√", "explain": "正确。malloc/free 只分配/释放原始内存，不调用构造/析构；new/delete 在分配内存的同时调用构造函数、delete 先析构再释放。C++ 中对象分配应优先用 new。", "imgs": []}, {"id": "judge-174", "kind": "judge", "kind_name": "判断题", "num": 174, "stem": "野指针只包含未初始化的指针。（　）", "options": [], "answer": "×", "explain": "错误。“野指针”泛指指向不可用内存的指针：未初始化指针、释放后未置空的悬空指针、越界访问产生的指针都算。故“只包含未初始化指针”不成立。", "imgs": []}, {"id": "judge-175", "kind": "judge", "kind_name": "判断题", "num": 175, "stem": "多线程一定比单线程执行更快。（　）", "options": [], "answer": "×", "explain": "错误。多线程能否更快取决于：可并行比例（Amdahl 定律）、同步/通信开销、CPU 核数与负载均衡；单核上多线程还可能因切换开销更慢。故“一定更快”错误。", "imgs": []}, {"id": "judge-176", "kind": "judge", "kind_name": "判断题", "num": 176, "stem": "栈内存由系统自动分配与释放。（　）", "options": [], "answer": "√", "explain": "正确。栈内存由编译器插入的入栈/出栈指令与运行期栈指针自动管理：函数调用自动分配局部空间、返回自动回收；栈溢出、返回局部指针是常见坑。", "imgs": []}, {"id": "choice-177", "kind": "choice", "kind_name": "单选题", "num": 177, "stem": "你正在完成紧急模块，突然需求细节变更，且需在原截止时间交付，你会：（　）", "options": [{"key": "A", "text": "反复确认变更原因，暂停当前工作"}, {"key": "B", "text": "快速评估影响，调整方案，优先保证交付"}, {"key": "C", "text": "直接表示无法完成，要求延期"}, {"key": "D", "text": "继续按原计划执行，等追问再处理"}], "answer": "B", "explain": "本题考查工程素养（行为判断题）。正确做法：快速评估变更影响、调整方案并优先保证交付（B）——体现主动性与交付意识；A 暂停工作反复确认会耽误进度；C 直接要求延期缺乏建设性；D 无视变更消极等待会放大风险。", "imgs": []}, {"id": "choice-178", "kind": "choice", "kind_name": "单选题", "num": 178, "stem": "代码提交后测试发现问题，但原因不在你的模块，你会：（　）", "options": [{"key": "A", "text": "主动协助定位，推动整体解决"}, {"key": "B", "text": "说明不是自己负责，不参与"}, {"key": "C", "text": "等待负责人自行处理"}, {"key": "D", "text": "明确划分责任，避免背锅"}], "answer": "A", "explain": "本题考查团队协作素养。问题在他人模块：应主动协助定位（提供现象、日志、复现步骤）并推动整体解决（A）；“不是我的不参与/等待/划清责任”都不利于交付，团队目标是让问题被解决而非界定责任。", "imgs": []}, {"id": "choice-179", "kind": "choice", "kind_name": "单选题", "num": 179, "stem": "同一时段收到 3 项优先级相近的任务，你会：（　）", "options": [{"key": "A", "text": "随机挑选一项开始"}, {"key": "B", "text": "评估工作量与依赖，同步负责人确认顺序"}, {"key": "C", "text": "全部并行推进"}, {"key": "D", "text": "只做最简单的任务"}], "answer": "B", "explain": "本题考查任务管理素养。多任务优先级相近时：先评估工作量与依赖关系，再与负责人同步确认优先级（B）；随机开始、全部并行、只做简单任务都不是专业做法。", "imgs": []}, {"id": "choice-180", "kind": "choice", "kind_name": "单选题", "num": 180, "stem": "若有说明：`int a=2，*p=&a，*q=p;`，则以下非法的赋值语句是（　）", "options": [{"key": "A", "text": "`p=q;`"}, {"key": "B", "text": "`*p=*q;`"}, {"key": "C", "text": "`a=*q;`"}, {"key": "D", "text": "`q=a;`"}], "answer": "D", "explain": "本题考查指针与整型的类型匹配。int a=2, *p=&a, *q=p：A：p=q（指针赋值）合法；B：*p=*q（值赋值）合法；C：a=*q（取值赋给 a）合法；D：q=a 把整型赋给指针，类型不匹配、非法。故选 D。", "imgs": []}, {"id": "choice-181", "kind": "choice", "kind_name": "单选题", "num": 181, "stem": "已有定义 `int a=2，*p1=&a，*p2=&a;` 下面不能正确执行的赋值语句是（　）", "options": [{"key": "A", "text": "`a=*p1+*p2;`"}, {"key": "B", "text": "`p1=a;`"}, {"key": "C", "text": "`p1=p2;`"}, {"key": "D", "text": "`a=*p1*(*p2);`"}], "answer": "B", "explain": "本题考查指针赋值规则。p1、p2 均指向 a：A：a=*p1+*p2 = 4 合法；B：p1=a 把整数 2 赋给指针 → 类型错误，不能正确执行；C：p1=p2（同类指针互赋）合法；D：a=*p1*(*p2) = 4 合法。故选 B。", "imgs": []}, {"id": "choice-182", "kind": "choice", "kind_name": "单选题", "num": 182, "stem": "Declare a pointer to the text string \"Hello\" called message.", "options": [{"key": "A", "text": "`char message = \"Hello\";`"}, {"key": "B", "text": "`*message = \"Hello\";`"}, {"key": "C", "text": "`char *message = \"Hello\";`"}, {"key": "D", "text": "`char message = 'Hello';`"}], "answer": "C", "explain": "本题考查字符串指针声明。指向字符串常量的指针：`char *message = \"Hello\";`（c）；a 是单字符赋值（类型错误）；b 缺类型且解引用未初始化指针；d 用单引号包多字符（非法）。", "imgs": []}, {"id": "choice-183", "kind": "choice", "kind_name": "单选题", "num": 183, "stem": "What is the output of the following program segment?\nint count = 10, *temp, sum = 0;\ntemp = &count;\n*temp = 20;\ntemp = &sum;\n*temp = count;\nprintf(\"count = %d, *temp = %d, sum = %d\\n\", count, *temp, sum );", "options": [{"key": "A", "text": "count = 2, *temp = 10, sum = 10"}, {"key": "B", "text": "count = 20, *temp = 20, sum = 20"}, {"key": "C", "text": "count = 10, *temp = 2, sum = 10"}, {"key": "D", "text": "count = 200, *temp = 0.2, sum = 1"}], "answer": "B", "explain": "本题考查指针间接赋值。temp=&count 后 *temp=20 → count=20；temp=&sum 后 *temp=count → sum=20；printf 时 temp 指向 sum。输出 count=20, *temp=20, sum=20（b）。", "imgs": []}, {"id": "choice-184", "kind": "choice", "kind_name": "单选题", "num": 184, "stem": "If data is defined as an array of int, which has 10 items: `int data[10];`. Which one CANNOT give the address of data[1]?", "options": [{"key": "A", "text": "`&data[0]+1`"}, {"key": "B", "text": "`&data[1]`"}, {"key": "C", "text": "`&data[0]++`"}, {"key": "D", "text": "`data+1`"}, {"key": "E", "text": "none of above"}], "answer": "C", "explain": "本题考查地址运算。a、b、d：&data[0]+1 与 data+1 都等于 &data[1]（指针算术按元素步长）；c 的 &data[0]++ 试图自增“取地址表达式”——它是常量表达式，不能自增，语法错误。故选 c。", "imgs": []}, {"id": "choice-185", "kind": "choice", "kind_name": "单选题", "num": 185, "stem": "A structure called record which holds an integer called loop, a character array of 5 elements called word, and a float called sum, looks like", "options": [{"key": "A", "text": "`struct record { int loop; char word[5]; float sum; };`"}, {"key": "B", "text": "`type structure record { loop : integer; word : array[0..4] of char; sum : real; };`"}, {"key": "C", "text": "`type record { integer loop; char word[4]; float sum; }`"}], "answer": "A", "explain": "本题考查 C 结构体定义语法。正确形式：`struct record { int loop; char word[5]; float sum; };`（a）；b 是 Pascal 风格、c 是伪代码风格，均非 C 语法。", "imgs": []}, {"id": "choice-186", "kind": "choice", "kind_name": "单选题", "num": 186, "stem": "What is the output of the following program segment?\nunsigned char v1, v2, v3, v4;\nv1 = 0x3;\nv2 = v1 ^ 0x76;\nv3 = ~0xa | (v2 << 2);\nv4 = v1 & (v3 >> 6);\nprintf(\"v1 = %d, v2 = %x, v3 = %d, v4 = %x\", v1, v2, v3, v4);", "options": [{"key": "A", "text": "v1 = 3, v2 = 117, v3 = 21, v4 = 0"}, {"key": "B", "text": "v1 = 3, v2 = 75, v3 = 33, v4 = 0"}, {"key": "C", "text": "v1 = 3, v2 = 75, v3 = 245, v4 = 3"}, {"key": "D", "text": "v1 = 3, v2 = 117, v3 = f5, v4 = 3"}], "answer": "C", "explain": "本题考查位运算顺序与截断。v2 = 3^0x76 = 0x75；v3 = (~0xA | (0x75<<2)) 截断 8 位：0x75<<2 低 8 位 = 0xD4，~0xA 截断 = 0xF5，0xF5|0xD4 = 0xF5 = 245；v4 = 3 & (0xF5>>6 = 3) = 3。结果 v1=3, v2=75, v3=245, v4=3（c）。注意 %x 下 v2 显示 75（十六进制）。", "imgs": []}, {"id": "choice-187", "kind": "choice", "kind_name": "单选题", "num": 187, "stem": "A structure of type machine contains two fields, an integer called name, and a char pointer called memory. Show what the definition of the structure looks like.", "options": [{"key": "A", "text": "`struct machine { int name; char memory; }`"}, {"key": "B", "text": "`machine { name : integer; memory : char *; };`"}, {"key": "C", "text": "`struct machine { int name; char *memory; };`"}], "answer": "C", "explain": "本题考查含指针成员的结构体定义。char 指针成员写作 `char *memory;`：`struct machine { int name; char *memory; };`（c）；a 的 memory 是 char 值（非指针）；b 是伪代码风格。", "imgs": []}, {"id": "choice-188", "kind": "choice", "kind_name": "单选题", "num": 188, "stem": "嵌入式开发中，用于硬件调试的典型工具是（　）。", "options": [{"key": "A", "text": "J-Link"}, {"key": "B", "text": "VSCode"}, {"key": "C", "text": "Excel"}, {"key": "D", "text": "Word"}], "answer": "A", "explain": "本题考查嵌入式调试工具。J-Link 是 SEGGER 的常用 JTAG/SWD 调试下载器，配合 Keil/IAR 等可给 STM32 等 MCU 下载与在线调试（A）；VSCode 是编辑器，Excel/Word 是办公软件。", "imgs": []}, {"id": "choice-189", "kind": "choice", "kind_name": "单选题", "num": 189, "stem": "在 Git 中，查看提交历史的命令是（　）。", "options": [{"key": "A", "text": "`git status`"}, {"key": "B", "text": "`git log`"}, {"key": "C", "text": "`git diff`"}, {"key": "D", "text": "`git branch`"}], "answer": "B", "explain": "本题考查 Git 常用命令。git log 查看提交历史（作者、时间、提交信息）（B）；git status 看工作区状态、git diff 看差异、git branch 管理分支。", "imgs": []}, {"id": "choice-190", "kind": "choice", "kind_name": "单选题", "num": 190, "stem": "USB HID 协议中，报告描述符（Report Descriptor）的作用是（　）。", "options": [{"key": "A", "text": "定义设备厂商 ID"}, {"key": "B", "text": "定义数据传输格式与用途"}, {"key": "C", "text": "定义电源管理策略"}, {"key": "D", "text": "定义物理连接端口"}], "answer": "B", "explain": "本题考查 USB HID 协议。报告描述符（Report Descriptor）用 HID 描述符语言定义设备上报/接收数据的格式与用途（按键、坐标、LED 等），主机据此解析报告（B）；厂商 ID 在设备描述符中，电源策略由配置描述符负责。", "imgs": []}, {"id": "choice-191", "kind": "choice", "kind_name": "单选题", "num": 191, "stem": "蓝牙协议栈中，负责设备配对与绑定的层是（　）。", "options": [{"key": "A", "text": "物理层"}, {"key": "B", "text": "链路层"}, {"key": "C", "text": "安全管理层"}, {"key": "D", "text": "应用层"}], "answer": "C", "explain": "本题考查 BLE 协议栈层次。配对（Pairing）与绑定（Bonding，保存密钥供下次免配对）由安全管理层（SM）实现（C）；物理层负责射频收发，链路层负责链路调度，应用层是用户业务。", "imgs": []}, {"id": "multi-192", "kind": "multi", "kind_name": "多选题", "num": 192, "stem": "以下哪种情况会导致触摸误触？（　）", "options": [{"key": "A", "text": "采样频率过高"}, {"key": "B", "text": "信号滤波不足"}, {"key": "C", "text": "使用高阻抗材料"}, {"key": "D", "text": "电源电压稳定"}], "answer": "BC", "explain": "本题考查触摸检测的干扰因素（多选）。B：信号滤波不足 → 噪声被误判为触摸；C：高阻抗材料 → 充放电时间变长、抗扰度差，易误触；合理的采样频率（A）与稳定电源（D）不是误触根因。故选 B、C。", "imgs": []}, {"id": "choice-193", "kind": "choice", "kind_name": "单选题", "num": 193, "stem": "C 语言中，防止变量被编译器优化的关键字是（　）。", "options": [{"key": "A", "text": "Volatile"}, {"key": "B", "text": "static"}, {"key": "C", "text": "const"}, {"key": "D", "text": "register"}], "answer": "A", "explain": "本题考查关键字作用。volatile 阻止编译器对该变量的访问做优化（不缓存、不删除、不重排）（A）；static 控制存储期/链接性、const 表示只读、register 只是寄存器建议。", "imgs": []}, {"id": "choice-194", "kind": "choice", "kind_name": "单选题", "num": 194, "stem": "嵌入式系统中，RTOS（实时操作系统）的核心作用是（　）。", "options": [{"key": "A", "text": "提供图形界面"}, {"key": "B", "text": "管理任务调度与资源分配"}, {"key": "C", "text": "替代 MCU 硬件"}, {"key": "D", "text": "优化电源功耗"}], "answer": "B", "explain": "本题考查 RTOS 的定位。RTOS 核心职责是任务调度与资源管理（任务、消息队列、信号量、时间管理），保证高优先级任务及时响应（B）；图形界面、电源优化是可选组件/上层功能，RTOS 更不替代硬件。", "imgs": []}, {"id": "choice-195", "kind": "choice", "kind_name": "单选题", "num": 195, "stem": "以下哪项不属于嵌入式开发基础环境？（　）", "options": [{"key": "A", "text": "MCU（如 STM32）"}, {"key": "B", "text": "RTOS（如 FreeRTOS）"}, {"key": "C", "text": "USB HID 协议栈"}, {"key": "D", "text": "Git 版本控制"}], "answer": "C", "explain": "本题考查嵌入式开发环境构成（选不属于项）。MCU（硬件平台）、RTOS（软件平台）、Git（版本管理）属通用基础环境；USB HID 协议栈是面向 USB 人机设备的专用组件，不属于“基础环境”。故选 C。", "imgs": []}, {"id": "choice-196", "kind": "choice", "kind_name": "单选题", "num": 196, "stem": "在 C 语言中，用于动态内存分配的函数是（　）。", "options": [{"key": "A", "text": "`malloc( )`"}, {"key": "B", "text": "`printf( )`"}, {"key": "C", "text": "`scanf( )`"}, {"key": "D", "text": "`memcpy( )`"}], "answer": "A", "explain": "本题考查常用库函数用途。malloc 动态分配堆内存（A）；printf/scanf 是输入输出、memcpy 是内存拷具，均不分配内存。", "imgs": []}, {"id": "choice-197", "kind": "choice", "kind_name": "单选题", "num": 197, "stem": "软件版本控制中，\"分支（Branch）\"的主要用途是（　）。", "options": [{"key": "A", "text": "备份代码"}, {"key": "B", "text": "并行开发不同功能"}, {"key": "C", "text": "压缩代码体积"}, {"key": "D", "text": "加密代码"}], "answer": "B", "explain": "本题考查版本控制概念。分支用于并行开发不同功能/修复，隔离变更、互不影响，完成后合并（B）；备份靠远程仓库/标签，压缩、加密不是分支的功能。", "imgs": []}, {"id": "choice-198", "kind": "choice", "kind_name": "单选题", "num": 198, "stem": "下面代码输出什么？（　）\nint a = 5;\nprintf(\"%d\", ++a);", "options": [{"key": "A", "text": "5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "7"}, {"key": "D", "text": "编译错误"}], "answer": "B", "explain": "本题考查前置自增。++a 先自增再取值：a 变为 6，printf 输出 6（B）。与后置 a++（输出 5）区分。", "imgs": []}, {"id": "choice-199", "kind": "choice", "kind_name": "单选题", "num": 199, "stem": "sizeof(char) 的值通常是？（　）", "options": [{"key": "A", "text": "8"}, {"key": "B", "text": "4"}, {"key": "C", "text": "1"}, {"key": "D", "text": "与平台有关"}], "answer": "C", "explain": "本题考查 sizeof 的定义。C 标准明确规定 sizeof(char) ≡ 1（字节即 char 的宽度，其它类型以它为单位），与平台无关。故选 C。", "imgs": []}, {"id": "choice-200", "kind": "choice", "kind_name": "单选题", "num": 200, "stem": "`memset(buf, 0, sizeof(buf));` 的作用是？（　）", "options": [{"key": "A", "text": "分配内存"}, {"key": "B", "text": "清零缓冲区"}, {"key": "C", "text": "释放内存"}, {"key": "D", "text": "拷贝字符串"}], "answer": "B", "explain": "本题考查 memset 的用途。memset(buf, 0, sizeof(buf)) 把 buf 起 sizeof(buf) 字节全部写 0（清零）（B），常用于初始化缓冲区/结构体。注意它按字节操作：置 0 才安全，若置非 0 值（如 memset(a,1,…)）会得到 0x01010101 而非 1。", "imgs": []}, {"id": "choice-201", "kind": "choice", "kind_name": "单选题", "num": 201, "stem": "以下哪个是\"后进先出\"结构？（　）", "options": [{"key": "A", "text": "Queue"}, {"key": "B", "text": "Stack"}, {"key": "C", "text": "Array"}, {"key": "D", "text": "Tree"}], "answer": "B", "explain": "本题考查数据结构的进出顺序。栈（Stack）后进先出 LIFO（B）；队列 Queue 先进先出 FIFO；数组与树不定义 LIFO 语义。", "imgs": []}, {"id": "choice-202", "kind": "choice", "kind_name": "单选题", "num": 202, "stem": "malloc() 分配的内存位于？（　）", "options": [{"key": "A", "text": "栈"}, {"key": "B", "text": "堆"}, {"key": "C", "text": "寄存器"}, {"key": "D", "text": "Flash"}], "answer": "B", "explain": "本题考查内存分区。malloc/new 从堆区分配（B）；栈是函数局部变量自动区域，寄存器不存放被分配对象，Flash 只存放代码/常量。", "imgs": []}, {"id": "choice-203", "kind": "choice", "kind_name": "单选题", "num": 203, "stem": "const 的作用是什么？（　）", "options": [{"key": "A", "text": "变量可修改"}, {"key": "B", "text": "定义只读变量"}, {"key": "C", "text": "定义全局变量"}, {"key": "D", "text": "防止优化"}], "answer": "B", "explain": "本题考查 const 语义。const 定义只读变量（不可修改；编译器可据此优化并放入只读段）（B）；A 说反，C 是普通全局定义，D 是 volatile 的作用。", "imgs": []}, {"id": "choice-204", "kind": "choice", "kind_name": "单选题", "num": 204, "stem": "extern 的作用是什么？（　）", "options": [{"key": "A", "text": "定义静态变量"}, {"key": "B", "text": "声明外部变量"}, {"key": "C", "text": "防止优化"}, {"key": "D", "text": "定义局部变量"}], "answer": "B", "explain": "本题考查 extern 语义。extern 声明“变量/函数定义在其它编译单元”，链接时解析引用（B）；它不分配存储、不改作用域、不影响优化。", "imgs": []}, {"id": "choice-205", "kind": "choice", "kind_name": "单选题", "num": 205, "stem": "以下哪个函数通常不能在中断里长时间执行？（　）", "options": [{"key": "A", "text": "GPIO 翻转"}, {"key": "B", "text": "printf"}, {"key": "C", "text": "清中断标志"}, {"key": "D", "text": "读取寄存器"}], "answer": "B", "explain": "本题考查中断中应避免的操作。printf 内部可能阻塞（等待发送）、使用锁与缓冲、耗时长且不可重入，中断中禁用（B）；GPIO 翻转、清中断标志、读寄存器都是快速操作，适合中断内执行。", "imgs": []}, {"id": "choice-206", "kind": "choice", "kind_name": "单选题", "num": 206, "stem": "MCU 的 Flash 通常用于存放？（　）", "options": [{"key": "A", "text": "运行时栈"}, {"key": "B", "text": "程序代码"}, {"key": "C", "text": "DMA 缓存"}, {"key": "D", "text": "网络数据"}], "answer": "B", "explain": "本题考查 MCU 存储布局。Flash 存放程序代码与常量数据（掉电不丢）（B）；栈/堆在 SRAM；DMA 缓冲与网络数据也是运行期在 SRAM 中的数据。", "imgs": []}, {"id": "choice-207", "kind": "choice", "kind_name": "单选题", "num": 207, "stem": "UART 通信至少需要哪两根线？（　）", "options": [{"key": "A", "text": "TX、RX"}, {"key": "B", "text": "SCL、SDA"}, {"key": "C", "text": "MOSI、MISO"}, {"key": "D", "text": "VCC、GND"}], "answer": "A", "explain": "本题考查 UART 接线。UART 全双工最少需 TX（发送）、RX（接收）两根信号线（另需共地 GND）（A）；SCL/SDA 是 I2C、MOSI/MISO 是 SPI、VCC/GND 是电源线，不能通信。", "imgs": []}, {"id": "choice-208", "kind": "choice", "kind_name": "单选题", "num": 208, "stem": "static 局部变量的特点是？（　）", "options": [{"key": "A", "text": "每次重新创建"}, {"key": "B", "text": "生命周期贯穿程序运行期"}, {"key": "C", "text": "存放在栈"}, {"key": "D", "text": "只能在 main 使用"}], "answer": "B", "explain": "本题考查 static 局部变量。只初始化一次、生命周期贯穿程序（B），存于静态区而非栈（C 错）；不是每次重建（A 错）；与是否在 main 使用无关（D 错）。", "imgs": []}, {"id": "choice-209", "kind": "choice", "kind_name": "单选题", "num": 209, "stem": "下面代码输出什么？（　）\nchar str[] = \"abc\";\nprintf(\"%lu\", sizeof(str));", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": "B", "explain": "本题考查字符串数组大小。char str[]=\"abc\" 数组大小含结尾 '\\0'：3+1 = 4 字节（B）。sizeof 得数组长度 4；strlen(str) 才是 3（不含 '\\0'）。", "imgs": []}, {"id": "choice-210", "kind": "choice", "kind_name": "单选题", "num": 210, "stem": "判断字符类型变量 c 是否为大写字母的正确表达式是（　）", "options": [{"key": "A", "text": "`'A'<=c<='Z'`"}, {"key": "B", "text": "`(c>='A') & (c<='Z')`"}, {"key": "C", "text": "`(c>='A') && (c<='Z')`"}, {"key": "D", "text": "`('A'<=c) AND ('Z'>=c)`"}], "answer": "C", "explain": "本题考查布尔表达式写法。必须用逻辑与 &&：`(c>='A') && (c<='Z')`（C）；A 是数学连写，在 C 中语义为 (('A'<=c)<='Z')（比较结果为 0/1 再与 'Z' 比较）恒为真，错误；B 用了位与 &（数值运算，语义不对）；D 的 AND 不是 C 运算符。", "imgs": []}, {"id": "choice-211", "kind": "choice", "kind_name": "单选题", "num": 211, "stem": "malloc 返回值类型是？（　）", "options": [{"key": "A", "text": "void"}, {"key": "B", "text": "void*"}, {"key": "C", "text": "int*"}, {"key": "D", "text": "char*"}], "answer": "B", "explain": "本题考查 malloc 原型。`void *malloc(size_t size);` 返回 void*（B），需转换为目标指针类型使用；分配失败返回 NULL，使用前应判空、使用后配对 free。", "imgs": []}, {"id": "choice-212", "kind": "choice", "kind_name": "单选题", "num": 212, "stem": "以下代码输出？（　）\nchar *p = \"hello\";\nprintf(\"%c\", *p + 1);", "options": [{"key": "A", "text": "h"}, {"key": "B", "text": "i"}, {"key": "C", "text": "e"}, {"key": "D", "text": "o"}], "answer": "B", "explain": "本题考查字符指针取值与整型提升。char *p=\"hello\"：*p 取 'h'（104），+1 得 105，%c 输出 'i'（B）。注意 *p+1 是字符码值加 1，非指针移动（*(p+1) 才是 'e'）。", "imgs": []}, {"id": "choice-213", "kind": "choice", "kind_name": "单选题", "num": 213, "stem": "问：fp 可以怎么调用 add？（　）\nint add(int a, int b) {\n    return a + b;\n}\nint (*fp)(int, int);\nfp = add;", "options": [{"key": "A", "text": "`fp(1,2)`"}, {"key": "B", "text": "`*fp(1,2)`"}, {"key": "C", "text": "两者都可以"}, {"key": "D", "text": "不能调用"}], "answer": "C", "explain": "本题考查函数指针调用语法（存疑题）。C 标准规定 `fp(1,2)` 与先解引用再调用 `(*fp)(1,2)` 完全等价（C）。注意选项 B 若原卷为不带括号的 `*fp(1,2)`：因函数调用优先级高于解引用，会解析为 `*(fp(1,2))`（对 int 解引用）非法，此时只有 A 成立——请对照原卷确认 B 是否带括号。", "imgs": []}, {"id": "choice-214", "kind": "choice", "kind_name": "单选题", "num": 214, "stem": "下面关于关键字的描述及使用中，错误的是（　）", "options": [{"key": "A", "text": "volatile 可用于定义多线程应用中的共享变量"}, {"key": "B", "text": "const 可用于定义全局变量"}, {"key": "C", "text": "一个变量既可以是 const，同时也是 volatile"}, {"key": "D", "text": "register static int i = 0;"}], "answer": "D", "explain": "本题考查存储类说明符的互斥关系。C 语言规定一个声明中最多只能有一个存储类说明符，且 `register` 与 `static` 属于同类，二者不能同时出现，因此 `register static int i` 是语法错误（D 为错误描述，选 D）。A 正确：volatile 告知编译器每次从内存取值，多线程共享变量必须加它；B 正确：const 修饰全局变量表示只读，可放只读段；C 正确：只读状态寄存器就是典型——volatile 因为硬件可能改，const 因为程序不该改，两者并不冲突。易错点：把 register 当成\"存储位置\"而与 static 混用，register 只是建议放寄存器，不是另一维度的属性。", "imgs": []}, {"id": "choice-215", "kind": "choice", "kind_name": "单选题", "num": 215, "stem": "中断响应时间是指（　）", "options": [{"key": "A", "text": "从中断处理开始到中断处理结束"}, {"key": "B", "text": "从发出中断请求到中断处理结束"}, {"key": "C", "text": "从发出中断请求到进入中断处理"}, {"key": "D", "text": "从进入中断处理到中断处理结束"}], "answer": "C", "explain": "本题考查中断时序术语。中断响应时间＝从外部（或内部）发出中断请求，到 CPU 完成现场保护、跳入中断服务程序第一条指令所经历的时间，即\"请求→进入处理\"（C）。A、D 描述的是中断服务程序的执行时间（中断处理时间）；B 把响应时间与处理时间合并，成了\"请求到处理结束\"的全程时间。易错点：不要与\"中断延迟\"混淆——引入优先级更高中断或关中断时长的等待都算在响应时间内，但\"处理耗时\"不属于响应时间。", "imgs": []}, {"id": "choice-216", "kind": "choice", "kind_name": "单选题", "num": 216, "stem": "若 P、V 操作的信号量 S 初值为 1，当前值为 -2，则表示有（　）个等待此信号量的线程", "options": [{"key": "A", "text": "0 个"}, {"key": "B", "text": "1 个"}, {"key": "C", "text": "2 个"}, {"key": "D", "text": "3 个"}], "answer": "C", "explain": "本题考查信号量绝对值的语义。信号量 S 初值 1（表示有 1 个资源），当前 S=-2 表示资源已被占用且多出 2 个申请者，其绝对值就是阻塞在该信号量等待队列上的线程数 → 2 个（C）。规律：S>0 时其值＝可用资源数；S=0 表示无资源且无等待；S<0 时 |S|＝等待进程数。易错点：不要把初值 1 与当前值相加理解为\"1+2=3\"。", "imgs": []}, {"id": "choice-217", "kind": "choice", "kind_name": "单选题", "num": 217, "stem": "存储 16×16 点阵的一个汉字信息，需要的字节数为（　）", "options": [{"key": "A", "text": "32"}, {"key": "B", "text": "64"}, {"key": "C", "text": "128"}, {"key": "D", "text": "256"}], "answer": "A", "explain": "本题考查点阵字模容量计算。16×16 点阵共 256 个点，每点用 1 bit 表示（1 为黑、0 为白），合计 256 bit ÷ 8 = 32 Byte（A）。口诀：字节数＝水平点数×垂直点数÷8＝宽×高/8。易错点：把 256 个\"点\"当成 256 字节（选 D）；若字模带偏移、每行再补对齐，则可能略大，但标准 HZK16 字库就是 32 字节/字。", "imgs": []}, {"id": "choice-218", "kind": "choice", "kind_name": "单选题", "num": 218, "stem": "嵌入式芯片的内核电源与片内 I/O 模块的电源是（　）", "options": [{"key": "A", "text": "统一接在一起的"}, {"key": "B", "text": "不同的，其中内核电源的电压要高"}, {"key": "C", "text": "不同的，其中 I/O 模块电源的电压要高"}, {"key": "D", "text": "上述都可以"}], "answer": "C", "explain": "本题考查 MCU 多电源域设计原因。内核（Core/Cortex-M 域）为追求速度与低功耗，采用先进工艺与较低电压（如 1.2V/1.8V）；片内 I/O 需要与外部 3.3V/5V 器件对接并保证足够噪声容限，故电源域分开且 I/O 电压更高（C）。分开还便于加去耦电容、隔离数字噪声。A 错：若统一供电，低压内核无法承受 I/O 电平；B 反了。", "imgs": []}, {"id": "choice-219", "kind": "choice", "kind_name": "单选题", "num": 219, "stem": "UCOSIII 操作系统不属于（　）", "options": [{"key": "A", "text": "RTOS"}, {"key": "B", "text": "抢占式实时操作系统"}, {"key": "C", "text": "非抢占式实时操作系统"}, {"key": "D", "text": "嵌入式实时操作系统"}], "answer": "C", "explain": "本题考查 µC/OS-III 的系统属性。µC/OS-III 是典型的嵌入式实时操作系统（D），采用基于优先级抢占式调度，支持同优先级时间片轮转，属于 RTOS（A、B）——因此\"非抢占式实时操作系统\"（C）不是它的属性，选 C。易错点：\"抢占式\"指高优先级任务就绪可立即剥夺当前任务；µC/OS-III 还可配置为不允许抢占（Round-Robin 或 OSTaskCreate 时指定），但默认与主流用法是抢占式。", "imgs": []}, {"id": "choice-220", "kind": "choice", "kind_name": "单选题", "num": 220, "stem": "在嵌入式芯片接口中，以下 ______ 是音频接口。", "options": [{"key": "A", "text": "IIC"}, {"key": "B", "text": "IIS"}, {"key": "C", "text": "PWM"}, {"key": "D", "text": "以上都不是"}], "answer": "B", "explain": "本题考查常见外设接口用途。IIS/I2S（Inter-IC Sound）是专为数字音频设计的串行总线，由 BCK（位时钟）、WS（声道选择/帧同步）、SD（数据）组成，用于连接 Codec/DAC（B）。IIC 是两线低速控制总线（如配置 Codec 寄存器），PWM 可粗略驱动蜂鸣器但不是音频接口标准，故 A、C、D 错。易错点：I2S 与 I2C 名字相近、引脚都有 SCK/SCL，注意区分数据线数量与用途。", "imgs": []}, {"id": "choice-221", "kind": "choice", "kind_name": "单选题", "num": 221, "stem": "在启动代码中，在关键的初始化代码中，可以使用 ______ 语言。", "options": [{"key": "A", "text": "汇编"}, {"key": "B", "text": "C 语言"}, {"key": "C", "text": "汇编 + C 语言"}, {"key": "D", "text": "以上都不是"}], "answer": "A", "explain": "本题考查启动流程的语言选择。复位后立即执行的关键初始化代码（设置栈指针 SP、初始化时钟/PLL、配置中断向量表、跳转到 C 入口前）必须用汇编实现：此时 C 运行环境（栈、.bss/.data 段、堆）尚未建立，C 代码无法安全运行（A）。堆栈与 C 环境就绪后，才用 C 完成 SystemInit、外设初始化等主体工作。易错点：选 C 看似\"两者都用\"，但题眼是\"关键初始化代码\"这一阶段只能靠汇编。", "imgs": []}, {"id": "choice-222", "kind": "choice", "kind_name": "单选题", "num": 222, "stem": "在启动代码中，STM32 复位处理放在 ______。", "options": [{"key": "A", "text": "0x00000000"}, {"key": "B", "text": "0x00000004"}, {"key": "C", "text": "0x00000010"}, {"key": "D", "text": "0x00000014"}], "answer": "B", "explain": "本题考查 Cortex-M 异常向量表布局。复位后 CPU 从地址 0 处取初始 MSP（0x00000000），从 0x00000004 取复位向量（Reset_Handler 地址）并跳转执行（B）。0x00000008 为 NMI、0x0000000C 为 HardFault；0x00000010/0x14 是 MemManage/BusFault。易错点：向量表首字不是代码而是栈顶地址，真正的代码入口在第二个字；STM32 可通过 BOOT 引脚把 0x00000000 重映射到 Flash/系统存储器/SRAM。", "imgs": []}, {"id": "choice-223", "kind": "choice", "kind_name": "单选题", "num": 223, "stem": "Cortex-M4 处理器采用的架构是（　）", "options": [{"key": "A", "text": "v4T"}, {"key": "B", "text": "v5TE"}, {"key": "C", "text": "v6"}, {"key": "D", "text": "v7"}], "answer": "D", "explain": "本题考查内核架构版本对应关系。Cortex-M4（含 M3/M4/M7）基于 ARMv7-M 架构（带 DSP/浮点扩展时称 ARMv7E-M），故为 v7（D）；ARM7TDMI 是 v4T，ARM9E/10E 是 v5TE，ARM11 是 v6。易错点：把\"M4\"误记为第 6 代架构，v6 对应 ARM11，不是 Cortex-M 系列。", "imgs": []}, {"id": "choice-224", "kind": "choice", "kind_name": "单选题", "num": 224, "stem": "Cortex-M4 提供的流水线是（　）", "options": [{"key": "A", "text": "2 级"}, {"key": "B", "text": "3 级"}, {"key": "C", "text": "5 级"}, {"key": "D", "text": "8 级"}], "answer": "B", "explain": "本题考查 Cortex-M 内核流水线级数。Cortex-M3/M4 采用经典三级流水线：取指（Fetch）→ 译码（Decode）→ 执行（Execute），故为 3 级（B）。对比：Cortex-M7 为六级（双发射）、ARM7 三级、ARM9 五级。易错点：三级流水线使分支跳转带来约 3 个周期的流水线填充，这也是\"跳转指令耗时略长\"\"需要预取指令\"的由来。", "imgs": []}, {"id": "choice-225", "kind": "choice", "kind_name": "单选题", "num": 225, "stem": "Cortex-M4 使用的存储器格式是（　）", "options": [{"key": "A", "text": "小端格式"}, {"key": "B", "text": "大端格式"}, {"key": "C", "text": "小端或大端格式"}, {"key": "D", "text": "没有正确答案"}], "answer": "A", "explain": "本题考查端序（Endianness）结论。Cortex-M4 的存储器取指与数据访问固定为小端（Little-endian）：低地址存放低字节（A）。虽然 ARMv7-M 的定义允许大端，但 Cortex-M 系列实现仅支持小端。易错点：0x12345678 存于 0x4000 时，小端布局依次为 78 56 34 12，大端为 12 34 56 78；网络字节序（大端）与 CPU 字节序不一致时需 __REV/htons 转换。", "imgs": []}, {"id": "choice-226", "kind": "choice", "kind_name": "单选题", "num": 226, "stem": "所有的 GPIO 引脚为（　）模式", "options": [{"key": "A", "text": "输入"}, {"key": "B", "text": "输出"}, {"key": "C", "text": "模拟"}, {"key": "D", "text": "以上都对"}], "answer": "D", "explain": "本题考查 GPIO 工作模式。STM32 每个 GPIO 均可通过 MODER/CRL/CRH 配置为输入（浮空/上拉/下拉）、输出（推挽/开漏）、复用功能或模拟模式，复位后默认为输入浮空（D）。易错点：ADC 采集引脚必须配置成模拟模式，否则数字输入缓冲器会引入额外功耗与误差；同一引脚不能既作 ADC 又作普通数字 IO。", "imgs": []}, {"id": "choice-227", "kind": "choice", "kind_name": "单选题", "num": 227, "stem": "每个 I/O 端口位可以自由的编程，尽管 I/O 端口寄存器必须以（　）的方式访问。", "options": [{"key": "A", "text": "16 位字"}, {"key": "B", "text": "16 位字节"}, {"key": "C", "text": "32 位字节"}, {"key": "D", "text": "32 位字"}], "answer": "D", "explain": "本题考查 GPIO 寄存器访问宽度。STM32 的 GPIO 属于 APB2 外设，其寄存器（MODER、OTYPER、BSRR 等）为 32 位，必须按 32 位字（word）访问（D）；官方固件库直接对其写 u32，才有\"原子置位/清零\"的 BSRR 用法。\"16 位字节\"\"32 位字节\"本身不是有效的存储器传输术语。易错点：按字节/半字访问外设寄存器可能触发总线错误或读到无效数据。", "imgs": []}, {"id": "choice-228", "kind": "choice", "kind_name": "单选题", "num": 228, "stem": "固件库中的功能状态（FunctionalState）类型被赋予以下两个值（　）", "options": [{"key": "A", "text": "ENABLE 或者 DISABLE"}, {"key": "B", "text": "SET 或者 RESET"}, {"key": "C", "text": "YES 或者 NO"}, {"key": "D", "text": "SUCCESS 或者 ERROR"}], "answer": "A", "explain": "本题考查固件库枚举类型。标准外设库中 `FunctionalState` 用于表示\"使能/失能\"配置意图，取值为 `ENABLE`/`DISABLE`（A）；`FlagStatus`（标志状态）与 `ITStatus` 才是 `SET`/`RESET`；`SUCCESS`/`ERROR` 用于函数返回值 `ErrorStatus`。易错点：`xxxCmd(ENABLE/DISABLE)` 与 `xxx_GetFlagStatus()==SET` 是两个不同枚举，别混用。", "imgs": []}, {"id": "choice-229", "kind": "choice", "kind_name": "单选题", "num": 229, "stem": "固件库中的标志状态（FlagStatus）类型被赋予以下两个值（　）", "options": [{"key": "A", "text": "ENABLE 或者 DISABLE"}, {"key": "B", "text": "SUCCESS 或者 ERROR"}, {"key": "C", "text": "SET 或者 RESET"}, {"key": "D", "text": "YES 或者 NO"}], "answer": "C", "explain": "本题考查固件库枚举类型。`FlagStatus`（读某个状态位/标志的结果）取值为 `SET`（置位/事件已发生）/`RESET`（未发生），故 C。`ENABLE/DISABLE` 属 `FunctionalState`（写入配置）；`SUCCESS/ERROR` 属 `ErrorStatus`（返回值）。易错点：`USART_GetFlagStatus(USART1, USART_FLAG_TC)==SET` 中的 SET 不能写成 ENABLE。", "imgs": []}, {"id": "choice-230", "kind": "choice", "kind_name": "单选题", "num": 230, "stem": "STM32F407 有（　）可屏蔽中断通道", "options": [{"key": "A", "text": "43"}, {"key": "B", "text": "51"}, {"key": "C", "text": "74"}, {"key": "D", "text": "82"}], "answer": "D", "explain": "本题考查 STM32F407 中断资源。STM32F407 共有 82 个可屏蔽中断（IRQ）通道（D），另有 10 个系统异常（NMI、HardFault、SysTick 等）。对比：F103 是 60 个，F405/407 由于外设更多达到 82。易错点：常把\"EXTI 16 条线\"\"NVIC 240 个 IRQ（内核上限）\"与本芯片实际通道数混淆。", "imgs": []}, {"id": "choice-231", "kind": "choice", "kind_name": "单选题", "num": 231, "stem": "STM32F407 采用（　）位来编辑中断的优先级", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "8"}, {"key": "C", "text": "16"}, {"key": "D", "text": "32"}], "answer": "A", "explain": "本题考查 NVIC 优先级位宽。Cortex-M4 的优先级寄存器为 8 位，但 ST 在 STM32F4 上只实现了高 4 位（低 4 位读回 0），因此实际可编程优先级为 16 级（A）。同理 F1 系列也是 4 位。易错点：把内核手册的 8 位当成实现值；也正因只有 4 位，`NVIC_PriorityGroupConfig` 才把 4 位拆成\"抢占:响应\"两段。", "imgs": []}, {"id": "choice-232", "kind": "choice", "kind_name": "单选题", "num": 232, "stem": "向量中断控制器最多可支持（　）个 IRQ 中断", "options": [{"key": "A", "text": "127"}, {"key": "B", "text": "128"}, {"key": "C", "text": "240"}, {"key": "D", "text": "255"}], "answer": "C", "explain": "本题考查 Cortex-M 内核 NVIC 的中断上限。Cortex-M3/M4 的 NVIC 理论上最多支持 240 个外部 IRQ（中断号 16~255）（C），其中编号 0~15 留给系统异常。具体芯片只实现其中一部分（如 F407 为 82 个）。易错点：240 是\"内核能力上限\"而非某颗芯片的实现数；255 是把编号范围当成数量。", "imgs": []}, {"id": "choice-233", "kind": "choice", "kind_name": "单选题", "num": 233, "stem": "系统控制寄存器 NVIC 和处理器内核接口紧密耦合，主要目的是（　）。", "options": [{"key": "A", "text": "结构更紧凑，减小芯片的尺寸"}, {"key": "B", "text": "连接更可靠，减小出错的概率"}, {"key": "C", "text": "减小延时，高效处理最近发生的中断"}, {"key": "D", "text": "无所谓，没有特别的意思，远一点也没有关系"}], "answer": "C", "explain": "本题考查 NVIC 紧密耦合的动机。NVIC 与内核紧耦合（而非挂在总线上）是为了配合流水线实现低延迟中断响应与高效的尾链（tail-chaining）/迟到（late-arriving）处理，从而缩短中断延迟、快速处理最新到来的更高优先级中断（C）。芯片面积、连线可靠性都不是设计要点；D 显然错误。", "imgs": []}, {"id": "choice-234", "kind": "choice", "kind_name": "单选题", "num": 234, "stem": "关于中断嵌套说法正确的是（　）。", "options": [{"key": "A", "text": "只要响应优先级不一样就有可能发生中断嵌套"}, {"key": "B", "text": "只要抢占式优先级不一样就有可能发生中断嵌套"}, {"key": "C", "text": "只有抢占式优先级和响应优先级都不一才有可能发生中断嵌套"}, {"key": "D", "text": "以上说法都不对"}], "answer": "B", "explain": "本题考查抢占优先级与响应（子）优先级的作用。抢占优先级决定能否嵌套：高抢占优先级的中断可以打断正在执行的低抢占优先级中断（B）。响应优先级只在\"多个中断同时挂起且抢占优先级相同\"时决定谁先被响应（排队顺序），它不会产生嵌套——若两中断抢占优先级相同，后到的只能等待前者执行完。易错点：A 把响应优先级误当成抢占。", "imgs": []}, {"id": "choice-235", "kind": "choice", "kind_name": "单选题", "num": 235, "stem": "在 STM32F407 向量中断控制器管理下，可将中断分为（　）组。", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": "B", "explain": "本题考查中断优先级分组。STM32 的 NVIC 提供 5 种分组方式（Group 0~4），通过 `NVIC_PriorityGroupConfig()` 选择，把 4 个优先级位在\"抢占位数:响应位数\"间分配：0→(0,4)、1→(1,3)、2→(2,2)、3→(3,1)、4→(4,0)（B）。易错点：默认（不配置时）为 Group 0，\"分组 2\"是很多教程的习惯配置（抢占 4 级、响应 4 级）。", "imgs": []}, {"id": "choice-236", "kind": "choice", "kind_name": "单选题", "num": 236, "stem": "中断屏蔽器不能屏蔽（　）", "options": [{"key": "A", "text": "NMI 中断"}, {"key": "B", "text": "串口中断"}, {"key": "C", "text": "窗口看门狗中断"}, {"key": "D", "text": "外部中断"}], "answer": "A", "explain": "本题考查 NMI 的不可屏蔽特性。NMI（Non-Maskable Interrupt，不可屏蔽中断）不受 PRIMASK/BASEPRI 及 NVIC 使能位屏蔽，用于掉电、时钟失效等致命事件（A）；串口、窗口看门狗（EWI）、外部中断都是普通可屏蔽 IRQ，可用 BASEPRI/使能位屏蔽或清除。易错点：NMI 也无法被更高优先级\"抢占前\"门控，但可通过 NMI 处理程序内部逻辑处理；HardFault 同样不可屏蔽。", "imgs": []}, {"id": "choice-237", "kind": "choice", "kind_name": "单选题", "num": 237, "stem": "PWM 是（　）", "options": [{"key": "A", "text": "脉冲宽度调制"}, {"key": "B", "text": "脉冲频率调制"}, {"key": "C", "text": "脉冲幅度调制"}, {"key": "D", "text": "脉冲位置调制"}], "answer": "A", "explain": "本题考查缩写含义。PWM＝Pulse Width Modulation＝脉冲宽度调制（A）：周期（频率）固定，通过改变高电平占空比等效输出不同平均电压，用于调光、调速、DAC 滤波等。B 是 PFM（调频）、C 是 PAM（调幅）、D 是 PPM（脉位调制）。易错点：PWM 频率与占空比独立——频率由 ARR+PSC 决定，占空比由 CCR/ARR 决定。", "imgs": []}, {"id": "choice-238", "kind": "choice", "kind_name": "单选题", "num": 238, "stem": "当使用定时器 14 输出频率为 1000Hz 的脉冲，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseInitTypeDef TIM_TimeBaseStructure;\nRCC_APB1PeriphClockCmd(RCC_APB1Periph_TIM14, ENABLE);\nTIM_TimeBaseStructure.TIM_Period        = ___________;\nTIM_TimeBaseStructure.TIM_Prescaler     = 8400-1;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM14, &TIM_TimeBaseStructure);", "options": [{"key": "A", "text": "1000"}, {"key": "B", "text": "10"}, {"key": "C", "text": "999"}, {"key": "D", "text": "9"}], "answer": "D", "explain": "本题考查定时器周期计算（F407：APB1 定时器时钟 84MHz）。计数时钟＝84MHz/8400＝10kHz；要 1000Hz 输出，周期计数应为 10kHz/1000Hz＝10 个计数，而 ARR 是\"重装载值\"，实际周期为 ARR+1，故 TIM_Period＝10-1＝9（D）。易错点：忘记 +1 会算成 10（B）；1000/999（A、C）是把 84MHz 当成计数时钟。", "imgs": []}, {"id": "choice-239", "kind": "choice", "kind_name": "单选题", "num": 239, "stem": "当使用定时器 1 输出频率为 100Hz 的脉冲，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseInitTypeDef TIM_TimeBaseStructure;\nRCC_APB2PeriphClockCmd(RCC_APB2Periph_TIM1, ENABLE);\nTIM_TimeBaseStructure.TIM_Period        = ___________;\nTIM_TimeBaseStructure.TIM_Prescaler     = 16800-1;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM1, &TIM_TimeBaseStructure);", "options": [{"key": "A", "text": "100"}, {"key": "B", "text": "200"}, {"key": "C", "text": "99"}, {"key": "D", "text": "199"}], "answer": "C", "explain": "本题考查定时器周期计算（F407：TIM1 挂在 APB2，定时器时钟 168MHz）。计数时钟＝168MHz/16800＝10kHz；100Hz 输出需要 10kHz/100Hz＝100 个计数，TIM_Period＝100-1＝99（C）。易错点：TIM1/TIM8 在 APB2 上跑 168MHz，TIM2~TIM7 等 APB1 定时器为 84MHz，两者预分频系数不同；仍要记得 ARR+1 才是周期。", "imgs": []}, {"id": "choice-240", "kind": "choice", "kind_name": "单选题", "num": 240, "stem": "以下对于 STM32 ADC 描述正确的是（　）", "options": [{"key": "A", "text": "STM32F407 ADC 是一个 12 位连续近似模拟到数字的转换器"}, {"key": "B", "text": "STM32F407 ADC 是一个 8 位连续近似模拟到数字的转换器"}, {"key": "C", "text": "STM32F407 ADC 是一个 12 位连续近似数字到模拟的转换器"}, {"key": "D", "text": "STM32F407 ADC 是一个 8 位连续近似数字到模拟的转换器"}], "answer": "A", "explain": "本题考查 ADC 分辨率与转换方向。STM32F4 片上 ADC 为逐次逼近型（SAR）12 位、把模拟量转成数字量（A/D），因此 A 正确。B、D 位数错；C、D 方向错（数字转模拟是 DAC）。易错点：\"连续近似\"是逐次逼近（successive approximation）的旧译，指内部用逐次比较试凑；12 位对应满量程 4096 级（0~4095）。", "imgs": []}, {"id": "choice-241", "kind": "choice", "kind_name": "单选题", "num": 241, "stem": "ADC 转换过程不含哪项（　）", "options": [{"key": "A", "text": "采样"}, {"key": "B", "text": "量化"}, {"key": "C", "text": "编码"}, {"key": "D", "text": "逆采样"}], "answer": "D", "explain": "本题考查 A/D 转换三大步骤。模拟到数字的转换依次为采样（Sample）→ 量化（Quantize）→ 编码（Encode），不含\"逆采样\"（D，属生造名词）。采样把时间轴离散化，量化把幅值离散化（引入量化误差，最大 ±1/2 LSB），编码把量化结果写成二进制码。易错点：采样定理要求 fs ≥ 2·fmax，否则混叠（Aliasing）。", "imgs": []}, {"id": "choice-242", "kind": "choice", "kind_name": "单选题", "num": 242, "stem": "ADC 转换过程正确的是（　）", "options": [{"key": "A", "text": "采样—量化—编码"}, {"key": "B", "text": "量化—采样—编码"}, {"key": "C", "text": "采样—编码—量化"}, {"key": "D", "text": "编码—采样—量化"}], "answer": "A", "explain": "本题考查 A/D 转换顺序。必须先\"采样\"取出瞬时值，再\"量化\"到有限电平档，最后\"编码\"成二进制，故为 A。B、C、D 把顺序打乱即违背物理过程：没有采样就没有样本可量化，没有量化结果就无法编码。易错点：牢记\"采样→量化→编码\"三步链，D/A 转换则是\"解码→重建（零阶保持）→滤波\"。", "imgs": []}, {"id": "choice-243", "kind": "choice", "kind_name": "单选题", "num": 243, "stem": "下列哪项不是 ADC 转换器的主要技术指标（　）", "options": [{"key": "A", "text": "分辨率"}, {"key": "B", "text": "频率"}, {"key": "C", "text": "转换速率"}, {"key": "D", "text": "量化误差"}], "answer": "B", "explain": "本题考查 ADC 指标。主要指标包括分辨率（位数/LSB）、转换时间或转换速率（sps）、量化误差、精度（INL/DNL）、信噪比等；\"频率\"一词笼统，不是标准指标名（B）——若指采样频率/输入带宽则会明确写\"采样率\"\"输入信号频率\"。易错点：不要把\"系统时钟频率\"当成 ADC 指标；采样率与转换时间互为倒数，需分清。", "imgs": []}, {"id": "choice-244", "kind": "choice", "kind_name": "单选题", "num": 244, "stem": "以下对 STM32F407 集成 A/D 的特性描述不正确的是（　）", "options": [{"key": "A", "text": "12 位精度"}, {"key": "B", "text": "单一转换模式"}, {"key": "C", "text": "按通道配置采样时间"}, {"key": "D", "text": "数据对齐方式与内建数据一致"}], "answer": "B", "explain": "本题考查 F4 ADC 特性。F4 ADC 支持单次/连续/扫描/间断、单通道/多通道 DMA 搬运等多种转换模式，\"单一转换模式\"说法错误（B 为应选项）。A 正确（12 位可配 6/8/10/12 位）；C 正确（每个规则通道可单独设 SMPR 采样周期）；D 正确（数据可按左/右对齐读出）。易错点：多通道扫描必须配合 DMA，否则只能循环读取同一规则通道。", "imgs": []}, {"id": "choice-245", "kind": "choice", "kind_name": "单选题", "num": 245, "stem": "以下对 STM32F407 集成 A/D 的特性描述正确的是（　）", "options": [{"key": "A", "text": "供电需求：2.6V 到 3.8V"}, {"key": "B", "text": "输入范围：VREF- ≤ VIN ≤ VREF+"}, {"key": "C", "text": "所有输入通道能够同时进行工作"}, {"key": "D", "text": "ADC 转换过程是：采样—编码—量化"}], "answer": "B", "explain": "本题考查 F4 ADC 规格。模拟输入电压必须在 VREF- 与 VREF+ 之间（通常 0~3.3V）才是有效量程（B）。A 错：VDDA 要求 1.8~3.6V（典型 3.3V），2.6~3.8V 不是手册值；C 错：F4 单个 ADC 内部只有一个SAR 转换核心，多通道靠轮流采样，不能真正同时转换（F3 才有双 ADC 交错）；D 错：次序应为采样—量化—编码。", "imgs": []}, {"id": "choice-246", "kind": "choice", "kind_name": "单选题", "num": 246, "stem": "SysTick 定时器是多少位的定时器（　）", "options": [{"key": "A", "text": "8"}, {"key": "B", "text": "16"}, {"key": "C", "text": "32"}, {"key": "D", "text": "24"}], "answer": "D", "explain": "本题考查 SysTick 位宽。Cortex-M 内核自带的 SysTick 是 24 位递减计数器（D），时钟源可选内核时钟（F407 为 168MHz）或 HCLK/8，常用于 RTOS 时基与精确延时。易错点：24 位不能直接一次产生 1s 级延时——168MHz 下最大约 0.1s，需要软件计数或改用其他定时器；它也没有预分频（只有 /1、/8 两档）。", "imgs": []}, {"id": "choice-247", "kind": "choice", "kind_name": "单选题", "num": 247, "stem": "当前 SysTick 使用到的时钟源频率为 168MHz，则最大的定时时间约为（　）", "options": [{"key": "A", "text": "168ms"}, {"key": "B", "text": "168us"}, {"key": "C", "text": "84ms"}, {"key": "D", "text": "99ms"}], "answer": "D", "explain": "本题考查 SysTick 最大定时时间计算。24 位计数器最大计数值 2^24-1＝16,777,215，除以 168MHz ≈ 0.0998s ≈ 99ms（D）。易错点：把 2^24 当成 2^26；或误以为 32 位（则应是 25.6s）。工程做法：需要更长延时就记录溢出次数（如 SysTick_Handler 累加计数）来实现 ms 级 RTOS 时基。", "imgs": []}, {"id": "choice-248", "kind": "choice", "kind_name": "单选题", "num": 248, "stem": "当前 SysTick 使用到的时钟源频率为 168MHz，然后接着进行 8 分频，则最大的定时时间约为（　）", "options": [{"key": "A", "text": "1680ms"}, {"key": "B", "text": "99ms"}, {"key": "C", "text": "798ms"}, {"key": "D", "text": "990ms"}], "answer": "C", "explain": "本题考查 SysTick 分频后的最大定时。168MHz/8＝21MHz，24 位最大计数值 16,777,215 ÷ 21MHz ≈ 0.799s ≈ 798ms（C）。易错点：分频 8 后最大时间应是原来的 8 倍（99ms×8≈798ms），而不是 990ms（把 21MHz 记成 16.9MHz 的错算）。做法：`SysTick_Config(SystemCoreClock/8/1000)` 常用作 1ms 中断时基。", "imgs": []}, {"id": "choice-249", "kind": "choice", "kind_name": "单选题", "num": 249, "stem": "若按键连接了 STM32F407 的 PC6 GPIO，PC6 通用 IO 端口映射到外部中断事件线上是（　）", "options": [{"key": "A", "text": "EXTI 线 4"}, {"key": "B", "text": "EXTI 线 5"}, {"key": "C", "text": "EXTI 线 6"}, {"key": "D", "text": "EXTI 线 7"}], "answer": "C", "explain": "本题考查 EXTI 线编号规则。STM32 的 EXTI 线按引脚序号映射（与端口号无关）：PX0→EXTI0、PX1→EXTI1 …… 因此 PC6 → EXTI6（C），同时在 SYSCFG_EXTICR 中选择端口 C。易错点：ERROR 常见于把\"端口 C\"当成线号 2；同一线号的多个端口（PA6/PB6/PC6…）只能选一个，不能同时做外部中断。", "imgs": []}, {"id": "choice-250", "kind": "choice", "kind_name": "单选题", "num": 250, "stem": "上图中 WKUP 连接了 STM32F407 的 PA0 GPIO，PA0 通用 IO 端口映射到外部中断事件线上是（　）", "options": [{"key": "A", "text": "EXTI 线 0"}, {"key": "B", "text": "EXTI 线 1"}, {"key": "C", "text": "EXTI 线 2"}, {"key": "D", "text": "EXTI 线 3"}], "answer": "A", "explain": "本题考查 EXTI 线映射。引脚序号决定 EXTI 线号，PA0 → EXTI0（A）。PA0-WKUP 还是芯片的唤醒引脚：可在待机模式下用 WKUP 上升沿唤醒，其 EXTI0 中断同样可唤醒 STOP 模式。易错点：PA0 的线号是 0 而不是端口号 A（即 0）。", "imgs": []}, {"id": "choice-251", "kind": "choice", "kind_name": "单选题", "num": 251, "stem": "在 STM32F407 上的 I/O 脚的翻转速度可以为（　）。", "options": [{"key": "A", "text": "18MHz"}, {"key": "B", "text": "50MHz"}, {"key": "C", "text": "36MHz"}, {"key": "D", "text": "72MHz"}], "answer": "B", "explain": "本题考查 GPIO 输出速度选项。STM32F4 的 OSPEEDR 提供低/中/高/超高四档，F407 对应约 2/25/50/100MHz；四选项中最接近且属于标准档位的是 50MHz（B）——原卷答案即为 B。A（18MHz）是 F1 的档位，C、D（36/72MHz）不是 F4 手册给出的标称值。易错点：GPIO 翻转速度是\"摆率\"限制，配得越高 EMI 与功耗越大，够用即可。", "imgs": []}, {"id": "choice-252", "kind": "choice", "kind_name": "单选题", "num": 252, "stem": "ARM Cortex-M4 不可以通过（　）唤醒 CPU。", "options": [{"key": "A", "text": "I/O 端口"}, {"key": "B", "text": "RTC 闹钟"}, {"key": "C", "text": "USB 唤醒事件"}, {"key": "D", "text": "PLL"}], "answer": "D", "explain": "本题考查低功耗唤醒源。睡眠/停止/待机模式下可由外部中断（I/O 端口）、RTC 闹钟/唤醒中断、USB 唤醒事件、独立看门狗等唤醒；PLL 是时钟倍频器，只是被唤醒后重配时钟的对象，不是唤醒源（D）。易错点：待机模式只能由 WKUP 引脚、RTC、IWDG、NRST 唤醒；停止模式可被任意 EXTI 唤醒。", "imgs": []}, {"id": "choice-253", "kind": "choice", "kind_name": "单选题", "num": 253, "stem": "STM32 嵌套向量中断控制器（NVIC）具有（　）个可编程的优先等级。", "options": [{"key": "A", "text": "16"}, {"key": "B", "text": "43"}, {"key": "C", "text": "72"}, {"key": "D", "text": "36"}], "answer": "A", "explain": "本题考查优先级级数。STM32 的 NVIC 优先级寄存器实现 4 位 → 2^4＝16 个可编程优先级（0 最高、15 最低）（A），再按分组拆成抢占/响应两段。B（43）、C（72）、D（36）均非优先级数（43、51、74、82 是不同型号的中断通道数，容易混淆）。易错点：数字越小优先级越高，别写反。", "imgs": []}, {"id": "choice-254", "kind": "choice", "kind_name": "单选题", "num": 254, "stem": "STM32 的外部中断/事件控制器（EXTI）支持（　）个中断/事件请求。", "options": [{"key": "A", "text": "16"}, {"key": "B", "text": "23"}, {"key": "C", "text": "19"}, {"key": "D", "text": "36"}], "answer": "B", "explain": "本题考查 EXTI 通道数。F4 的 EXTI 共 23 条线：16 条对应 PX0~PX15，另有 PVD、RTC 闹钟、USB 唤醒/OTG_FS、以太网唤醒等（共 7 条），合计 23（B）。易错点：16（A）只是 IO 线；19（C）是 F1 的线数；EXTI 既可产生中断（进 NVIC）也可只产生事件（触发 ADC/DMA 等，不进中断）。", "imgs": []}, {"id": "choice-255", "kind": "choice", "kind_name": "单选题", "num": 255, "stem": "当使用定时器 8 的通道 1 输出频率为 50Hz，占空比为 20% 的脉冲，且 PWM 工作在模式 1，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseStructure.TIM_Period        = ______________;\nTIM_TimeBaseStructure.TIM_Prescaler     = ______________;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM8, &TIM_TimeBaseStructure);\nTIM_SetCompare1(TIM8, _______________);", "options": [{"key": "A", "text": "500，8400，20"}, {"key": "B", "text": "50，16800，20"}, {"key": "C", "text": "199，16799，20"}, {"key": "D", "text": "199，16799，40"}], "answer": "D", "explain": "本题考查 PWM 频率与占空比计算（TIM8 属 APB2，时钟 168MHz）。计数时钟＝168M/16800＝10kHz；50Hz 周期需 10k/50＝200 个计数 → ARR＝199。模式 1 下\"高电平有效\"，占空比＝CCR/(ARR+1)，要 20% → CCR＝200×20%＝40（D）。易错点：模式 1 时 CCR=40 得 20% 高电平；若填 20 则只有 10%。模式 2 极性相反（下一题）。", "imgs": []}, {"id": "choice-256", "kind": "choice", "kind_name": "单选题", "num": 256, "stem": "当使用定时器 8 的通道 1 输出频率为 50Hz，占空比为 20% 的脉冲，且 PWM 工作在模式 2，且代码如下，对应的空白区值应为（　）：\nTIM_TimeBaseStructure.TIM_Period        = ______________;\nTIM_TimeBaseStructure.TIM_Prescaler     = ______________;\nTIM_TimeBaseStructure.TIM_ClockDivision = TIM_CKD_DIV1;\nTIM_TimeBaseStructure.TIM_CounterMode   = TIM_CounterMode_Up;\nTIM_TimeBaseInit(TIM8, &TIM_TimeBaseStructure);\nTIM_SetCompare1(TIM8, _______________);", "options": [{"key": "A", "text": "500，8400，20"}, {"key": "B", "text": "50，16800，20"}, {"key": "C", "text": "199，16799，20"}, {"key": "D", "text": "199，16799，160"}], "answer": "D", "explain": "本题考查 PWM 模式 2 的极性关系。TIM8 时钟 168MHz，PSC=16799 → 10kHz；50Hz → ARR=199；模式 2 是\"CNT<CCR 时输出无效电平（低）\"，即输出高电平的时间为 (ARR+1)-CCR。要得到 20% 高电平，就需要 80% 的低电平 → CCR＝200×80%＝160（D）。易错点：模式 1 与模式 2 的占空比互补，记不住就用\"模式2：CCR 越大高电平越少\"。", "imgs": []}, {"id": "choice-257", "kind": "choice", "kind_name": "单选题", "num": 257, "stem": "AT24C02 的 A0、A1、A2 引脚给予高电平，则读访问地址为（　）。", "options": [{"key": "A", "text": "0xA0"}, {"key": "B", "text": "0xA3"}, {"key": "C", "text": "0xAA"}, {"key": "D", "text": "以上都不是"}], "answer": "D", "explain": "本题考查 24C02 的 I2C 器件地址。AT24C02 的 7 位地址为 `1010 A2 A1 A0`，A2A1A0＝111 → 7 位地址 0x57，写成含读写位的 8 位形式：写 0xAE、读 0xAF，四个选项都不对，故选 D。易错点：常有人按\"1010+A2A1A0+0\"算成 1010 111 0＝0xAE，而读操作最低位应是 1；A0~A2 全高时读地址不是 0xAF 以外的任何选项。", "imgs": []}, {"id": "choice-258", "kind": "choice", "kind_name": "单选题", "num": 258, "stem": "AT24C02 一次最多进行编程（　）字节。", "options": [{"key": "A", "text": "256"}, {"key": "B", "text": "128"}, {"key": "C", "text": "8"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查 EEPROM 页写容量。AT24C02 总容量 2Kbit＝256Byte，但内部按页（page）组织，每页 8 字节，一页写操作不能跨页，否则地址回卷覆盖本页开头（C）。易错点：256 是总容量；跨页写必须拆成多次写并重发地址；每次写后需等待约 5ms 内部写周期才能响应下一个起始条件（应答轮询可检测）。", "imgs": []}, {"id": "choice-259", "kind": "choice", "kind_name": "单选题", "num": 259, "stem": "STM32F407ZE 内部 FLASH 容量是（　）。", "options": [{"key": "A", "text": "1MB"}, {"key": "B", "text": "512KB"}, {"key": "C", "text": "2MB"}, {"key": "D", "text": "192KB"}], "answer": "B", "explain": "本题考查型号编码规则。STM32F407ZE：Z 表示 144 引脚，E 表示 Flash 容量 512KB（B）；C=256KB、D=384KB、E=512KB、F=768KB、G=1MB、I=2MB。1MB 对应 F407ZG/IG。易错点：把\"E\"当成\"增强版\"而与容量无关，型号后缀字母表的容量对照是必背项。", "imgs": []}, {"id": "choice-260", "kind": "choice", "kind_name": "单选题", "num": 260, "stem": "STM32F407ZE 内部 FLASH 被全部擦除后，尝试读取其存储某地址字数据会是（　）。", "options": [{"key": "A", "text": "0x00000000"}, {"key": "B", "text": "0xFF"}, {"key": "C", "text": "0xFFFFFFFF"}, {"key": "D", "text": "0x00"}], "answer": "C", "explain": "本题考查 Flash 擦除后的状态。浮栅存储单元擦除后所有 bit 都是 1，按字（32 位）读取得 0xFFFFFFFF（C）（按字节读才是 0xFF，故 B 是干扰项）。这也解释了 Flash 编程只能把 1 写成 0、写前必须先擦除的原因。易错点：未初始化的 Flash 区域不等于 0，做空白检查要用 0xFFFFFFFF。", "imgs": []}, {"id": "choice-261", "kind": "choice", "kind_name": "单选题", "num": 261, "stem": "独立看门狗使用的时钟源可以是（　）。", "options": [{"key": "A", "text": "LSE"}, {"key": "B", "text": "LSI"}, {"key": "C", "text": "HSI"}, {"key": "D", "text": "PLL"}], "answer": "B", "explain": "本题考查 IWDG 时钟源。独立看门狗必须独立于主时钟，其时钟源只能是内部低速 RC LSI（约 32kHz）（B），即使主时钟失效也能复位。LSE 是外部 32.768kHz 晶振（给 RTC）；HSI/PLL 属主时钟链，不能给 IWDG。易错点：窗口看门狗（WWDG）则挂在 PCLK1 上、带时钟预分频，两者时钟源不同。", "imgs": []}, {"id": "choice-262", "kind": "choice", "kind_name": "单选题", "num": 262, "stem": "窗口看门狗计数初值为 100，窗口上限值为 80，窗口下限值为 64，窗口看门狗使能后，在计数值等于（　）时刻喂狗不会导致 CPU 复位。", "options": [{"key": "A", "text": "90"}, {"key": "B", "text": "70"}, {"key": "C", "text": "63"}, {"key": "D", "text": "以上都不是"}], "answer": "B", "explain": "本题考查窗口看门狗喂狗时机。WWDG 的计数从初值递减，允许喂狗的窗口是 CFR < CNT < 窗口值（上限），即 80 与 64 之间（不含上下边界），因此只有计数值 70（B）落在窗口内；90 大于上限 80 → 喂狗过早，触发复位；63 已低于下限 0x40 → 计数值减到 0x3F 时本身就会复位。易错点：WWDG 是\"太早喂也不行\"的安全机制，与 IWDG 只要求\"别太晚\"不同。", "imgs": []}, {"id": "choice-263", "kind": "choice", "kind_name": "单选题", "num": 263, "stem": "STM32F407 的 VREF 引脚连接到 1.8V，读取到 A/D 转换后的数值为 4095，则测量出的电压值为（　）。", "options": [{"key": "A", "text": "3300mv"}, {"key": "B", "text": "1800mv"}, {"key": "C", "text": "0mv"}, {"key": "D", "text": "以上都不是"}], "answer": "B", "explain": "本题考查 ADC 量程换算。12 位满码 4095 对应基准电压 VREF＝1.8V，故测量值 1800mV（B）。公式：Vin＝AD×VREF/4095（或用 4096 的近似口径，误差 <1LSB）。易错点：VREF 不一定是 3.3V，本题故意把 VREF 设为 1.8V；A 是按 3.3V 硬套的错选。", "imgs": []}, {"id": "choice-264", "kind": "choice", "kind_name": "单选题", "num": 264, "stem": "STM32F407 的 VREF 引脚连接到 3.3V，读取到 A/D 转换后的数值为 0，则测量出的电压值为（　）。", "options": [{"key": "A", "text": "3300mv"}, {"key": "B", "text": "1800mv"}, {"key": "C", "text": "0mv"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查 ADC 量程换算。数字量 0 对应输入电压为 0（相对 VREF-，通常接地），故为 0mV（C）。注意：代码 0 表示 Vin ≤ VREF-，实际可能是负电压被钳位或引脚未接信号；6 位/8 位精度下同样是 0。易错点：把 VREF 电压与转换结果混为一谈（A）。", "imgs": []}, {"id": "choice-265", "kind": "choice", "kind_name": "单选题", "num": 265, "stem": "默认使用中断优先级分组 2，配置串口中断的抢占优先级为 2，响应优先级为 3；配置定时器 1 中断的抢占优先级为（　），响应优先级为 3，就能抢占串口中断。", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "2"}, {"key": "C", "text": "1"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查抢占优先级比较方向。抢占优先级数值越小级别越高；要抢占串口（抢占 2），定时器 1 的抢占值必须小于 2，即 1（C）。（此处\"响应优先级为 3\"是原题设定的干扰，响应优先级不影响抢占能力。）易错点：4 位优先级数值越小越高，与\"等级\"直觉相反；同抢占优先级时不存在抢占，只按响应优先级排队。", "imgs": []}, {"id": "choice-266", "kind": "choice", "kind_name": "单选题", "num": 266, "stem": "默认使用中断优先级分组 2，配置串口中断的抢占优先级为 2，响应优先级为 2；配置定时器 1 中断的抢占优先级为 2，响应优先级为（　），则当两个中断同时发生，定时器 1 中断优先执行。", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "2"}, {"key": "C", "text": "1"}, {"key": "D", "text": "以上都不是"}], "answer": "C", "explain": "本题考查响应优先级的作用。两中断抢占优先级相同（都是 2）时不会嵌套，此时由响应优先级决定同时挂起时谁先被响应，数值越小越优先，故要优于串口的 2 就取 1（C）。易错点：响应优先级相同（都 2）时，则按中断号（IRQ 编号小者优先）裁决——TIM1 的 IRQ 号是 25，USART1 是 37，TIM1 其实也会先执行；但题设要求\"通过配置达到\"目标，选 1 最稳妥。", "imgs": []}, {"id": "choice-267", "kind": "choice", "kind_name": "单选题", "num": 267, "stem": "在 SPI 通信中有以下 4 根信号引脚，（　）引脚用于读取从机的数据。", "options": [{"key": "A", "text": "MOSI"}, {"key": "B", "text": "MISO"}, {"key": "C", "text": "/SS"}, {"key": "D", "text": "SCLK"}], "answer": "B", "explain": "本题考查 SPI 引脚含义。MISO（Master In Slave Out）是主机的输入、从机的输出，主机正是通过它读从机数据（B）。MOSI 是主机输出（写数据给从机），/SS 是片选（选中从机），SCLK 是时钟（由主机产生）。易错点：记 MISO 的 \"MI\"＝Master In＝主入，即主机收数据。", "imgs": []}, {"id": "choice-268", "kind": "choice", "kind_name": "单选题", "num": 268, "stem": "在 SPI 通信中有以下 4 根信号引脚，（　）引脚用于输出时钟信号。", "options": [{"key": "A", "text": "MOSI"}, {"key": "B", "text": "MISO"}, {"key": "C", "text": "/SS"}, {"key": "D", "text": "SCLK"}], "answer": "D", "explain": "本题考查 SPI 时钟来源。SPI 是同步串行总线，时钟由主机产生并通过 SCLK（SCK）输出给从机（D）；从机不得驱动时钟。MOSI/MISO 传数据，/SS 选片。易错点：SCLK 是\"主机发出的时钟\"，这点与 I2C 的 SCL 类似但 I2C 多主；SPI 无应答、无地址，靠片选区分从机。", "imgs": []}, {"id": "choice-269", "kind": "choice", "kind_name": "单选题", "num": 269, "stem": "当串口 1 中断的抢占优先级为 2，响应优先级为 1；定时器 1 中断的抢占优先级 2，响应优先级为 1，以下描述正确的是：（　）", "options": [{"key": "A", "text": "当串口 1 中断在运行，定时器 1 能够抢占其优先执行。"}, {"key": "B", "text": "当定时器 1 中断在运行，串口 1 中断能够抢占其优先执行。"}, {"key": "C", "text": "当两个中断同时发生，定时器 1 优先执行。"}, {"key": "D", "text": "以上都不对。"}], "answer": "C", "explain": "本题考查优先级完全相同（都为 2/1）时的裁决。抢占优先级相同 → 不能互相抢占（A、B 错）；同时挂起时按中断向量号（IRQ 号）小者先得到响应，TIM1(25) < USART1(37)，因此定时器 1 优先执行（C）。易错点：C 的正确性依赖芯片实现的中断号顺序；若两者抢占/响应完全一样但 IRQ 号顺序相反，则结果相反。原卷标答为 C。", "imgs": []}, {"id": "choice-270", "kind": "choice", "kind_name": "单选题", "num": 270, "stem": "独立看门狗使用的时钟源为内部低速 RC 振荡电路，频率为 32KHz，部分初始化代码如下：\nIWDG_SetPrescaler(IWDG_Prescaler_256);\nIWDG_SetReload(125);\n则看门狗的喂狗超时时间为（　）", "options": [{"key": "A", "text": "125ms"}, {"key": "B", "text": "256ms"}, {"key": "C", "text": "1000ms"}, {"key": "D", "text": "以上都不对。"}], "answer": "C", "explain": "本题考查 IWDG 溢出（喂狗超时）时间计算。公式：T＝(RLR+1)×预分频值÷LSI（分频档位 IWDG_Prescaler_4~256 就是 4×2^PR）。本题 LSI≈32kHz、预分频 256 → 计数时钟 32kHz/256＝125Hz；重装载值 125 → 实际计数 125+1＝126 个周期，T＝126/125Hz≈1.008s≈1000ms（C）。易错点：①漏掉 +1（则算得约 992ms，选项里没有，可反向验证）；②把 32kHz 写成 32MHz（则得约 1ms，选 A）；③分频档位写错一位结果差一倍。", "imgs": []}, {"id": "choice-271", "kind": "choice", "kind_name": "单选题", "num": 271, "stem": "窗口看门狗在初始化的时候设置窗口的上限值为 80，则在其计数值在递减的过程中，执行喂狗会导致 CPU 复位为（　）", "options": [{"key": "A", "text": "63"}, {"key": "B", "text": "64"}, {"key": "C", "text": "65"}, {"key": "D", "text": "66"}], "answer": "A", "explain": "本题考查 WWDG 下限复位点。WWDG 计数器为 7 位，0x3F（63）是硬件规定的下限：当 CNT 从 0x40(64) 递减到 0x3F(63) 时，即使\"喂狗\"也会立即产生复位（A），因为此时已经越过了 T6 位清零的边界。B(64)、C(65)、D(66) 都还在允许区（只要小于窗口上限 80）。易错点：窗口上限（CFR）与下限（0x40-1）是两道不同的门；软件必须在 64~79 之间喂狗。", "imgs": []}, {"id": "choice-272", "kind": "choice", "kind_name": "单选题", "num": 272, "stem": "在 UCOSIII 创建了两个任务，而且该两个任务同时都是最高的优先级，printf 函数通过串口 1 打印输出，且波特率为 9600bps，这两个任务执行代码如下：\nvoid task1(void *parg) {\n    while (1) {\n        printf(\"task1 is running ...\\r\\n\");\n        OSTimeDlyHMSM(0,0,0,300,OS_OPT_TIME_HMSM_STRICT,&err);\n    }\n}\nvoid task2(void *parg) {\n    while (1) {\n        printf(\"task2 is running ...\\r\\n\");\n        OSTimeDlyHMSM(0,0,0,100,OS_OPT_TIME_HMSM_STRICT,&err);\n    }\n}\n以下描述正确的是（　）", "options": [{"key": "A", "text": "任务 1 一直执行，任务 2 不能执行"}, {"key": "B", "text": "任务 1 与任务 2 都不能执行"}, {"key": "C", "text": "任务 1 打印信息完整，任务 2 打印信息不完整"}, {"key": "D", "text": "以上都不对"}], "answer": "D", "explain": "本题考查同优先级任务的时间片轮转。两个任务优先级相同且都使能了时间片轮转，因此都能运行、并非\"一直执行/不能执行\"（A、B 错）；关键在于 printf 非可重入——两者在 9600bps 下都会调用同一串口发送函数，可能出现双方打印都残缺（互相打断、输出交叉）的情形，而不仅是\"任务 2 不完整\"（C 的表述不全面），故按原卷标答选 D。要点：多任务共用串口需加互斥信号量或用可重入的日志缓冲；1 个字符 10 位，9600bps≈960 字符/s，一条 22 字节消息就要 230ms，远超 100ms 的延时周期，冲突几乎必然发生。", "imgs": []}, {"id": "choice-273", "kind": "choice", "kind_name": "单选题", "num": 273, "stem": "若有说明 `int (*p)[3];` 以下叙述正确的是（　）", "options": [{"key": "A", "text": "p 是指针数组"}, {"key": "B", "text": "`(*p)[3]` 和 `*p[3]` 等价"}, {"key": "C", "text": "p 是指向一维数组中任何一个元素的指针"}, {"key": "D", "text": "p 是指向含有 3 个整型元素的一维数组的指针"}], "answer": "D", "explain": "本题考查数组指针与指针数组的区分（原卷标答为 C，属笔误，正确答案是 D）。`int (*p)[3]` 中括号让 `*` 先与 p 结合：p 是指针，指向\"含 3 个 int 的一维数组\"（D 对）；A 的\"指针数组\"应写成 `int *p[3]`；C 描述的是\"指向单个 int 的指针\"（`int *p`）的行为，不能带 [3]；B 中 `*p[3]` 因下标优先级高于 `*`，等于 `*(p[3])`，即\"取 p 数组第 4 个元素指向的值\"，与 `(*p)[3]` 语义完全不同，且此处 p 根本不是数组，`p[3]` 会越界。记忆法：名字先与谁结合——`(*p)[N]`→数组指针，`*p[N]`→指针数组。", "imgs": []}, {"id": "choice-274", "kind": "choice", "kind_name": "单选题", "num": 274, "stem": "在 C 程序中，表达式 5%2 的结果是（　）", "options": [{"key": "A", "text": "2.5"}, {"key": "B", "text": "2"}, {"key": "C", "text": "1"}, {"key": "D", "text": "3"}], "answer": "C", "explain": "本题考查取余运算。`%` 是整型取余运算符，5÷2＝2 余 1，故结果为 1（C）。A 是 5.0/2.0 的浮点除结果（C 语言中整数相除 5/2 也只取整数部分 2，即 B 是 `5/2` 的结果）；D 是 (5+2)/2 之类的错算。易错点：`%` 只能用于整型（浮点取余要用 fmod）；负数取余结果符号随被除数（如 -5%2＝-1）。", "imgs": []}, {"id": "choice-275", "kind": "choice", "kind_name": "单选题", "num": 275, "stem": "若 `int x=2,y=3,z=4` 则表达式 `x<z?y:z` 的结果是（　）", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "3"}, {"key": "C", "text": "2"}, {"key": "D", "text": "0"}, {"key": "E", "text": "1"}], "answer": "B", "explain": "本题考查三目条件运算符。先算条件 `x<z`（2<4）为真，取冒号前的值 y＝3（B）。易错点：①三目运算的结合性是从右向左（A?B:C?D:E 等价 A?B:(C?D:E)）；②优先级低于关系/算术运算但高于赋值，所以 `k = a>b?a:b` 无需加括号；③条件表达式的类型会做隐式转换，若两分支类型不同（int/double）则整体提升为 double。", "imgs": []}, {"id": "choice-276", "kind": "choice", "kind_name": "单选题", "num": 276, "stem": "对以下循环体的执行次数是（　）\n#include <stdio.h>\nint main()\n{\n    int i,j;\n    for(i=0,j=3; i<j+5; i+=2,j--)\n        printf(\"%d \\n\",i);\n}", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "3"}, {"key": "C", "text": "2"}, {"key": "D", "text": "1"}], "answer": "B", "explain": "本题考查双变量 for 循环的执行次数（注意条件含 j 变化）。逐轮：初值 i=0,j=3；条件 i<j+5 → 0<8 真，执行后 i=2,j=2；2<7 真，i=4,j=1；4<6 真，i=6,j=0；再判 6<5 假，结束。共执行 3 次（输出 0、2、4）（B）。易错点：把条件里的 `j+5` 当成常量 8（则算成 4 次）；忘记 i 每轮 +2 而 j 每轮 −1，条件 `i<j+5` 会随两者相向变化而提前为假。", "imgs": []}, {"id": "choice-277", "kind": "choice", "kind_name": "单选题", "num": 277, "stem": "设数组 `a[5]={10,20,30,40,50};` 已知指针 p 指向 a[1]；则表达式 `*(++p)` 的值是（　）", "options": [{"key": "A", "text": "20"}, {"key": "B", "text": "21"}, {"key": "C", "text": "30"}, {"key": "D", "text": "31"}], "answer": "C", "explain": "本题考查前置 ++ 与指针解引用的优先级。p 初始指向 a[1]（值 20）；`++p` 先自增使 p 指向 a[2]，再解引用得 30（C）。对比：`(*p)++` 是把 a[1] 的值自增为 21（值仍指 a[1]）；`*p++` 因后缀 ++ 优先级高，等价 `*(p++)`，先取值 20 再让 p 后移。易错点：`*++p` 与 `*(++p)` 等价；B（21）对应 `(*p)++`、A（20）对应 `*p++`。", "imgs": []}, {"id": "choice-278", "kind": "choice", "kind_name": "单选题", "num": 278, "stem": "有以上程序段，执行后，mul 的值为（　）\nint a[]={1,3,5,7,9};\nint mul,*data,x;\nmul=1;\ndata=&a[1];\nfor(x=0;x<3;x++)\n    mul *= *(data+x);", "options": [{"key": "A", "text": "15"}, {"key": "B", "text": "105"}, {"key": "C", "text": "315"}, {"key": "D", "text": "945"}], "answer": "B", "explain": "本题考查指针偏移访问数组。data 指向 a[1]（值 3），循环 3 次取 `*(data+0)=3`、`*(data+1)=5`、`*(data+2)=7`，累乘 1×3×5×7＝105（B）。易错点：①误以为从 a[0] 开始（则得 1×3×5＝15，选 A）；②循环写成 x<4 会带上 9 得 945（D）；③`*(data+x)` 是\"指针加 x 再取值\"，与 `*data+x`（取 3 再加 x）完全不同。", "imgs": []}, {"id": "choice-279", "kind": "choice", "kind_name": "单选题", "num": 279, "stem": "以下语句不能正确赋值的是（　）", "options": [{"key": "A", "text": "`char s1[10]; s1=\"China\";`"}, {"key": "B", "text": "`char s2[]={'C','h','i','n','a'};`"}, {"k 二进制追加用 `ab`；用完必须 fclose，否则缓冲区内容可能没真正落盘。", "imgs": []}, {"id": "choice-286", "kind": "choice", "kind_name": "单选题", "num": 286, "stem": "有以下程序，该程序的输出结果为（　）\n#include <stdio.h>\n#include <string.h>\nint main()\n{\n    char s[10]=\"121\";\n    int k=0,a=0,b=0;\n    do\n    {\n        k++;\n        if(k%2==0)\n        {\n            a=a+s[k]-'0';\n            continue;\n        }\n        b=b+(s[k]-'0');\n        a=a+s[k]-'0';\n    }while(s[k+1]);\n    printf(\"k=%d a=%d b=%d\\n\",k,a,b);\n    return 0;\n}", "options": [{"key": "A", "text": "k=3 a=2 b=3"}, {"key": "B", "text": "k=3 a=3 b=2"}, {"key": "C", "text": "k=2 a=3 b=2"}, {"key": "D", "text": "k=2 a=2 b=3"}], "answer": "C", "explain": "本题考查 do-while、取模分支与 continue 的综合执行。s=\"121\"，s[0]='1',s[1]='2',s[2]='1',s[3]=0。第 1 轮：k=1（奇数）→ 跳过 if，b += 2 得 b=2、a += 2 得 a=2；判 s[2]='1' 非 0 → 继续。第 2 轮：k=2（偶数）→ a += s[2]-'0'＝1，a=3，continue 跳过后面两句（b 不再累加）；判 s[3]＝0 → 循环结束。故 k=2, a=3, b=2（C）。易错点：①continue 在 do-while 中仍会执行 while 条件判断，不会死循环；②`s[k]-'0'` 是把数字字符转成数值的惯用法；③s[k+1] 为 0 时条件为假——它检测的是\"下一个字符是否为 '\\0'\"，等价于\"是否已到串尾\"。", "imgs": []}];
/* 错误可视化：不遮挡任何操作按钮（顶部横条，可关闭、自动消失） */
function showErrBox(msg, ln){
  try{
    var d=document.getElementById("__errbox");
    if(!d){
      d=document.createElement("div"); d.id="__errbox";
      d.style.cssText="position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;font-size:12px;line-height:1.6;padding:8px 34px 8px 10px;z-index:999";
      var x=document.createElement("span");
      x.textContent="✕";
      x.style.cssText="position:absolute;right:6px;top:6px;font-size:14px;cursor:pointer;padding:2px 8px;";
      x.onclick=function(){ if(d.parentNode)d.parentNode.removeChild(d); };
      d.appendChild(x);
      var t=document.createElement("span"); t.id="__errtext";
      d.appendChild(t);
      document.body.appendChild(d);
      setTimeout(function(){ try{ if(d.parentNode)d.parentNode.removeChild(d); }catch(_){} }, 12000);
    }
    var brief=String(msg||"");
    document.getElementById("__errtext").textContent = (brief.indexOf("Script error")>=0)
      ? "ℹ️ 检测到环境脚本提示（浏览器隐藏了详情，一般是微信/QQ 浏览器自身的提示，不影响使用）"
      : ("⚠ 页面提示："+brief+"（行 "+(ln||"?")+"）");
  }catch(e){}
}
window.onerror=function(msg,src,ln){
  try{
    var brief=String(msg||"");
    if(brief.indexOf("Script error")>=0){
      /* 脱敏错误：延迟检查——页面正常加载完成则忽略（环境注入脚本的噪音） */
      setTimeout(function(){ if(!window.__appReady) showErrBox(brief, ln); }, 700);
    }else{
      showErrBox(brief, ln);
    }
  }catch(e){}
};

const EXAM_MIN=40, EXAM_NUM=30, EXAM_CHOICE_NUM=20, EXAM_JUDGE_NUM=10, EXAM_SCORE=5;

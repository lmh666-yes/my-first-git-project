plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cquiz.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cquiz.app"
        // minSdk 24 = Android 7.0: WebView fully supports the modern JS syntax used by the app
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>刷题软件 · 手机版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f2f4f7}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
/* 顶部 */
header{background:#1a5276;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
header .title{font-size:16px;font-weight:bold}
header .stat{font-size:11px;opacity:.95}
/* 模式栏 */
.tabs{display:flex;background:#2c3e50}
.tabs button{flex:1;padding:10px 0;border:none;background:transparent;color:#bdc3c7;font-size:14px;cursor:pointer}
.tabs button.active{background:#1a5276;color:#fff;font-weight:bold}
/* 考试栏(考试模式专用按钮) */
#examBar{display:none;background:#34495e;padding:6px 8px;gap:6px}
#examBar button{flex:1;border:none;border-radius:6px;padding:8px;color:#fff;font-size:13px;cursor:pointer}
/* 进度条 */
.pbar{height:4px;background:#d5dbdb}
.pbar div{height:100%;background:#27ae60;width:0%;transition:width .3s}
/* 主体 */
main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.head{color:#1a5276;font-size:13px;font-weight:bold}
.stem{background:#fff;border-radius:10px;padding:12px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* 选项 */
#opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#fff;border:1px solid #d5dbdb;border-radius:10px;padding:11px 12px;font-size:15px;cursor:pointer;transition:.15s}
.opt.selected{background:#1a5276;color:#fff;border-color:#1a5276}
.opt.right{background:#e8f8f0;color:#1a7f37;border-color:#1a7f37;font-weight:bold}
.opt.wrong{background:#fdecea;color:#c62828;border-color:#c62828}
/* 判断按钮 */
.judgeBtns{display:flex;gap:10px}
.judgeBtns button{flex:1;border:none;border-radius:10px;padding:14px;font-size:15px;color:#fff;cursor:pointer}
/* 反馈 */
#fb{background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;display:none}
#fb .tag-ok{color:#1a7f37;font-weight:bold}
#fb .tag-no{color:#c62828;font-weight:bold}
/* 笔记 */
#noteBox{background:#fdf6e3;border-radius:10px;padding:10px;display:none}
#noteBox .nt{font-size:12px;color:#7b5804;font-weight:bold;margin-bottom:4px}
#noteBox textarea{width:100%;min-height:60px;border:1px solid #e8d9a8;border-radius:8px;background:#fffdf5;font-size:13px;padding:8px;font-family:inherit;resize:vertical}
/* 底部操作栏 */
footer{background:#fff;padding:8px;display:flex;gap:6px;box-shadow:0 -1px 4px rgba(0,0,0,.08)}
footer button{flex:1;border:none;border-radius:8px;padding:11px 2px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:12px;width:86%;max-width:360px;padding:16px;text-align:center}
.mbox h3{font-size:16px;margin-bottom:8px}
.mbox p{font-size:14px;line-height:1.6;color:#333;margin-bottom:12px;white-space:pre-wrap;text-align:left}
.mbox .btns{display:flex;gap:10px;justify-content:center}
.mbox button{border:none;border-radius:8px;padding:10px 22px;font-size:14px;color:#fff;cursor:pointer}
/* 成绩页/错题按钮 */
.chip{border:none;border-radius:20px;padding:6px 12px;margin:3px;background:#c62828;color:#fff;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🎯 刷题软件</div>
    <div class="stat" id="stat">-</div>
  </header>
  <div class="tabs" id="tabs">
    <button data-mode="顺序" class="active">顺序</button>
    <button data-mode="随机">随机</button>
    <button data-mode="错题">错题</button>
    <button data-mode="考试">考试</button>
  </div>
  <div id="examBar"></div>
  <div class="pbar"><div id="pbarFill"></div></div>
  <main id="main">
    <div class="head" id="head"></div>
    <div class="stem" id="stem"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <div id="noteBox">
      <div class="nt">📝 我的笔记（确认答案后可写，自动保存）</div>
      <textarea id="noteText" placeholder="写下你的笔记…"></textarea>
    </div>
  </main>
  <footer id="footer"></footer>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
/*__BANK__*/
const EXAM_MIN=20, EXAM_NUM=20, EXAM_SCORE=5;
const LS_KEY="cquiz_progress_v1";
let mode="顺序", queue=[], idx=0, sel="";
let exam=null, examLeft=0, examTimer=null;
let progress=load();
let noteTimer=null;

function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(progress))}catch(e){} }
function byId(qid){ return BANK.find(x=>x.id===qid) }
function isOk(it,s){ const a=(it.answer||"").toUpperCase().trim(); s=String(s||"").trim();
  return s===a || (s==="√"&&["对","T","TRUE","√"].includes(a)) || (s==="×"&&["错","F","FALSE","×"].includes(a)); }
function rec(qid){ return progress[qid]||(progress[qid]={ok:null,fav:false,wrong_count:0,notes:""}) }

/* ---------- 渲染 ---------- */
function setMode(m){
  if(mode==="考试" && exam && exam.active && !exam.finished){ msg("考试中","考试进行中，不能切换到其他板块！"); return; }
  stopExamTimer(); mode=m;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  if(m==="顺序") queue=BANK.slice();
  else if(m==="随机"){ queue=BANK.slice(); for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  else if(m==="错题"){ queue=BANK.filter(x=>rec(x.id).ok===false); if(!queue.length){ msg("错题本","太棒了，当前没有错题！"); setMode("顺序"); return; } }
  else if(m==="考试"){ renderExamReady(); return; }
  idx=0; renderQ();
}
function renderExamReady(){
  stopExamTimer();
  $("#head").textContent="📝 模拟考试";
  $("#stem").textContent=`考试说明：\n\n· 共 ${EXAM_NUM} 题（单选+判断），限时 ${EXAM_MIN} 分钟\n· 每题 ${EXAM_SCORE} 分，满分 ${EXAM_NUM*EXAM_SCORE} 分\n· 每题只能作答一次，答错自动进入错题库\n· 考试中可暂停/退出，强制关闭自动保存，下次打开继续\n· 考试中不能切换到其他板块\n\n点击下方「开始考试」按钮开始。`;
  $("#opts").innerHTML=""; hideFb(); hideNote();
  footerBtns([["开始考试","#1a5276",startExam]]);
  stat();
}
function startExam(){
  const q=BANK.filter(x=>x.kind==="choice"||x.kind==="judge");
  const ids=shuffle(q).slice(0,Math.min(EXAM_NUM,q.length)).map(x=>x.id);
  exam={active:true,finished:false,paused:false,ids,idx:0,left:EXAM_MIN*60,answers:{}};
  progress.exam=exam; save();
  queue=ids.map(byId).filter(Boolean); idx=0; examLeft=EXAM_MIN*60;
  examBarShow(); tick(); renderQ();
}
function tick(){
  if(mode!=="考试"||!exam||!exam.active||exam.finished||exam.paused){ examTimer=null; return; }
  if(examLeft<=0){ finishExam(); return; }
  examLeft--; exam.left=examLeft;
  const mm=String(Math.floor(examLeft/60)).padStart(2,"0"), ss=String(examLeft%60).padStart(2,"0");
  $("#head").textContent=`⏱ 模拟考试 · 剩余 ${mm}:${ss} · 第 ${idx+1}/${queue.length} 题`;
  examTimer=setTimeout(tick,1000);
}
function stopExamTimer(){ if(examTimer){clearTimeout(examTimer);examTimer=null;} }
function examBarShow(){
  const b=$("#examBar"); b.style.display="flex"; b.innerHTML="";
  if(exam.paused){
    b.innerHTML+=`<button style="background:#1a5276" onclick="togglePause()">▶ 继续考试</button>`;
  }else{
    b.innerHTML+=`<button style="background:#b9770e" onclick="togglePause()">⏸ 暂停考试</button>`;
  }
  b.innerHTML+=`<button style="background:#c62828" onclick="quitExam()">🚪 退出考试</button>`;
}
function examBarHide(){ const b=$("#examBar"); b.style.display="none"; b.innerHTML=""; }
function showPaused(){
  examBarShow();
  $("#head").textContent="⏸ 考试已暂停";
  $("#stem").textContent=`考试已暂停。\n\n剩余时间：${fmt(examLeft)}\n已完成 ${Object.keys(exam.answers).length}/${queue.length} 题\n\n点击顶部「▶ 继续考试」恢复答题。`;
  $("#opts").innerHTML=""; hideFb(); hideNote();
}
function togglePause(){
  if(exam.paused){ exam.paused=false; progress.exam=exam; save(); examBarShow(); tick(); renderQ(); }
  else{ stopExamTimer(); exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); showPaused(); }
}
function quitExam(){
  confirm("退出考试","确定要退出考试吗？本次考试将作废。",()=>{
    stopExamTimer(); delete progress.exam; save(); exam=null; examBarHide(); setMode("顺序");
  });
}
function renderQ(){
  const it=queue[idx];
  if(!it){ $("#head").textContent="暂无题目"; $("#stem").textContent=""; $("#opts").innerHTML=""; return; }
  if(mode!=="考试"){ $("#head").textContent=`[${it.kind_name} ${it.num}]  ${idx+1}/${queue.length}`; }
  else{
    exam.idx=idx;
    const mm=String(Math.floor(examLeft/60)).padStart(2,"0"),ss=String(examLeft%60).padStart(2,"0");
    $("#head").textContent=`⏱ ${mm}:${ss} · 第 ${idx+1}/${queue.length} 题`;
  }
  $("#stem").textContent=it.stem||"";
  sel="";
  const examSel=exam?exam.answers[it.id]:undefined;
  renderOpts(it,examSel);
  // 反馈:历史状态
  const r=rec(it.id);
  let txt="";
  if(r.ok===true)txt+="✅ 上次作答：正确\n"; else if(r.ok===false)txt+="❌ 上次作答：错误\n"; else txt+="未作答\n";
  if(r.wrong_count)txt+=`🔁 本题累计错误：${r.wrong_count} 次\n`;
  if(r.fav)txt+="⭐ 已收藏\n";
  showFb(txt);
  // 笔记:确认答案(已作答)后才显示
  if(rec(it.id).ok!==null){ showNote(it.id); } else { hideNote(); }
  // 底部按钮
  if(mode==="考试"&&exam&&exam.active&&!exam.finished){
    footerBtns([["◀ 上一题","#1a5276",()=>nav(-1)],["确认答案","#27ae60",()=>checkAnswer()],["下一题 ▶","#1a5276",()=>nav(1)]]);
  }else{
    footerBtns([["◀ 上一题","#1a5276",()=>nav(-1)],["确认答案","#27ae60",()=>checkAnswer()],["下一题 ▶","#1a5276",()=>nav(1)],["⭐收藏","#8e44ad",()=>toggleFav()],["重新做","#b9770e",()=>redoQ()],["重置","#c62828",()=>resetProgress()]]);
  }
  stat();
}
function renderOpts(it,examSel){
  const o=$("#opts"); o.innerHTML="";
  if(it.kind==="choice"){
    if(examSel!==undefined){
      const ans=(it.answer||"").toUpperCase().trim();
      it.options.forEach(op=>{
        const d=document.createElement("div");
        d.className="opt";
        d.textContent=`${op.key}. ${op.text}`;
        if(op.key===ans)d.classList.add("right");
        else if(op.key===examSel)d.classList.add("wrong");
        o.appendChild(d);
      });
      return;
    }
    it.options.forEach(op=>{
      const d=document.createElement("div");
      d.className="opt"; d.textContent=`${op.key}. ${op.text}`;
      d.onclick=()=>{ document.querySelectorAll(".opt").forEach(x=>x.classList.remove("selected"));
        d.classList.add("selected"); sel=op.key; };
      o.appendChild(d);
    });
  }else if(it.kind==="judge"){
    if(examSel!==undefined){
      const ans=(it.answer||"").toUpperCase().trim();
      const d1=document.createElement("div"); d1.className="opt"; d1.textContent=`正确答案：${it.answer}`; d1.classList.add("right"); o.appendChild(d1);
      const d2=document.createElement("div"); d2.className="opt"; d2.textContent=`你的答案：${examSel}`; d2.classList.add(examSel===ans?"right":"wrong"); o.appendChild(d2);
      return;
    }
    const w=document.createElement("div"); w.className="judgeBtns";
    const b1=document.createElement("button"); b1.style.background="#1a7f37"; b1.textContent="✔ 正确";
    b1.onclick=()=>answerJudge("√");
    const b2=document.createElement("button"); b2.style.background="#c62828"; b2.textContent="✘ 错误";
    b2.onclick=()=>answerJudge("×");
    w.append(b1,b2); o.appendChild(w);
  }
}
function checkAnswer(){
  const it=queue[idx];
  if(!it)return;
  if(mode==="考试"){ if(exam&&exam.active&&!exam.finished) examAnswer(it,sel); return; }
  if(it.kind==="choice"){
    if(!sel){ msg("提示","请先选择一个答案"); return; }
    record(it,sel,isOk(it,sel)); showResult(it,sel,isOk(it,sel)); showNote(it.id);
  }else if(it.kind==="judge"){ /* judge 通过按钮直接判分 */ }
  stat();
}
function answerJudge(key){
  const it=queue[idx];
  if(mode==="考试"){ examAnswer(it,key); return; }
  const ok=isOk(it,key);
  record(it,key,ok); showResult(it,key,ok); showNote(it.id); stat();
}
function examAnswer(it,k){
  if(exam.answers[it.id]){ msg("提示","本题已作答，不能更改"); return; }
  const ok=isOk(it,k); exam.answers[it.id]=k; exam.left=examLeft; save();
  record(it,k,ok); showNote(it.id); renderQ();
}
function record(it,ans,ok){
  const r=rec(it.id); r.ok=ok; if(!ok)r.wrong_count=(r.wrong_count||0)+1; save();
}
function showResult(it,ans,ok){
  const r=rec(it.id); let txt="";
  txt+= ok?`<span class="tag-ok">✅ 回答正确！</span>`:`<span class="tag-no">❌ 回答错误。正确答案：${it.answer}</span>`;
  if(r.wrong_count)txt+=`\n🔁 本题累计错误：${r.wrong_count} 次`;
  if(it.explain)txt+="\n\n解析：\n"+it.explain;
  showFb(txt);
}
function nav(d){
  const ni=idx+d;
  if(ni<0){ msg("提示","已经是第一题"); return; }
  if(ni>=queue.length){
    if(mode==="考试"){ confirm("交卷","已到最后一题，确定交卷吗？",finishExam); }
    else msg("提示","已经是最后一题");
    return;
  }
  idx=ni; renderQ();
}
function toggleFav(){
  const it=queue[idx]; const r=rec(it.id); r.fav=!r.fav; save();
  showFb(r.fav?"⭐ 已收藏，可在错题中回顾":"已取消收藏");
}
function redoQ(){
  const it=queue[idx]; delete progress[it.id]; save(); hideNote(); renderQ();
}
function finishExam(){
  stopExamTimer();
  if(!exam||!exam.active||exam.finished)return;
  exam.finished=true; exam.paused=false; exam.left=examLeft; progress.exam=exam; save(); examBarHide();
  renderResult();
}
function renderResult(){
  if(!exam)return;
  const qs=queue, ans=exam.answers;
  let correct=0, wrong=[], un=0;
  qs.forEach(x=>{ if(ans[x.id]===undefined)un++; else if(isOk(x,ans[x.id]))correct++; else wrong.push(x); });
  const score=correct*EXAM_SCORE;
  $("#head").textContent="🏁 考试结束";
  $("#stem").textContent=`🏆 考试成绩：${score} 分 / 满分 ${qs.length*EXAM_SCORE} 分\n\n✅ 答对 ${correct} 题 · ❌ 答错 ${wrong.length} 题 · ⭕ 未答 ${un} 题`;
  let fbTxt=`得分：${score} 分（每题 ${EXAM_SCORE} 分）　答题进度：${Object.keys(ans).length}/${qs.length}\n\n错题已自动进入「错题」板块。`;
  showFb(fbTxt);
  const o=$("#opts"); o.innerHTML="";
  const scoreDiv=document.createElement("div");
  scoreDiv.className="opt"; scoreDiv.textContent=`🏆 成绩：${score} 分（答对 ${correct}/${qs.length}）`;
  scoreDiv.classList.add(score>=qs.length*EXAM_SCORE*0.6?"right":"wrong"); o.appendChild(scoreDiv);
  if(wrong.length){
    const t=document.createElement("div"); t.style.cssText="font-size:13px;color:#c62828;font-weight:bold;margin-top:6px";
    t.textContent="📌 点击错题号回顾："; o.appendChild(t);
    wrong.forEach(x=>{ const c=document.createElement("button"); c.className="chip"; c.textContent=`错题 ${x.num}`;
      c.onclick=()=>reviewWrong(x.id); o.appendChild(c); });
  }else{
    const t=document.createElement("div"); t.className="opt"; t.textContent="🎉 全部答对，太棒了！"; t.classList.add("right"); o.appendChild(t);
  }
  footerBtns([["🔄 重新考试","#b9770e",startExam],["返回顺序","#1a5276",()=>setMode("顺序")]]);
  stat();
}
function reviewWrong(qid){
  const it=byId(qid); if(!it)return;
  $("#head").textContent=`📖 错题回顾 · 第 ${it.num} 题`;
  $("#stem").textContent=it.stem||"";
  const o=$("#opts"); o.innerHTML="";
  const ans=(it.answer||"").toUpperCase().trim(), your=exam.answers[qid];
  if(it.kind==="choice"){
    it.options.forEach(op=>{ const d=document.createElement("div"); d.className="opt"; d.textContent=`${op.key}. ${op.text}`;
      if(op.key===ans)d.classList.add("right"); else if(op.key===your)d.classList.add("wrong"); o.appendChild(d); });
  }else{
    const d1=document.createElement("div"); d1.className="opt"; d1.textContent=`正确答案：${it.answer}`; d1.classList.add("right"); o.appendChild(d1);
    const d2=document.createElement("div"); d2.className="opt"; d2.textContent=`你的答案：${your}`; d2.classList.add(your===ans?"right":"wrong"); o.appendChild(d2);
  }
  if(it.explain){ const e=document.createElement("div"); e.style.cssText="font-size:13px;color:#555;margin-top:8px"; e.textContent="解析："+it.explain; o.appendChild(e); }
  showFb(`你的答案：${your||"未作答"}　正确答案：${it.answer}`);
  footerBtns([["⬅ 返回成绩","#1a5276",renderResult]]);
}
/* ---------- 笔记 ---------- */
function showNote(qid){
  const nb=$("#noteBox"); nb.style.display="block";
  $("#noteText").value=rec(qid).notes||"";
}
function hideNote(){ $("#noteBox").style.display="none"; }
$("#noteText").addEventListener("input",()=>{
  const it=queue[idx]; if(!it)return; rec(it.id).notes=$("#noteText").value;
  clearTimeout(noteTimer); noteTimer=setTimeout(save,800);
});
/* ---------- 工具 ---------- */
function $(s){return document.querySelector(s)}
function fmt(sec){ return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
function showFb(html){ const f=$("#fb"); f.style.display="block"; f.innerHTML=html; }
function hideFb(){ $("#fb").style.display="none"; }
function footerBtns(btns){
  const f=$("#footer"); f.innerHTML="";
  btns.forEach(([t,c,fn])=>{ const b=document.createElement("button"); b.textContent=t; b.style.background=c; b.onclick=fn; f.appendChild(b); });
}
function stat(){
  const done=BANK.filter(x=>rec(x.id).ok!==null), okN=done.filter(x=>rec(x.id).ok===true).length;
  const rate=done.length?Math.round(okN/done.length*100):0;
  const wrong=BANK.filter(x=>rec(x.id).ok===false).length;
  $("#stat").textContent=`已做 ${done.length}/${BANK.length} · 正确率 ${rate}% · 错题 ${wrong}`;
  $("#pbarFill").style.width=rate+"%";
}
/* ---------- 弹窗 ---------- */
let modalCb=null;
function msg(t,p){ $("#mbox").innerHTML=`<h3>${t}</h3><p>${p}</p><div class="btns"><button style="background:#1a5276" onclick="closeModal()">确定</button></div>`; $("#modal").classList.add("show"); }
function confirm(t,p,cb){ modalCb=cb; $("#mbox").innerHTML=`<h3>${t}</h3><p>${p}</p><div class="btns"><button style="background:#c62828" onclick="closeModal()">取消</button><button style="background:#1a5276" onclick="doConfirm()">确定</button></div>`; $("#modal").classList.add("show"); }
function doConfirm(){ closeModal(); if(modalCb)modalCb(); }
function closeModal(){ $("#modal").classList.remove("show"); }
/* ---------- 重置(3次确认) ---------- */
function resetProgress(){ resetStep(1); }function resetStep(n){
  if(n===1) confirm("重置进度（1/3）","确定要清除全部做题记录吗？\n此操作不可恢复！",()=>resetStep(2));
  else if(n===2) confirm("重置进度（2/3）","再次确认：将清空做题记录、错题次数、笔记和考试记录！",()=>resetStep(3));
  else if(n===3) confirm("重置进度（3/3）","最后一次确认：立即清空全部数据并重新开始！",()=>{ progress={}; save(); stopExamTimer(); exam=null; examBarHide(); setMode("顺序"); msg("完成","🗑 已清除全部做题记录，重新开始！"); });
}
/* 考试中关页面自动保存 */
window.addEventListener("beforeunload",()=>{ if(mode==="考试"&&exam&&exam.active&&!exam.finished){ exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); } });
/* 启动:恢复考试 */
document.querySelectorAll("#tabs button").forEach(function(b){
  b.addEventListener("click",function(){ setMode(b.dataset.mode); });
});
(function init(){
  exam = progress.exam && typeof progress.exam==="object" ? progress.exam : null;
  if(exam&&exam.active){
    // 直接进入考试板块恢复（不走 renderExamReady，避免闪待开始页）
    mode="考试";
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode==="考试"));
    queue=exam.ids.map(byId).filter(Boolean);
    idx=Math.min(exam.idx||0, Math.max(0,queue.length-1));
    examLeft=exam.left;
    if(exam.finished){ renderResult(); }
    else if(exam.paused){ showPaused(); }        // 暂停态：停留，用户手动继续
    else { examBarShow(); tick(); renderQ(); }   // 运行中：恢复倒计时
  } else setMode("顺序");
})();
</script>
</body>
</html>

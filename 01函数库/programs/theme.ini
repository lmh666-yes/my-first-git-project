# ============================================================
#  utils_gui 主题配色配置（Notepad++ 默认风格：白底黑字）
#  修改后保存，重新打开程序即可生效（无需重新编译）
#
#  颜色格式: RRGGBB（十六进制，无 # 前缀）
#  以 # 开头的行是注释
# ============================================================

[theme]
name=Notepad++ 默认风格

# 详情窗格背景（白色）
background=FFFFFF

# 普通文本（黑色）
default=000000

# 元信息（函数名/分类/示例等介绍文字 + 下方详细说明：注释绿）
meta=008000

# 类型关键字：int / void / uint8_t / struct / typedef ...（蓝色）
keyword=0000FF

# 控制关键字：if / for / while / return / switch ...（紫）
control=7F0055

# 类型名（struct/enum/union 后的名字，深青）
type=2F6F9F

# 函数名（深蓝加粗）
func=0000C0

# 形参（黑色）
param=000000

# 字符串 / 字符（灰色）
string=808080

# 数字（黑色）
number=000000

# 注释（绿色）
comment=008000

# 宏 / 预处理指令（紫）
macro=7F0055

# 头文件（#include <...>，深青）
header=2F6F9F

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>面试刷题 · 主观题（手机版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(165deg,#e8f0fa 0%,#f6f8fc 45%,#eaf6ef 100%)}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
/* 顶部 */
header{background:linear-gradient(135deg,#14486e 0%,#1a5276 55%,#2980b9 100%);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 3px 12px rgba(26,82,118,.28)}
header .title{font-size:16px;font-weight:bold;letter-spacing:.5px}
header .stat{font-size:11px;opacity:.95;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px}
/* 板块栏 */
.tabs{display:flex;background:#2c3e50}
.tabs button{flex:1;padding:11px 0;border:none;background:transparent;color:#bdc3c7;font-size:14px;cursor:pointer;transition:color .25s,background .25s}
.tabs button.active{background:#1a5276;color:#fff;font-weight:bold;box-shadow:inset 0 -3px 0 #58d68d}
/* 考试栏 */
#examBar{display:none;background:#34495e;padding:6px 8px;gap:6px}
#examBar button{flex:1;border:none;border-radius:8px;padding:9px;color:#fff;font-size:13px;cursor:pointer;transition:transform .12s,filter .2s}
#examBar button:active{transform:scale(.96);filter:brightness(.92)}
/* 主体 */
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{color:#1a5276;font-size:13px;font-weight:bold}
.stem{background:#fff;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 12px rgba(0,0,0,.07)}
/* 题目配图 */
.qimg{width:100%;border-radius:10px;margin:6px 0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);animation:fadeSlide .3s ease}
/* 作答区 */
.anslab{background:#fdf6e3;color:#7b5804;font-size:12px;font-weight:bold;padding:8px 12px;border-radius:10px 10px 0 0}
#myans{width:100%;min-height:120px;border:none;border-radius:0 0 10px 10px;padding:10px 12px;font-size:14px;font-family:inherit;line-height:1.7;background:#fffdf5;resize:vertical;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:box-shadow .2s}
#myans:focus{box-shadow:0 0 0 2px #aed6f1,0 2px 10px rgba(0,0,0,.08)}
#myans:disabled{background:#f4f6f7;color:#666}
/* 参考答案区 */
#ansBox{display:none;background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.75;box-shadow:0 2px 10px rgba(0,0,0,.06);animation:fadeSlide .3s ease;white-space:pre-wrap;word-break:break-word}
#ansBox .h-ans{color:#1a7f37;font-weight:bold}
#ansBox .h-exp{color:#8e44ad;font-weight:bold;margin-top:8px}
/* 成绩页题号按钮 */
.chip{border:none;border-radius:20px;padding:7px 13px;margin:3px;background:linear-gradient(135deg,#1a7f37,#27ae60);color:#fff;font-size:12px;cursor:pointer;transition:transform .12s,filter .2s;box-shadow:0 2px 6px rgba(26,127,55,.25)}
.chip.gray{background:linear-gradient(135deg,#7f8c8d,#95a5a6);box-shadow:0 2px 6px rgba(127,140,141,.25)}
.chip:active{transform:scale(.94)}
/* 底部操作栏 */
footer{background:#fff;padding:9px;display:flex;gap:6px;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
footer button{flex:1;border:none;border-radius:10px;padding:12px 2px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .2s}
footer button:active{transform:scale(.95);filter:brightness(.92)}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;animation:fadeIn .18s ease}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;width:86%;max-width:360px;padding:18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:zoomIn .25s ease}
.mbox h3{font-size:16px;margin-bottom:8px}
.mbox p{font-size:14px;line-height:1.6;color:#333;margin-bottom:14px;white-space:pre-wrap;text-align:left}
.mbox .btns{display:flex;gap:10px;justify-content:center}
.mbox button{border:none;border-radius:10px;padding:10px 22px;font-size:14px;color:#fff;cursor:pointer;transition:transform .12s,filter .2s}
.mbox button:active{transform:scale(.95)}
/* 动画 */
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🎯 面试刷题（主观题）</div>
    <div class="stat" id="stat">-</div>
  </header>
  <div class="tabs" id="tabs">
    <button data-mode="顺序" class="active">顺序练习</button>
    <button data-mode="考试">模拟考试</button>
  </div>
  <div id="examBar"></div>
  <main id="main">
    <div class="head" id="head"></div>
    <div class="stem" id="stem"></div>
    <div id="imgs"></div>
    <div id="ansWrap">
      <div class="anslab" id="anslab">✍️ 我的作答（打字作答，自动保存；不判对错）</div>
      <textarea id="myans" placeholder="在此输入你的作答…"></textarea>
    </div>
    <div id="ansBox"></div>
  </main>
  <footer id="footer"></footer>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
/*__BANK__*/
/* 错误可视化：不遮挡任何操作按钮（顶部横条，可关闭、自动消失） */
function showErrBox(msg, ln){
  try{
    var d=document.getElementById("__errbox");
    if(!d){
      d=document.createElement("div"); d.id="__errbox";
      d.style.cssText="position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;font-size:12px;line-height:1.6;padding:8px 34px 8px 10px;z-index:999";
      var x=document.createElement("span");
      x.textContent="✕";
      x.style.cssText="position:absolute;right:6px;top:6px;font-size:14px;cursor:pointer;padding:2px 8px;";
      x.onclick=function(){ if(d.parentNode)d.parentNode.removeChild(d); };
      d.appendChild(x);
      var t=document.createElement("span"); t.id="__errtext";
      d.appendChild(t);
      document.body.appendChild(d);
      setTimeout(function(){ try{ if(d.parentNode)d.parentNode.removeChild(d); }catch(_){} }, 12000);
    }
    var brief=String(msg||"");
    document.getElementById("__errtext").textContent = (brief.indexOf("Script error")>=0)
      ? "ℹ️ 检测到环境脚本提示（浏览器隐藏了详情，一般是微信/QQ 浏览器自身的提示，不影响使用）"
      : ("⚠ 页面提示："+brief+"（行 "+(ln||"?")+"）");
  }catch(e){}
}
window.onerror=function(msg,src,ln){
  try{
    var brief=String(msg||"");
    if(brief.indexOf("Script error")>=0){
      /* 脱敏错误：延迟检查——页面正常加载完成则忽略（环境注入脚本的噪音） */
      setTimeout(function(){ if(!window.__appReady) showErrBox(brief, ln); }, 700);
    }else{
      showErrBox(brief, ln);
    }
  }catch(e){}
};
/* 防呆：直接打开模板（未嵌入题库）时给出明确提示 */
if (typeof BANK === "undefined" || !Array.isArray(BANK) || !BANK.length) {
  document.body.innerHTML = '<div style="padding:48px 22px;text-align:center;font-family:sans-serif;font-size:15px;line-height:2">⚠️ 题库未加载<br>当前打开的可能是有“模板”文件（template.html）。<br>请打开同目录下的 <b>index.html</b><br>（或根目录的「面试刷题-主观题.html」）。</div>';
  throw new Error("BANK missing: 请打开 index.html");
}
const LS_KEY="interview_sub_v1";
const EXAM_NUM=10, EXAM_MIN=40;
let mode="顺序", idx=0, revealed=false, saveTimer=null, statTimer=null;
let seqSavedIdx=null;                 // 顺序板块本次会话中的位置（切板块返回时恢复）
let exam=null, examLeft=0, examTimer=null;
let progress=load();

function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(progress))}catch(e){} }
function rec(qid){ return progress[qid]||(progress[qid]={wrote:"",revealed:false}) }
function $(s){return document.querySelector(s)}
function forEachNode(nodes, fn){ for(var i=0;i<nodes.length;i++) fn(nodes[i], i); }
function toggleCls(el, cls, force){ if(force) el.classList.add(cls); else el.classList.remove(cls); }
function byId(qid){ for(var i=0;i<BANK.length;i++){ if(BANK[i].id===qid) return BANK[i]; } return null; }
function isAnswered(it){ return !!String((progress[it.id]||{}).wrote||"").trim(); }
/* ---------- 进度记忆 ----------
   记忆位置 = "连续完成题目的最后一题"：做了 1、2、3、4，跳过 5 又做了 6、7、8 → 回到第 4 题。
   一道题算完成：有作答内容 或 已查看过参考答案。 */
function isDone(it){ const r=progress[it.id]||{}; return !!String(r.wrote||"").trim() || !!r.revealed; }
function resumeIndex(){
  let last=-1;
  for(let i=0;i<BANK.length;i++){ if(isDone(BANK[i])) last=i; else break; }
  if(last>=0) return last;
  return Math.min(progress._last||0, Math.max(0,BANK.length-1));   // 尚未连续做题时回到上次浏览处
}
function pad2(n){ n=String(n); return n.length<2?"0"+n:n; }
function fmt(sec){ return pad2(Math.floor(sec/60))+":"+pad2(sec%60); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;} return r; }
function wrapCn(s, lim){ return String(s||""); }

/* ---------- 模式切换 ---------- */
function setMode(m){
  if(mode==="考试" && exam && exam.active && !exam.finished){ msg("考试中","考试进行中，不能切换到其他板块！"); return; }
  if(mode==="顺序" && m!=="顺序") seqSavedIdx=idx;      // 离开顺序板块：记住当前位置
  stopExamTimer(); mode=m;
  forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode===m); });
  if(m==="考试"){ enterExamBoard(); return; }
  examBarHide();
  // 顺序板块：首次进入（打开软件）跳到"连续完成题目的最后一题"，之后回到上次浏览位置
  if(m==="顺序") idx = (seqSavedIdx===null) ? resumeIndex() : seqSavedIdx;
  idx=Math.min(idx, BANK.length-1);
  renderQ();
}

/* ---------- 顺序模式 ---------- */
function renderQ(){
  const it=BANK[idx];
  if(!it){ $("#head").textContent="暂无题目"; return; }
  $("#head").textContent="[主观题 "+it.num+"]  "+(idx+1)+"/"+BANK.length;
  $("#stem").textContent=it.stem||"";
  renderImgs(it);
  revealed=false;
  showAnsBox(false);
  setAnsEnabled(true, "✍️ 我的作答（打字作答，自动保存；不判对错）");
  $("#myans").value=rec(it.id).wrote||"";
  footerBtns([["◀ 上一题","#1a5276",function(){nav(-1)}],
              ["👀 查看参考答案","#8e44ad",toggleReveal],
              ["下一题 ▶","#1a5276",function(){nav(1)}],
              ["🗑 重置","#c62828",resetProgress]]);
  progress._last=idx; save();
  $("#main").scrollTop=0;
  stat();
}
function renderImgs(it){
  const ia=$("#imgs"); ia.innerHTML="";
  (it.imgs||[]).forEach(function(src){ const im=document.createElement("img"); im.className="qimg"; im.src=src; ia.appendChild(im); });
}
function showAnsBox(show, it){
  const ab=$("#ansBox");
  if(!show){ ab.style.display="none"; ab.innerHTML=""; return; }
  ab.innerHTML="";
  const h1=document.createElement("div"); h1.className="h-ans"; h1.textContent="✅ 参考答案"; ab.appendChild(h1);
  const a=document.createElement("div"); a.textContent=(it.answer||"（无）"); ab.appendChild(a);
  const h2=document.createElement("div"); h2.className="h-exp"; h2.textContent="🎯 得分点"; ab.appendChild(h2);
  const e=document.createElement("div"); e.textContent=(it.explain||"（无）"); ab.appendChild(e);
  ab.style.display="block";
}
function toggleReveal(){
  const it=BANK[idx]; if(!it || mode!=="顺序")return;
  if(revealed){
    showAnsBox(false); revealed=false;
    const b=findBtn("参考答案"); if(b)b.textContent="👀 查看参考答案";
    return;
  }
  saveNow();
  showAnsBox(true, it); revealed=true;
  const b=findBtn("参考答案"); if(b)b.textContent="🙈 收起参考答案";
  rec(it.id).revealed=true; save(); stat();
  try{ $("#ansBox").scrollIntoView(true); }catch(e){}
}
function findBtn(txt){ return Array.prototype.slice.call(document.querySelectorAll("#footer button")).filter(function(x){return x.textContent.indexOf(txt)>=0})[0]; }
function nav(d){
  saveNow();
  const ni=idx+d;
  if(ni<0){ msg("提示","已经是第一题"); return; }
  if(ni>=BANK.length){ msg("提示","已经是最后一题"); return; }
  idx=ni; renderQ();
}

/* ---------- 考试 ---------- */
function enterExamBoard(){
  if(!exam || !exam.active){ renderExamReady(); return; }
  if(exam.finished){ renderResult(); return; }
  if(exam.paused){ examBarShow(); showPaused(); return; }
  examBarShow(); tick(); renderExamQ();
}
function renderExamReady(){
  stopExamTimer(); examBarShow();
  const cnt=progress._exam_count||0;
  const rounds=Math.max(1, Math.ceil(BANK.length/EXAM_NUM));
  $("#head").textContent="📝 模拟考试 · 第 "+(cnt+1)+" 次考试";
  $("#stem").textContent="考试说明：\n\n· 共 "+EXAM_NUM+" 题（从 "+BANK.length+" 题主观题库中计划式抽取），限时 "+EXAM_MIN+" 分钟\n· 打字作答，自动保存；考试中可随时修改\n· 主观题不打分：交卷后逐题对照参考答案与得分点自评\n· 当前第 "+(cnt+1)+" 次考试 · 已累计完成 "+cnt+" 次 · 环形抽题：同一场不重复，连续 "+rounds+" 场必覆盖全部题目\n· 考试中可暂停 / 退出；强制关闭自动保存，下次打开继续\n· 考试中不能切换到其他板块\n\n点击「▶ 开始考试」按钮开始。";
  $("#imgs").innerHTML="";
  showAnsBox(false);
  setAnsEnabled(false, "📖 我的作答");
  $("#myans").value="";
  footerBtns([]);
  stat();
}
function pickPlanned(ids, n){
  // 环形连续段算法：洗牌固定序列，每场沿环连续取 n 个。
  // 同一场绝不重复；连续 ceil(len/n)+1 场必覆盖全部题目。
  const plan=progress._exam_plan&&typeof progress._exam_plan==="object"?progress._exam_plan:{};
  let order=plan.sub;
  if(!Array.isArray(order)||order.length!==ids.length||ids.some(function(id){return order.indexOf(id)<0})){ order=shuffle(ids); plan.cur=0; }
  const m=order.length;
  n=Math.min(n,m);
  if(n<=0) return [];
  let cur=plan.cur;
  if(typeof cur!=="number"||cur<0||cur>=m) cur=0;
  let picked;
  if(n>=m){ picked=order.slice(); cur=0; }
  else{
    const end=cur+n;
    picked=end<=m?order.slice(cur,end):order.slice(cur).concat(order.slice(0,end-m));
    cur=end%m;
  }
  plan.sub=order; plan.cur=cur;
  progress._exam_plan=plan;
  return picked;
}
function startExam(){
  const ids=pickPlanned(BANK.map(function(x){return x.id}), EXAM_NUM);
  exam={active:true,finished:false,paused:false,ids:ids,idx:0,left:EXAM_MIN*60};
  progress.exam=exam; save();
  idx=0; examLeft=EXAM_MIN*60;
  examBarShow(); tick(); renderExamQ();
}
function tick(){
  if(mode!=="考试"||!exam||!exam.active||exam.finished||exam.paused){ examTimer=null; return; }
  if(examLeft<=0){ finishExam(); return; }
  examLeft--; exam.left=examLeft;
  if(exam.idx!==undefined) idx=exam.idx;
  $("#head").textContent="⏱ 模拟考试 · 剩余 "+fmt(examLeft)+" · 第 "+(idx+1)+"/"+exam.ids.length+" 题";
  examTimer=setTimeout(tick,1000);
}
function stopExamTimer(){ if(examTimer){clearTimeout(examTimer);examTimer=null;} }
function examBarShow(){
  const b=$("#examBar"); b.style.display="flex"; b.innerHTML="";
  if(!exam || !exam.active){
    b.innerHTML+='<button style="background:#1a5276" onclick="startExam()">▶ 开始考试</button>';
  }else if(exam.finished){
    b.innerHTML+='<button style="background:#b9770e" onclick="restartToReady()">🔄 重新考试</button>';
  }else{
    if(exam.paused) b.innerHTML+='<button style="background:#1a5276" onclick="togglePause()">▶ 继续考试</button>';
    else b.innerHTML+='<button style="background:#b9770e" onclick="togglePause()">⏸ 暂停考试</button>';
    b.innerHTML+='<button style="background:#c62828" onclick="quitExam()">🚪 退出考试</button>';
  }
}
function examBarHide(){ const b=$("#examBar"); b.style.display="none"; b.innerHTML=""; }
function renderExamQ(){
  if(!exam||!exam.active||exam.finished)return;
  idx=Math.min(exam.idx||0, exam.ids.length-1);
  const it=byId(exam.ids[idx]);
  if(!it){ return; }
  exam.idx=idx; exam.left=examLeft; save();
  $("#head").textContent="⏱ 模拟考试 · 剩余 "+fmt(examLeft)+" · 第 "+(idx+1)+"/"+exam.ids.length+" 题";
  $("#stem").textContent=it.stem||"";
  renderImgs(it);
  showAnsBox(false);
  setAnsEnabled(true, "✍️ 我的作答（考试中，自动保存）");
  $("#myans").value=rec(it.id).wrote||"";
  footerBtns([["◀ 上一题","#1a5276",function(){examNav(-1)}],
              ["📮 交卷","#27ae60",askFinish],
              ["下一题 ▶","#1a5276",function(){examNav(1)}]]);
  $("#main").scrollTop=0;
  stat();
}
function examNav(d){
  saveNow();
  const ni=idx+d;
  if(ni<0){ msg("提示","已经是第一题"); return; }
  if(ni>=exam.ids.length){ confirmDlg("交卷","已到最后一题，确定交卷吗？",finishExam); return; }
  idx=ni; exam.idx=idx; exam.left=examLeft; save();
  renderExamQ();
}
function askFinish(){
  saveNow();
  const done=exam.ids.filter(function(qid){ const it=byId(qid); return it&&isAnswered(it); }).length;
  confirmDlg("交卷","确定交卷吗？\n（已作答 "+done+"/"+exam.ids.length+" 题）",finishExam);
}
function togglePause(){
  if(exam.paused){ exam.paused=false; save(); examBarShow(); tick(); renderExamQ(); }
  else{ stopExamTimer(); exam.paused=true; exam.left=examLeft; save(); examBarShow(); showPaused(); }
}
function showPaused(){
  const done=exam.ids.filter(function(qid){ const it=byId(qid); return it&&isAnswered(it); }).length;
  $("#head").textContent="⏸ 考试已暂停";
  $("#stem").textContent="考试已暂停。\n\n剩余时间："+fmt(examLeft)+"\n已作答 "+done+"/"+exam.ids.length+" 题\n\n点击顶部「▶ 继续考试」恢复答题。";
  $("#imgs").innerHTML="";
  showAnsBox(false);
  setAnsEnabled(false, "📖 我的作答");
  $("#myans").value="";
  footerBtns([]);
  stat();
}
function quitExam(){
  confirmDlg("退出考试","确定要退出考试吗？本次考试将作废。",function(){
    stopExamTimer(); delete progress.exam; save(); exam=null; examBarHide(); setMode("顺序");
  });
}
function restartToReady(){
  stopExamTimer(); exam=null; delete progress.exam; save(); examBarHide();
  renderExamReady();
}
function finishExam(){
  stopExamTimer();
  if(!exam||!exam.active||exam.finished)return;
  saveNow();
  exam.finished=true; exam.paused=false; exam.left=examLeft;
  progress._exam_count=(progress._exam_count||0)+1;
  progress.exam=exam; save(); examBarShow();
  renderResult();
}
function renderResult(){
  if(!exam)return;
  examBarShow();
  const qs=exam.ids.map(byId).filter(Boolean);
  const answered=qs.filter(isAnswered);
  const un=qs.length-answered.length;
  $("#head").textContent="🏁 考试结束";
  $("#stem").textContent="📋 考试完成：已作答 "+answered.length+"/"+qs.length+" 题 · 未作答 "+un+" 题\n\n主观题不打分——点击下方题号逐题回顾：\n对照参考答案与得分点，自我评估掌握程度。";
  $("#imgs").innerHTML="";
  showAnsBox(false);
  setAnsEnabled(false, "📖 我的作答");
  $("#myans").value="";
  const o=$("#imgs");
  qs.forEach(function(x){
    const c=document.createElement("button");
    c.className="chip"+(isAnswered(x)?"":" gray");
    c.textContent="第 "+x.num+" 题";
    c.onclick=function(){ reviewQ(x.id); };
    o.appendChild(c);
  });
  footerBtns([["🔄 重新考试","#b9770e",restartToReady],
              ["⬅ 返回顺序","#1a5276",function(){ setMode("顺序"); }]]);
  stat();
}
function reviewQ(qid){
  const it=byId(qid); if(!it)return;
  $("#head").textContent="📖 第 "+it.num+" 题 · 回顾";
  $("#stem").textContent=it.stem||"";
  renderImgs(it);
  setAnsEnabled(false, "📖 我的作答（只读）");
  $("#myans").value=(progress[qid]||{}).wrote||"（本题未作答）";
  showAnsBox(true, it);
  footerBtns([["⬅ 返回成绩","#1a5276",renderResult]]);
  $("#main").scrollTop=0;
  stat();
}

/* ---------- 作答保存 ---------- */
$("#myans").addEventListener("input",function(){
  const it=curIt(); if(!it)return;
  rec(it.id).wrote=$("#myans").value;
  clearTimeout(saveTimer); saveTimer=setTimeout(save,600);
  clearTimeout(statTimer); statTimer=setTimeout(stat,600);
});
function curIt(){ return (mode==="考试"&&exam&&exam.active&&!exam.finished) ? byId(exam.ids[idx]) : BANK[idx]; }
function saveNow(){
  const it=curIt(); if(!it)return;
  if($("#myans").disabled)return;
  rec(it.id).wrote=$("#myans").value; save();
}
function setAnsEnabled(enabled, label){
  $("#myans").disabled=!enabled;
  $("#anslab").textContent=label;
}

/* ---------- 统计 / 工具 ---------- */
function stat(){
  const total=BANK.length;
  const done=BANK.filter(function(x){return isAnswered(x)}).length;
  const rev=BANK.filter(function(x){return (progress[x.id]||{}).revealed}).length;
  $("#stat").textContent="已看答案 "+rev+"/"+total+" · 已作答 "+done+"/"+total;
}
function footerBtns(btns){
  const f=$("#footer"); f.innerHTML="";
  btns.forEach(function(item){
    const b=document.createElement("button"); b.textContent=item[0]; b.style.background=item[1]; b.onclick=item[2]; f.appendChild(b);
  });
}
/* ---------- 弹窗 ---------- */
let modalCb=null;
function msg(t,p){ $("#mbox").innerHTML='<h3>'+t+'</h3><p>'+p+'</p><div class="btns"><button style="background:#1a5276" onclick="closeModal()">确定</button></div>'; $("#modal").classList.add("show"); }
function confirmDlg(t,p,cb){ modalCb=cb; $("#mbox").innerHTML='<h3>'+t+'</h3><p>'+p+'</p><div class="btns"><button style="background:#c62828" onclick="closeModal()">取消</button><button style="background:#1a5276" onclick="doConfirm()">确定</button></div>'; $("#modal").classList.add("show"); return true; }
function doConfirm(){ closeModal(); if(modalCb)modalCb(); }
function closeModal(){ $("#modal").classList.remove("show"); }
/* ---------- 重置(3次确认) ---------- */
function resetProgress(){ resetStep(1); }
function resetStep(n){
  if(n===1) confirmDlg("重置进度（1/3）","确定要清除全部作答记录与看答案记录吗？\n此操作不可恢复！",function(){resetStep(2)});
  else if(n===2) confirmDlg("重置进度（2/3）","再次确认：将清空所有作答内容与看答案记录！",function(){resetStep(3)});
  else if(n===3) confirmDlg("重置进度（3/3）","最后一次确认：立即清空全部数据并重新开始！",function(){
    progress={}; save(); stopExamTimer(); exam=null; examBarHide(); idx=0; seqSavedIdx=null; setMode("顺序");
    msg("完成","🗑 已清除全部作答记录，重新开始！");
  });
}
/* 关闭页面时保存 */
window.addEventListener("beforeunload",function(){
  saveNow();
  if(mode==="考试"&&exam&&exam.active&&!exam.finished){ exam.paused=true; exam.left=examLeft; progress.exam=exam; save(); }
});
/* 启动：恢复考试或上次位置 */
forEachNode(document.querySelectorAll("#tabs button"), function(b){
  b.addEventListener("click",function(){ setMode(b.dataset.mode); });
});
function markTabs(m){ forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode===m); }); }
function showInitError(e){
  window.__appReady = true;   /* 已自愈回顺序模式，避免环境噪音再报 */
  showErrBox("初始化失败（已自动清除本地旧数据，请刷新页面重试）："+((e&&e.message)?e.message:e), "");
}
(function init(){
  try{
    exam = (progress.exam && typeof progress.exam==="object") ? progress.exam : null;
    if(exam && exam.active){
      var qs=(exam.ids||[]).map(byId).filter(Boolean);
      if(!qs.length){ exam=null; delete progress.exam; throw new Error("考试会话数据异常"); }
      mode="考试"; markTabs("考试"); examBarShow();
      if(exam.finished){ renderResult(); }
      else if(exam.paused){ showPaused(); }
      else { tick(); renderExamQ(); }
    }else{
      exam=null;
      idx=resumeIndex();                       // 跳到"连续完成题目的最后一题"位置
      renderQ();
    }
    window.__appReady=true;
  }catch(e){
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    progress={}; exam=null; idx=0; mode="顺序";
    try{ markTabs("顺序"); renderQ(); }catch(_){}
    showInitError(e);
  }
})();
/* 微信/QQ 环境提示（悬浮顶部，可关闭，不影响任何按钮操作） */
if(navigator.userAgent.indexOf("MicroMessenger")>=0 || navigator.userAgent.indexOf("QQBrowser")>=0 || navigator.userAgent.indexOf("MQQBrowser")>=0){
  try{
    var tip=document.createElement("div");
    tip.style.cssText="position:fixed;left:0;right:0;top:0;background:#fff8e1;color:#8a6d3b;font-size:12px;line-height:1.6;padding:7px 34px 7px 10px;z-index:998;text-align:center";
    var tx=document.createElement("span");
    tx.textContent="✕";
    tx.style.cssText="position:absolute;right:6px;top:5px;font-size:14px;cursor:pointer;padding:2px 8px;color:#8a6d3b";
    tx.onclick=function(){ if(tip.parentNode)tip.parentNode.removeChild(tip); };
    tip.textContent="ℹ️ 微信/QQ 内可能显示不全：如按钮缺失或无法操作，请点右上角「…」→「用其他应用打开」→ 选浏览器打开";
    tip.appendChild(tx);
    document.body.appendChild(tip);
  }catch(e){}
}
</script>
</body>
</html>

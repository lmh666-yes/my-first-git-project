要额外管理元数据（对齐、块头）；不释放则一直占用直到程序结束（或由 OS 回收）；分配失败返回 NULL，必须判空。\n3. 其他区别：①增长方向通常栈向下、堆向上（都向中间\"对撞\"，相遇即溢出）；②访问效率：栈靠栈指针相对寻址、缓存友好；堆靠指针间接访问、随机性大；③安全：堆的越界/二次释放/泄漏很难定位，嵌入式常禁用动态内存，改用静态分配或内存池（如 µC/OS 的 `OSMemCreate`）。", "explain": "① 栈＝编译器自动分配释放、存局部变量/参数/返回地址、LIFO、快但小 ② 堆＝程序员手动申请释放、malloc/free、有碎片与泄漏、慢但大 ③ 加分：指出嵌入式实践禁用动态分配而用内存池/静态分配，或栈溢出与堆碎片问题。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-445", "kind": "subjective", "kind_name": "主观题", "num": 445, "stem": "何为 MSB 和 LSB？", "options": [], "answer": "1. MSB（Most Significant Bit）：最高有效位，即二进制数中权值最大的那一位（如 8 位数的 bit7）。\n2. LSB（Least Significant Bit）：最低有效位，即权值最小的那一位（8 位数的 bit0）。\n3. 常见相关用法：\n   ①MSB-first / LSB-first：串行传输时是\"先发最高位\"还是\"先发最低位\"，SPI/I2C/移位的配置项（SPI 有 `SPI_FirstBit_MSB/LSB`）；写软件 SPI 时若位序搞反，收到的数据会整体镜像（如 0x01 变 0x80）；\n   ②LSB 的含义（分辨率单位）：在 ADC/DAC 语境中 \"1 LSB\" 表示最低有效位对应的模拟量变化量，即满量程/2ⁿ（12 位、3.3V 时 1LSB＝3.3/4096≈0.806mV），也用于描述量化误差（±1/2 LSB）、INL/DNL（±2 LSB）；\n   ③字节序：小端是\"低地址存 LSB 所在的低字节\"，大端相反。\n4. 易混点：MSB 有时也指\"最高有效字节（Most Significant Byte）\"，需结合上下文判断是 bit 还是 byte（也可写为 MSbit/MSbyte 加以区分）。", "explain": "① MSB＝最高有效位、LSB＝最低有效位 ② 用途（串行位序 MSB-first/LSB-first、ADC 的 1LSB 分辨率）③ 加分：指出 MSB 也可能指最高有效字节，或给出 1LSB＝VREF/2ⁿ 的计算。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-446", "kind": "subjective", "kind_name": "主观题", "num": 446, "stem": "什么是可重入函数？", "options": [], "answer": "可重入（reentrant）函数是指可以被多于一个任务（或主程序与中断）并发使用而不会出现数据错误的函数：它可以在任意时刻被中断、稍后继续运行而不丢失数据。\n满足可重入的条件（关键：不依赖任何\"共享且可变\"的状态）：\n1. 只使用局部（自动）变量或参数，且这些变量在栈/寄存器上（每次调用各有一份，互不干扰）；\n2. 不使用 `static` 局部变量、全局变量、共享缓冲区等静态/全局可写数据（若必须使用，则要用互斥量/临界区保护，或每次调用由调用者传入缓冲区）；\n3. 不调用不可重入函数（如 malloc/free、printf、strtok、标准 I/O 库等）；\n4. 不返回指向自身静态数据或局部变量的指针（返回局部变量地址属未定义行为）。\n工程意义：在 RTOS 与中断环境中，被多个任务或\"任务+ISR\"共同调用的函数必须可重入，否则会出现数据被改写、状态错乱的偶发故障。\n示例：`int add(int a,int b){ return a+b; }` 完全可重入；而用 static 缓存的 strlen 实现不可重入。", "explain": "① 定义＝多任务/主程序与中断可并发调用而不出错 ② 条件＝只用局部变量（栈上）、不使用 static/全局、不调用不可重入函数 ③ 加分：指出若必须共享则需互斥保护，或举出可重入/不可重入的例子。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-447", "kind": "subjective", "kind_name": "主观题", "num": 447, "stem": "什么是不可重入函数？", "options": [], "answer": "不可重入函数在实时系统设计中被视为不安全函数：如果它在执行过程中被中断（或另一任务）再次调用，会因共享了可写的中间状态而使数据被破坏、结果错误。\n满足下列条件之一的函数多为不可重入：\n1. 函数体内使用了静态数据结构：`static` 局部变量、全局变量、共享缓冲区（如内部 static 数组做返回值或缓存）；\n2. 函数体内调用了 malloc()/free()：堆管理器本身用全局链表与状态，非线程安全；\n3. 函数体内调用了标准 I/O 函数（printf/fscanf/fread 等）：它们使用共享的文件缓冲与内部锁状态，且执行时间长、可能阻塞；\n4. 其他：调用了 `strtok`、`rand`、`getenv`、`setlocale`、`asctime/localtime`（返回内部 static 缓冲）等使用了库内全局状态的函数。\n对策：①用可重入版本（`strtok_r`、`localtime_r`、`rand_r`）；②改为由调用者传入缓冲区/上下文（`snprintf` 到调用者数组）；③用互斥量/临界区保护对本函数的调用（注意 ISR 与任务竞争时需用关中断或信号量，ISR 不能用互斥量）；④关键场合禁止在 ISR 中调用这类函数（这也是\"ISR 里不能 printf\"的根本原因）。", "explain": "① 定义＝共享可写状态导致并发/中断重入时出错 ② 三类典型成因（static/全局数据、malloc/free、标准 I/O）③ 加分：给出可重入替代（strtok_r/localtime_r）或用互斥保护、ISR 中禁用这些函数。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-448", "kind": "subjective", "kind_name": "主观题", "num": 448, "stem": "按键抖动的原因与解决办法。", "options": [], "answer": "1. 原因：按键在按下/松开时，活动触点击打固定触点会发生机械振动（弹性回跳），导致输出波形在短时间内产生多次高低电平跳变（抖动）。抖动持续时间与按键形态、触点材料有关：金属触点按键可能达约 10ms，软性触点（导电橡胶、薄膜按键）通常在 1ms 以内甚至几乎无抖动；此外电磁干扰、长线耦合也会引入毛刺。\n2. 解决办法：\n   ①软件消抖（最常用）：检测到电平变化后延时 10~20ms 再复检，两次一致才确认按键；注意不要用大循环 `delay_ms()` 阻塞（会拖慢系统），更好的做法是定时器周期扫描（如 5~10ms）+ 状态机（空闲→确认按下→按住→确认释放）或计数确认（连续 N 次采样一致才认为有效）。\n   ②硬件消抖：RC 滤波（配合施密特触发输入）、RS 触发器、专用消抖芯片、加电容/上拉。\n   ③结合中断：用 EXTI 边沿触发唤醒，但在中断里只置标志，消抖与判定放到定时器任务中完成（避免在中断里做延时）。\n   ④其他：加长按/连击判定与按键释放检测、对多键同按的矩阵键盘加二极管防鬼影；关键操作可要求\"按下 + 释放\"完整动作。\n3. 设计要点：查询间隔选 10ms 左右足够（人不可能每秒按 50 次，按下持续时间也不可能短于 10ms）；抖动窗口要覆盖按键最长抖动时间；若同时要检测长按，用状态机记录按下时长比 `delay` 更可靠。", "explain": "① 原因＝机械触点弹性回跳（数 ms~10ms，软性触点更短）② 软件消抖做法（延时复检或定时器周期扫描 + 状态机/计数确认）③ 加分：硬件 RC/施密特消抖、中断里只置标志、长按检测或矩阵键盘鬼影。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-449", "kind": "subjective", "kind_name": "主观题", "num": 449, "stem": "extern \"C\" 的作用是什么？", "options": [], "answer": "1. 作用：在 C++ 代码中，加上 `extern \"C\"` 会指示编译器把这部分代码（或其中的声明）按 C 语言的规则编译/链接，即不进行函数名修饰（name mangling）、不做 C++ 重载解析。\n2. 原因：C 与 C++ 编译器对函数名的处理不同。C++ 支持函数重载，编译后的符号名一般由\"函数名 + 参数类型\"构成，例如 `void fun(int,int)` 可能被修饰成 `_Z3funii`；而 C 没有重载，符号名基本就是 `_fun`。若一个用 C 编译的目标文件与 C++ 混合链接，符号名不一致就会链接失败（undefined reference）。`extern \"C\"` 让两边都使用 C 的符号名规则，从而可以互相调用。\n3. 典型用法：\n#ifdef __cplusplus\nextern \"C\" {\n#endif\n    int my_add(int a, int b);      /* 或整个头文件内容 */\n#ifdef __cplusplus\n}\n#endif\n这样头文件既可以被 C 编译器包含（`__cplusplus` 未定义，宏不生效，按 C 编译），也可以被 C++ 编译器包含（按 C 规则声明），实现\"同一头文件 C/C++ 通用\"。\n4. 注意：①`extern \"C\"` 只能用于 C++（写在 .c 文件里会报错，故需 `#ifdef __cplusplus` 包裹）；②它只影响链接符号名，不改变调用约定/参数传递（若需改调用约定要用 `__cdecl/__stdcall` 等）；③不能用来包裹 C++ 重载函数（同名不同参无法用 C 符号表示）；④只对函数和变量声明有意义，对类型定义无影响（类型定义本就不产生符号）。", "explain": "① 作用＝让 C++ 按 C 方式编译/链接，避免 name mangling 导致的链接错误 ② 说明 C++ 重载靠\"函数名+参数类型\"修饰符号名 ③ 加分：写出 `#ifdef __cplusplus extern \"C\" { #endif … }` 的通用头文件写法。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-450", "kind": "subjective", "kind_name": "主观题", "num": 450, "stem": "static 与 extern 的区别。", "options": [], "answer": "1. static（静态存储类，主要三种用法）：\n   - 修饰函数内的局部变量：变为静态局部变量，只初始化一次、生命周期贯穿整个程序，存于静态区（.data/.bss），作用域仍在函数内；\n   - 修饰函数：函数仅在本文件内可见（内部链接），其他文件不能调用；\n   - 修饰本 .c 文件的全局变量：变量仅在本文件内可见（内部链接），阻止其他文件用 extern 访问。\n   概括：static 的两大作用是\"限制可见性（内部链接）\"与\"延长生命周期（静态存储）\"。\n2. extern（外部链接声明）：用于声明\"这个变量/函数在别的地方定义\"，让多个模块（.c 文件）共享同一个全局变量或调用外部函数；`extern` 本身不分配内存、不产生定义，只是告诉编译器符号名与类型，真正的定义在某个 .c 文件中（且只能有一处定义，否则重复定义链接错误）。\n3. 对比小结：\n   - 目的相反：static 让符号\"只在本文件可见\"，extern 让符号\"跨文件可见/共享\"；\n   - static 是定义/限定，extern 是声明；\n   - static 修饰局部变量改变其存储位置与生命周期，extern 只影响链接可见性；\n   - 工程用法：模块内部实现用 static 隐藏（降低耦合、避免命名冲突）；模块对外接口与共享数据用 extern（配合头文件声明）。", "explain": "① static 三种用法（静态局部变量、静态函数、静态全局变量）② extern 用于声明外部变量/函数以便跨文件共享 ③ 加分：概括为\"static 限制可见性 + 延长生命周期，extern 声明外部符号\"，或指出定义只能有一处。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-451", "kind": "subjective", "kind_name": "主观题", "num": 451, "stem": "assert 的概念与作用是什么？", "options": [], "answer": "1. 概念：断言（assert）是一种用于在代码中捕捉程序员假设的机制，可看作异常处理的一种高级形式：断言是一个布尔表达式，程序员相信在程序的某个特定点该表达式一定为真。C 标准库中以宏形式提供：`void assert(int expression);`（`#include <assert.h>`），当表达式为假时向 `stderr` 打印失败信息（文件名、行号、表达式）并调用 `abort()` 终止程序。\n2. 作用：①在开发阶段尽早暴露逻辑错误与非法状态（如空指针、越界索引、参数不合法、不可能到达的分支），把\"隐式错误\"变成\"立即崩溃\"，避免错误被掩盖后造成更大损失；②作为设计约束的自检（函数入口的前置条件、出口的后置条件、循环不变式），提高代码可验证性；③配合单元测试快速定位。\n3. 使用要点：①断言用于检查\"绝不应该发生\"的情况，不能用于常规错误处理（用户输入错误、文件打不开、通信失败应当用返回值/错误码处理，而不是 assert）；②断言可以在任何时候启用/禁用：定义 `NDEBUG` 后 `assert` 被预处理为无操作，因此断言语句中不能包含必须执行的副作用（如 `assert(Init()==OK);` —— 发布版会自动跳过）；③嵌入式常把断言重定向为记录日志 + 系统复位（而非 abort），以便现场恢复；④`static_assert`（编译期断言）可用于检查常量条件（如结构体大小、类型宽度），零运行开销。", "explain": "① 概念＝捕捉程序员假设的布尔表达式、assert 是宏不是函数 ② 作用＝开发期尽早暴露非法假设/逻辑错误，不作常规错误处理 ③ 加分：`NDEBUG` 可禁用以致发布版无开销（故不能在断言里写副作用）、嵌入式重定向为记录+复位、static_assert 编译期检查。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-452", "kind": "subjective", "kind_name": "主观题", "num": 452, "stem": "宏定义中使用 do{}while(0) 有什么作用？", "options": [], "answer": "主要作用是保证宏的使用者能\"无编译错误、语义正确\"地使用该多语句宏，特别是把它放在 `if/else` 等带分支的语句中时。\n反例分析：定义 `#define SAFE_FREE(p) free(p); p=NULL;`\n- 用法 `if (NULL!=p) SAFE_FREE(p); else ...;` 展开为：\nif (NULL!=p) free(p); p=NULL;; else ...;\n①`if` 后面出现了两条语句，`else` 找不到配对的 `if`，编译失败；②即使没有 else，`p=NULL` 也会无论条件是否成立都执行（逻辑错误）。\n若改成 `#define SAFE_FREE(p) { free(p); p=NULL; }`：展开后 `if(...) { free(p); p=NULL; }; else ...` —— 由于 C 语言习惯在语句后加分号，宏后的那个分号成了空语句，又切断了 if 与 else 的配对，仍会编译失败。\n正确写法：\n#define SAFE_FREE(p) do{ free(p); p=NULL; } while(0)\n展开后 `if (NULL!=p) do{...}while(0); else ...;` —— 整个宏在语法上是一条完整语句（do-while 必须带分号，正好吸收使用者写的分号），因此：①与 if/else 正确配对（不会 cut off else）；②不会多出未受控的语句；③编译器还能保证只执行一次；④控制流中 `break` 只跳出该 do-while（部分场景反而是期望行为）。\n同类技巧：把宏的参数和整体都加括号；若宏需要\"返回值\"可用 `({ ... })`（GCC 扩展语句表达式）或改为 `static inline` 函数（更推荐：有类型检查、可调试）。", "explain": "① 作用＝让多语句宏在 if/else 中作为一条完整语句、不破坏分支配对 ② 举出 `SAFE_FREE` 展开的反例（else 悬空 / 第二条语句无条件执行）③ 加分：指出只用 {} 仍会被分号破坏、常量/复杂逻辑建议改 static inline 函数或加括号。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-453", "kind": "subjective", "kind_name": "主观题", "num": 453, "stem": "什么是字节对齐？字节对齐有什么作用？如何改变 C 编译器的缺省对齐方式？", "options": [], "answer": "1. 什么是字节对齐：结构体是复合数据类型，编译器为每个成员按其自然边界（alignment）分配空间，成员按声明顺序存储，第一个成员地址与结构体地址相同。所谓对齐，是要求变量的起始地址能被其自身大小（或指定对齐数）整除 —— 例如 4 字节的 int 起始地址应能被 4 整除。为满足这一要求，编译器会在成员之间或结构末尾填充（padding）空字节。\n2. 作用：①便于 CPU 快速访问：32 位机一次可访问 4 字节，若一个 long 跨越 4 字节边界存放，CPU 需要读取两次并拼接，效率下降（有些平台甚至不支持非对齐访问而直接硬件异常）；②合理利用对齐可节省存储空间、减少填充。注意对齐数是\"折中\"：在 32 位机上用 1 或 2 字节对齐反而会降低访问速度，需结合处理器与编译器（VC/gcc 默认 4 字节对齐）。\n3. 改变缺省对齐方式的方法：\n   - `#pragma pack(n)`：按 n 字节对齐；`#pragma pack()` 取消自定义、恢复默认；\n   - `__attribute((aligned(n)))`：让结构成员对齐在 n 字节自然边界（成员长度大于 n 时按最大成员长度对齐）；\n   - `__attribute__((packed))`：取消编译期优化对齐，按实际字节数紧凑排列。\n4. 举例：\nstruct test { char x1; short x2; float x3; char x4; };\n默认 4 字节对齐时：x1 在偏移 0；x2（short）需 2 对齐 → 偏移 1 处补 1 字节，x2 在 2~3；x3 在偏移 4~7；x4 在偏移 8；结构最大对齐数为 4，末尾补 3 字节 → sizeof=12。加 `#pragma pack(1)` 后无任何填充 → sizeof=8；用 `__attribute__((packed))` 同样得 8。\n5. 工程意义：①通信协议报文/寄存器映射结构常用 pack(1) 保证\"内存布局 = 线格式\"，否则字段错位；②结构体成员按\"大类型在前、小类型在后\"排列可减少填充（如 12→8）；③取消对齐会带来非对齐访问（效率下降或硬件异常），访问 packed 结构中的成员需谨慎（必要时用 memcpy 而非强转指针）；④`sizeof` 不等于各成员大小之和，memcmp 比较结构体、按字节传输结构体都要注意填充字节是\"不确定值\"。", "explain": "① 定义＝成员起始地址按自身大小/指定对齐数对齐，编译器插入填充字节 ② 作用＝便于 CPU 快速访问、兼顾空间利用 ③ 改变方式＝pragma pack(n)/pack()、__attribute__((aligned(n)))/packed ④ 加分：给出 12→8 的计算过程，或指出 packed 带来的非对齐访问与协议报文对齐的工程用法。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-454", "kind": "subjective", "kind_name": "主观题", "num": 454, "stem": "STM32 中字节对齐问题（__align(n)、__packed 用法）。", "options": [], "answer": "一、`__align(num)`\n1. 作用：修改最高级别对象的字节边界（按 num 字节对齐），最常用于保证 DMA/汇编 `LDRD/STRD` 等要求的数据对齐（最大支持 8 字节）。\n2. 限制：他是存储类修饰，只能修饰最高级类型对象，不能用于结构或函数对象；可以让 2 字节对象做 4 字节对齐，但不能让 4 字节对象做 2 字节对齐（只能加严不能放宽）。\n3. 例：\n__align(4) u8 mem1base[MEM1_MAX_SIZE];  // 保证数组首地址 4 字节对齐\n这在自定义 malloc 时尤其关键：MDK 标准 malloc 返回的内存是 8 字节对齐的，而自己写的内存池若不加 `__align(4)`，分配出的首地址可能不对齐，编译器并不知道，后续用该指针做 int/long 访问就会出问题。\n二、`__packed`\n1. 作用：施加1 字节对齐（取消填充），使结构体尺寸 = 各成员大小之和，用于与通信报文/寄存器映射严格对应（如文件记录、协议帧、跨编译器传递的数据）。\n2. 特性与注意：\n   - 不能对 packed 对象做对齐假设，其成员地址可能是非对齐的；\n   - 对 packed 对象的所有读写都是非对齐访问：ARM 上编译器会生成\"多次字节访问再拼接\"的代码（如 __rt_uwrite4 用 4 次 strb）或触发非对齐访问异常（若用 ldr/str 直接访问奇地址会失败）；\n   - float 及含 float 的结构/联合、未用 __packed 的对象之间转换是未定义行为；`__packed int*` 本身没有意义（修饰指针无效）；\n   - 对局部整型变量无影响；\n   - 栈上数据通常是对齐访问，因此把 packed 结构声明为全局/静态（不放栈上）能减少踩坑，或用 `__packed int* q;` 明确告知编译器\"该指针指向非对齐数据\"以生成安全代码。\ntypedef __packed struct READ_Command { u_char code; u_int addr; u_char len; } READ_Command;\n与不带 `__packed` 的版本相比：无 packed 时成员会按各自对齐规则填充（如 code 后可能补 3 字节、末尾再补齐），尺寸变大；带 packed 时严格紧凑。\n三、结论与建议：①只在协议/存储映射等确有必要时用 packed，并配合 memcpy 读写或确保编译器生成非对齐安全代码；②DMA 缓冲区务必按对齐要求对齐（`__align(4)` 或 `ALIGN_4` 宏），避免 DMA 传输时地址错乱/效率低下；③查阅编译器手册确认关键字（MDK `__packed`/`__align`，GCC `__attribute__((packed/aligned))`）。", "explain": "① `__align(n)` 用途（最高级对象对齐，保 DMA/汇编要求）与限制（不能修饰结构/函数、只能加严）② `__packed` 用途（1 字节对齐，使结构与报文/寄存器布局一致）与非对齐访问代价 ③ 加分：提及自定义 malloc 与 DMA 缓冲区的对齐要求，或给出给 packed 指针加 `__packed` 修饰以生成安全访问代码的做法。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-455", "kind": "subjective", "kind_name": "主观题", "num": 455, "stem": "你使用过哪些操作系统、编程语言及 MCU？（开放题）", "options": [], "answer": "本题为主观经历题，按\"操作系统 / 语言 / MCU\"三条线作答，并给出可验证的具体项目点：\n①操作系统：裸机（前后台 while(1)+中断）、RTOS（µC/OS-II/III、FreeRTOS 为主，RT-Thread 或有接触）、Linux（可选，涉及驱动/应用分层）；说明各自用过的能力点：µC/OS 的任务/信号量/消息队列/事件标志/内存分区与优先级继承；FreeRTOS 的任务/队列/软件定时器/信号量；裸机的中断处理与定时器扫描架构。\n②编程语言：C（主力，指针/结构体/位操作/宏）、C++（类与继承、虚函数、引用、STL 基础）、汇编（启动代码/关键时序）、Python/Shell（测试脚本、自动化构建与数据处理）。\n③MCU 平台：STM32F1/F4（HAL/标准库，GPIO/EXTI/定时器 PWM/ADC/DMA/USART/I2C/SPI/IWDG/WWDG/RTC/Flash）、51 单片机、ESP32/ESP8266（Wi-Fi/AT 或 SDK）、NXP/华大等国产芯片（可按实际填写）。\n④建议的\"加分表述\"：挑 1~2 个最有代表性的项目，用\"芯片 + 外设 + 软件架构 + 解决的具体问题\"说清楚（例如\"用 STM32F407 + DMA 双缓冲采集 ADC，配合 µC/OS-III 三任务分离采集/算法/上报，用消息队列解耦，误码率从 x 降到 y\"）。切忌罗列名词而没有细节。", "explain": "① 分别列出操作系统、语言、MCU 三方面 ② 结合具体外设/机制（定时器、DMA、I2C、任务/信号量等）说明熟练度 ③ 加分：用\"芯片+外设+架构+效果\"的结构举出真实项目。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-456", "kind": "subjective", "kind_name": "主观题", "num": 456, "stem": "对一系列数据进行排序有哪几种方法？（开放题）", "options": [], "answer": "常用排序方法及适用场景：\n1. 冒泡排序：相邻比较交换，每轮把最值\"冒\"到末尾；时间 O(n²)，空间 O(1)，稳定；实现最简单，适合教学/极小数据量。\n2. 选择排序：每轮选最值放到已排序区末尾；O(n²)、O(1)、不稳定；交换次数少。\n3. 插入排序：把元素插入到前面已排序序列中；平均 O(n²)、最好 O(n)（近乎有序时极快）、O(1)、稳定；小规模或基本有序数据首选。\n4. 希尔排序：分组插入、逐步缩小增量；平均约 O(n^1.3)，不稳定；实现简单、无需额外空间。\n5. 快速排序：选基准分区递归；平均 O(n log n)、最坏 O(n²)（有序/基准选择差）、空间 O(log n)（递归栈）、不稳定；实际最快之一，注意用\"三数取中/随机基准\"避免最坏情况。\n6. 归并排序：分治合并；稳定 O(n log n)、需要 O(n) 额外空间；适合链表排序与外排序（大数据文件分块排序）。\n7. 堆排序：建堆 + 反复取堆顶；O(n log n)、O(1)、不稳定；适合\"求前 k 大/小\"、优先级队列。\n8. 计数排序 / 基数排序 / 桶排序：非比较排序，当数据范围有限（如 0~255 的 ADC 值、固定长度的 ID）时可做到 O(n)（基数 O(d·n)），需要额外空间；计数排序稳定，基数排序稳定。\n9. 库函数：C 的 `qsort()`、C++ 的 `std::sort`（内省排序 introsort），工程中优先使用（已高度优化）。\n选型要点：①数据量小（<50）或基本有序 → 插入排序；②通用大数据 → 快排或库函数 sort；③需要稳定（保留相等元素的相对次序，如多字段排序）→ 归并/插入/计数；④内存受限 → 堆排序；⑤数据范围小且是整数 → 计数/基数排序。", "explain": "① 说出≥4 种算法并给出时间复杂度 ② 区分稳定性与适用场景 ③ 加分：提到工程中用 qsort/std::sort，或按数据规模/范围/内存约束给出选型建议。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-457", "kind": "subjective", "kind_name": "主观题", "num": 457, "stem": "翻译题：请把下面这段英文译成中文（关于硬件资源管理接口的说明）。\n> Interfaces that manage hardware resources have Open and Close functions. The Open func(tion) usually takes an index that enumerates the hardware resource as a Settings structure for init(ial) configuration.", "options": [], "answer": "管理硬件资源的接口通常提供 Open（打开）和 Close（关闭）两个函数。Open 函数一般接受一个用于枚举硬件资源的索引，以及一个用于初始配置的 Settings（设置）结构体作为参数。\n术语建议：Open/Close 保留原名并加中文注释（打开/关闭）；index 译为\"索引（编号）\"；enumerates the hardware resource 指\"枚举/一一列举可用的硬件资源\"；Settings structure 译为\"配置（设置）结构体\"；init configuration 译为\"初始化配置\"。", "explain": "① 主句译对：硬件资源管理接口提供 Open/Close ② 说明 Open 的参数：资源索引 + 初始化配置用的 Settings 结构体 ③ 加分：术语处理一致（索引、结构体、初始化配置）、语序通顺无漏译。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-458", "kind": "subjective", "kind_name": "主观题", "num": 458, "stem": "翻译题：请把下面这段关于 eCos 可移植性的英文译成中文。\n> eCos is designed to be portable to a wide range of target architectures and target platforms including 16, 32, and 64 bit architectures, MPUs, MCUs and DSPs. The eCos kernel, libraries and runtime components are layered on the Hardware Abstraction Layer (HAL), and thus will run on any target once the HAL and relevant device drivers have been ported to the target's processor architecture and board. Currently eCos supports a large range of different target architectures.", "options": [], "answer": "eCos 被设计为可移植到多种目标体系结构与目标平台之上，包括 16 位、32 位和 64 位架构、MPU（微处理器）、MCU（微控制器）以及 DSP（数字信号处理器）。eCos 的内核、库和运行时组件都分层构建在硬件抽象层（HAL）之上，因此只要把 HAL 和相关设备驱动移植到目标处理器架构与目标板，eCos 就能在该目标上运行。目前 eCos 支持非常多种不同的目标体系结构。\n术语建议：portable 可移植的；target architecture 目标体系结构；MPU/MCU/DSP 保留缩写并加中文；layered on 分层（构建）于……之上；Hardware Abstraction Layer (HAL) 硬件抽象层；device drivers 设备驱动；ported to 移植到；board 目标板。", "explain": "① 三句话信息完整（可移植范围含 16/32/64 位与 MPU/MCU/DSP；内核/库/运行时分层于 HAL 之上；移植 HAL+驱动后即可运行；现支持多种架构）② 关键术语译对：HAL 硬件抽象层、移植（port）、体系结构、目标板 ③ 加分：语言通顺、正确体现\"分层\"与\"只要……就……\"的条件关系。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-459", "kind": "subjective", "kind_name": "主观题", "num": 459, "stem": "你使用过哪些单片机？熟练使用单片机的哪些功能模块？（开放题）", "options": [], "answer": "分两层作答：\n①平台：如 STM32F103/F407（标准库与 HAL 库）、51 系列、ESP32/ESP8266（Wi-Fi/BLE）、NXP/国产 MCU 等；说明各平台的项目用途。\n②功能模块（每项都要有具体用法说明）：\n   - GPIO/EXTI：按键中断、外部脉冲计数、唤醒；\n   - 定时器：PWM 调光/调速/舵机、输入捕获测频测宽、定时溢出做系统时基与软件定时；\n   - ADC/DAC：多通道采样 + DMA 双缓冲、内部参考/温度通道、均值滤波；\n   - 通信：USART（自定义协议帧 + CRC + 环形缓冲区 + 空闲中断）、I2C（EEPROM/传感器）、SPI（Flash/显示屏/无线模块）、CAN（工业总线）、USB（虚拟串口/CDC）、RS485（半双工方向控制 + 终端电阻）；\n   - 低功耗与外设：IWDG/WWDG、RTC（掉电计时）、STOP/STANDBY 模式与唤醒源、Flash 读写（参数保存 + 校验 + 双备份）；\n   - RTOS 与架构：任务划分、队列/信号量解耦、任务优先级与栈估算、看门狗与异常记录（HardFault 现场保存）。\n③表述建议：用\"模块 + 我做了什么 + 踩过什么坑\"的方式说明熟练度（例如\"用 USART 空闲中断 + DMA 接收不定长帧，解决了高波特率丢包问题\"），比单纯罗列模块更有说服力。", "explain": "① 列出用过的平台（型号+项目）② 列出≥5 个功能模块并结合具体用法 ③ 加分：给出\"模块+做法+效果/踩坑\"的实例或提到 RTOS 架构与低功耗设计。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-460", "kind": "subjective", "kind_name": "主观题", "num": 460, "stem": "单片机的 bootloader 程序一般要实现什么功能？", "options": [], "answer": "Bootloader（引导程序）是上电后最先运行的一小段程序，其核心职责与常见功能如下：\n1. 启动与判定：完成最基础的硬件初始化（时钟、看门狗、串口/外设、必要引脚），判断\"进入升级流程\"还是\"跳转到应用程序\"，常见进入条件：①上电/复位后检测某个引脚电平；②在 Flash 指定位置读取升级标志（magic 字）与版本信息；③在应用请求下跳转（应用收到升级命令后置标志并复位）；④接收上位机在启动窗口期的握手命令（超时则直接跳应用）。\n2. 应用跳转：读取应用程序起始地址（如 0x08008000）与栈顶值，设置 MSP 与向量表偏移（SCB->VTOR），关闭已使能的外设/中断，然后跳转到应用的 Reset_Handler（常用函数指针调用 + `__set_MSP()`）。\n3. 固件传输与写入：通过 USART/CAN/USB/以太网/I2C 等接收新固件，按扇区擦除 + 写入 Flash（注意写入前解锁 `FLASH_Unlock()`、按对齐与页边界写入、写完校验），传输过程需带分包序号 + 校验（CRC/累加和）+ 重传、丢包超时处理。\n4. 完整性与合法性校验：校验固件的长度、CRC/签名，确认无误再置\"可跳转\"标志，避免刷入半包固件导致设备变砖。\n5. 升级策略与可靠性（进阶）：①A/B 双分区（备份区）：新固件先写到备份区，校验通过后再更新，失败可回滚；②支持断点续传与失败回滚、记录升级次数/结果；③升级期间关闭或定期喂看门狗防止被复位；④预留\"强制升级/恢复出厂\"通道。\n6. 其他细节：①划分好 Flash 布局（bootloader 区 + 参数区 + A/B 应用区）并在链接脚本中对应；②应用的中断向量表要整体偏移（VTOR）并把向量表重定位代码写入应用；③上电到跳转之间不宜耗时过长（启动窗口超时机制）。", "explain": "① 启动判定（引脚/标志/命令）与跳转应用程序（设置 MSP、VTOR）② 固件接收（分包/校验/重传）+ Flash 擦写 + 校验后生效 ③ 加分：A/B 双分区与回滚、看门狗处理、Flash 分区与中断向量表重定位。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-461", "kind": "subjective", "kind_name": "主观题", "num": 461, "stem": "如果一组精度为 10 位 AD 的按键，各按键 AD 值依次为：10、200、400、600、800（无按键的时候 AD 为 1023），如何确定各个按键的取值范围？", "options": [], "answer": "核心思路是取相邻按键 AD 值的\"中间点\"作为门限，为每个按键划分一个容差区间（同时避开无按键的 1023）：\n1. 计算相邻边界（中间值）：\n   - 按键 1(10) 与按键 2(200)：门限 = (10+200)/2 = 105\n   - 按键 2(200) 与按键 3(400)：门限 = 300\n   - 按键 3(400) 与按键 4(600)：门限 = 500\n   - 按键 4(600) 与按键 5(800)：门限 = 700\n   - 按键 5(800) 与\"无按键\"(1023)：门限 = (800+1023)/2 ≈ 911（工程上一般取 900 或 950 更安全）\n2. 因此取值范围为：\n   - KEY1：AD < 105（或 0~105）\n   - KEY2：105 ≤ AD < 300\n   - KEY3：300 ≤ AD < 500\n   - KEY4：500 ≤ AD < 700\n   - KEY5：700 ≤ AD < 911（或 900）\n   - 无按键：AD ≥ 911（接近 1023）\n3. 实现方式（`if-else` 判断，等效于查表 + 二分）：\nif      (ad < 105) key = 1;\nelse if (ad < 300) key = 2;\nelse if (ad < 500) key = 3;\nelse if (ad < 700) key = 4;\nelse if (ad < 911) key = 5;\nelse               key = 0;   /* 无按键 */\n4. 工程注意：①门限应尽量居中（距相邻键值等距），给分压电阻容差与温漂留最大余量；若两键间距很小则应加大电阻间距；②必须做去抖（连续多次采样一致或定时器周期扫描 + 状态机），并做稳定性判断（采样值落在同一区间 N 次才认为有效）；③可对采样值做均值/中值滤波平滑（按键对实时性要求不高）；④若用 DMA 多通道扫描则需注意与其它通道的采样时间一致性；⑤也可用\"查表 + 最近邻\"实现：找与采样值最接近的标定值，但中间门限法更省算力。", "explain": "① 给出中间门限（105、300、500、700、≈911）与各键区间 ② 说明\"取相邻 AD 值中点作门限 + 无按键单独判定\"的原则 ③ 加分：去抖/多次采样确认、均值滤波，或指出门限居中可为电阻容差与温漂留余量。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-462", "kind": "subjective", "kind_name": "主观题", "num": 462, "stem": "PWM 是什么意思，实现什么功能？", "options": [], "answer": "1. 含义：PWM＝Pulse Width Modulation＝脉冲宽度调制。在一个固定周期（频率 f）内改变高电平所占的时间比例（占空比 duty = 高电平时间 / 周期），从而在负载上得到\"等效可调的模拟量\"。\n2. 实现的功能/原理：①对惯性负载（LED 视觉暂留、电机机械惯性、RC/LC 滤波）而言，等效效果由平均电压/功率决定：`Uavg = D × VCC`，改变占空比即可等效调节亮度、转速、输出功率；②比\"线性调压\"效率高得多——开关管工作在饱和/截止（导通电阻小、截止无电流），功耗极低，配合电感/电容可做开关电源；③同时能精确输出频率与脉冲个数。\n3. 典型应用：LED 调光/呼吸灯（注意选高于人眼闪烁感知的频率，>1~2kHz 避免可见闪烁）、直流电机调速、舵机角度控制（50Hz，脉宽 0.5~2.5ms 对应 0~180°，这正是\"脉宽决定位置\"而不是平均电压）、蜂鸣器发声（方波频率决定音调）、开关电源（Buck/Boost）、DAC 输出（PWM + RC 低通滤波再运算放大）、逆变与 H 桥控制。\n4. 实现与注意：①MCU 侧一般用定时器的 PWM 模式（ARR 决定周期/PSC 决定计数时钟、CCR 决定占空比，模式 1/2 决定极性），或用 GPIO + 定时中断软件翻转（灵活但占用 CPU）；②死区时间（H 桥/电机驱动必须设置，防上下桥直通）、启动电流限制（软启动）；③舵机等对脉宽绝对时间敏感的应用不能只改占空比而忽略频率。", "explain": "① 答出脉冲宽度调制、占空比概念 ② 说明等效平均电压/功率可调（惯性负载）③ 加分：举出 LED 调光/电机调速/舵机/DAC 等应用，或说明定时器 ARR/PSC/CCR 的实现方式与死区/H 桥注意点。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-463", "kind": "subjective", "kind_name": "主观题", "num": 463, "stem": "你所熟悉的 RTOS 任务调度是如何实现的？", "options": [], "answer": "以 µC/OS-III、FreeRTOS 为例，任务调度的实现机制可概括为\"就绪表 + 优先级位图 + 上下文切换\"：\n1. 任务与优先级：每个任务有独立栈与任务控制块（TCB，存栈指针、优先级、状态、等待对象等），任务按优先级组织为就绪表（µC/OS 用就绪位图 `OSRdyTbl[]` + 优先级分组表 `OSUnMapTbl` 做 O(1) 查找最高优先级；FreeRTOS 用 `uxTopReadyPriority` 位图 + 每个优先级一条就绪链表）。\n2. 调度时机/策略：采用基于优先级的抢占式调度，并支持同优先级时间片轮转。调度由 `OSSched()`/`taskYIELD()` 触发（事件唤醒、延时到期、创建/删除任务、改优先级、中断退出等）；策略为\"总是运行就绪态中优先级最高的任务\"，高优先级任务就绪立即抢占。µC/OS 还提供 `OSSchedRoundRobinCfg()` 配置时间片。\n3. 状态与阻塞：就绪/运行/阻塞（等信号量、队列、事件、延时）/挂起/休眠；任务调用阻塞 API 时被移出就绪表并按事件挂到等待表（信号量等待表、延时表/节拍链表），到期或事件到达时被重新放回就绪表并触发调度。\n4. 时钟节拍：SysTick（或定时器）产生 tick 中断，`OSTimeTick()`/`xTaskIncrementTick()` 递减延时任务计数、唤醒到期任务，并在有更高优先级就绪时切换任务（tick 也是时间片轮转的计数来源）。\n5. 上下文切换（PendSV）：Cortex-M 上 RTOS 用 PendSV 异常做真正的现场切换——在 PendSV 里把当前任务的寄存器（R4~R11、PSP 等）压入其栈、保存栈指针到 TCB，再从下一个最高优先级任务的 TCB 取栈指针、恢复寄存器（需用汇编 `OS_CPU_PendSVHandler`）。用 PendSV 的目的是推迟切换：中断嵌套时不在 ISR 内切换，等所有 ISR 退出后再统一切换，避免中断被长时间打断（这也是\"中断里调 API → 只在退出时调度\"的原因）。\n6. 优先级反转与阻塞管理：µC/OS-III 的互斥量支持优先级继承，FreeRTOS 的 Mutex 支持继承；任务挂起/延时用链表与位图组织，使调度与查找都接近 O(1)。", "explain": "① 说明\"基于优先级的抢占式调度 + 同优先级时间片轮转\" ② 就绪表/优先级位图 O(1) 找最高优先级任务 ③ 上下文切换用 PendSV（或 SVC）+ TCB/栈指针切换 ④ 加分：时钟节拍唤醒延时任务、任务状态机、优先级继承与中断退出才统一调度。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-464", "kind": "subjective", "kind_name": "主观题", "num": 464, "stem": "对 UDS 和 NM 熟悉了解吗？（开放题，CAN 总线诊断与网络管理）", "options": [], "answer": "建议按\"是什么 → 怎么用 → 我做过什么\"结构作答：\n1. UDS（Unified Diagnostic Services，统一诊断服务，ISO 14229）：建立在 ISO 15765（CAN 上的 DoIP/DoCAN 传输层）之上的应用层诊断协议，用于 ECU 的诊断、标定、刷写、故障读取。核心是服务（SID）+ 子功能 + 参数的请求/响应模型，典型服务：\n   - 0x10 诊断会话控制（Default/Programming/Extended 会话）\n   - 0x11 ECU 复位、0x14 清除故障码\n   - 0x19 读取 DTC 信息、0x22 读数据标识符（DID）、0x2E 写 DID\n   - 0x27 安全访问（种子/密钥，刷写前置门槛）\n   - 0x31 例程控制、0x34/0x36/0x37 请求下载/传输数据/结束传输（刷写流程）\n   常见否定响应码 NRC（0x11 服务不支持、0x13 长度错误、0x22 条件不满足、0x31 请求超范围、0x33 安全访问被拒、0x78 响应挂起）。\n2. NM（Network Management，网络管理，AUTOSAR NM / OSEK NM）：管理总线上节点的协调睡眠与唤醒，避免\"某个节点一直在线\"导致整车静态电流过大。机制：节点通过周期性 NM 报文（NM PDU，通常带用户数据）表示\"我需要保持网络唤醒\"；一段时间没有唤醒请求（NM Timeout / Repeat Message State → Normal Operation → Ready Sleep → Prepare Bus Sleep → Bus Sleep）后全网一起进入睡眠；任一节点有唤醒源（本地事件或总线报文）可立即重新唤醒并广播 NM 报文使全网恢复通信。\n3. 实践要点（若做过就具体说）：①用 CAN 分析仪（CANoe/CANTest/PCAN）抓报文，按 UDS 请求/响应 + 时间参数 P2/P2* 分析；②用 0x27 安全访问 + 0x34/0x36/0x37 实现 Bootloader 刷写，配合 CRC 校验与超时重发；③NM 报文周期、超时参数与休眠条件整定，验证静态电流与唤醒时延；④用 CAPL/Python(can-isotp) 做自动化诊断脚本与回归测试。\n4. 如果了解有限：如实回答\"听过/抓过报文但没负责过完整实现\"，并说明你清楚 UDS 的会话-安全访问-刷写三层流程与 NM 的\"周期性唤醒报文 + 超时休眠\"思想——诚实且有框架的回答同样加分。", "explain": "① 说明 UDS 是应用层诊断协议（服务+子功能+NRC，如 0x10/0x19/0x22/0x27/0x34~0x37）② 说明 NM 的作用（协调睡眠与唤醒、周期性 NM 报文、超时休眠）③ 加分：结合项目说明抓包/刷写/自动化测试实践，或正确说出会话-安全访问-刷写流程。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-465", "kind": "subjective", "kind_name": "主观题", "num": 465, "stem": "\"周期事件型文件\"代表什么意思？", "options": [], "answer": "该说法常见于汽车/工业 CAN 总线与诊断测试规范语境，指的是按固定周期（Cyclic/Periodic）发送、内容表示\"事件/状态信号\"的报文或信号定义文件，即\"周期事件型报文（cyclic event message）\"：\n1. 发送机制：节点按固定周期（如 10ms/100ms）主动在总线上发送该报文，与\"变化时才发送\"的事件型（event / on-change）报文相对。周期型保证接收方有稳定的更新节拍，超时即可判为通信丢失；事件型只在信号变化时发送，可省带宽但需配合周期性的\"心跳/超时\"监控。\n2. \"事件\"含义：报文里携带的通常是事件或状态类信号——按键/开关动作、故障标志、状态机迁移、告警提示等（区别于周期性变化的连续量如车速/温度）。\n3. 工程含义（文件层面）：在 DBC/ARXML/ODX 这类描述文件里，\"周期事件型信号/报文\"由属性标明：`GenMsgCycleTime`（周期）、`GenMsgSendType`=Cyclic/Event、`GenSigStartValue` 等；测试规范会据此定义\"周期时间容差、抖动、超时判定、丢失计数\"等用例。\n4. 相关要点：①周期报文的时间参数（周期、抖动、超时、首次/快速发送 Fast Cyclic）与错误处理（超时后默认值、故障码置位）；②事件型报文的去抖（最小发送间隔 Min Delay / Repeat）避免总线风暴；③诊断与网络管理报文（NM）本身也是周期报文。\n5. 回答策略：若不确定具体出处，可先给出上述\"周期性发送的事件/状态报文\"的理解，再请面试官确认语境（是 CAN 报文调度、诊断规范还是 RTOS 任务周期），这样既展示知识框架也不冒进。", "explain": "① 解释为\"按固定周期发送、承载事件/状态信号（或事件触发后按周期重复发送）的报文/文件\" ② 与事件型（变化即发）+ 超时监控对照说明 ③ 加分：提到 DBC/CAN 的周期属性（GenMsgCycleTime/发送类型）、Fast Cyclic、超时判定与 NM 也是周期报文。", "sec": "3.4 笔试题3（MCU / CAN 综合简答，7 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-466", "kind": "subjective", "kind_name": "主观题", "num": 466, "stem": "`int i=(j=4,k=8,l=16,m=32); printf(\"%d\", i);` 输出是多少？（附加面试题·面试题5 第 1 题，5 分）", "options": [], "answer": "输出 32。括号内是一个逗号表达式：逗号运算符的规则是从左到右依次求值，整个表达式的值等于最后一个子表达式的值——依次执行 `j=4`、`k=8`、`l=16`、`m=32`，最终 `(j=4,k=8,l=16,m=32)` 的值是 `m=32`，赋给 i。要点：①逗号运算符优先级最低（比赋值还低），所以必须加括号，`int i=(…);` 与 `int i=j=4,k=8;` 完全是两回事；②左侧子表达式应有副作用（赋值/自增等），否则只是被丢弃；③若写成 `i = j=4, k=8;` 则是 `(i=j=4), k=8`，i 为 4。", "explain": "①结论 32 ②说明逗号表达式取最后一个子表达式的值、从左到右求值 ③加分：指出括号不可省/优先级最低，或右侧副作用的说明。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-467", "kind": "subjective", "kind_name": "主观题", "num": 467, "stem": "下列程序的结果是什么？为什么？（附加面试题·面试题5 第 4 题，5 分）\n#include <stdio.h>\n#define SQR(X) (X*X)\nint main(void)\n{\n    int a = 10;\n    int k = 2;\n    int m = 1;\n    a /= SQR(k+m)/SQR(k+m);\n    printf(\"%d\\n\", a);\n    return 0;\n}", "options": [], "answer": "输出 10。原因：宏是预处理阶段的文本替换，实参 `k+m` 原样代入后整个表达式变成\n`a /= (k+m*k+m)/(k+m*k+m);`\n按优先级先算乘法：`(k+m*k+m)` = 2+1*2+1 = 5（并不是 (2+1)²=9！参数代入后没有\"先加后乘\"，而是按运算符优先级重新结合），分子分母都是 5，`5/5=1`，故 `a = 10/1 = 10`。\n经典对照（面试常问的口径）：若宏写成 不带内部括号的 `#define SQR(X) X*X`，展开为 `a /= k+m*k+m/k+m*k+m;` = 2+1*2+(1/2)+1*2+1，整数除法得 (1/2)=0，结果 2+2+0+2+1=7，`10/7=1`——很多资料里的答案\"1\"来自这个变体。本题宏体带括号，答案就是 10。结论：宏参数代入后不能保证整体先算，必须给参数也加括号，正确写法是 `#define SQR(X) ((X)*(X))`（此时结果才是 10/1=10 的\"平方语义\"：9/9=1）。", "explain": "①结论 10 ②说明宏是文本替换、参数 k+m 代入后按优先级重新结合得 5/5=1 ③加分：指出正确宏写法 `((X)*(X))`，或说出\"无括号变体答案才是 1\"的对比。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-468", "kind": "subjective", "kind_name": "主观题", "num": 468, "stem": "i 最后等于多少？（附加面试题·面试题5 第 5 题，5 分）\nint i = 1;\nint j = i++;\nif ((i > j++) && (i++ == j))   i += j;", "options": [], "answer": "i 最后等于 5（此时 j 为 2）。逐步推演：\n1) `int j = i++;`：j 取 i 的原值 1，i 变为 2（j=1）。\n2) `(i > j++)`：先取 j 的值 1 参与比较，2 > 1 为真；随后 j 自增为 2。\n3) 由于 `&&` 左边为真，继续算 `(i++ == j)`：i++ 取当前值 2 与 j=2 比较，相等为真，之后 i 变为 3。\n4) `if` 成立 → `i += j` → i = 3 + 2 = 5。\n要点：①`j++`/`i++` 是\"先取值、后自增\"，在同一个表达式中自增何时生效要按\"取值—比较—生效\"顺序推；②`&&` 有短路特性（左边假则右边不执行），本题左边为真所以右边执行了。易错点：把 `(i>j++)` 当成\"j 先加再比\"会一路算错。", "explain": "①结论 5 ②推演过程（j 取自增值 1 → 自增 2；i 参与比较后 3；i+=j 得 5）③加分：提到 && 短路特性或\"先取值后自增\"的时机。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-469", "kind": "subjective", "kind_name": "主观题", "num": 469, "stem": "什么是\"引用\"？声明和使用\"引用\"要注意哪些问题？（附加面试题·面试题5 第 13 题，5 分）", "options": [], "answer": "引用（reference）是已存在对象的别名，语言层面不产生新对象，对引用的操作就是对其绑定对象的操作；一旦绑定不能改绑。声明与使用的注意点：\n①定义时必须初始化，不能有\"空引用\"；②绑定后不能改指向（给引用赋值 = 给原对象赋值）；③不存在引用的引用（`int&&` 是右值引用，含义不同）、不存在引用的数组；④不能绑定字面量/临时值这类非左值（常量引用 `const T&` 除外，但它只读）；⑤不能返回局部变量的引用（悬空引用），返回引用要确保对象生命周期足够长；⑥引用不支持指针运算，也不能为 NULL，用起来比指针安全、简洁；⑦`sizeof(引用)` 得到的是所指对象的大小，不是地址大小；⑧底层几乎都用地址实现（可理解为\"自动解引用的常量指针\"），但语言语义不同——引用不是对象，无法重新定位。", "explain": "①定义：别名、不产生新对象、必须初始化且不可改绑 ②至少说出 2 条注意点（不能为空/不能改绑/不能返回局部变量引用/不能引用字面量等）③加分：const 引用可绑临时量、sizeof 差异、与指针的对比。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-470", "kind": "subjective", "kind_name": "主观题", "num": 470, "stem": "在什么时候需要使用\"常引用\"？（附加面试题·面试题5 第 14 题，5 分）", "options": [], "answer": "常引用即 `const T&`，典型使用场景：①函数参数传大对象——用 `const 类类型&` 既避免拷贝（效率高），又保证函数内不修改实参（安全），这是 C++ 传参的默认推荐；②需要绑定临时对象/字面量时——普通引用不能绑右值，`const T&` 可以（如 `void f(const std::string& s)` 允许传 `\"abc\"` 隐式转换得到的临时 string），并延长其生命周期到引用作用域结束；③接口语义表达——告诉调用者\"我只读不写\"（如 `compare(const T& a, const T& b)`）；④拷贝构造/赋值运算符的形参必须写 `const T&`（避免无限递归拷贝、支持绑定常对象）；⑤返回引用时若调用者不该修改，也应返回 `const T&`。易错点：常引用只是\"不能通过这个名字改\"，原对象本身仍可变；`const` 引用绑定临时量延长的是该临时量的生命周期，不要把它当\"万能安全引用\"到处返回。", "explain": "①参数传递：避免拷贝 + 防误改（大声势场景）②可绑定临时值/字面量 ③加分：拷贝构造函数签名、接口语义、延长临时量生命周期等细节。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-471", "kind": "subjective", "kind_name": "主观题", "num": 471, "stem": "以下三条输出语句分别输出什么？（附加面试题·面试题5 第 17 题，5 分）\nchar str1[] = \"abc\";\nchar str2[] = \"abc\";\nconst char str3[] = \"abc\";\nconst char str4[] = \"abc\";\nconst char* str5 = \"abc\";\nconst char* str6 = \"abc\";\ncout << boolalpha << (str1==str2) << endl;   // 输出什么？\ncout << boolalpha << (str3==str4) << endl;   // 输出什么？\ncout << boolalpha << (str5==str6) << endl;   // 输出什么？", "options": [], "answer": "依次输出 false、false、true（boolalpha 会把布尔值打印成 true/false）。\n原因：①`str1`、`str2` 是两个独立的数组对象，名字在表达式中退化为各自的首地址，`str1==str2` 比较的是地址 → 不等 → false；②`str3`、`str4` 是常量数组，同样是两个独立对象，地址不同 → false（比较的是地址，不是内容；比较内容要用 `strcmp`/`std::string`）；③`str5`、`str6` 是指针，初始化时指向同一个字符串字面量 `\"abc\"`——编译器通常会把相同的字面量合并存储（同一份数据），两个指针指向同一地址 → true。注意：C++ 标准不保证相同字面量一定合并（实现可选），只是主流编译器（GCC/Clang/MSVC）都会合并；写代码时不应依赖 `str5==str6` 为 true 这个\"特性\"。", "explain": "①三个输出 false、false、true ②解释数组名比较的是地址、内容比较该用 strcmp ③指出字面量合并是常见实现行为（标准未强制）。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-472", "kind": "subjective", "kind_name": "主观题", "num": 472, "stem": "C++ 里面是不是所有的动作都是 main() 引起的？如果不是，请举例。（附加面试题·面试题5 第 19 题，5 分）", "options": [], "answer": "不是。以下动作在 main() 之前或之外发生：\n①全局/静态对象在 main() 之前构造（如全局类实例的构造函数、`std::cout` 的初始化），`main` 返回后还有全局对象析构、`atexit` 注册函数；\n②静态初始化与动态链接：加载器完成动态库装载、符号重定位，对动态库初始函数（`.init_array`/DLL 入口）的调用都与 main 无关；\n③中断/信号处理：硬件中断触发中断服务程序（ISR），信号处理函数由内核在任意时刻投递，独立于 main 的控制流；\n④其它线程：main 创建/未创建，线程都可能独立运行；线程结束后也可能仍有守护/后台线程在处理；\n⑤编译器/运行库的隐式调用：如 C++ 的异常处理、模板实例化、静态构造顺序相关的运行库初始化，以及 CRT 启动代码 `_start → __libc_start_main → main`。\n一句话：main() 是\"用户程序的入口\"，但进程真正的启动/结束流程由运行库与操作系统驱动。", "explain": "①结论：不是 ②举例：全局/静态对象的构造与析构、动态库加载/重定位、中断或信号处理、多线程、atexit 等（任举 2 个）③加分：提到 CRT 启动流程（_start→main）或析构在 main 之后。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-473", "kind": "subjective", "kind_name": "主观题", "num": 473, "stem": "请写出下列代码中各变量的大小及存储位置。（附加面试题·面试题5 第 20 题，5 分）\n#define SIZE 1024\ntypedef struct _Node {\n    struct _Node *prev;\n    struct _Node *next;\n    unsigned char buf[SIZE];\n    char a;\n    int ib;\n    short header;\n    double *p;\n    unsigned char (*buf2)[SIZE];\n    int (*fun[3])(char (*argA)(int,int), int);\n} Node;\n\nstatic double m = 2.1;\nint data = 0;\n\nint main(void)\n{\n    int *p = NULL;                       /* ①②③④ 依 32/64 位平台 */\n    p = malloc(sizeof(int));\n    char *buf = \"helloworld\";\n    static double m = 10.0;              /* 函数内静态局部变量 */\n    Node *node = (Node*)malloc(sizeof(Node));\n    char buf[10];\n    int i = 0;\n    extern int data;\n    free(p);\n    free(node);\n    return 0;\n}", "options": [], "answer": "（以 32 位平台为例；64 位下所有指针与 double 对齐变为 8 字节）\n| 变量/对象 | 大小 | 存储位置 | 说明 |\n|---|---|---|---|\n| `Node` 结构体本体 | 1064 B | 类型，不占运行内存 | 2×4(两个指针) + 1024(buf) + 1(a) + 3(填充) + 4(ib) + 2(header) + 2(填充) + 4(p) + 4(buf2) + 12(fun[3]) = 1064 |\n| `static double m = 2.1;`（文件级） | 8 B | 静态区 .data | 程序启动即存在，直到进程结束 |\n| `int data = 0;`（全局） | 4 B | 静态区（已显式初始化，通常 .data；未初始化才归 .bss） | 全程有效 |\n| `int *p = NULL;` | 指针 4 B | 指针变量在栈 | 它后来指向的内存见下 |\n| `malloc(sizeof(int))` 的内存 | 4 B | 堆 | `free(p)` 释放 |\n| `char *buf = \"helloworld\";` | 指针 4 B / 字面量 11 B | 指针变量在栈；字面量 `\"helloworld\"`（含 '\\0' 共 11 B）在只读数据段 .rodata | 字面量不可修改 |\n| `static double m = 10.0;`（函数内） | 8 B | 静态区 .data（不是栈！） | 只初始化一次，生命周期到程序结束，作用域限于本函数 |\n| `Node *node = (Node*)malloc(sizeof(Node));` | 指针 4 B / 节点 1064 B | 指针在栈；节点本体在堆 | `free(node)` 释放 |\n| `char buf[10];` | 10 B | 栈 | 局部数组 |\n| `int i = 0;` | 4 B | 栈 | — |\n| `extern int data;`（函数内声明） | — | 仍是全局静态区 | extern 只是声明，不新分配空间 |\n存储区总结：栈——局部/自动变量、函数参数；堆——malloc/new 的动态内存；静态区 .data/.bss——全局变量、文件级 static、函数内 static；只读段——字符串字面量等常量。\n⚠️ 原代码两处笔误（答题时可顺带指出）：① 宏定义为 `#define size 1024`（小写）但结构体里用的是 `buf[SIZE]`（大写），大小写不一致会编不过；② `main` 中先 `char *buf = \"helloworld\";` 后又 `char buf[10];`，同名重复定义，也是编译错误（应改为 `buf10` 或先注释其一）。", "explain": "①四类存储区（栈/堆/静态区/只读段）判断正确 ②函数内 static 变量在静态区、只初始化一次 ③指针变量本身在栈、所指内存在堆 ④加分：sizeof(Node)=1064 的计算或 64 位差异，或指出原代码的两处笔误。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-474", "kind": "subjective", "kind_name": "主观题", "num": 474, "stem": "假设 `ch='B'`，则表达式 `ch=(ch>='A' && ch<='Z')?(ch+12):ch` 的值是？（附加面试题·面试题6 第 8 题）", "options": [], "answer": "值为 'N'。'B' 的 ASCII 码是 66，条件 `ch>='A' && ch<='Z'` 成立（B 是大写字母，65≤66≤90），执行 `ch+12`：66+12=78，78 对应大写字母 'N'（'A'=65，N 是第 14 个字母：65+13=78 ✓）。要点：①字符参与算术按 ASCII 码（或平台字符集）计算，加完再按字符解释；②三目运算符 `条件?表达式1:表达式2` 中只有被选中的分支求值；③\"字母加密/凯撒位移\"类题常用这一写法。易错点：把 'B'+12 当字符串拼接；或忘记 'A' 是 65。", "explain": "①结果 'N' ②说明 'B'=66、66+12=78='N' ③加分：提到三目只求值选中分支或字符按 ASCII 参与运算。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-475", "kind": "subjective", "kind_name": "主观题", "num": 475, "stem": "下面程序的输出结果是？（附加面试题·面试题6 第 9 题）\n#include <stdio.h>\n#define M(x, y) x>y?x:y\n#define N(x, y) (x)*y\nvoid main(void)\n{\n    int a=3, b=4, c=5, d=6, e;\n    e = N(a++, b+M(c, d));\n    printf(\"%d\", e);\n}", "options": [], "answer": "输出 5（执行完后 a=4）。展开推演：\n`e = N(a++, b+M(c,d));` → `(a++)*b+M(c,d)` → `(a++)*b+c>d?c:d`\n按优先级/结合性：`(a++)*b` 先算（a++ 取值 3，a 变 4）得 12；`12 + c` = 17；`17 > d(6)` 为真 → 取 `c`= 5 赋给 e。\n关键点：①`N` 的宏体 `(x)*y` 只给 x 加了括号，参数 `b+M(c,d)` 代入后没有括号保护，导致 `M` 展开的 `c>d?c:d` 参与了与外层 `+`、`>` 的重新结合；②运算符优先级：`*` > `+` > `>` > `?:`，所以是 `((a++)*b+c) > d ? c : d`；③宏参数 `a++` 只出现一次，副作用仅一次。正确写法应给每个参数和整体都加括号：`#define N(x,y) ((x)*(y))`、`#define M(x,y) ((x)>(y)?(x):(y))`——那时结果会变成 3*(4+6)=30。", "explain": "①输出 5 ②展开式与优先级推演（(a++)*b+c>d?c:d）③加分：指出宏参数未加括号是根因、给出正确宏写法（结果会不同）。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-476", "kind": "subjective", "kind_name": "主观题", "num": 476, "stem": "下面程序的输出结果是？（附加面试题·面试题6 第 10 题）\nchar *s = \"abcde\";\ns += 2;\nprintf(s);", "options": [], "answer": "输出 cde。`s` 是字符指针，初始指向字面量 `\"abcde\"` 的首字符 'a'；`s += 2` 让指针前移 2 个字节（每个 char 1 字节），指向 'c'；`printf(s)`（以 s 作为格式串）从 'c' 开始打印直到 `'\\0'`，得到 `cde`。要点与风险：①`printf(s)` 用变量当格式串不是好习惯——若字符串里含 `%d` 等格式符会按格式解析（本题 \"cde\" 无 %，恰好安全），规范写法 `printf(\"%s\", s)`；②\"abcde\" 是字符串字面量，位于只读段，`*s = 'x'` 之类的写操作会崩溃；③指针运算以所指类型为单位，char 指针 +2 就是 +2 字节。", "explain": "①输出 cde ②说明指针+2 的字节含义、从 'c' 打印到 '\\0' ③加分：指出 printf(s) 的格式串风险或字面量只读。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-477", "kind": "subjective", "kind_name": "主观题", "num": 477, "stem": "下面程序的输出结果是？（附加面试题·面试题6 第 11 题，两空）\nfloat num1 = 1.8495;\nunsigned long num2 = 32;\nprintf(\"%.2f, %4ld%%\\n\", num1, num2);   /* 两个空：____  ____ */", "options": [], "answer": "第一空 1.85，第二空 `  32%`（32 前有两个空格、结尾一个百分号）。完整输出为：`1.85,   32%`\n解析：①`%.2f` 保留两位小数——1.8495 存为 float 时实际约为 1.84949994，第三位小数是 9，四舍五入到两位得 1.85；②`%4ld` 按最小宽度 4 打印长整型 32：数字占 2 位，左边补 2 个空格 → `  32`（默认右对齐）；③`%%` 输出一个普通的 `%` 字符。注意点：`%4ld` 里的 `4` 是宽度不是精度；想左对齐用 `%-4ld`；float 直接拿来比较/格式化要注意二进制表示误差（本题正好进位到 1.85）。", "explain": "①1.85 ②\"  32%\"（宽度 4 右对齐 + %% 输出 %）③加分：说明 %.2f 是四舍五入到两位、%4ld 的宽度含义。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-478", "kind": "subjective", "kind_name": "主观题", "num": 478, "stem": "下面程序的输出结果是？（附加面试题·面试题6 第 12 题，四空，每空 2 分）\nclass Father {\npublic:\n    virtual void foo() { cout << \"M\" << endl; }\n    void fun()          { cout << \"S\" << endl; }\n};\nclass Child : public Father {\npublic:\n    void foo() { cout << \"T\" << endl; }\n    void fun() { cout << \"R\" << endl; }\n};\nint main(void)\n{\n    Father fa;\n    Child ch;\n    Father *pfa = &fa;\n    pfa->foo();\n    pfa->fun();\n    pfa = &ch;\n    pfa->foo();\n    pfa->fun();\n}", "options": [], "answer": "依次输出 M、S、T、S。分析：\n1) `pfa = &fa; pfa->foo();` → 实际对象是 Father，虚函数走 Father 版本 → M；\n2) `pfa->fun();` → fun 不是虚函数，静态绑定（按指针的静态类型 Father 调用）→ S；\n3) `pfa = &ch;` 基类指针指向派生类对象；`pfa->foo();` → foo 是虚函数，动态绑定，实际对象 Child → 调用 Child::foo → T；\n4) `pfa->fun();` → fun 非虚，仍按静态类型 Father 调用 → S（不是 R！）。\n考点：只有被声明为 virtual 且通过指针/引用调用时才发生运行时多态；非虚函数（fun）由指针的静态类型决定，派生类同名函数只是隐藏了基类版本。补充：若基类析构不是虚函数，delete pfa 也存在同样问题；同名非虚函数建议加 `override` 检查或避免与基类同名。", "explain": "①四个输出 M、S、T、S ②解释虚函数动态绑定、非虚函数静态绑定 ③加分：指出 Child::fun 只是隐藏、或提到虚析构的必要性。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-479", "kind": "subjective", "kind_name": "主观题", "num": 479, "stem": "C++ 面向对象的三大特点分别是封装、继承、多态，其中多态分为 编译时多态 和 运行时多态 两种类型，分别通过 ______、______ ______ 实现。（附加面试题·面试题6 第 13 题，每空 1 分）", "options": [], "answer": "编译时多态（静态多态）通过 函数重载 / 运算符重载 / 模板 实现；运行时多态（动态多态）通过 继承 + 虚函数（+ 基类指针/引用调用，即动态绑定） 实现。\n要点：①编译时多态在编译期就能确定调用哪个函数（重载解析、模板实例化）；②运行时多态依赖虚函数表 vtable，在运行期根据对象的动态类型找到实际函数——必要条件：基类中声明虚函数、派生类覆盖（override）、通过基类指针或引用调用；③若目标对象是\"直接对象\"（`Father f = ch;` 切片）或直接按值调用，多态不生效。易错点：把\"函数重载\"当成运行时多态；忘记运行时多态三要素（虚函数、指针/引用、覆盖）。", "explain": "①编译时：函数重载（或运算符重载/模板）②运行时：虚函数（+继承/动态绑定）③加分：说出多态生效的三个条件或 vtable 机制。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-480", "kind": "subjective", "kind_name": "主观题", "num": 480, "stem": "下列是在具有头结点单向链表中删除第 i 个结点，请在空格内填上适当的语句。（附加面试题·面试题6 第 14 题，每空 2 分）\nint delete(NODE *head, int i)\n{\n    NODE *p, *q;\n    int j;\n    q = head;\n    j = 0;\n    while((q != NULL) && (j < i-1)) { q = q->next; j++; }\n    if(q == NULL)\n        return (0);\n    (1) ____________;          /* 横线一 */\n    (2) q->next = p; ____;     /* 横线二：补全该语句 */\n    free(p);\n    return (1);\n}", "options": [], "answer": "横线(1)填 `p = q->next;`；横线(2)处补 `->next`，使整句成为 `q->next = p->next;`（即把待删结点 p 从链上\"绕过\"）。\n推演：q 从带头结点的表头出发，循环结束时指向第 i-1 个结点（前驱）；要删的结点是 `q->next`，先存到 p（横线 1），再让前驱跨过它指向 p 的后继（横线 2），最后 `free(p)` 释放。注意点：①有头结点时删除第 1 个元素也无需改 head（头结点永远在），所以与\"无头结点删除\"不同；②直接 `q->next = p->next` 与\"先保存 p、再改链\"的顺序不能反，否则会丢失后继；③题面横线的排版有歧义（`q->next = p;` 之后另起横线），按标准删除逻辑作答为 `q->next = p->next;`，若判卷要求\"横线处只写 `->next`\"也能对应；④工程实现应同时判空（`p == NULL` 说明 i 越界）并考虑内存池/heap 的差异。", "explain": "①(1) p = q->next ②(2) 使语句成为 q->next = p->next（写 ->next 或整句均可）③加分：指出 q 是前驱、删完需 free、i 越界要判空。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-481", "kind": "subjective", "kind_name": "主观题", "num": 481, "stem": "有一牧场，已知养牛 27 头，6 天把草吃尽；养牛 23 头，9 天把草吃尽。如果养牛 21 头，那么 ___ 天能把牧场上的草吃尽呢？并且牧场上的草是不断生长的。（附加面试题·面试题6 第 15 题）", "options": [], "answer": "12 天。设：初始草量为 S，每天新长草量为 g（单位：头·天的口粮），每头牛每天吃 1 份。由\"吃尽\"条件：\n① 27×6 = 162 = S + 6g；\n② 23×9 = 207 = S + 9g；\n两式相减：45 = 3g → g = 15，代回得 S = 162 − 90 = 72。\n养 21 头牛，吃 T 天：21T = S + gT = 72 + 15T → 6T = 72 → T = 12 天。\n要点：牛吃草问题的通法——总消耗 = 原有草 + 每天生长×天数；先消元求出\"每日生长量\"和\"原有草量\"，再代入求解。易错点：直接按\"牛数×天数成反比\"算（忽略草在生长），或把 g 与牛数混淆。", "explain": "①列式 S+6g=162、S+9g=207 ②解得 g=15、S=72 ③代入 21T=72+15T 得 T=12 天。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-482", "kind": "subjective", "kind_name": "主观题", "num": 482, "stem": "下列给定程序中函数 fun 的功能是：计算函数 F(x,y,z)=(x+y)/(x−y)+(z+y)/(z−y) 的值。其中 x 和 y 的值不相等，z 和 y 的值不相等。例如，当 x=9，y=11，z=15 时，函数值为 −3.50。以上程序的错误是？（附加面试题·面试题6 第 16 题）\n01  #include <stdio.h>\n02  #include <math.h>\n03  #include <stdlib.h>\n04  #define FUN(m, n) ((m/n))\n05  float fun(float a, float b, float c)\n06  {\n07      float value;\n08      value = FUN(a+b, a-b)+FUN(c+b, c-b);\n09      Return (Value);\n10  }\n11  void main(void)\n12  {\n13      float x, y, z, sum;\n14      printf(\"Input  x  y  z: \");\n15      scanf(\"%f%f%f\", &x, &y, &z);\n16      printf(\"x=%f, y=%f, z=%f\\n\", x, y, z);\n17      if(x==y && y==z)\n18      {\n19          printf(\"Data error!\\n\");\n20          exit(0);\n21      }\n22      sum = fun(x, y, z);\n23      printf(\"The result is: %5.2f\\n\", sum);\n24  }", "options": [], "answer": "主要有 3 处错误：\n① 第 04 行宏参数未加括号：`#define FUN(m, n) ((m/n))` 中 `m`、`n` 代入的是表达式 `a+b`、`a-b`，展开后变成 `((a+b/a-b))`——按优先级算成 `a + b/a − b`，与要求的 `(a+b)/(a−b)` 不符。应改为 `#define FUN(m, n) ((m)/(n))`。\n② 第 09 行关键字与变量名大小写错误：`Return (Value);` 应为 `return (value);`——C 语言区分大小写，`Return` 不是关键字，`Value` 也是未定义标识符，编译直接报错。\n③ 第 17 行的数据校验条件不完整：题目要求 x≠y 且 z≠y，只要 `x==y` 或 `z==y` 就会让分母为 0，所以条件应为 `if(x==y || z==y)`，原写法 `x==y && y==z` 只在两者同时成立时才报错，漏检大量非法输入（运行时会除零得到 inf/nan）。\n其他可提及点：`main` 的标准写法应为 `int main(void)` 并 return 0；`math.h` 未使用；`printf/sum` 的类型匹配但 float 打印建议 `%f` 用 double 提升即可。", "explain": "①宏参数缺括号（应 ((m)/(n))）②Return/Value 大小写（应为 return (value)）③校验条件应为 x==y||z==y ④加分：提到 main 标准写法或除零后果。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-483", "kind": "subjective", "kind_name": "主观题", "num": 483, "stem": "以上程序（选择排序算法）的错误是？（附加面试题·面试题6 第 17 题）\n01  void selectionSort(int *a, int size)\n02  {\n03      int min_inex, min_value, i, j, temp;\n04      for(i=0; i<size - 1; i++)\n05      {\n06          min_index = i;\n07          min_value = a[i];\n08          for(j=i+1; j<size; j--)\n09          {\n10              if(min_value < a[j])\n11              {\n12                  min_value = a[j];\n13                  min_index = j;\n14              }\n15          }\n16          if(i != min_index)\n17          {\n18              temp = a[i];\n19              a[i] = a[min_inex];\n20              a[min_index] = temp;\n21          }\n22      }\n23  }", "options": [], "answer": "有 3 处错误（对应选择排序\"每轮选最小、放到已排序区末尾\"的思想）：\n① 第 08 行循环变量方向反了：`for(j=i+1; j<size; j--)` 应为 `j++`。j 递减会让循环永不终止并越界访问 `a[负数]`，程序直接崩溃/未定义行为。\n② 第 10 行比较方向反了：要找最小元素，应为 `if(min_value > a[j])`。原写法 `min_value < a[j]` 实际选出了最大值，排序结果变成降序（与函数名/题意不符）。\n③ 第 19 行标识符拼写错误：`a[i] = a[min_inex];` 中 `min_inex` 未定义（第 03 行声明的是 `min_inex`，第 06 行又是 `min_index`），属编译错误，应变更为 `min_index`，同时第 03 行的声明也要改正。\n补充说明：修好拼写后逻辑为——外层控制已排序区边界，内层找未排序区间最小值下标，若不在 i 处则与 a[i] 交换；注意第 03 行声明处与第 06 行必须统一命名。", "explain": "①j-- 应为 j++（死循环/越界）②`<` 应为 `>`（求最小值）③min_inex 拼写错误应统一为 min_index ④加分：说明修正后算法的行为（升序、O(n²)、不稳定）。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-484", "kind": "subjective", "kind_name": "主观题", "num": 484, "stem": "一辆卡车违反交通规则，撞人后逃跑。现场有三人目击事件，但都没有记住车号，只记下车号的一些特征。甲说：牌照的前两位数字是相同的；乙说：牌照的后两位数字是相同的，但与前两位不同；丙是数学家，他说：四位的车号刚好是一个整数的平方。请根据以上线索找出车号。（附加面试题·面试题6 第 18 题，10 分）", "options": [], "answer": "车号是 7744（即前两位 7、7，后两位 4、4；验证 7744 = 88²）。\n推理过程：设车牌为 `aabb`（a≠b，a 取 1~9，b 取 0~9），数值 N = 1100a + 11b = 11×(100a + b)。因为 N 是完全平方数且含有因子 11，故 N 必须能被 11² 整除 → 100a + b 需再被 11 整除（100a+b ≡ a+b (mod 11)，即要求 a+b 是 11 的倍数）。枚举 a=1~9、b=0~9 且 a≠b：\n- a+b=11 的候选：(2,9)=2299、(3,8)=3388、(4,7)=4477、(5,6)=5566、(6,5)=6655、(7,4)=7744、(8,3)=8833、(9,2)=9922，以及 (1,10) 非法。\n逐一开平方检查：√2299≈47.9、√3388≈58.2、√4477≈66.9、√5566≈74.6、√6655≈81.6、√7744=88 ✓、√8833≈94.0、√9922≈99.6 —— 只有 7744 是完全平方数。\n结论：车号为 7744。", "explain": "①结果 7744 ②设 aabb 并推出\"a+b=11 的倍数\"的推理 ③列出候选并验证平方数 ④加分：说明 11 的整除性质（11 与 11²）或编程枚举思路。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-485", "kind": "subjective", "kind_name": "主观题", "num": 485, "stem": "纯虚函数有什么作用？如何实现？（附加面试题·面试题7 第 7 题）", "options": [], "answer": "作用：①定义接口/规范——在抽象基类中声明\"必须由派生类实现的函数\"，明确继承者契约；②禁止基类被实例化（含纯虚函数的类是抽象类，不能创建对象），强制使用者通过派生类使用；③为运行时多态提供统一入口（基类指针调用时动态绑定到各派生类实现），并便于在基类中先写好通用流程（模板方法模式）。\n实现方式：`virtual 返回类型 函数名(参数) = 0;`（虚函数声明后加 `= 0`）。\n要点：①含纯虚函数的类为抽象类，抽象类可以有数据成员和普通成员函数，其构造函数可以被子类调用；②必须被派生类覆盖，否则派生类仍是抽象类、不能实例化；③纯虚函数可以给出函数体（`= 0` 后仍可定义），派生类可用 `Base::f()` 显式调用基类版本；④抽象类作为指针/引用使用没有限制；⑤析构函数常声明为虚（保证 delete 基类指针时正确析构）；⑥把接口类设计成\"纯虚函数 + 虚析构\"是 C++ 面向接口编程的常规做法（也可用纯虚析构）。", "explain": "①作用：定义接口契约、禁止基类实例化、支撑多态 ②写法：`virtual ... = 0;` ③派生类必须覆盖否则仍为抽象类 ④加分：纯虚函数可带实现、接口类配虚析构、模板方法等应用。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-486", "kind": "subjective", "kind_name": "主观题", "num": 486, "stem": "什么情况下用 vector，什么情况下用 list？（附加面试题·面试题7 第 8 题）", "options": [], "answer": "vector 是连续内存的动态数组，list 是双向链表（每个元素单独分配节点）。选用依据：\n①频繁随机访问（下标 `v[i]`）：用 vector —— O(1) 随机访问，CPU 缓存友好（连续内存、预取友好）；list 随机访问需 O(n) 遍历，且每个节点单独分配、缓存不友好。\n②频繁在中间插入/删除：用 list —— 已知位置的插入/删除是 O(1)（只改指针），vector 在中间插入/删除要搬移后续元素（O(n)），还可能触发扩容/重新分配。\n③内存与开销：vector 每元素无额外开销、但扩容时会成倍申请并搬移（可 `reserve` 预留）；list 每个节点额外两个指针 + 独立分配（碎片/分配开销大）。\n④尾部操作：只在尾部增删 → vector 的 push_back/pop_back 均摊 O(1)，首选 vector（最常用的默认容器就是 vector，甚至 `std::deque` 用于两端操作）。\n⑤迭代器与稳定性：vector 扩容后所有迭代器/引用失效；list 插入删除只影响被删元素，其它迭代器保持有效（适合需要稳定引用的场景）。常见结论：\"默认用 vector；只有明确的中间插删热点、且不需随机访问时才考虑 list\"；需要两端操作考虑 deque；要按序且频繁插删也可用 `std::set/map` 等。", "explain": "①vector：随机访问 O(1)、缓存友好、中间插删 O(n) ②list：中间插删 O(1)、随机访问 O(n)、节点开销大 ③给出选型结论（默认 vector）④加分：迭代器失效规则、reserve、deque 等延伸。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-487", "kind": "subjective", "kind_name": "主观题", "num": 487, "stem": "请解释以下内容。（附加面试题·面试题7 第 11 题，高难度）\nvoid *(*(fp1)(int))[10];   /* 原卷排印为 void *(*（fp1)(int))[10]，括号为全角，按此理解 */\nfloat (*(*fp2)(int, int, float))(int);\ntypedef double (*(*(*fp3)())[10])();\nfp3 a;\nint (*(*f4)())[10]();", "options": [], "answer": "逐条按\"从内到外、右左法则\"解读：\n① `void *(*(fp1)(int))[10];` —— fp1 是一个函数（参数 int），返回值为\"指向含 10 个 `void*` 元素的数组的指针\"。解析顺序：fp1(int) → 函数；`*` → 返回指针；`[10]` → 指向数组；元素类型 `void*`。（说明：本题按题面写法就是这么解析的；经典教材版本多一个 `*` 写成 `void *(*(*fp1)(int))[10];`，含义变为\"指向函数的指针（函数参数 int、返回指向 10 个 void* 数组的指针）\"——只差一个星号，答题时可顺带说明。）\n② `float (*(*fp2)(int, int, float))(int);` —— fp2 是一个指针，指向函数（参数 `int,int,float`），该函数返回一个函数指针，这个被返回的指针指向\"参数 int、返回 float\"的函数。\n③ `typedef double (*(*(*fp3)())[10])();` + `fp3 a;` —— 定义类型 fp3：a 是一个指针，指向\"无参数的函数\"，该函数返回\"指向含 10 个元素数组的指针\"，数组的每个元素是\"无参数、返回 double 的函数指针\"。（记忆法：一层层剥：a → 指针 → 函数() → 数组[10] → 指针 → 函数() → double。）\n④ `int (*(*f4)())[10]();` —— 该写法本身编译不过：GCC 报 `declaration of 'f4' as array of functions`（数组元素不能是函数）。按经典答案的意图应写成 `int (*(*f4())[10])();`——f4 是一个函数（无参数），返回\"指向含 10 个元素数组的指针\"，元素是\"无参数、返回 int 的函数指针\"。答题时建议：先按题面解读并指出该行不合法，再给出修正后的含义，这样既严谨又不丢分。\n总结技巧：读复杂声明用右左法则——从标识符出发，先往右（`()` 函数、`[]` 数组），再往左（`*` 指针），遇括号就跳出去。", "explain": "①fp1：函数(int) → 返回指向 10 个 void* 数组的指针（或说明经典同题多一个 * 的含义）②fp2：指向函数(int,int,float)的指针，返回\"指向函数(int)→float 的指针\" ③a：指向无参函数的指针，返回指向 10 元素数组的指针，元素是 double(*)() ④f4：指出题面写法非法、按经典意图解释（无参函数返回指向 10 个 int(*)() 数组的指针）⑤加分：说出\"右左法则\"。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-488", "kind": "subjective", "kind_name": "主观题", "num": 488, "stem": "取得当前时间的方法有哪些，说明优缺点。（附加面试题·面试题7 第 13 题，中等难度）", "options": [], "answer": "常用几类方法及优缺点：\n① C 标准库 `time()/localtime()/strftime()`（`<time.h>`）：跨平台、简单，精度秒级；适合日志时间戳、界面显示；缺点是时区/夏令时处理依赖环境，`localtime`/`gmtime` 返回静态缓冲（非线程安全，多线程用 `localtime_r`）。\n② `clock()`：返回进程消耗的 CPU 时间（不是墙钟时间），适合测算法 CPU 耗时；不适合取\"当前时刻\"。\n③ POSIX `gettimeofday()`：微秒级墙钟时间，Linux/Unix 常用；受系统时间调整影响，且不是单调时钟——测耗时可能因 NTP 校时\"倒退\"。\n④ POSIX `clock_gettime(CLOCK_REALTIME / CLOCK_MONOTONIC / CLOCK_MONOTONIC_RAW)`：纳秒级，`CLOCK_MONOTONIC` 是单调时钟（不受校时影响），是测耗时/定时的首选；实时时间用 `CLOCK_REALTIME`。\n⑤ C++11 `std::chrono::system_clock / steady_clock`：类型安全、跨平台，`steady_clock` 单调、适合计时，`system_clock` 可转 `time_t` 供显示；需要 C++11 及以上。\n⑥ Windows `GetSystemTime/GetTickCount64/QueryPerformanceCounter`：`GetTickCount64` 毫秒级系统运行时间，`QueryPerformanceCounter` 高精度计时；注意平台可移植性差。\n⑦ 嵌入式：SysTick/定时器计数器（如 HAL_GetTick、TIM 计数）做毫秒/微秒计时；RTC 提供掉电保持的日历时间。\n选型建议：记录\"时刻\"用 system_clock/localtime；测量\"时长\"用单调时钟（chrono::steady_clock / CLOCK_MONOTONIC / HAL_GetTick），避免系统时间被调整导致测量出错。", "explain": "①至少答出 2~3 种（time/localtime、gettimeofday、chrono、clock_gettime、系统 API、嵌入式 RTC/SysTick）②说明精度级别的差异 ③加分：区分\"实时时钟 vs 单调时钟\"、测耗时避免用 wall clock、线程安全（localtime_r）。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-489", "kind": "subjective", "kind_name": "主观题", "num": 489, "stem": "简要描述中断和异常的区别。（附加面试题·面试题7 第 15 题）", "options": [], "answer": "二者都会让 CPU 暂停当前执行流、保存现场并跳转到处理程序（都可用统一的中断向量/门机制），区别主要在来源、同步性与处理时机：\n① 来源：中断（interrupt）来自处理器外部的异步事件——外设（定时器、串口、GPIO、DMA 等）在任意时刻发请求，与当前指令无因果关系；异常（exception）由当前正在执行的指令引起，是同步的——如除零、非法指令、访问权限错误、缺页、系统调用（软中断）、断点等。\n② 触发时机：中断可在指令之间被采样响应（异步到达）；异常一定在某条指令执行时产生，与指令对应。\n③ 处理与返回：中断处理完成后一般返回被中断的指令继续执行（有时会有延迟指令）；异常可能无法直接返回——如除零/段错误属故障类，有的可修复（缺页异常修好页表后重试同一条指令），有的必须终止进程（不可恢复的致命异常）；系统调用（陷入 trap）则返回下一条指令。\n④ 分类：异常通常分故障 fault（可重试）、陷阱 trap（如 int3/系统调用，返回下一条指令）、终止 abort（不可恢复）；中断分可屏蔽/不可屏蔽、软/硬中断等。\n⑤ 嵌入式视角：Cortex-M 里 FRQ 把\"外部中断\"（IRQn）与\"系统异常\"（如 HardFault、SVC、SysTick）统一编址，但语义上仍按上述区分。", "explain": "①来源：中断=外部异步事件，异常=指令执行引起的同步事件 ②举例：中断=定时器/串口；异常=除零/缺页/非法指令/系统调用 ③加分：返回行为差异（返回原指令/下一条/终止）、异常三分类（fault/trap/abort）。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-490", "kind": "subjective", "kind_name": "主观题", "num": 490, "stem": "在 32 位系统的机器上，下面数据类型的指针变量占多少位？（附加面试题·面试题7 第 16 题，两空）\nchar *pszChar = NULL;\nint  *pInt = NULL;", "options": [], "answer": "两个都占 32 位（4 字节）。指针变量的大小只取决于系统的地址空间宽度（字长），与所指类型无关——32 位机器上地址是 32 位，因此 `char*`、`int*`、`void*`、函数指针（多数平台）都是 4 字节；64 位机器上则是 8 字节。易错点：①以为 `char*` 是 1 字节（那是所指对象 'a' 的大小，`sizeof(*pszChar)` 才等于 1）；②误以为 `int*` 是 4 字节而 char* 是 1 字节；③\"指针大小与机器有关，与类型无关\"是常考结论（sizeof(char*) 在 64 位上位 8）。", "explain": "①两个都是 32 位/4 字节 ②说明指针大小只由地址空间（字长）决定、与所指类型无关 ③加分：举 64 位平台为 8 字节的对照。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-491", "kind": "subjective", "kind_name": "主观题", "num": 491, "stem": "简要描述 C++ 的 new 操作符与 C 的 malloc 的区别（并说明 new/delete 与 malloc/free 的关系）。（附加面试题·面试题7 第 9 题、第 18 题 + 面试题5 第 12 题，三题合并）", "options": [], "answer": "区别（\"分配 + 构造\" vs \"只分配一段原始内存\"）：\n① 本质：`new` 是运算符（语言内置，可重载 `operator new`），会调用构造函数完成对象初始化；`malloc` 是库函数，只从堆上划出指定字节的原始内存、不调用构造函数、不初始化。\n② 类型安全与用法：`new` 直接返回具体类型指针（`Node* p = new Node;`），自动按类型算大小；`malloc` 返回 `void*`，需要显式强转与 `sizeof` 计算（C 中不需强转，C++ 中必须）。\n③ 失败行为：`new` 分配失败抛 `std::bad_alloc`（或用 `nothrow` 版返回 0）；`malloc` 失败返回 `NULL`，必须判空。\n④ 释放配对：`new` 配 `delete`、`new[]` 配 `delete[]`（会调用析构函数）；`malloc` 配 `free`（只还内存，不调析构）。混用是未定义行为（`free(new 出来的)` / `delete malloc 出来的` 都可能崩溃）。\n⑤ 构造/析构：`new` 先分配内存再调构造函数，`delete` 先调析构再释放内存——这是 C++ 对象生命周期管理的核心，`malloc/free` 做不到（对象里的资源如文件句柄/内存块不会被自动释放）。\n⑥ 细节：`new` 内存不足时可重载处理、`new` 可与构造函数异常配合自动回收内存；`malloc` 可与 `realloc/calloc` 配合，适合 C 代码与 POD 数据。\n关系：`new/delete` 的底层通常就是用 `malloc/free` 实现的（`operator new` 默认调用 `malloc`），它们是\"内存分配（malloc/free）与\"对象构造/析构（new/delete）两个层面的功能\"；在 C++ 里对象一律用 new/delete，只有需要原始字节缓冲、与 C 接口交互时才用 malloc/free。补充：C++ 中还有 `std::allocator`、智能指针（unique_ptr/shared_ptr）管理生命周期。", "explain": "①new 是运算符/会调构造函数/返回具体类型/失败抛异常；malloc 是函数/只分配原始内存/返回 void*/失败返回 NULL ②delete 调析构、free 不调；必须配对使用不能混用 ③关系：new 底层常基于 malloc，二者是\"构造 + 分配\"两个层面 ④加分：智能指针、nothrow、realloc 等延伸。", "sec": "3.5 面试题5 / 面试题6 / 面试题7（C/C++ 综合，26 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}];
/* 错误可视化：不遮挡任何操作按钮（顶部横条，可关闭、自动消失） */
function showErrBox(msg, ln){
  try{
    var d=document.getElementById("__errbox");
    if(!d){
      d=document.createElement("div"); d.id="__errbox";
      d.style.cssText="position:fixed;left:0;right:0;top:0;background:#c62828;color:#fff;font-size:12px;line-height:1.6;padding:8px 34px 8px 10px;z-index:999";
      var x=document.createElement("span");
      x.textContent="✕";
      x.style.cssText="position:absolute;right:6px;top:6px;font-size:14px;cursor:pointer;padding:2px 8px;";
      x.onclick=function(){ if(d.parentNode)d.parentNode.removeChild(d); };
      d.appendChild(x);
      var t=document.createElement("span"); t.id="__errtext";
      d.appendChild(t);
      document.body.appendChild(d);
      setTimeout(function(){ try{ if(d.parentNode)d.parentNode.removeChild(d); }catch(_){} }, 12000);
    }
    var brief=String(msg||"");
    document.getElementById("__errtext").textContent = (brief.indexOf("Script error")>=0)
      ? "ℹ️ 检测到环境脚本提示（浏览器隐藏了详情，一般是微信/QQ 浏览器自身的提示，不影响使用）"
      : ("⚠ 页面提示："+brief+"（行 "+(ln||"?")+"）");
  }catch(e){}
}
window.onerror=function(msg,src,ln){
  try{
    var brief=String(msg||"");
    if(brief.indexOf("Script error")>=0){
      /* 脱敏错误：延迟检查——页面正常加载完成则忽略（环境注入脚本的噪音） */
      setTimeout(function(){ if(!window.__appReady) showErrBox(brief, ln); }, 700);
    }else{
      showErrBox(brief, ln);
    }
  }catch(e){}
};
/* 防呆：直接打开模板（未嵌入题库）时给出明确提示 */
if (typeof BANK === "undefined" || !Array.isArray(BANK) || !BANK.length) {
  document.body.innerHTML = '<div style="padding:48px 22px;text-align:center;font-family:sans-serif;font-size:15px;line-height:2">⚠️ 题库未加载<br>当前打开的可能是有“模板”文件（template.html）。<br>请打开同目录下的 <b>index.html</b><br>（或根目录的「面试刷题-主观题.html」）。</div>';
  throw new Error("BANK missing: 请打开 index.html");
}
const LS_KEY="interview_sub_v1";
const EXAM_NUM=10, EXAM_MIN=40;
let mode="顺序", idx=0, revealed=false, saveTimer=null, statTimer=null;
let queue=BANK.slice();               // 当前视图列表（顺序/收藏）
let seqSavedIdx=null;                 // 顺序板块本次会话中的位置（切板块返回时恢复）
let exam=null, examLeft=0, examTimer=null;
let progress=load();

function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(progress))}catch(e){} }
function rec(qid){ return progress[qid]||(progress[qid]={wrote:"",revealed:false}) }
function $(s){return document.querySelector(s)}
function forEachNode(nodes, fn){ for(var i=0;i<nodes.length;i++) fn(nodes[i], i); }
function toggleCls(el, cls, force){ if(force) el.classList.add(cls); else el.classList.remove(cls); }
function byId(qid){ for(var i=0;i<BANK.length;i++){ if(BANK[i].id===qid) return BANK[i]; } return null; }
function isAnswered(it){ return !!String((progress[it.id]||{}).wrote||"").trim(); }
/* ---------- 进度记忆 ----------
   记忆位置 = "连续完成题目的最后一题"：做了 1、2、3、4，跳过 5 又做了 6、7、8 → 回到第 4 题。
   一道题算完成：有作答内容 或 已查看过参考答案。 */
function isDone(it){ const r=progress[it.id]||{}; return !!String(r.wrote||"").trim() || !!r.revealed; }
function resumeIndex(){
  let last=-1;
  for(let i=0;i<BANK.length;i++){ if(isDone(BANK[i])) last=i; else break; }
  if(last>=0) return last;
  return Math.min(progress._last||0, Math.max(0,BANK.length-1));   // 尚未连续做题时回到上次浏览处
}
function pad2(n){ n=String(n); return n.length<2?"0"+n:n; }
function fmt(sec){ return pad2(Math.floor(sec/60))+":"+pad2(sec%60); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;} return r; }
function wrapCn(s, lim){ return String(s||""); }

/* ---------- 模式切换 ---------- */
function favList(){
  var f=progress._favs; if(!Array.isArray(f)) return [];
  return f.map(byId).filter(function(x){ return !!x; });
}
function isFav(id){ var f=progress._favs; return Array.isArray(f) && f.indexOf(id)>=0; }
function setMode(m){
  if(mode==="考试" && exam && exam.active && !exam.finished){ msg("考试中","考试进行中，不能切换到其他板块！"); return; }
  if(mode==="顺序" && m!=="顺序") seqSavedIdx=idx;      // 离开顺序板块：记住当前位置
  if(m==="收藏" && !favList().length){ msg("收藏","还没有收藏题目。\n在「顺序练习」里点「⭐ 收藏」即可收藏。"); return; }
  stopExamTimer(); mode=m;
  forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode===m); });
  if(m==="考试"){ enterExamBoard(); return; }
  examBarHide();
  if(m==="顺序"){
    queue=BANK.slice();
    idx = (seqSavedIdx===null) ? resumeIndex() : seqSavedIdx;
  }else{                        /* 收藏 */
    queue=favList(); idx=0;
  }
  idx=Math.min(idx, queue.length-1);
  renderQ();
}

/* ---------- 顺序 / 收藏 ---------- */
function renderQ(){
  const it=queue[idx];
  if(!it){ $("#head").textContent="暂无题目"; return; }
  $("#head").textContent="[主观题 "+it.num+"]  "+(idx+1)+"/"+queue.length+((mode==="收藏")?" · ⭐收藏":"");
  $("#stem").textContent=it.stem||"";
  renderImgs(it);
  revealed=false;
  showAnsBox(false);
  setAnsEnabled(true, "✍️ 我的作答（打字作答，自动保存；不判对错）");
  $("#myans").value=rec(it.id).wrote||"";
  if(mode==="收藏"){
    footerBtns([["◀ 上一题","#1a5276",function(){nav(-1)}],
                ["💔 取消收藏","#c62828",unfavCur],
                ["下一题 ▶","#1a5276",function(){nav(1)}],
                ["🗑 重置","#c62828",resetProgress]]);
  }else{
    footerBtns([["◀ 上一题","#1a5276",function(){nav(-1)}],
                [isFav(it.id)?"⭐ 已收藏":"⭐ 收藏","#b9770e",favAdd],

function pickPlanned(ids, n){
  // 环形连续段算法：洗牌固定序列，每场沿环连续取 n 个。
  // 同一场绝不重复；连续 ceil(len/n)+1 场必覆盖全部题目。
  const plan=progress._exam_plan&&typeof progress._exam_plan==="object"?progress._exam_plan:{};
  let order=plan.sub;
  if(!Array.isArray(order)||order.length!==ids.length||ids.some(function(id){return order.indexOf(id)<0})){ order=shuffle(ids); plan.cur=0; }
  const m=order.length;
  n=Math.min(n,m);
  if(n<=0) return [];
  let cur=plan.cur;
  if(typeof cur!=="number"||cur<0||cur>=m) cur=0;
  let picked;
  if(n>=m){ picked=order.slice(); cur=0; }
  else{
    const end=cur+n;
    picked=end<=m?order.slice(cur,end):order.slice(cur).concat(order.slice(0,end-m));
    cur=end%m;
  }
  plan.sub=order; plan.cur=cur;
  progress._exam_plan=plan;
  return picked;
}

/* ---------- 配图全屏查看：可拖动 / 双指缩放 / 双击放大 ---------- */
var IV={s:1,x:0,y:0,natW:0,natH:0,minS:0.15,maxS:10,pointers:0,lastX:0,lastY:0,pinchDist:0,lastTap:0,dragging:false,manual:false};
function ivEl(){ return $("#imgView"); }
function ivImg(){ return $("#imgViewImg"); }
function ivView(){ var v=ivEl(); return {w:v.clientWidth||window.innerWidth, h:v.clientHeight||(window.innerHeight-58)}; }
function openImgView(src){
  IV.s=1; IV.x=0; IV.y=0; IV.pointers=0; IV.pinchDist=0; IV.manual=false;
  var im=ivImg();
  im.onload=function(){
    IV.natW=im.naturalWidth||im.width; IV.natH=im.naturalHeight||im.height;
    imgFit();
  };
  im.src=src;
  if(im.complete && im.naturalWidth){ IV.natW=im.naturalWidth; IV.natH=im.naturalHeight; imgFit(); }
  ivEl().classList.add("show");
  $("#imgBar").style.display="flex";
  $("#imgHint").style.display="block";
  /* 不修改 viewport meta：避免移动端重新布局，缩放完全由本查看器接管
     （遮罩已设 touch-action:none，会阻止浏览器自带手势） */
}
function ivDraw(){
  if(!IV.natW) return;
  var im=ivImg();
  im.style.width=IV.natW+"px"; im.style.height=IV.natH+"px";
  im.style.transform="translate("+IV.x+"px,"+IV.y+"px) scale("+IV.s+")";
}
function ivClamp(){
  var r=ivView(), w=IV.natW*IV.s, h=IV.natH*IV.s;
  IV.x = (w<=r.w) ? Math.round((r.w-w)/2) : Math.min(0, Math.max(r.w-w, IV.x));
  IV.y = (h<=r.h) ? Math.round((r.h-h)/2) : Math.min(0, Math.max(r.h-h, IV.y));
}
function ivZoomAt(f, cx, cy){
  var ns=Math.max(IV.minS, Math.min(IV.maxS, IV.s*f));
  var k=ns/IV.s;
  IV.x = cx - (cx - IV.x)*k;
  IV.y = cy - (cy - IV.y)*k;
  IV.s = ns;
  IV.manual = true;          /* 用户已手动缩放：窗口变化时不再自动适应 */
  ivClamp(); ivDraw();
}
function imgZoom(f){ var r=ivView(); ivZoomAt(f, r.w/2, r.h/2); }
function imgFit(){
  if(!IV.natW) return;
  var r=ivView();
  IV.s=Math.min(1, r.w/IV.natW, r.h/IV.natH);
  IV.manual=false;
  ivClamp(); ivDraw();
}
function imgOneToOne(){ var r=ivView(); ivZoomAt(1/IV.s, r.w/2, r.h/2); }
function closeImgView(){
  ivEl().classList.remove("show");
  $("#imgBar").style.display="none";
  $("#imgHint").style.display="none";
  ivImg().src="";
  IV.manual=false;
}
function ivLocalPos(clientX, clientY){
  var r=ivEl().getBoundingClientRect();
  return {x:clientX-r.left, y:clientY-r.top};
}
function ivDist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
function ivMid(t){ return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2}; }
(function ivBind(){
  var v=ivEl(); if(!v) return;
  v.addEventListener("touchstart", function(e){
    if(e.touches.length===1){
      IV.pointers=1; IV.lastX=e.touches[0].clientX; IV.lastY=e.touches[0].clientY;
    }else if(e.touches.length>=2){
      IV.pointers=2; IV.pinchDist=ivDist(e.touches);
    }
    e.preventDefault();
  }, {passive:false});
  v.addEventListener("touchmove", function(e){
    if(e.touches.length===1 && IV.pointers===1){
      var t=e.touches[0];
      IV.x += t.clientX-IV.lastX; IV.y += t.clientY-IV.lastY;
      IV.lastX=t.clientX; IV.lastY=t.clientY;
      ivClamp(); ivDraw();
    }else if(e.touches.length>=2){
      var d=ivDist(e.touches), m=ivMid(e.touches);
      if(IV.pinchDist>0){
        var p=ivLocalPos(m.x, m.y);
        ivZoomAt(d/IV.pinchDist, p.x, p.y);
      }
      IV.pinchDist=d;
    }
    e.preventDefault();
  }, {passive:false});
  v.addEventListener("touchend", function(e){
    if(e.touches.length===0){
      IV.pointers=0; IV.pinchDist=0;
      var now=Date.now();
      if(now-IV.lastTap<300 && e.changedTouches && e.changedTouches.length){
        var p=ivLocalPos(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        if(IV.s<1.6) ivZoomAt(2.2/IV.s, p.x, p.y); else imgFit();
      }
      IV.lastTap=now;
    }
  }, {passive:false});
  v.addEventListener("mousedown", function(e){ IV.dragging=true; IV.lastX=e.clientX; IV.lastY=e.clientY; e.preventDefault(); });
  v.addEventListener("mousemove", function(e){ if(!IV.dragging) return; IV.x+=e.clientX-IV.lastX; IV.y+=e.clientY-IV.lastY; IV.lastX=e.clientX; IV.lastY=e.clientY; ivClamp(); ivDraw(); });
  v.addEventListener("mouseup", function(){ IV.dragging=false; });
  v.addEventListener("mouseleave", function(){ IV.dragging=false; });
  v.addEventListener("wheel", function(e){ var p=ivLocalPos(e.clientX, e.clientY); ivZoomAt(e.deltaY<0?1.12:1/1.12, p.x, p.y); e.preventDefault(); }, {passive:false});
  v.addEventListener("click", function(e){ if(e.target===v && IV.s<=1.02) closeImgView(); });
  window.addEventListener("resize", function(){ if(ivEl().classList.contains("show")){ if(IV.manual){ ivClamp(); ivDraw(); } else { imgFit(); } } });
})();

/* 启动：恢复考试或上次位置 */
forEachNode(document.querySelectorAll("#tabs button"), function(b){
  b.addEventListener("click",function(){ setMode(b.dataset.mode); });
});
function markTabs(m){ forEachNode(document.querySelectorAll("#tabs button"), function(b){ toggleCls(b,"active",b.dataset.mode===m); }); }
function showInitError(e){
  window.__appReady = true;   /* 已自愈回顺序模式，避免环境噪音再报 */
  showErrBox("初始化失败（已自动清除本地旧数据，请刷新页面重试）："+((e&&e.message)?e.message:e), "");
}
(function init(){
  try{
    exam = (progress.exam && typeof progress.exam==="object") ? progress.exam : null;
    if(exam && exam.active){
      var qs=(exam.ids||[]).map(byId).filter(Boolean);
      if(!qs.length){ exam=null; delete progress.exam; throw new Error("考试会话数据异常"); }
      mode="考试"; markTabs("考试"); examBarShow();
      if(exam.finished){ renderResult(); }
      else if(exam.paused){ showPaused(); }
      else { tick(); renderExamQ(); }
    }else{
      exam=null;
      idx=resumeIndex();                       // 跳到"连续完成题目的最后一题"位置
      renderQ();
    }
    window.__appReady=true;
  }catch(e){
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    progress={}; exam=null; idx=0; mode="顺序";
    try{ markTabs("顺序"); renderQ(); }catch(_){}
    showInitError(e);
  }
})();
/* 微信/QQ 环境提示（悬浮顶部，可关闭，不影响任何按钮操作） */
if(navigator.userAgent.indexOf("MicroMessenger")>=0 || navigator.userAgent.indexOf("QQBrowser")>=0 || navigator.userAgent.indexOf("MQQBrowser")>=0){
  try{
    var tip=document.createElement("div");
    tip.style.cssText="position:fixed;left:0;right:0;top:0;background:#fff8e1;color:#8a6d3b;font-size:12px;line-height:1.6;padding:7px 34px 7px 10px;z-index:998;text-align:center";
    var tx=document.createElement("span");
    tx.textContent="✕";
    tx.style.cssText="position:absolute;right:6px;top:5px;font-size:14px;cursor:pointer;padding:2px 8px;color:#8a6d3b";
    tx.onclick=function(){ if(tip.parentNode)tip.parentNode.removeChild(tip); };
    tip.textContent="ℹ️ 微信/QQ 内可能显示不全：如按钮缺失或无法操作，请点右上角「…」→「用其他应用打开」→ 选浏览器打开";
    tip.appendChild(tx);
    document.body.appendChild(tip);
  }catch(e){}
}

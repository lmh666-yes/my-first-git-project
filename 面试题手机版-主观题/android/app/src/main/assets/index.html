": []}, {"id": "sub-305", "kind": "subjective", "kind_name": "主观题", "num": 305, "stem": "请在空白处填写下面程序的输出（C++ 类的构造/析构/虚函数）：\n// A、B 类各含构造/析构/拷贝构造输出语句，func() 内：\nA *a = new B();\na->Say();\nB b = *(B*)a;\ndelete a;", "options": [], "answer": "输出顺序（前提：A 的析构函数为 virtual）：\n1) `A Constructor.` 2) `B Constructor`（new B：先构造基类，再构造派生类）\n3) `This is Class B.`（a->Say() 走虚函数动态绑定）\n4) `A Constructor.` 5) `B Constructor 2`（拷贝构造 B b 时先构造基类子对象）\n6) `B Destructor` 7) `A Destructor`（delete a：虚析构先派生后基类）\n8) `B Destructor` 9) `A Destructor`（b 在作用域结束时析构）\n关键点：构造顺序是基类→派生类，析构恰好相反；若 A::~A 不是虚函数，delete a 只会调用 A 的析构，属未定义行为。", "explain": "①构造/析构顺序（先基后派生、析构相反）②delete a 走虚析构 ③加分：指出 A 析构必须 virtual、拷贝构造先调基类构造。", "sec": "2026面试题-7（C/C++ 试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-306", "kind": "subjective", "kind_name": "主观题", "num": 306, "stem": "请计算以下 sizeof 的值：\nchar str[]=\"www.qdazzle.com\";\nchar *p = str;\nint n = 10;", "options": [], "answer": "sizeof(str)=16、sizeof(p)=4、sizeof(n)=4。str 是数组，大小等于 15 个可见字符再加结尾 '\\0'；p 是指针，32 位环境下 4 字节，sizeof 只看声明类型、不看它指向什么；n 是 int，4 字节。三者都在编译期确定，与运行期内容无关。", "explain": "①16 ②4 ③4 ④加分：sizeof 是编译期运算符、数组大小含 '\\0'。", "sec": "2026面试题-7（C/C++ 试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-307", "kind": "subjective", "kind_name": "主观题", "num": 307, "stem": "解释\"直流分量对电流采样精度的影响\"，并提出一种硬件或软件补偿方法。", "options": [], "answer": "影响：实际采样信号 = 直流偏置 + 交流分量。直流分量会占用 ADC 的动态范围；偏置漂移或过大时波形被削顶/饱和，有效位数与信噪比下降，幅值、有效值（RMS）与功率计算随之失真，越小的信号受直流基线误差影响越明显。补偿：①硬件——加隔直电容或高通 RC 滤波、改用差分放大/计量专用芯片，从源头去掉直流；②软件——上电或周期性采样求均值得到基线，实时扣除（滑动平均或一阶数字高通滤波），必要时按温度做标定修正。", "explain": "①对动态范围/精度的具体影响 ②给出一种硬件或软件补偿并说明做法 ③加分：提差分采样、RMS 失真或温漂标定。", "sec": "2026面试题-8（积积科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-308", "kind": "subjective", "kind_name": "主观题", "num": 308, "stem": "如何通过软件设计实现智能电表的\"防拆机\"功能？列举至少两种实现方案。", "options": [], "answer": "①开盖检测：在表壳上装微动开关/光敏/霍尔加磁铁，开盖即触发；②磁场检测：霍尔传感器监测强磁，超过阈值判为磁攻击；③接线端子或电池仓检测；④事件立即写入 Flash 并带时间戳，断电不丢；⑤主动上报 + 心跳比对，平台发现离线或事件异常再告警；⑥可选联动处置：告警时冻结计量或断开继电器。多手段组合能提高检出率，避免单一手段被绕过。", "explain": "①至少 2 种方案并说出检测元件 ②事件记录断电不丢与上报 ③加分：多手段组合或联动处置。", "sec": "2026面试题-8（积积科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-309", "kind": "subjective", "kind_name": "主观题", "num": 309, "stem": "智能电表常用的物联网协议包括\\_\\_\\_\\_\\_\\_和\\_\\_\\_\\_\\_\\_。", "options": [], "answer": "MQTT、CoAP（也可写 LwM2M、DLMS/COSEM 等行业协议）。MQTT 基于 TCP 的发布/订阅、报文小，适合与 NB-IoT 配合做数据上传；CoAP 基于 UDP、面向受限设备，可搭配 DTLS，LwM2M 就建在其上。注意层次关系：NB-IoT/LoRa 是承载通信技术，MQTT/CoAP 是应用层协议，答题时最好点明这层区别。", "explain": "①MQTT ②CoAP（或另一合理协议）③加分：说明协议特点/适用场景，或与 NB-IoT 的层次关系。", "sec": "2026面试题-9（配网科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-310", "kind": "subjective", "kind_name": "主观题", "num": 310, "stem": "电能表防篡改设计中，检测磁场干扰的传感器通常是\\_\\_\\_\\_\\_\\_。", "options": [], "answer": "霍尔传感器（磁敏元件；干簧管、磁阻 AMR 传感器也可用）。原理：传感器输出随磁场强度变化，无磁时输出为基准电平，外界强磁（如磁铁贴近）使输出超过阈值，MCU 即判定磁攻击事件并记录告警，防止用强磁干扰计量或窃电。", "explain": "①霍尔（磁敏）传感器 ②加分：说明阈值判定原理，或列举干簧管/AMR 等替代元件。", "sec": "2026面试题-9（配网科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-311", "kind": "subjective", "kind_name": "主观题", "num": 311, "stem": "在 FreeRTOS 中，任务优先级数值越\\_\\_\\_\\_\\_\\_，优先级越高。", "options": [], "answer": "大（数值越大优先级越高）。有效范围是 0 ~ configMAX_PRIORITIES−1，0 最低、configMAX_PRIORITIES−1 最高。注意区分：Cortex-M 的 NVIC 中断优先级方向恰好相反——数值越小优先级越高；中断中调用 FreeRTOS API 时，优先级还受 configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY 限制。", "explain": "①大 ②加分：优先级范围 0~configMAX_PRIORITIES−1，或指出与 NVIC“数小优先”相反。", "sec": "2026面试题-9（配网科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-312", "kind": "subjective", "kind_name": "主观题", "num": 312, "stem": "智能电表的远程通信模块（如 NB-IoT）唤醒方式通常为\\_\\_\\_\\_\\_\\_或\\_\\_\\_\\_\\_\\_触发。", "options": [], "answer": "定时唤醒或事件触发唤醒。定时：MCU 的 RTC/低功耗定时器到点唤醒主控，再唤醒 NB-IoT 模块上报（周期上报，常用小时级）；事件：告警、按键、外部中断、计量事件等触发即时唤醒。为省电，模块平时处于 PSM/深睡眠，唤醒后才建链发送，故通常把多项数据合并批量上报。", "explain": "①定时（RTC/周期）②事件（中断/告警）③加分：提 PSM 省电模式或合并上报降低功耗。", "sec": "2026面试题-9（配网科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-313", "kind": "subjective", "kind_name": "主观题", "num": 313, "stem": "电能表数据加密中，对称加密算法如\\_\\_\\_\\_\\_\\_，非对称加密算法如\\_\\_\\_\\_\\_\\_。", "options": [], "answer": "对称加密：AES、SM4（也可写 DES/3DES）；非对称加密：RSA、ECC/SM2。区别与用法：对称算法加解密快、适合大数据量，用于加密业务数据或会话密钥；非对称算法慢但可公钥分发，适合密钥交换、数字签名与设备认证。电表数据常采用混合方案：用非对称算法协商出会话密钥，再用对称算法加密报文。", "explain": "①各写一个正确算法 ②加分：说明用途差异（会话加密 vs 密钥交换/签名）或点出 SM 国密算法。", "sec": "2026面试题-9（配网科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-314", "kind": "subjective", "kind_name": "主观题", "num": 314, "stem": "远程智能电表的\"心跳包\"机制有何作用？设计时需考虑哪些因素？", "options": [], "answer": "作用：①长连接/NAT 保活，防止链路被中间设备回收；②让平台判断设备在线或离线（心跳缺失即判离线告警）；③顺带上报轻量状态（信号、电量、告警），减少单独上报次数。设计考虑：心跳周期要在功耗与实时性之间权衡（NB-IoT 可拉长到小时级并配合 PSM）；报文尽量短；超时重传与失败计数、断网缓存补报；心跳与周期数据合并发送；流量与资费成本；平台侧要有离线判定阈值（如连续 3 个周期未收到）。", "explain": "①作用≥2（保活/在线判断/状态上报）②因素≥2（周期与功耗、超时重传、断网处理）③加分：PSM/eDRX、合并上报或服务器离线判定。", "sec": "2026面试题-9（配网科技）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-315", "kind": "subjective", "kind_name": "主观题", "num": 315, "stem": "列出电脑的几大硬件组成部分。", "options": [], "answer": "主机内部：CPU（含散热器）、主板、内存、硬盘/SSD、电源、显卡、机箱、网卡；外部设备：显示器、键盘、鼠标等。也可按冯·诺依曼五大部件归类：运算器、控制器（二者合起来就是 CPU）、存储器、输入设备、输出设备。", "explain": "①≥5 项 ②加分：能按运算器/控制器/存储器/输入/输出五大部件归类。", "sec": "2026面试题-10（软件基础知识）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-316", "kind": "subjective", "kind_name": "主观题", "num": 316, "stem": "硬盘分区与格式化有什么联系和区别？在使用中的电脑如果要重装系统需要注意什么？", "options": [], "answer": "区别：分区是给物理磁盘写入分区表、划出多个逻辑区域（只规划“地皮”）；格式化是在某个分区上建立文件系统（写引导记录/FAT/MFT 等结构并清空原有数据，“盖房入住”）。联系：先分区后格式化，格式化以分区为单位，一个分区一个文件系统。重装系统注意：①备份数据，尤其 D 盘、桌面与账号信息；②确认固件启动方式与分区表匹配（UEFI 一般配 GPT，Legacy 配 MBR），否则装不上或无法引导；③准备启动 U 盘与必要驱动（RAID/网卡）；④记录激活方式/微软账户与专业软件授权；⑤装完核对引导项与盘符顺序。", "explain": "①概念区别（写分区表 vs 建文件系统）②重装注意≥2（备份、UEFI/GPT 匹配、驱动、激活）③加分：解释 UEFI 配 GPT 的原因或提 4K 对齐。", "sec": "2026面试题-10（软件基础知识）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-317", "kind": "subjective", "kind_name": "主观题", "num": 317, "stem": "CAD：①画直线、画圆、修剪的快捷键；②线性标注与对齐标注测量什么距离；③哪些属于直线的特性。", "options": [], "answer": "①快捷键：直线 L（LINE）、圆 C（CIRCLE）、修剪 TR（TRIM）；常用还有 E 删除、M 移动、CO 复制。②线性标注（DIMLINEAR）测水平或垂直方向的距离（按 X/Y 投影），对齐标注（DIMALIGNED）测两点之间的真实距离（斜线长度）。③直线的特性：颜色、图层、线宽均属对象特性（另有线型、透明度等通用特性）。", "explain": "①三个快捷键 ②两种标注各自测什么距离 ③特性选项全对 ④加分：再举常用命令或说明图层的作用。", "sec": "2026面试题-10（软件基础知识）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-318", "kind": "subjective", "kind_name": "主观题", "num": 318, "stem": "Solidworks：①草图按尺寸标注分哪三种；②旋转特征草图中不允许多条什么；③钣金零件必须同一什么；④主要建模技术；⑤特征管理设计树中默认包含几个基准面。", "options": [], "answer": "①欠定义、完全定义、过定义（按尺寸/几何约束是否确定划分草图状态；欠定义自由度大于 0，过定义是尺寸冲突）；②旋转特征的草图中不允许多条中心线——旋转轴只能取一条，且轮廓须完整位于轴线一侧、不得跨越；③钣金零件必须同一厚度（同一板材成形，各壁厚一致）；④主要建模技术：基于特征的参数化建模（按特征顺序建模、尺寸驱动，改尺寸即重建模型）；⑤特征设计树默认含 3 个基准面：前视、上视、右视。", "explain": "①五空各 1 分 ②加分：能解释欠/过定义含义，或说明钣金为何必须等厚。", "sec": "2026面试题-10（软件基础知识）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-319", "kind": "subjective", "kind_name": "主观题", "num": 319, "stem": "列举三种常用的编程语言。", "options": [], "answer": "例如 C、C++、Python：C 面向底层与嵌入式，C++ 兼顾性能与抽象，Python 用于脚本、数据处理与 AI。也可答 Java/C#/Go/汇编等，任举三种并写清典型用途即可（不要写“编程语言”这类泛称）。", "explain": "①三种语言名称正确 ②加分：各说一句典型用途。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-320", "kind": "subjective", "kind_name": "主观题", "num": 320, "stem": "单片微型计算机由\\_\\_\\_\\_\\_\\_、\\_\\_\\_\\_\\_\\_和\\_\\_\\_\\_\\_\\_三部分组成。", "options": [], "answer": "微处理器（CPU）、存储器、I/O 接口三部分。补充口径：若题目问的是 CPU 内部组成，则填运算器、控制器、寄存器组，两者不要混填。单片机把 CPU、ROM/RAM、定时器/中断、串口、ADC 等集成在同一芯片内，各部件通过总线相连。", "explain": "①CPU/存储器/I/O 三部分 ②加分：区分“单片机组成”与“CPU 内部组成”，或提总线连接。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-321", "kind": "subjective", "kind_name": "主观题", "num": 321, "stem": "16 进制数 0x1564 转换成 10 进制为（\\_\\_\\_\\_\\_\\_），10 进制数 5477 转换成 16 进制为（\\_\\_\\_\\_\\_\\_）。", "options": [], "answer": "5476；0x1565。计算：0x1564 = 1×16³ + 5×16² + 6×16 + 4 = 4096 + 1280 + 96 + 4 = 5476；5477 比 5476 大 1，因此是 0x1565（也可用除 16 取余法验证）。", "explain": "①5476 ②0x1565（写作 1565H/0x1565 均可）③加分：给出换算过程。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-322", "kind": "subjective", "kind_name": "主观题", "num": 322, "stem": "请给出如下程序的结果 a=\\_\\_\\_\\_\\_\\_，b=\\_\\_\\_\\_\\_\\_：\nint a = 3;      int b = a << 3;", "options": [], "answer": "a=3，b=24。说明：`a << 3` 把 a 的二进制左移 3 位，等价于乘 2³=8，故 3×8=24；位移不改变 a 本身，a 仍为 3。注意有符号负数左移属未定义/实现定义行为，嵌入式代码中建议用无符号类型左移。", "explain": "①a=3 ②b=24 ③加分：左移=乘 2ⁿ、原变量不变，或有符号左移的风险提示。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-323", "kind": "subjective", "kind_name": "主观题", "num": 323, "stem": "设 a 和 b 均为 double 型变量，且 a=5.5、b=2.5，则表达式 `(int)a+b/b` 的值是（\\_\\_\\_\\_\\_\\_）。", "options": [], "answer": "6.0。步骤：①强制转换 (int)a 对 5.5 截断取整（向零取整）得 5；②b/b = 2.5/2.5 = 1.0，两个 double 相除结果仍是 double；③5 与 1.0 混合运算时提升为 double，得 6.0。注意结果是浮点型 6.0，不是整数 6。", "explain": "①6.0 ②强转截断取整与 double 类型提升 ③加分：指出结果为浮点型/应用 %f 输出。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-324", "kind": "subjective", "kind_name": "主观题", "num": 324, "stem": "头文件中的 ifndef/define/endif 干什么用？", "options": [], "answer": "用作“头文件卫士”（include guard），防止同一头文件被重复包含而导致宏重定义、类型或变量重复声明。机理：首次包含时 `#ifndef 宏` 成立，随即 `#define 宏` 把它定义掉，文件内容参与编译；再次包含时宏已存在、条件为假，整段内容被跳过，`#endif` 结束条件块。宏名常取头文件名（如 `__STD_H__`）。另有一种非标准但通用写法：文件开头写 `#pragma once`。", "explain": "①防止重复包含/重定义 ②#ifndef 条件编译机理 ③加分：提 #pragma once 或宏命名习惯。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-325", "kind": "subjective", "kind_name": "主观题", "num": 325, "stem": "`#include <filename.h>` 和 `#include \"filename.h\"` 有什么区别？", "options": [], "answer": "查找顺序不同：`<filename.h>` 只在系统/编译器标准包含路径（如 /usr/include、工具链 inc 目录）中查找；`\"filename.h\"` 先在当前源文件所在目录（其次 -I 指定的用户路径）查找，找不到再按 `<>` 的规则查找。使用惯例：自己项目的头文件用 `\"\"`，标准库与第三方库用 `<>`；搜索路径可用 -I 扩展。", "explain": "①查找顺序不同（\"\" 先当前目录，<> 只查系统路径）②给出使用惯例 ③加分：提 -I 搜索路径或不同编译器/IDE 的差异。", "sec": "2026面试题-11（软件工程师面试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-326", "kind": "subjective", "kind_name": "主观题", "num": 326, "stem": "请完成下面的宏定义，作用是获得 a 和 b 两个参数中的较大者：`#define max(a, b) ____`", "options": [], "answer": "`((a) > (b) ? (a) : (b))`。要点：每个参数各自加括号、整个表达式再包一层，避免调用处的运算符优先级破坏宏（如 max(a & 1, b) 或 max(x, y) + 1 的情形）；宏参数会被求值两次，实参若带 `i++` 等副作用会出错，工程上更推荐 `static inline` 函数或 GCC 的语句表达式 `({...})`。", "explain": "①三目写法正确 ②参数与整体都有括号 ③加分：指出重复求值/副作用风险或函数替代方案。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-327", "kind": "subjective", "kind_name": "主观题", "num": 327, "stem": "用预处理指令 #define 声明一个常数，用以表明一年中有多少秒（忽略闰年问题）：`#define ____`", "options": [], "answer": "`#define SECONDS_PER_YEAR (60UL * 60UL * 24UL * 365UL)`。要点：数值 = 31 536 000 秒；整个表达式必须加括号；常量加 UL 后缀，防止在 16 位 int 平台上溢出（60×60×24×365 远超 32767）。这也是用宏常量代替直接写数字的原因：含义清晰、可复用、类型明确。", "explain": "①数值/表达式正确（31536000 秒）②括号完整 ③加分：UL 后缀并说明防溢出原因。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-328", "kind": "subjective", "kind_name": "主观题", "num": 328, "stem": "ISR 温度读取程序找错：`static int __g_temperatures[2];` 中断写入、main 中比较取值。它是否包括错误？该如何修正？", "options": [], "answer": "有错误。①共享数组未用 volatile：编译器可能把主循环里的读取优化成寄存器缓存甚至常量，中断中的写入对主程序不可见；②int 的多字节读取非原子，可能低半字为新值、高半字为旧值（撕裂读）；③主循环无同步机制、纯忙等，判据不可靠且浪费 CPU。修正：变量加 volatile；读写放入临界区（关中断/开中断或互斥量）保护，或采用双缓冲、指针原子切换（先写后备缓冲，再原子更新指针）；也可由中断只置标志或投递队列，由主循环统一处理。", "explain": "①volatile（避免被优化）②原子性/临界区或双缓冲 ③加分：提队列/中断置标志等更稳妥的结构。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-329", "kind": "subjective", "kind_name": "主观题", "num": 329, "stem": "请给下面代码段中的变量按存放位置进行划分（只读存储、可读写存储、堆、栈）：\nstatic int static_int;\nint        public_int;\nint        initialized = 4;\nchar  *string = \"where does this string go?\";\nvoid *pointer;\nvoid function (int param, int *param_ptr)\n{\n    static int static_local;\n    int     local;\n    pointer = malloc(10);\n}", "options": [], "answer": "只读存储：\"where does this string go?\" 字符串字面量；\n可读写存储（静态区）：static_int、public_int、pointer、static_local 这类未初始化变量在 .bss；initialized 有初值、string 指针本身都在 .data；函数内的 static_local 同属静态区，生命周期贯穿整个程序；\n堆：malloc(10) 返回的那块内存（pointer 指向它，需手动 free）；\n栈：形参 param、param_ptr 的副本与局部变量 local，随函数调用建立、返回即销毁。", "explain": "①只读：字符串字面量 ②静态区：全局/static 变量与指针本身 ③堆：malloc 所得 ④栈：形参与局部变量 ⑤加分：区分 .data/.bss 或说明各区域生命周期。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-330", "kind": "subjective", "kind_name": "主观题", "num": 330, "stem": "下面的程序由任务（线程）A、B 和 C 调用，但它们都不能工作。怎样解决这个问题？\nstatic int      __g_counter;\nos_semaphore_t  __g_sem_plus;\nos_semaphore_t  __g_sem_minus;\nvoid counter_increment (int count) { os_semaphore_take(__g_sem_plus); __g_counter += count; }\nvoid counter_decrement (int count) { __g_counter -= count; os_semaphore_give(__g_sem_minus); }", "options": [], "answer": "三个问题：①两个信号量从未创建/初始化就 take/give，行为未定义；②take/give 配对错误——increment 只 take 不 give（消耗许可），decrement 只 give 不 take（凭空增加许可），计数单向失衡，迟早阻塞或失去保护作用；③`__g_counter += count` 是读-改-写三步，A、B、C 并发时可能丢失更新，且两个函数没有用同一把锁。解决：在任务启动前创建一把互斥信号量（或二值信号量），increment 与 decrement 都按 take → 修改 → give 执行，保证增减串行化；若临界区极短，也可改用关中断/调度器锁，代价更小。", "explain": "①未初始化/未创建 ②take/give 配对与逻辑错误 ③同一互斥保护与原子性 ④加分：临界区/调度器锁等更轻量方案。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-331", "kind": "subjective", "kind_name": "主观题", "num": 331, "stem": "两个任务收发字符程序找错（task_get_characters 投递 URGENT/NORMAL 队列；task_consume_characters 先 pend URGENT 再 pend NORMAL）：\nchr_urgent = os_queue_pend(URGENT_QUEUE, WAIT_FOREVER);\nchr_normal = os_queue_pend(NORMAL_QUEUE, WAIT_FOREVER);", "options": [], "answer": "问题：接收任务先以 WAIT_FOREVER 等 URGENT 队列，一旦紧急消息长期不来就永久阻塞，普通（NORMAL）消息永远得不到处理，形成饥饿甚至整条处理链停摆；永久等待也无法响应退出/复位请求。改进：①两条队列都用带超时的 pend 循环轮询（如各 10ms），兼顾紧急与普通；②两队列 + 事件标志组，消息到达置位，统一等事件再分派；③只留一条队列，消息内带优先级字段，接收端据此插队处理；④紧急消息交给更高优先级的专职任务。核心：不能把可能永不发生的等待写成 WAIT_FOREVER。", "explain": "①指出 WAIT_FOREVER 造成永久阻塞/饥饿 ②给出改进方案≥1 ③加分：事件标志组/优先级队列/任务分派等设计。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-332", "kind": "subjective", "kind_name": "主观题", "num": 332, "stem": "在 32 位 CPU 上，下面代码能正常工作吗？如果可以，请写出可能的输出：\n#define offsetof(type, member)      ((type *)0)->member)\nstruct a_struct { char ch; short data; long value; void *buf; };\nprintf(\"%d, %d, %d, %d\\n\", offsetof(...,ch), (...,data), (...,value), (...,buf));", "options": [], "answer": "输出 `0, 2, 4, 8`（32 位环境）。对齐推导：char 在偏移 0；short 需 2 字节对齐，故 data 在 2；long 在 32 位按 4 字节对齐，value 在 4；指针 4 字节，buf 在 8，结构总大小 12。两个写法问题：①题目宏 `((type *)0)->member)` 括号不配对，标准写法是 `#define offsetof(type,member) ((size_t)&((type *)0)->member)`；②printf 用 %d 打印 size_t，应加强转或改用 %zu。该技巧并不真正解引用空指针，属标准允许的常见用法（C99 起可直接用库里的 offsetof）。", "explain": "①0、2、4、8 ②对齐规则说明 ③加分：宏括号/格式符问题，或指出 64 位下会变成 0,2,8,16。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-333", "kind": "subjective", "kind_name": "主观题", "num": 333, "stem": "设有一 C 语言头文件 std.h（含两条 MEMPOOL 宏调用），试解释下列代码宏定义的意义：\nstatic const u16_t memp_sizes[] = {\n#define MEMPOOL(name,num,size,desc) (size),\n#include \"std.h\"\n};\nstatic u8_t memp_memory[3\n#define MEMPOOL(name,num,size,desc) + ( (num) * (size) )\n#include \"std.h\"\n];", "options": [], "answer": "这是 X-Macro（嵌套展开）技术：同一份 std.h 里的若干 `MEMPOOL(name,num,size,desc)` 调用被两次 #include，靠宏的不同定义生成不同代码。第一次在数组初始化列表内展开为 `(size),`，得到各池的块尺寸表，示例 memp_sizes[] = {20, 30}；第二次展开为 `+ ((num)*(size))`，配合开头的 3，得到总缓冲区字节数，示例 = 3 + 2×20 + 3×30 = 133。意义：内存池配置只在 std.h 里写一处，尺寸表与缓冲区大小自动同步派生，增删池不必改两处——lwIP 的 memp 就是这样写的。", "explain": "①说明两次展开各生成什么（尺寸表/总大小）②示例计算正确 ③加分：指出“一处配置多处派生”的维护优势或 lwIP 来源。", "sec": "2026面试题-12（嵌入式软件工程师考试试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-335", "kind": "subjective", "kind_name": "主观题", "num": 335, "stem": "简述 C 和 C++ 的核心区别。", "options": [], "answer": "①范式：C 是面向过程的，用函数加结构体解决问题；C++ 支持面向对象（类、封装、继承、多态、虚函数）与泛型编程（模板、STL）。②语言设施：C++ 有引用、函数/运算符重载、命名空间、构造析构与 RAII、异常处理；C 没有，只能靠函数指针模拟多态、手工管理内存。③资源管理：C++ 用构造/析构与智能指针自动配对释放；C 全靠程序员。④兼容性：C++ 基本兼容 C（少数语义收紧），C 代码大多可直接用 C++ 编译。⑤典型用途：C 多用于嵌入式/驱动/内核，C++ 多用于复杂上层系统。", "explain": "①≥2 个语言特性差异（OOP/泛型/重载/异常/RAII）②加分：兼容关系或典型用途差异。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-336", "kind": "subjective", "kind_name": "主观题", "num": 336, "stem": "Linux 32 位 C 程序，计算：`const char* str = \"hello\"; char* p = str;` 的 sizeof(str) 与 sizeof(p)。", "options": [], "answer": "均为 4。理由：sizeof 求的是类型字节数，char* 在 32 位机器上是 4 字节指针；const 只限定所指内容能否修改，不改变指针本身大小。若在 64 位环境则是 8，答 4 的前提是题目给出的 32 位。另注意 p = str 会丢掉 const，需强制转换才能通过编译。", "explain": "①4 ②4 ③加分：说明 const 不改变指针大小或 64 位下为 8。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-337", "kind": "subjective", "kind_name": "主观题", "num": 337, "stem": "简述线程和进程的区别。", "options": [], "answer": "①定位不同：进程是资源分配的基本单位（独立地址空间、文件描述符表、信号处理），线程是 CPU 调度与执行的基本单位。②共享与私有：同一进程内各线程共享代码段、数据段、堆和打开的文件，但各有独立的栈、寄存器和程序计数器现场。③开销：进程创建/切换/通信开销大（切换页表、拷贝上下文），线程小得多。④通信：线程可直接读写共享变量（需加锁同步），进程间需 IPC（管道、共享内存、消息队列、套接字）。⑤健壮性：线程崩溃常拖垮整个进程，进程之间相互隔离。⑥选型：多进程适合强调稳定隔离的服务，多线程适合共享数据、轻量并发的场景。", "explain": "①资源单位 vs 调度单位 ②地址空间共享/独立栈 ③开销或健壮性差异 ④加分：通信方式（共享变量+锁 vs IPC）或选型场景。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-338", "kind": "subjective", "kind_name": "主观题", "num": 338, "stem": "C 与 C++ 中 struct 有什么区别。", "options": [], "answer": "C 方面：struct 只能装数据成员（可用函数指针成员模拟方法），没有访问控制、不能继承、没有构造/析构，定位是“数据的集合”。C++ 方面：struct 与 class 几乎等价，都可以有成员函数、构造析构、继承、多态、模板；唯一实际区别是默认访问权限与默认继承权限——struct 默认 public，class 默认 private。", "explain": "①C 仅有数据成员 ②C++ 可含成员函数/继承/多态 ③默认权限 public 与 class private 的对比 ④加分：默认继承权限或空类占 1 字节。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-339", "kind": "subjective", "kind_name": "主观题", "num": 339, "stem": "以下代码运行会产生什么结果：`char szstr[10]; strcpy(szstr,\"0123456789\");`", "options": [], "answer": "缓冲区溢出（越界写）。strcpy 连结尾 '\\0' 一起复制，“0123456789”共 11 字节，而 szstr 只有 10 字节，多出的 1 字节写到数组之后：属未定义行为，可能破坏相邻变量或返回地址导致崩溃，也可能是可被利用的安全漏洞（栈溢出攻击）。正确做法：用 strncpy 并用 snprintf 限定长度（strncpy 不保证补 '\\0'，需手动补），或改用 std::string/容器。", "explain": "①溢出原因（11 字节写入 10 字节）②后果属未定义行为 ③加分：给出安全替代与补 '\\0' 细节。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-340", "kind": "subjective", "kind_name": "主观题", "num": 340, "stem": "简述：拷贝构造、移动构造、深拷贝、浅拷贝。", "options": [], "answer": "①拷贝构造 `T(const T&)`：以同类型对象为模板构造新对象，通常做深拷贝。②移动构造 `T(T&&)`：形参是右值引用，直接“窃取”源对象的资源（接管指针、把源置空），避免深拷贝开销，用于临时对象/返回值。③浅拷贝：只逐位复制成员，指针成员使两个对象指向同一资源，重释放（double free）或悬空。④深拷贝：额外申请内存并复制指针所指内容，两对象资源独立，代价是性能与实现复杂度。工程规则：自定义了析构/拷贝就应遵循三法则或五法则（含移动），并用智能指针替代裸指针。", "explain": "①四个概念定义清晰 ②指出浅拷贝风险（共享/重复释放）③加分：右值/移动语义的用途或三/五法则。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-341", "kind": "subjective", "kind_name": "主观题", "num": 341, "stem": "简述栈和堆的区别。", "options": [], "answer": "①谁来管：栈由编译器与运行时自动分配回收（进入函数分配、返回即释放），堆由程序员用 malloc/new 申请、free/delete 释放。②空间与方向：栈空间小（嵌入式常仅几 KB），堆空间大，两者增长方向通常相对。③速度与碎片：栈只是移动栈指针，O(1) 且连续无碎片；堆需查找空闲块、维护元数据，分配/释放较慢并可能产生碎片。④内容与风险：栈放局部变量、形参、返回地址，过大数组或深递归会栈溢出；堆放动态数据结构，忘记释放会内存泄漏。⑤生命周期：栈对象随作用域结束消亡，堆对象存活到显式释放（C++ 中由 RAII/智能指针约束）。", "explain": "①管理方式（自动 vs 手动）②空间/速度/碎片差异 ③加分：生命周期与典型故障（栈溢出 vs 内存泄漏）。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-342", "kind": "subjective", "kind_name": "主观题", "num": 342, "stem": "指出以下代码问题：\nwap(int* p1,int* p2) {\n    int * p;\n    *p = *p1;\n    *p1 = *p2;\n    *p2 = *p;\n}", "options": [], "answer": "问题一：`int *p;` 只声明未初始化就 `*p = *p1;`，向未知地址写入（野指针解引用），属未定义行为，通常直接崩溃或破坏其他内存。问题二：函数没有写返回类型（旧标准下隐式 int，规范写法应为 void）。问题三：函数名拼成 wap（若本意是 swap 属笔误）。修正：\n`void swap(int *p1, int *p2) { int t = *p1; *p1 = *p2; *p2 = t; }`\n交换的是指针指向的值，用整型临时变量保存，不能使用未初始化的指针。", "explain": "①野指针未初始化 ②缺返回类型 ③给出正确实现 ④加分：说明形参是指针、交换的是目标内存。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-343", "kind": "subjective", "kind_name": "主观题", "num": 343, "stem": "指出以下代码存在的问题：\nint main() {\n    char a;\n    char* p = &a;\n    strcpy(p, \"hello\");\n    printf(\"%d\\n\", str);\n}", "options": [], "answer": "①严重越界：a 只有 1 字节，p 指向它，却用 strcpy 写入 \"hello\" 共 6 字节，越界 5 字节，是典型的栈缓冲区溢出（未定义行为）。②printf 里用的是未声明的 str（应改为 p，且打印字符串要用 %s 而不是 %d）。③未包含 <string.h>/<stdio.h>。修正写法：`char a[6]; strcpy(a, \"hello\"); printf(\"%s\\n\", a);`（数组预留 '\\0' 空间），或 `char *p = \"hello\";`（只指向不修改）。", "explain": "①溢出/越界写原因 ②str 未定义与 %d 用法错误 ③加分：给出两种正确写法。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-344", "kind": "subjective", "kind_name": "主观题", "num": 344, "stem": "内存泄漏的常见原因与避免方法。", "options": [], "answer": "常见原因：①malloc/new 之后忘记对应 free/delete，尤其出错分支提前 return 时；②指针被重新赋值，原内存丢失无法释放；③C++ 中异常抛出路径未释放资源（未用 RAII）；④只释放外层结构，内部成员未释放；⑤文件描述符、套接字、句柄只开不关（广义资源泄漏）。避免：谁申请谁释放、配对书写（申请后立即规划释放路径）；C++ 用智能指针与 RAII，用容器代替裸数组；遵循构造函数申请、析构函数释放；代码评审加静态检查；用 valgrind/ASan 等工具做长时间运行压测，把内存水位纳入监控。", "explain": "①原因≥2（漏配对/异常路径/指针被覆盖）②避免方法≥2（RAII/智能指针、工具检查）③加分：广义资源泄漏或长时间运行监测。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-345", "kind": "subjective", "kind_name": "主观题", "num": 345, "stem": "死锁的四个必要条件。", "options": [], "answer": "①互斥条件：资源同一时刻只能被一个进程/任务占用；②请求并保持（占有并等待）：已占有资源的同时又申请新资源且被阻塞；③不可剥夺：资源只能由持有者主动释放，不能被强制抢走；④循环等待：存在进程—资源的环形等待链。四者同时成立才会死锁，破坏任一即可预防，常用手段：资源按固定顺序申请（破坏循环等待）、一次性申请全部资源、允许抢占，以及设置超时重试与死锁检测。", "explain": "①四项条件的名称与含义 ②加分：说明破坏任一条件即可预防，并给出一种具体方法。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-346", "kind": "subjective", "kind_name": "主观题", "num": 346, "stem": "逻辑题：8 元买鸡，9 元卖出，10 元买回，11 元卖出，共赚多少？", "options": [], "answer": "赚 2 元。两次交易分别记账：第一次 8 元买、9 元卖，赚 1 元；第二次 10 元买、11 元卖，赚 1 元，合计 (9−8)+(11−10)=2 元。也可用总收入减总支出：买鸡共花 8+10=18 元，卖鸡共得 9+11=20 元，净赚 2 元。易错点：把 10 元买回误当成额外亏损，其实它只是第二轮的成本。", "explain": "①2 元 ②说明两次交易或总收入减总支出 ③加分：指出常见错解（3/1/0 元）的误区。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-347", "kind": "subjective", "kind_name": "主观题", "num": 347, "stem": "逻辑题：房间有 10 盏灯，关掉 3 盏，还剩几盏？", "options": [], "answer": "还剩 10 盏。关掉的 3 盏只是变为不亮，灯仍留在房间里，数量不变；本题陷阱在于把关掉偷换成拿走。若题目问的是还亮着几盏，则是 10−3=7 盏，答题时先点明这一区别更稳。", "explain": "①10 盏 ②说明关掉不等于减少数量 ③加分：附带指出若问亮度则为 7 盏。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-348", "kind": "subjective", "kind_name": "主观题", "num": 348, "stem": "逻辑题：3 人 3 天用 3 桶水，9 人 9 天用几桶水？", "options": [], "answer": "27 桶。先归一化求单人单天用量：3 人 3 天用 3 桶 → 1 人 1 天用 1/3 桶；再按新条件放大：9 人 × 9 天 × 1/3 = 27 桶。也可用比例法验证：人数变 3 倍、天数变 3 倍，总用量变 9 倍，3×9=27。", "explain": "①27 桶 ②给出归一化或比例推理 ③加分：能说清人数与天数各自放大 3 倍的易错点。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-349", "kind": "subjective", "kind_name": "主观题", "num": 349, "stem": "逻辑题：找出与众不同的一项：苹果、香蕉、西红柿、梨", "options": [], "answer": "西红柿。理由：苹果、香蕉、梨都是水果，西红柿在日常食用与农产品分类中归为蔬菜（植物学上它属浆果类，与本题常规口径不同）。答题关键是给出一个自洽的分类标准并说明依据；若从颜色、形状等其他角度也能构造不同答案，但要讲清理由。", "explain": "①答西红柿 ②给出分类依据（蔬/果之分）③加分：说明植物学与食用分类的差异，或指出本题属多解、需给理由。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-350", "kind": "subjective", "kind_name": "主观题", "num": 350, "stem": "情景题：你负责的功能在联调时频繁不稳定，定位耗时较长，你通常如何推进？（开放题）", "options": [], "answer": "①先稳定复现并量化：记录出现条件（版本、时序、负载、环境），抓日志/示波器波形，把不稳定变成可比较的数据。②二分隔离缩小范围：分段打点（串口/RTT）、注释代码、构造最小复现工程，逐层排除模块。③提出假设后一次只改一处并验证，用时序时间戳与计数统计支撑，不靠猜。④设时间盒（如半天），到点主动同步进展、请同事一起看或评审，避免独自硬耗。⑤修复后补回归用例、加断言与监控，并把现象、根因、验证方法记录成文档，防止复发。", "explain": "开放：①复现与证据（日志/波形/量化）②隔离与假设验证方法 ③加分：时间盒与求助、修复后的回归与文档沉淀。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-351", "kind": "subjective", "kind_name": "主观题", "num": 351, "stem": "情景题：你的实现思路与资深同事不同，对方直接否定你的方案，你会如何处理？（开放题）", "options": [], "answer": "①先听完对方的理由，确认双方对需求与约束（性能、成本、进度、维护）的理解是否一致，避免各说各话。②用数据与原型说话：做最小实验、查文档与标准、量测性能，列出两个方案的优缺点对比，而不是争论感觉。③就事论事，对方案不对人，主动吸收对方合理的部分。④若仍无法一致，提请技术评审或由主管决策，服从最终结论并全力执行。⑤事后复盘：若自己确实错了坦然承认，若方案确更优则用可验证的结果说明，而不是情绪化对抗。", "explain": "开放：①倾听并确认目标/约束 ②用数据、原型对比而非空辩 ③加分：评审决策机制、服从结论、事后复盘。", "sec": "2026面试题-13（C/C++ 初级/中级笔试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-352", "kind": "subjective", "kind_name": "主观题", "num": 352, "stem": "堆栈溢出一般是由什么原因导致的？", "options": [], "answer": "①递归过深或无终止条件（每层调用都占栈帧）；②函数内定义超大局部数组/结构体（如 char buf[64K]）；③调用层次过深，累计栈帧超过栈容量；④中断嵌套或 RTOS 多任务叠加占用；⑤栈空间本身配置过小（链接脚本或任务栈设置不足）。排查手段：栈填充法看水位、FreeRTOS 的 uxTaskGetStackHighWaterMark、MPU 保护页捕获越界；改进：大缓冲改为 static 或堆、递归改迭代、增大栈或减少中断嵌套。", "explain": "①≥3 条原因 ②加分：给出检测方法（栈水位/高水位接口）或对应改进措施。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-353", "kind": "subjective", "kind_name": "主观题", "num": 353, "stem": "局部变量能否和全局变量重名？", "options": [], "answer": "可以重名，编译器按作用域就近匹配：函数内访问的是局部变量，全局变量被屏蔽（name hiding），不报错但容易出错。若确实要访问被屏蔽的全局变量：C++ 可用作用域限定 ::count，C 语言没有 ::，只能另起别名或改名。工程上应避免重名，开启 -Wshadow 让编译器告警，可显著减少这类隐蔽错误。", "explain": "①可以 ②屏蔽（就近作用域）规则 ③加分：C++ 的 :: 访问法，或 -Wshadow/避免重名建议。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-354", "kind": "subjective", "kind_name": "主观题", "num": 354, "stem": "I2C 通信做 master 和 slaver 最主要区别是什么？", "options": [], "answer": "最主要区别在时钟与发起权：主机产生并驱动 SCL、发起 START/STOP 条件、发送从机地址与读写位，还负责总线仲裁与超时恢复；从机不产生时钟（仅可用时钟拉伸），只能靠地址被选中后应答并收发数据，不能主动发起传输。多主机系统中，具备主机功能的设备经仲裁胜出后才是当前主机，仲裁失败方立即退出。数据收发方向两者都会用到，不构成区别。", "explain": "①时钟控制与发起权在主机 ②从机靠地址被选中、被动应答 ③加分：时钟拉伸、多主机仲裁，或点明收发方向不算区别。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-355", "kind": "subjective", "kind_name": "主观题", "num": 355, "stem": "下列程序的输出是：\n#define add(a+b) a+b\nInt main()\n{\n    Printf(\"%d\\n\",5*add(3+4)\");\n    Return 0;\n}", "options": [], "answer": "按题意理解，宏只做文本替换且未加括号，`add(3+4)` 被展开成 `3+4`，于是 `5*add(3+4)` 变成 `5*3+4` = 19；数学上的 5×(3+4)=35 是错误直觉。需要指出：题目给的 `#define add(a+b) a+b` 本身不合法——C 规定宏形参必须是标识符，含 + 无法通过编译（gcc 直接报错），应视为原题笔误；且代码还有 Int/Printf/Return 大小写、字符串引号不成对等问题。正确写法：`#define ADD(a,b) ((a)+(b))`，此时 5*ADD(3,4)=35。", "explain": "①19（文本替换结果）②说明缺括号导致优先级错误的机理 ③加分：指出宏定义本身语法不合法或大小写笔误，并给出正确写法。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-356", "kind": "subjective", "kind_name": "主观题", "num": 356, "stem": "你怎样保证代码中的变化不会影响产品的其他部分？", "options": [], "answer": "①结构上隔离：模块化、高内聚低耦合，接口尽量小，改动只落在本模块内、不向外扩散。②契约稳定：头文件、协议与数据结构变更走评审，兼容旧调用（保留旧接口/提供默认值），必要时做版本化。③测试防线：单元测试加集成/回归测试，改动必跑；编译器警告全开并加静态检查。④流程手段：代码评审、特性开关（feature flag）、灰度发布与可回滚方案。⑤可追溯：版本控制与变更记录，出问题能定位到引入的提交。⑥对外兼容：配置项默认值、数据迁移与升级脚本。", "explain": "①≥3 点且具体（测试/评审/开关/灰度）②加分：接口兼容、可回滚或灰度策略。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-357", "kind": "subjective", "kind_name": "主观题", "num": 357, "stem": "请评论下面使用 `__interrupt` 定义 ISR 的代码：\n__interrupt double compute_area (double radius) {\n    double area = PI * radius * radius;\n    printf(\" Area = %f\", area);\n    return area;\n}", "options": [], "answer": "至少四处问题：①ISR 不应有返回值——中断由硬件调用，返回值没有接收者，应声明为 void；②也不应传参（很多工具链不支持，寄存器约定也不同）；③double 运算在多数 MCU 上靠软件浮点库完成，耗时数百至上千周期，还可能占用栈，导致中断严重超时；④printf 通常不可重入（内部有静态缓冲/锁）且可能阻塞，在 ISR 中调用会造成输出错乱、重入错误甚至死锁；⑤__interrupt 是编译器扩展关键字，可移植性差。正确做法：中断只做最短的事——置标志或发信号量，处理交给任务。", "explain": "①返回值/参数问题 ②浮点与 printf 的风险并说明原因 ③加分：__interrupt 可移植性，或中断置标志、任务处理的设计原则。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-358", "kind": "subjective", "kind_name": "主观题", "num": 358, "stem": "C 语言中 `int a = 5, b = 7, c; c = a+++b;` 是合法的吗，如果是它做些什么？", "options": [], "answer": "合法。C 的词法分析按最长匹配（贪心）规则切分，`a+++b` 被解析为 `a++ + b`：先取 a 的原值 5 与 b 相加得 c=12，表达式结束后 a 自增为 6。后缀 ++ 的求值有序列点保证，结果确定无歧义；若写成 `a++ + ++a` 这类同一序列点内多次修改同一变量的形式，才是未定义行为。实际编码应写成 a++ + b 以免误读。", "explain": "①合法 ②c=12 ③a 变为 6 ④加分：最长匹配规则或避免此类写法。", "sec": "2026面试题-14（软件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-359", "kind": "subjective", "kind_name": "主观题", "num": 359, "stem": "晶体管工作区域有哪几个？", "options": [], "answer": "三个工作区：截止区、放大区、饱和区（另有击穿区须避免）。判定看两个 PN 结的偏置：①截止——发射结反偏或未达开启电压（UBE 小于约 0.7V），IB≈0、IC≈0，相当于开关断开；②放大——发射结正偏、集电结反偏，IC=βIB 近似线性，用于信号放大；③饱和——两结均正偏，UCE 降到 0.1~0.3V，IC 不再随 IB 增大，相当于开关闭合；④击穿区电流剧增会损坏管子。开关应用工作在截止与饱和两态并快速切换，放大区只作瞬时过渡。", "explain": "①三个区名称 ②各区的偏置条件或用途 ③加分：说明开关应用工作在截止与饱和，放大区用于信号放大。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-360", "kind": "subjective", "kind_name": "主观题", "num": 360, "stem": "场效应管有哪几个工作区域？", "options": [], "answer": "①截止区：UGS 小于开启电压 Vth，未形成导电沟道，ID≈0，对应开关断开；②可变电阻区（线性区/欧姆区）：UGS>Vth 且 UDS 较小，沟道近似受 UGS 控制的小电阻，对应开关导通；③饱和区（恒流区/放大区）：UDS>UGS−Vth，沟道夹断，ID 主要由 UGS 决定、几乎不随 UDS 变化，用于放大与恒流源；④击穿区：UDS 过大雪崩击穿会损坏管子，须避免。术语陷阱：MOSFET 的饱和是恒流放大态，与三极管饱和=开关导通态含义相反。", "explain": "①三个主区名称 ②各区条件/用途 ③加分：辨析与三极管饱和含义相反这一点。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-361", "kind": "subjective", "kind_name": "主观题", "num": 361, "stem": "二极管的主要参数有？", "options": [], "answer": "主要参数：①最大整流电流 IF——长期允许通过的正向平均电流，选型先看它，决定散热与走线宽度；②最高反向工作电压 UR——一般取击穿电压的一半左右，超过易击穿；③反向饱和电流 IR——越小越好，对温度敏感；④正向压降 VF——硅管约 0.6~0.7V、肖特基 0.2~0.4V，影响导通损耗；⑤最高工作频率 fm（受结电容限制）与反向恢复时间 trr——高频开关电路必看；⑥击穿电压与最大耗散功率。若问稳压二极管，另有关键参数：稳定电压 UZ、动态电阻、最大功耗。", "explain": "①≥3 个参数名称正确且含义对 ②加分：说明参数的用途（选型/散热/高频限制），或补稳压管专用参数。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-364", "kind": "subjective", "kind_name": "主观题", "num": 364, "stem": "一个 MCU 电路不能正常启动，在硬件上可以从哪些方面检查？", "options": [], "answer": "①电源：各路电压是否到位、纹波与上电时序、去耦电容是否装好、VDD 与 VDDA 是否短路；②复位：复位脚是否被拉死（RC/复位芯片）、复位脉宽是否够、是否被看门狗反复复位；③时钟：晶振是否起振（示波器看波形）、负载电容是否匹配，HSE 不起振会超时切内部时钟；④BOOT 引脚配置（启动模式错会从错误区域取向量）；⑤调试口被复用或接错，导致连不上；⑥焊接短路/虚焊/错件，重点查芯片电源与地；⑦外设拉死总线：I2C/SPI 从机异常或短路使初始化卡住。", "explain": "①电源/复位 ②时钟/BOOT ③加分：焊接、总线或调试口的排查（总计≥4 项）。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-366", "kind": "subjective", "kind_name": "主观题", "num": 366, "stem": "麦克风电路录音时，出现干扰底噪声，在硬件原理图和 layout 上要做哪些方向的改善？", "options": [], "answer": "原理图方向：①电源与偏置加 RC/LC 滤波，模拟供电独立或经 LDO 二次稳压；②模拟地与数字地分区、单点接地，避免数字噪声串入；③基准电压去耦，拾音链路用差分输入，增益分配合理（前级噪声不被后级放大）。Layout 方向：①麦克风信号线尽量短，远离时钟、DCDC 开关节点、LCD 排线等干扰源；②差分对等长紧邻走线，两侧包地并打地过孔；③去耦电容紧贴引脚，电源先过电容再进芯片；④缩小 DCDC/晶振的电流回路面积；⑤结构上让麦克风开孔远离振动与风噪路径。", "explain": "①原理图方向≥2 点 ②layout 方向≥2 点 ③加分：差分/包地/回路面积或结构开孔等细节。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-367", "kind": "subjective", "kind_name": "主观题", "num": 367, "stem": "列举一下你熟悉使用画板软件。", "options": [], "answer": "Altium Designer（AD）、PADS、Cadence Allegro、KiCad（开源）、Eagle、Protel 99SE 等。答题时可再补一句熟练程度与典型项目（几层板、是否画过高速/电源板），比只列名字更有说服力。", "explain": "①≥2 个正确软件名 ②加分：说明熟练程度或做过的板卡类型。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-368", "kind": "subjective", "kind_name": "主观题", "num": 368, "stem": "两个 MCU 做通讯，一个 MCU 是 1.8V 供电，另一个 MCU 是 3.3V 供电，请问在电路设计是需要注意什么？", "options": [], "answer": "核心是电平不匹配，注意两个方向的风险：①3.3V 输出接 1.8V 器件的输入，可能超出其耐压而损坏，需降压或电平转换；②1.8V 输出接 3.3V 器件的输入，可能达不到其 VIH（约 0.7×VDD）而识别错误。方案：用双向电平转换芯片（如 TXS0108/TXB0104，I2C 用专用转换电路），单向可用电阻分压（注意速度与阈值）；确认各 IO 是否 5V 容忍或有独立 VDDIO 供电；必要时串小电阻限流并加钳位；注意上电时序与 IO 方向控制，最后实测 VIH/VIL 与边沿。", "explain": "①两个方向的电压风险 ②电平转换方案 ③加分：分压的适用条件、双向总线器件或实测验证。", "sec": "2026面试题-15（硬件工程师试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-369", "kind": "subjective", "kind_name": "主观题", "num": 369, "stem": "在 32 位系统上运行，写出下面打印的值：\nchar bufa[30] = {1,2,0};\nchar bufb[28] = \"hello\";\nchar a = 0x12;\nchar *p = \"1234567\";\nsprintf(bufa, \"%x\",a);\nprintf(\"%d %d \\n\",strlen(bufa),sizeof(bufa));\nprintf(\"%d %d %d\\n\",sizeof(p),sizeof(*p),strlen(p));", "options": [], "answer": "第一行 `2 30`：sprintf 把 0x12 转成十六进制字符串 \"12\"（strlen=2）；sizeof(bufa) 是数组声明大小 30，与内容无关。第二行 `4 1 7`：char* 在 32 位下 4 字节；*p 是 char 占 1；strlen(\"1234567\")=7。注意 bufa 原来的内容 {1,2,0} 已被 \"12\\0\" 覆盖。", "explain": "①2 30 ②4 1 7 ③加分：sizeof 看声明大小、strlen 数到 '\\0' 为止。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-370", "kind": "subjective", "kind_name": "主观题", "num": 370, "stem": "下面程序运行结果是什么？\nchar* a[] = {\"work\",\"at\",\"here\"};\nchar pa = a;\npa++;\n++pa;\nprintf(\"%s\\n\", *pa);", "options": [], "answer": "输出 `here`。char* a[] = {\"work\",\"at\",\"here\"} 是三个字符串指针组成的数组；pa 初始指向 a[0]，`pa++` 与 `++pa` 各前进一个元素（每次走一个指针的字节数），共前进两次到 a[2]，*pa 即 \"here\"。", "explain": "①here ②说明指针步长等于元素大小。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-371", "kind": "subjective", "kind_name": "主观题", "num": 371, "stem": "`Sizeof(struct test1)` 的值是多少？（struct { int a; int b; Char c; Char d; }）", "options": [], "answer": "12 字节。计算：int a 占 4、int b 占 4、char c 占 1、char d 占 1，合计 10；结构体大小需按最大成员对齐（4 的倍数），故补齐 2 字节到 12。规则：每个成员按自身对齐要求放置，结构体整体大小为最大成员对齐数的整数倍（可用 #pragma pack 改变）。", "explain": "①12 ②对齐规则（成员对齐加整体取最大对齐的整数倍）③加分：提 #pragma pack 或成员顺序对填充的影响。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-372", "kind": "subjective", "kind_name": "主观题", "num": 372, "stem": "以下程序运行后，输出结果是？\n#define PT 6.5\n#define S(x) PT*x*x\nmain() { int a=2, b=3; printf(\"%f\\n\", S(a+b)); }", "options": [], "answer": "展开式为 `6.5*2+3*2+3`（S(x) 里的 x 被替换成 a+b，宏只做文本替换且没有括号）→ 13+6+3 = 22，printf 用 %f 输出 22.000000。正确写法 `#define S(x) ((PT)*(x)*(x))`，则 (6.5)*(5)*(5)=162.5。", "explain": "①展开式正确 ②22.000000 ③加分：写出带括号的正确宏或解释优先级陷阱。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-373", "kind": "subjective", "kind_name": "主观题", "num": 373, "stem": "下面程序运行时的输出结果是？\nmain() { int a=7; printf(\"\\na=%d\", ++a+2); }", "options": [], "answer": "输出 \"a=10\"。前缀 `++a` 先把 a 由 7 自增为 8，再参与加法，8+2=10；格式串开头的 \\n 只产生换行，不影响数值。", "explain": "①a=10 ②前缀 ++ 先自增后取值。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-374", "kind": "subjective", "kind_name": "主观题", "num": 374, "stem": "以下程序的输出结果是？\nvoid fun(int a, int b, int c) { a=a+1; b=b+2; c=c+3; }\nmain() { int a=5, b=3, c=2; fun(a,b,c); printf(\"%d,%d,%d\\n\", a, b, c); }", "options": [], "answer": "输出 `5,3,2`。C 的参数是值传递，fun 内的 a、b、c 只是实参的副本，函数内修改副本不会影响 main 中的变量；main 里的 a、b、c 始终保持 5、3、2。若要修改调用者的变量，需传指针（如 void fun(int *a,...)）或数组。", "explain": "①结果 5,3,2 ②值传递机制说明 ③加分：给出传指针的正确写法。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-375", "kind": "subjective", "kind_name": "主观题", "num": 375, "stem": "以下程序输出什么？\nint a[5]={1,3,5,7,9};\nint *pstr = (int*)(&a+1);\nPrintf(\" %d %d \\n\",*(pstr-2),*(a+2));", "options": [], "answer": "输出 `7 5`。`&a` 的类型是数组指针 int(*)[5]，`&a+1` 跳过整个数组（5 个 int，20 字节），pstr 指向数组之后；`pstr−2` 退回 2 个 int，指向 a[3] = 7。`*(a+2)` 即 a[2] = 5。要点：区分 a（退化为元素指针，步长 4 字节）与 &a（数组指针，步长 20 字节）。", "explain": "①7 ②5 ③加分：&a+1 步长=整个数组（与 a+1 的差异）。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-377", "kind": "subjective", "kind_name": "主观题", "num": 377, "stem": "`int aa[2][5] = {...};` 打印的值是？\nint *ptr1 = (int *)(&aa + 1);\nint *ptr2 = (int *)(*(aa + 1));\nprintf( \" %d,%d\", *(ptr2 - 2), *(ptr1 - 2));", "options": [], "answer": "`4,9`。aa 为 2×5 数组（按 1~10 初始化）：ptr2 = *(aa+1) = &aa[1][0]（全局下标 5），ptr2−2 退到下标 3，即 aa[0][3]=4；ptr1 = &aa+1 跳过整个数组（10 个 int），ptr1−2 即倒数第二个元素 aa[1][3]=9。要点：分清元素指针步长与数组指针步长的区别。", "explain": "①4 ②9 ③加分：区分 a+1 与 &a+1 的步长/数组退化。", "sec": "2026面试题-17（C 语言试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-378", "kind": "subjective", "kind_name": "主观题", "num": 378, "stem": "把十进制 69 转化为二进制\\_\\_\\_\\_\\_\\_。十六进制 23 转化为十进制\\_\\_\\_\\_\\_\\_。", "options": [], "answer": "1000101B；35。计算：69 = 64+4+1 = 2^6+2^2+2^0，逐位写为 1000101B（也可用除 2 取余法验证）；0x23 = 2×16 + 3 = 35。", "explain": "①1000101（B）②35 ③加分：给出换算过程（按权展开/除 2 取余）。", "sec": "2026面试题-18（电子工程师测试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-381", "kind": "subjective", "kind_name": "主观题", "num": 381, "stem": "-1 的十六进制：\\_\\_\\_\\_\\_\\_；十进制 135 的十六进制：\\_\\_\\_\\_\\_\\_；0x30 对应的 ASCII 码字符是：\\_\\_\\_\\_\\_\\_。", "options": [], "answer": "0xFFFFFFFF（32 位补码；若按 8 位口径则为 0xFF）；0x87；字符 '0'。推导：负数用补码表示，-1 即全 1；135 = 128+7 = 0x80+0x07 = 0x87；ASCII 中 0x30 正是数字字符 '0' 的编码（'1' 为 0x31 依次递增，转换数字时常用 value = ch - '0'）。", "explain": "①0xFFFFFFFF（或 0xFF）②0x87 ③'0' ④加分：说明补码或 ASCII 0x30~0x39 的规律。", "sec": "2026面试题-20（单片机开发工程师面试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-382", "kind": "subjective", "kind_name": "主观题", "num": 382, "stem": "`const char *p;` 和 `char const *p;` 这两种修饰指针有什么区别。", "options": [], "answer": "没有区别，两者完全等价——都表示\"指向 const char 的指针\"：*p（所指内容）不可改，p 本身可以改指向其他地址。若要锁定指针本身，应把 const 写到 * 右边：`char * const p` 是常量指针（本身不可改，内容可改）。记忆法：const 在 * 左边修饰内容，在 * 右边修饰指针。", "explain": "①没有区别（都指所指内容只读）②加分：与 char * const p 对比，或给出记忆法。", "sec": "2026面试题-20（单片机开发工程师面试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-383", "kind": "subjective", "kind_name": "主观题", "num": 383, "stem": "下面程序的输出是什么？\nvoid add(int v) { v += 1; }\nvoid main() { int v = 8; add(v); printf(\"%d\",v); }", "options": [], "answer": "输出 8。C 是值传递，add 内的形参 v 只是实参的副本，v += 1 只修改副本，main 中的 v 保持不变。另注：void main() 写法不规范，标准应为 int main(void)。", "explain": "①8 ②值传递说明 ③加分：指出 void main 的规范性问题。", "sec": "2026面试题-20（单片机开发工程师面试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-384", "kind": "subjective", "kind_name": "主观题", "num": 384, "stem": "分析以下程序，分别给出 a、b、c、d 的输出值：\nint main(){\n    int a,b,c,d;\n    a=10;  b=a++;  c=++a;  d=10*a++;\n    printf(\"a=%d, b=%d, c=%d, d=%d\\n\",a, b, c, d);\n}", "options": [], "answer": "a=13, b=10, c=12, d=120。逐步分析：b = a++ 后缀先取值（b=10）再让 a=11；c = ++a 前缀先自增（a=12）再赋值（c=12）；d = 10 * a++ 先取 a=12 得 d=120，之后 a 自增为 13。要点：前缀先自增减后取值，后缀先取值后自增。", "explain": "①四个值 a=13、b=10、c=12、d=120 ②前缀/后缀自增的求值顺序分析。", "sec": "2026面试题-20（单片机开发工程师面试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-385", "kind": "subjective", "kind_name": "主观题", "num": 385, "stem": "在下面程序每一行 printf 后面填写输出的值：\nchar *p = \"abcd\";\nprintf(\"%d\\n\", sizeof(\"abcd\"));   // ?\nprintf(\"%d\\n\", sizeof(p));        // ?\nprintf(\"%d\\n\", sizeof(&p));       // ?\nprintf(\"%d\\n\", sizeof(p+5));      // ?\nprintf(\"%d\\n\", sizeof(*p));       // ?\nprintf(\"%d\\n\", strlen(p));        // ?\nprintf(\"%d\\n\", strlen(&p[1]+1));  // ?", "options": [], "answer": "5、4、4、4、1、4、2（按 32 位指针 4 字节）。逐项：sizeof(\"abcd\")=5（含 '\\0'）；sizeof(p)=4（指针）；sizeof(&p)=4（二级指针）；sizeof(p+5)=4（指针运算结果仍是指针）；sizeof(*p)=1（char）；strlen(p)=4；strlen(&p[1]+1) 即 strlen(\"cd\")=2。注意 sizeof 在编译期求类型大小，strlen 在运行期数到 '\\0' 为止。", "explain": "①7 个值全对 ②sizeof 与 strlen 的区别 ③加分：说明 sizeof 不求值/不访问内存。", "sec": "2026面试题-20（单片机开发工程师面试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-387", "kind": "subjective", "kind_name": "主观题", "num": 387, "stem": "简述嵌入式软件开发中\"调试\"的核心步骤，以及 J-Link 工具的作用。", "options": [], "answer": "调试核心步骤：①编译烧录并确认版本；②运行观察（串口日志、断点、单步）复现问题；③定位根因——查看变量、寄存器、内存、调用栈，用二分缩小范围；④修改并验证（一次改一处，确认修复）；⑤回归测试防止引入新问题；⑥记录问题与结论。J-Link：ARM 调试/下载器，经 SWD/JTAG 连接目标，支持下载固件、设置硬件/软件断点、单步执行、读写内存与寄存器、查看调用栈；配合 RTT/ITM 可在不占用串口的情况下输出调试信息。", "explain": "①调试步骤（含定位手段）②J-Link 功能≥2（下载/断点/单步/读写内存/RTT）③加分：提 RTT/ITM 或硬件断点数量限制。", "sec": "2026面试题-21（A 卷-软件方向）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-388", "kind": "subjective", "kind_name": "主观题", "num": 388, "stem": "请列举 3 种常见的嵌入式通信协议（如 USB、蓝牙、2.4G），并说明其核心应用场景。", "options": [], "answer": "任选三种（示例）：UART——异步串口，用于调试打印与模块 AT 指令；I2C——两线总线，板内传感器、EEPROM、PMIC；SPI——四线高速，Flash、LCD、ADC；USB——与上位机通信或存储；BLE——可穿戴、手机互联的低功耗场景；CAN——汽车与工业现场总线，多节点、抗干扰、距离远。答题时最好写出速率/距离/拓扑特点，说明选型依据。", "explain": "①3 种协议 ②各自核心场景 ③加分：说明速率/距离/拓扑特点或选型依据。", "sec": "2026面试题-21（A 卷-软件方向）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-389", "kind": "subjective", "kind_name": "主观题", "num": 389, "stem": "什么是\"代码规范\"？在团队开发中，遵守代码规范的意义是什么？", "options": [], "answer": "定义：代码规范是团队对命名、格式、缩进、注释、错误处理、目录结构等作出的统一约定（如 MISRA-C、Google 编码风格）。意义：①提高可读性与可维护性，降低接手成本；②统一风格减少低级错误与评审摩擦；③便于静态检查/格式化工具自动化，可用于 CI 卡口；④让代码评审聚焦逻辑而非格式；⑤长期项目知识沉淀，人员流动影响更小。", "explain": "①定义 ②意义≥2 ③加分：提 MISRA/静态检查工具或 CI 集成。", "sec": "2026面试题-21（A 卷-软件方向）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-390", "kind": "subjective", "kind_name": "主观题", "num": 390, "stem": "当开发中遇到\"程序跑飞\"或\"死循环\"时，你会如何排查和解决？", "options": [], "answer": "①先定位现象：用调试器暂停看 PC、调用栈、栈指针，判断卡在死循环、等待中断还是硬件异常（如 HardFault）。②排查常见根因：数组越界/野指针/栈溢出覆盖返回地址；中断冲突、优先级错误、标志未清；看门狗复位；死等某个标志却漏了 volatile；资源竞争或死锁。③缩小范围的手段：串口/RTT 分段打点日志、设断点二分、注释代码、查看关键变量与寄存器。④修复并加固：加边界检查与断言、开启看门狗、监控栈水位，补回归测试防止复发。", "explain": "①先定位（PC/栈/异常类型）②根因清单≥3 ③加分：加固措施（断言/看门狗/栈水位）与回归测试。", "sec": "2026面试题-21（A 卷-软件方向）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-391", "kind": "subjective", "kind_name": "主观题", "num": 391, "stem": "`#define SQUARE(x) x*x`，`int a = 5;`，`SQUARE(a+1);` 结果是多少？", "options": [], "answer": "11。SQUARE(a+1) 展开为 `a+1*a+1`（宏只做文本替换，参数没加括号），乘法优先级更高，故为 5 + 1*5 + 1 = 11；按数学的 (5+1)² 得 36 是错误直觉。正确宏应写 `#define SQUARE(x) ((x)*(x))`，展开为 (5+1)*(5+1)=36。这题是宏缺括号的经典陷阱。", "explain": "①11 ②展开式分析 ③加分：写出正确宏与 36。", "sec": "2026面试题-22（C 语言/硬件试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-392", "kind": "subjective", "kind_name": "主观题", "num": 392, "stem": "寄存器位操作：32 位寄存器 REG，清零第 5 位、设置第 2 位为 1。", "options": [], "answer": "清零第 5 位：`REG &= ~(1 << 5);`（先构造只有第 5 位为 1 的掩码再取反，与运算保留其余位）\n置 1 第 2 位：`REG |= (1 << 2);`（或运算置位，不影响其它位）\n延伸：常量加 u 后缀（`1u << 5`）可避免有符号移位问题；判断第 n 位用 `if (REG & (1u << n))`，翻转用 `REG ^= (1u << n);`；读写寄存器建议用读-改-写或直接位带/BitBand 操作。", "explain": "①两句代码正确 ②说明掩码取反清零、或运算置位的原理 ③加分：1u 后缀、位判断或翻转写法。", "sec": "2026面试题-22（C 语言/硬件试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-393", "kind": "subjective", "kind_name": "主观题", "num": 393, "stem": "以下代码有什么问题？\nchar *p = \"hello\";\np[0] = 'H';", "options": [], "answer": "p 指向字符串字面量，字面量存放在只读数据段（.rodata），对其写入是未定义行为（通常立即段错误崩溃，也可能看似正常的隐性错误）。修改内容应改用数组：`char p[] = \"hello\"; p[0] = 'H';`（数组在栈上有可写副本）；若只是只读访问，建议写 `const char *p = \"hello\";`，让编译器帮你拦住误写。", "explain": "①只读段写入/未定义行为 ②给出修正（char 数组或 const 指针）③加分：提编译器警告或 .rodata 机制。", "sec": "2026面试题-22（C 语言/硬件试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-394", "kind": "subjective", "kind_name": "主观题", "num": 394, "stem": "`const int *p` 和 `int * const p` 区别是？", "options": [], "answer": "区别在于 const 修饰谁：`const int *p` 中 const 修饰 int，即 *p 只读（不能通过 p 改值），p 本身可以改指向别的变量；`int * const p` 中 const 修饰 p 本身，p 是常量指针（定义时必须初始化，不能再指向别处），但 *p 可以改。两者可组合为 `const int * const p`——内容和指针都不可改。记忆法：从右往左读——pointer to const int 与 const pointer to int。", "explain": "①谁被锁定（内容 vs 指针）②加分：记忆法或 const int * const p 的组合。", "sec": "2026面试题-22（C 语言/硬件试题）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-395", "kind": "subjective", "kind_name": "主观题", "num": 395, "stem": "小车最大速度 10m/s，加速度 10m/s²，从 A 点行驶到 1000m 处 B 点去接人，请计算到达 B 点最短时间。给出解答步骤。", "options": [], "answer": "结论 100.5s（按到达即经过该点的理解）。步骤：小车先以 a=10m/s² 加速到最大速度 v=10m/s，t₁ = v/a = 1s，加速段位移 s₁ = v²/(2a) = 100/20 = 5m；剩余 1000−5 = 995m 以 10m/s 匀速，t₂ = 995/10 = 99.5s；总时间 = 1 + 99.5 = 100.5s。补充：若要求在 B 点刹停接人，还需制动段（同样 1s、5m），匀速段变为 990m/99s，总计 101s；答题时写清假设即可。", "explain": "①分段思路（先加速后匀速）②100.5s ③加分：说明刹车假设得到 101s。", "sec": "小车题卷（2025面试题-12 / 2026面试题-8、16、19，同卷合并）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-397", "kind": "subjective", "kind_name": "主观题", "num": 397, "stem": "简单描述数组与链表的优缺点。", "options": [], "answer": "数组：内存连续，按下标随机访问 O(1)（直接地址计算），缓存友好、无额外空间开销；缺点是指定大小固定，插入/删除需搬移元素为 O(n)。链表：节点由指针串接，已知位置时插入/删除为 O(1)（只改指针），可动态增长；缺点是随机访问要逐个遍历 O(n)，每节点额外存指针，缓存不友好且易碎片/泄漏。选型：频繁按下标读取、长度稳定用数组；频繁插入删除、长度不可预知用链表。", "explain": "①数组优缺点≥2 ②链表优缺点≥2 ③加分：给出选型依据。", "sec": "小车题卷（2025面试题-12 / 2026面试题-8、16、19，同卷合并）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-398", "kind": "subjective", "kind_name": "主观题", "num": 398, "stem": "简单描述堆、栈、队列，以及他们的区别是什么？", "options": [], "answer": "先分清语境：①堆——内存中由 malloc/new 动态申请、由程序员手动释放的大块区域（与栈相对，易产生碎片与泄漏）；②栈——后进先出（LIFO）的存储区，函数调用时自动分配帧、存放局部变量与返回地址，返回即释放，速度快但空间小；③队列——按先进先出（FIFO）访问的数据结构，入队在尾、出队在头，常用环形缓冲实现，用于任务缓冲与消息传递。区别：堆与栈是按内存分配方式与管理主体区分，队列是按访问顺序的数据结构，与前两者不在同一维度（队列本身也可用数组或链表实现）。", "explain": "①三者概念 ②堆栈区别（管理方式/空间/速度）③加分：辨析队列与堆栈不在同一维度。", "sec": "小车题卷（2025面试题-12 / 2026面试题-8、16、19，同卷合并）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-399", "kind": "subjective", "kind_name": "主观题", "num": 399, "stem": "文字或者画图描述一种矩阵式按键检测方式。", "options": [], "answer": "矩阵键盘把行列线交叉成网格：行线接 MCU 输出、列线接输入（通常各带上拉）。扫描时逐行输出低电平（其余行保持高），读取列线：某列为低说明该行该列交叉处按键按下；逐行轮询即得到键位坐标。注意点：①行线切换后要留稳定时间，等列线电平建立再读；②按键需去抖（10~20ms，用定时器周期扫描或状态机，避免纯延时）；③多键同按会出现鬼影（ghosting），可加二极管或限制单键；④可在定时器中断中周期扫描，键值入队后交任务处理。", "explain": "①行列扫描原理（输出行、读列，反向亦可）②去抖与扫描周期 ③加分：鬼影/二极管、定时器中断扫描或键值入队。", "sec": "小车题卷（2025面试题-12 / 2026面试题-8、16、19，同卷合并）", "sec_group": "五、2026 年", "imgs": []}, {"id": "sub-400", "kind": "subjective", "kind_name": "主观题", "num": 400, "stem": "有以下程序段，写出执行后的输出结果：\nint list[]={6,7,8,9,10};\nint *p;\np=list;\n*(p+2)=10;\nprintf(\"%d,%d\\n\",*p,*(p+2));", "options": [], "answer": "输出 `6,10`。\n① `p=list` 让 p 指向数组首元素 list[0]（值 6）；② `*(p+2)=10` 把 list[2]（原值 8）改写为 10，注意这是赋值不是取值，因此数组被修改；③ 打印 `*p` 得 6，打印 `*(p+2)` 得 10，结果为 `6,10`。", "explain": "① 正确说明 *(p+2) 是左值（写 a[2]）② 输出 \"6,10\" ③ 加分：指出 `*(p+2)` 等价于 `p[2]`、`*(p+2)=10` 与 `p[2]=10` 完全等价，且数组内容被实际改变。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-401", "kind": "subjective", "kind_name": "主观题", "num": 401, "stem": "如下代码，最终 value 的值是（　）\nint *p1,*p2;\nint value;\np1=(int*)0x400;\np2=(int*)0x408;\nvalue=p2-p1;", "options": [], "answer": "value = 2。\n两个 int 指针相减，结果不是字节差而是元素个数差：字节差＝0x408−0x400＝8 字节，除以 sizeof(int)＝4，得 8/4＝2。所以 value 是 2 而不是 8。", "explain": "① 答出 2 ② 说明指针相减结果以\"元素个数\"为单位（除以 sizeof(int)）③ 加分：指出该式仅在同一数组内的两个指针间才有定义良好的语义，否则属未定义行为，此处只是考计算公式。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-402", "kind": "subjective", "kind_name": "主观题", "num": 402, "stem": "如下代码，printf 的结果为（　）\nvoid main(void)\n{\n    char x=0,y=0;\n    while(x<=15)\n    {\n        x++;\n        if(x%2!=0)\n            y=(++y)+(++x);\n    }\n    printf(\"%d,%d\",x,y);\n}", "options": [], "answer": "输出 16,80。\n逐轮推导（x 为奇数时才执行赋值，且 `++y`、`++x` 都会使变量自增）：\n- x=1：y=(++y)+(++x) → y=1，x=2，y=1+2=3\n- x=3：y=4，x=4，y=4+4=8\n- x=5：y=9，x=6，y=9+6=15\n- x=7：y=16，x=8，y=24\n- x=9：y=25，x=10，y=35\n- x=11：y=36，x=12，y=48\n- x=13：y=49，x=14，y=63\n- x=15：y=64，x=16，y=80（x 已到 15 时循环条件仍成立）\n循环条件 x<=15 在 x=16 时为假，退出，故打印 `16,80`。", "explain": "① 结果 16,80 ② 说明 ++x 会额外把循环变量推快一步（每次奇数轮 x 增加 2）③ 加分：指出 y=(++y)+(++x) 同时依赖两个自增副作用、求值顺序未指定，属未定义/实现相关行为，实际工程中严禁这样写。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-403", "kind": "subjective", "kind_name": "主观题", "num": 403, "stem": "有如下程序段，运行该程序的输出结果是（　）\nmain()\n{\n    int y=3,x=3,z=1;\n    printf(\"%d%d\\n\", (++x,y++), z+2);\n}", "options": [], "answer": "输出 3,3。\n① 第一项 `(++x,y++)` 是逗号表达式：从左到右求值，整个表达式的值等于最后一个子表达式的值，即 `y++` 的值＝3（y 自增为 4，但取值时用旧值 3）；② 第二项 `z+2`＝1+2＝3；③ 逗号表达式在 printf 参数位置必须加括号，否则会被解析为多个实参。所以输出 `3,3`。", "explain": "① 结果 3,3 ② 说明逗号表达式的值取最后一个子表达式 ③ 加分：指出 y++ 是后缀自增（先取值后加 1）、若写成 ++y 则结果变 4；printf 参数求值顺序未指定，多项带副作用会踩坑。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-404", "kind": "subjective", "kind_name": "主观题", "num": 404, "stem": "设有 `int a=1,b=2,c=3,d=4,m=2,n=2;` 执行 `(m=a>b)&&(n=c>d)` 后，n 的值为（　）", "options": [], "answer": "n = 2（未被修改）。\n① `a>b` 即 1>2 为假（0），m 被赋值 0；② `&&` 具有短路特性：左操作数为 0 时右操作数不再求值，因此 `n=c>d` 根本不执行，n 保持原值 2；③ 反过来若写成 `(m=a<b)&&(n=c>d)`，左侧为真则右侧会执行：c>d 为假，n 被赋 0。", "explain": "① 答出 2 ② 说明逻辑与的短路求值（左侧假则右侧不求值）③ 加分：指出 m 的值被改为 0，并列出台达式最终结果为 0；提到 `||` 也有短路（左侧真则右侧不求值）。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-405", "kind": "subjective", "kind_name": "主观题", "num": 405, "stem": "下列程序中 AAA、BBB 在 32 位系统下字节对齐为 4 的情况下，占用的空间大小分别是多少？（　）\nstruct tagAAA\n{\n    unsigned char  ucId;    //1\n    unsigned short usData;  //2\n    unsigned long  ulData;  //4\n}AAA;\n\nstruct tagBBB\n{\n    unsigned char  ucId;    //1\n    unsigned long  ulData;  //4\n    unsigned short usData;  //2\n}AAA;", "options": [], "answer": "分别是 8 字节和 12 字节。\n① tagAAA：ucId 占 0 字节处，usData 需 2 字节对齐（偏移 1 不行）→ 补 1 字节到偏移 2，占 2~3；ulData 需 4 字节对齐，偏移 4 正好 → 占 4~7；总大小 8，已是最大成员对齐数 4 的倍数，sizeof=8。\n② tagBBB：ucId 在 0，ulData 需 4 对齐 → 补 3 字节到偏移 4，占 4~7；usData 在偏移 8，占 8~9；结构整体需按最大对齐数 4 补齐到 12，sizeof=12。\n③ 结论：成员顺序影响结构体大小（8 vs 12），把大类型成员排在前、小类型排在后可减少填充。", "explain": "① 8 与 12 两个数值 ② 说明\"成员自身对齐 + 结构体按最大成员对齐数补齐\"两条规则 ③ 加分：指出通过重排成员可从 12 优化到 8，或提及 `#pragma pack(1)`/`__attribute__((packed))` 可取消填充但会带来非对齐访问开销。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-406", "kind": "subjective", "kind_name": "主观题", "num": 406, "stem": "以下程序的输出结果为（　）\n#include <stdio.h>\nint main()\n{\n    intx,y=0;\n    for(x=1;x<=10;x++)\n    {\n        if(y>=10)\n            break;\n        y=y+x;\n    }\n    printf(\"%d %d\",y,x);\n}", "options": [], "answer": "输出 10 5。\n累加过程：x=1→y=1；x=2→y=3；x=3→y=6；x=4→y=10；x=5 时进循环先判 `y>=10` 成立 → break 直接跳出，此后 for 的 `x++` 不再执行，故 x 停在 5。打印 `10 5`。", "explain": "① 结果 10 与 5 ② 说明 break 跳出后不再执行 for 的表达式 x++ ③ 加分：指出若把判断改成 y+x>=10 或把 break 放在累加之后，x 会是 4；并说明 break 只跳出一层循环、continue 才跳过本次剩余语句。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-407", "kind": "subjective", "kind_name": "主观题", "num": 407, "stem": "翻译题：请把下面这段关于时钟同步标准的文字译成中文。\n> This standard defines a protocol enable precise synchronization of clocks in measurement and control systems implemented with technologies such as network communication, local computing, and distributed objects. The protocol is applicable to systems communicating by local area networks supporting multicast message including, but not limited to, Ethernet. The protocol enables heterogeneous systems that include clocks of various inherent precision, resolution, and stability to synchronize to a grandmaster clock.", "options": [], "answer": "该标准定义了一种协议，使以网络通信、本地计算和分布式对象等技术实现的测量与控制系统的时钟能够精确同步。该协议适用于通过支持多播报文的局域网进行通信的系统，包括但不限于以太网。该协议使包含各种固有精度、分辨率和稳定性的时钟的异构系统能够同步到一个主时钟（grandmaster clock）。", "explain": "① 三句话信息完整（协议目的＝精确同步；适用范围＝支持多播的局域网/以太网；能力＝异构系统同步到主时钟）② 关键术语译对：synchronization 同步、heterogeneous system 异构系统、resolution 分辨率、grandmaster clock 主/顶级时钟 ③ 加分：语句通顺、无漏译 \"including, but not limited to\"（包括但不限于）与 \"precise\"（精确）。", "sec": "3.1 面试题4（程序输出 / 填空 / 翻译，8 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-408", "kind": "subjective", "kind_name": "主观题", "num": 408, "stem": "i++ 和 ++i 的判断返回值有什么不同？请写代码说明。", "options": [], "answer": "int i = 5;\nint a = i++;   // a = 5（先取值后自增），此后 i = 6\nint b = ++i;   // i 先自增为 7，再取值 → b = 7\n区别：①后缀 `i++` 表达式的值是自增前的旧值，前缀 `++i` 的值是自增后的新值，两者最终都把 i 加 1；②实现上后缀版需要保存旧值（可能产生临时量），前缀版可直接返回自身，故在自定义类型（如迭代器）中前缀版效率更高，C++ 中推荐 `++it`；③作为独立语句使用时（`i++;`）两者完全等价，编译器会优化掉临时量。\n补充典型陷阱：`printf(\"%d %d\", i++, ++i)` 结果不确定（参数求值顺序未指定）；`a[i] = i++;` 属未定义行为。", "explain": "① 旧值/新值的区别 ② 给出可运行的对比代码 ③ 加分：提到迭代器/自定义类型中前缀效率更高，或指出参数求值顺序导致的未定义行为。", "sec": "3.2 欣诺通信面试题（2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-409", "kind": "subjective", "kind_name": "主观题", "num": 409, "stem": "文件 IO 中，要在文件的末尾追加内容，应该用哪个方式字母？", "options": [], "answer": "用 'a'（文本追加）或 'b' 无关的 'ab'（二进制追加）；需要既能读又能写时用 'a+'。\n说明：①`fopen(path, \"a\")` 以写入方式打开，若文件存在则定位到文件末尾，之后写入的内容追加在原内容之后、原内容不被清空；若文件不存在则创建新文件。②绝不能错用 `\"w\"` —— \"w\" 会先把文件长度截断为 0（内容全部丢失），这是工程中最常见的误用。③\"r+\" 也不保证写在末尾，写入位置取决于当前文件指针。④打开成功必须 fclose，否则缓冲区数据可能未落盘。", "explain": "① 答出字母 a ② 说明 a 是\"追加且不清空、不存在则创建\" ③ 加分：对比 w/r+ 的行为差异，或提到 a+ 与 fflush/fclose 的必要性。", "sec": "3.2 欣诺通信面试题（2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-410", "kind": "subjective", "kind_name": "主观题", "num": 410, "stem": "填空题：在头文件中加入 ifndef/define/endif 的作用是（　）", "options": [], "answer": "作用是防止头文件被重复包含（重复编译），即实现\"头文件保护（include guard）\"。典型写法：\n#ifndef __XXX_H__\n#define __XXX_H__\n/* 头文件正文：类型定义、宏、函数声明 */\n#endif\n工作机制：首次包含时 `__XXX_H__` 未被定义，条件成立 → 定义该宏并编译正文；第二次再包含同一个头文件时，宏已定义 → `#ifndef` 为假，正文被预处理\"跳过\"，从而避免\"重复定义\"类编译错误。\n补充：①C++/现代 C 也可用 `#pragma once`（更简洁但非标准）；②重复包含会导致 struct/typedef/enum 重定义、外部变量重定义等错误；③宏名建议加项目/文件前缀避免与其他头文件冲突。", "explain": "① 答出\"防止头文件重复包含/重复编译\" ② 写出 ifndef/define/endif 三段结构 ③ 加分：提到 `#pragma once`，或说明不保护的后果（重定义错误）。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-411", "kind": "subjective", "kind_name": "主观题", "num": 411, "stem": "0x01<<2+3 的值为多少？为什么？", "options": [], "answer": "值为 32。因为 `+`（加法）的优先级高于 `<<`（移位），表达式等价于 `0x01 << (2+3)` ＝ `0x01 << 5` ＝ 1×2⁵ ＝ 32。\n延伸：①C 语言运算符优先级顺序大致为：`()`/`[]` > 单目 > 算术（* / % 高于 + −）> 移位 > 关系 > 相等 > 位与 > 异或 > 位或 > 逻辑与或 > 三目 > 赋值 > 逗号；②移位与加减混用极易出错，建议一律加括号写成 `0x01 << (2+3)`；③若写成 `0x01 << 2 + 3` 想表达\"左移 2 位再加 3\"，实际结果是 4+3＝7，两种情况差之千里。", "explain": "① 结果 32 ② 说明加法优先级高于移位，等价于 0x01<<(2+3) ③ 加分：给出加括号的规范写法并列出相邻优先级关系。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-412", "kind": "subjective", "kind_name": "主观题", "num": 412, "stem": "当关键字 static 修饰一个变量的时候，它的意义是什么？例如 static var=0；当关键字 static 修饰一个函数时，它的意义是什么？例如 static add(int a,int b)；", "options": [], "answer": "一、static 修饰变量（分两种场景）\n1. 静态局部变量：如函数内的 `static int var=0;`。①只初始化一次（程序运行期只赋一次初值，之后沿用上次的值）；②生命周期从程序开始到结束，不在栈上而是存放在静态存储区（.data/.bss），函数返回后仍保留；③作用域仍限于本函数内；④未显式初始化时自动清 0。\n2. 静态全局变量：如文件顶层的 `static int var;`。作用域被限制在本文件内（内部链接），其他文件即便用 extern 也无法访问，可避免命名冲突与意外污染。\n二、static 修饰函数\n`static int add(int a,int b);` 表示该函数仅在本文件内可见（内部链接），其他 .c 文件不得调用；好处是①隐藏实现细节、避免不同文件同名函数冲突；②便于编译器内联与优化（编译器知道不会跨文件调用）。\n三、工程意义：①限制可见性，减少命名污染（模块化封装）；②保留状态，实现\"计数器/一次性初始化/状态机\"；③`static` 局部变量常用于避免全局变量滥用，同时保住了数据的安全性（必须通过本函数访问）。", "explain": "① static 局部变量＝只初始化一次 + 生命周期贯穿程序 + 存静态区 ② static 全局变量/函数＝仅本文件可见（内部链接）③ 加分：提到自动清 0、避免命名冲突、模块化封装或\"函数内 static 数组不释放\"的用法。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-413", "kind": "subjective", "kind_name": "主观题", "num": 413, "stem": "关键字 volatile 有何含义？请举 3 个例子。", "options": [], "answer": "volatile 是 C 的类型限定符，它告诉编译器\"该变量可能在程序控制流之外被改变\"，因此：①每次访问都必须真正去内存（或该地址）读取，不做寄存器缓存；②编译器不得删除、合并、重排与该变量相关的访问（不能把它当\"无用代码\"优化掉）；③它不是并发安全的保证（不提供原子性与内存屏障，多线程同步要用原子操作/互斥锁）。\n三个典型例子：\n1. 并行设备的硬件寄存器：如状态寄存器 `volatile uint32_t *STAT = (uint32_t*)0x40000000;` —— 硬件会自行改变其值，去掉 volatile 后 `while(*STAT & 0x01);` 可能因编译器只读一次而变成死循环。\n2. 中断服务程序中访问/修改的全局（非自动）变量：主循环 `while(!flag);` 等待、ISR 里置 `flag=1`。若 flag 不是 volatile，主循环可能被优化成只读一次，永远等不到标志变化。\n3. 多线程/多任务共享的变量（如 RTOS 中任务与中断共享的缓冲区索引、环形队列读写指针）：确保每次都重新从内存读取最新值。\n补充易错点：①`volatile` 与\"优化等级\"无关，任何优化等级下都必须遵守；②它不保证 64 位变量的读写在多核下原子；③C++ 中还有内存序语义，C 中它只是\"禁止假设值不变\"。", "explain": "① 答出\"每次直接读内存/禁止编译器优化、不缓存到寄存器\" ② 给出≥3 个例子（硬件寄存器、中断共享变量、多线程共享变量）③ 加分：指出 volatile 不保证原子性/不能替代互斥或内存屏障。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-414", "kind": "subjective", "kind_name": "主观题", "num": 414, "stem": "一个参数既可以是 const 还可以是 volatile 吗？解释为什么。", "options": [], "answer": "可以。典型例子是只读的状态寄存器：\nvolatile const uint32_t *STATUS = (uint32_t*)0x40021000;\n解释：①`volatile` 表示\"值可能被程序之外的因素（硬件/中断）意外改变\"，所以每次都要重新读，编译器不能缓存或优化掉；②`const` 表示\"程序本身不应该（也不允许通过这个指针）去修改它\"；两者作用维度不同——一个管\"谁可能改\"，一个管\"我能不能改\"，因此不矛盾，可同时出现。\n补充：①用指针声明时要注意 const 的位置：`const volatile uint32_t *p` 是\"指向只读 volatile 的指针\"；`uint32_t * const volatile p` 是\"指针本身 const volatile\"；②若寄存器真需要写则不能加 const（或通过另一个非 const 指针访问）；③C++ 中同理。", "explain": "① 答\"可以\" ② 说明 volatile 管\"可能被外部改变\"、const 管\"程序不应修改\"，二者不冲突 ③ 加分：举只读状态寄存器例子，或辨析 const 与 volatile 修饰指针时位置不同带来的差别。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-415", "kind": "subjective", "kind_name": "主观题", "num": 415, "stem": "一个指针可以是 volatile 吗？解释为什么。", "options": [], "answer": "可以。例如中断服务程序会修改一个指向缓冲区的指针：\nvolatile char *pRx;              // 所指向的内容可能随时变\nchar * volatile pBuf;            // 指针本身可能被 ISR 改写\nvolatile char * volatile pBoth;  // 两者都可能变\n解释：①`volatile char *p` 表示 p 指向的内容是 volatile（读取 *p 每次都要重新从内存取）；②`char * volatile p`（volatile 在 * 右侧）表示指针变量 p 自身是 volatile —— ISR 可能随时改写 p 的指向，主程序每次使用 p 都必须重新从内存读取该指针值，不能把它缓存在寄存器中；③两者可叠加。\n工程意义：在\"生产者中断写、消费者任务读\"的环形缓冲区设计中，用 `char * volatile` 修饰读写指针（或索引）是常见做法，否则编译器可能认为指针不变而优化掉重读。\n易错点：指针是 volatile 不等于所指向的数据是 volatile，也不等于数据是原子的——若指针是 32/64 位且可能被中断打断，仍需临界区保护。", "explain": "① 答\"可以\" ② 说明 volatile 修饰指针本身（指向可能被 ISR 改变）与修饰所指内容（内容可能随时改变）是两回事 ③ 加分：给出正确声明写法（volatile 位置）或中断/任务共享环形缓冲区的场景。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-416", "kind": "subjective", "kind_name": "主观题", "num": 416, "stem": "下面的代码使用 __interrupt 关键字定义了一个中断服务子程序（ISR），请评论这段代码。\n__interrupt double compute_area(double radius)\n{\n    double area = PI * radius * radius;\n    printf(\"Area = %f\", area);\n    return area;\n}", "options": [], "answer": "这段 ISR 有 4 处错误（对应嵌入式面试经典答案）：\n1. 不能有返回值：ISR 由硬件\"调用\"、没有调用者去接收返回值，必须声明为 `void`，这里的 `double` 返回值毫无意义（编译器通常会报错/告警）。\n2. 不能有参数传递：中断触发时没有人给它传参，形参 `double radius` 无法赋值，必须写成 `void compute_area(void)`。\n3. 不应执行浮点运算：①很多 MCU 无 FPU，浮点靠软件库实现，耗时长；②若上下文保存不保存浮点寄存器，中断中做浮点会破坏主程序（尤其带 FPU 的 Cortex-M4F 需注意 FPU 上下文与惰性压栈，编译器对 ISR 的浮点支持必须正确配置）；③乘除法与 PI 也可用定点/移位近似。\n4. 不应调用不可重入/阻塞型函数：`printf` 内部有静态缓冲、会调用 I/O、执行时间不可控（还可能触发其他中断/等待），绝不能放中断里；正确做法是在 ISR 里只做\"置标志/写缓冲/发信号量\"，把耗时处理交给主循环或任务。\n额外要点：①ISR 应尽量短，避免长时间关中断导致响应延迟；②共享变量要加 volatile 并注意临界区；③中断函数一般需正确的属性/关键字（如 gcc 的 `__attribute__((interrupt))`、ARM 的 `__irq`）以保证出口指令与上下文保存正确。", "explain": "① 指出不能有返回值 ② 指出不能有参数 ③ 指出不应做浮点运算 ④ 指出不应调用 printf 等不可重入/耗时函数（4 点至少答对 3 点）⑤ 加分：提到 ISR 要短，耗时处理交主循环/任务，共享变量加 volatile。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-417", "kind": "subjective", "kind_name": "主观题", "num": 417, "stem": "ST 公司提供了完善的 RCC 和 RTC 接口库函数，分别位于哪些文件中？", "options": [], "answer": "标准外设库（StdPeriph）中：\n- RCC（复位与时钟控制）驱动：stm32f4xx_rcc.c / stm32f4xx_rcc.h（F1 系列为 stm32f10x_rcc.c/h）\n- RTC（实时时钟）驱动：stm32f4xx_rtc.c / stm32f4xx_rtc.h（F1 为 stm32f10x_rtc.c/h）\n补充：①RCC 提供 `RCC_AHB1PeriphClockCmd()`、`RCC_APB1PeriphClockCmd()`、`RCC_PLLConfig()`、`RCC_GetClocksFreq()` 等，负责外设时钟使能与系统时钟树配置；②RTC 提供 `RTC_Init()`、`RTC_SetTime()/RTC_GetTime()`、`RTC_SetDate()`、`RTC_SetAlarm()`、`RTC_WaitForSynchro()` 等，RTC 时钟源通常取 LSE（32.768kHz）或 LSI，配置前需 `PWR_BackupAccessCmd(ENABLE)` 打开备份域写保护；③F4 的 RTC 还可作唤醒定时器；④HAL 库中对应 `stm32f4xx_hal_rcc.c`、`stm32f4xx_hal_rtc.c`。", "explain": "① 答出 RCC 在 stm32f4xx_rcc.c ② 答出 RTC 在 stm32f4xx_rtc.c ③ 加分：说明两者各自职责（时钟树/时钟使能 vs 日历与闹钟），或提到 HAL 库对应文件与备份域访问步骤。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-419", "kind": "subjective", "kind_name": "主观题", "num": 419, "stem": "32bit 的数 0x12345678 在 Little-endian 模式和 Big-endian 模式下 CPU 内存中的存放方式（假设从地址 0x4000 开始存放）。", "options": [], "answer": "| 地址 | 小端（Little-endian） | 大端（Big-endian） |\n| --- | --- | --- |\n| 0x4000 | 0x78（低字节） | 0x12（高字节） |\n| 0x4001 | 0x56 | 0x34 |\n| 0x4002 | 0x34 | 0x56 |\n| 0x4003 | 0x12（高字节） | 0x78（低字节） |\n规律：小端＝低地址存低字节（ARM Cortex-M、x86 采用），大端＝低地址存高字节（网络字节序、部分 DSP/PowerPC 采用）。\n工程要点：①结构体直接按内存 memcpy/走 DMA 发送时，端序不同会导致解析错误；②网络通信统一用大端（htonl/ntohl 转换）；③通信协议常规定\"高字节先发（MSB first）\"，与 CPU 端序无关，需在打包/解包时显式处理；④联合体/指针强转可用于检测端序。", "explain": "① 四种字节布局完全正确（小端 78 56 34 12 / 大端 12 34 56 78）② 说明小端=低地址低字节、大端=低地址高字节 ③ 加分：指出 Cortex-M 是小端、网络序是大端、跨平台通信需转换。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-420", "kind": "subjective", "kind_name": "主观题", "num": 420, "stem": "空指针与野指针的区别？", "options": [], "answer": "1. 空指针（NULL pointer）：值是 0 或 NULL，明确表示\"不指向任何有效对象/内存地址\"。它的指向是已知的，可通过 `if (p != NULL)` 安全判断；对空指针解引用是错误（会触发 HardFault/段错误），但至少可检测、可防御。\n2. 野指针（wild pointer）：值是无效的、不确定的地址（未初始化、已释放后未置空、或越界计算得到），它\"看起来\"指向某处但根本不可知。危害：①无法用 NULL 判断，容易漏检；②解引用可能静默改写别人内存（破坏数据、跑飞、偶发崩溃），调试困难。\n3. 常见成因与对策：①定义时未初始化 → 定义即初始化 `char *p = NULL;`；②`free(p)`/`delete` 后未置空 → 释放后立即 `p = NULL;`；③指针越界/返回局部变量地址 → 明确生命周期；④使用悬垂指针 → 用前判空 + 及时置空 + 静态分析工具（如 MISRA/Coverity）把关。", "explain": "① 空指针值是 0/NULL、明确不指向任何地址、可判空 ② 野指针值无效且不可知、不可判空、危害不可预测 ③ 加分：给出\"定义即置空、free 后置空\"的防御写法，或指出悬垂指针也属野指针。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-421", "kind": "subjective", "kind_name": "主观题", "num": 421, "stem": "详细描述 SPI 接口与 IIC（I2C）接口通信的异同点。", "options": [], "answer": "一、不同点\n1. 引脚与信号：I2C 只有 2 根线 SCL（时钟）+ SDA（数据），半双工，靠器件地址寻址；SPI 有 4 根线 SCK + MOSI + MISO + CS（片选），可全双工，靠 片选线选设备（多从机需多根 CS）。\n2. 速度：SPI 快得多，可达几 MHz~几十 MHz（F4 的 SPI 最高约 37.5MHz 分频后）；I2C 标准模式 100kHz、快速 400kHz、高速 3.4MHz。\n3. 流控/应答：I2C 每字节后有 ACK/NACK 应答，具备流控与错误检测；SPI 没有应答机制，主机不知道从机是否收到/是否忙。\n4. 主从与仲裁：I2C 是多主机总线，有地址仲裁与时钟同步（支持多主）；SPI 只有一个主机，不支持多主，也没有仲裁。\n5. 驱动复杂度：I2C 时序统一固定、便于做通用驱动；SPI 各器件时序差别大（CPOL/CPHA、命令格式、地址宽度不同），须按 datasheet 编写，相对复杂。\n6. 引脚成本/上拉：I2C 是开漏结构必须外接上拉电阻，线长受限、抗干扰一般；SPI 是推挽输出，驱动能力与速率更高，适合板上近距离高速传输。\n二、相同点\n1. 都是同步串行总线，时钟由主机产生，只在传输期间输出时钟；\n2. 都用于板级短距离芯片间通信（传感器、Flash、EEPROM、显示屏、ADC 等）；\n3. 都需注意时序参数（建立/保持时间）与信号完整性（走线短、必要时串阻）。\n选型建议：需要高速大数据量（如 SPI Flash、LCD）用 SPI；需要多器件共用少量引脚、需要应答确认（如 EEPROM、传感器）用 I2C。（I2C 总线上的上拉电阻作用：空闲时把总线拉到高电平，保证空闲态确定并增强抗干扰。）", "explain": "① 引脚数/双工方式/寻址方式差异 ② 速度差异 ③ 应答机制（I2C 有 ACK、SPI 无）④ 多主与片选差异 ⑤ 加分：相同点（同步、时钟由主产生）+ 选型建议或 I2C 上拉作用。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-423", "kind": "subjective", "kind_name": "主观题", "num": 423, "stem": "简述 STM32 异常的处理过程。", "options": [], "answer": "在 ARM 体系结构中，中断是异常的一种。异常是引起程序流程改变的事件：发生时处理器挂起当前正在执行的任务，转去执行称为异常处理程序（exception handler）的程序；处理完后再恢复原来的程序流程（中断的中断服务程序通常称为 ISR）。\n处理过程（以 Cortex-M 为例）：\n1. 异常发生：外设/外部信号产生中断请求（也可由软件触发），NVIC 根据使能位与优先级判断是否响应。\n2. 入栈（压栈）＋取向量：硬件自动把 xPSR、PC、LR、R12、R3~R0 压入当前栈（PSP/MSP），随后读取向量表取得处理程序入口地址并跳转；向量表可通过 VTOR 重定位。\n3. 执行处理程序：ISR 内一般先清中断标志（`EXTI_ClearITPendingBit()` 或读状态寄存器清除），再执行必要处理。若处理期间有更高抢占优先级的中断到来，会发生嵌套（latest-arriving/tail-chaining 机制可减少切换开销）。\n4. 返回：执行 `BX LR`（LR 中装载了 EXC_RETURN 特殊值）触发中断返回，硬件自动出栈恢复现场，被中断的程序继续运行。\n5. 异常类型：Cortex-M 定义了 15 个系统异常（Reset、NMI、HardFault、MemManage、BusFault、UsageFault、SVCall、PendSV、SysTick 等）＋最多 240 个外部 IRQ；其中 NMI、HardFault 不可屏蔽，HardFault 是所有故障的最终兜底。\n工程要点：ISR 应尽量短（只置标志/搬运少量数据）；共享变量加 volatile；清晰优先级分组避免误嵌套；必要时在 HardFault 处理里记录现场以便定位死机原因。", "explain": "① 异常定义（中断属于异常，挂起当前任务转去处理再恢复）② 硬件自动入栈、取向量、执行处理、出栈恢复的流程 ③ 加分：提到嵌套/优先级、HardFault 兜底、ISR 要短或 VTOR 重定位。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-424", "kind": "subjective", "kind_name": "主观题", "num": 424, "stem": "简述 STM32 中断抢占优先级与响应优先级。", "options": [], "answer": "二者合起来由 NVIC 优先级寄存器中同一个 4 位字段划分（由 `NVIC_PriorityGroupConfig()` 决定拆分方式），共同构成每个中断的优先级：\n1. 抢占优先级（pre-emption priority）：决定能否嵌套。高抢占优先级（数值更小）的中断可以打断正在执行的低抢占优先级中断；抢占优先级高者先执行、执行完再回到被打断的中断。抢占优先级不同 → 可以嵌套。\n2. 响应优先级（sub priority，也叫子优先级）：决定同抢占优先级中断的排队顺序。当多个中断同时挂起且抢占优先级相同时，响应优先级数值小者先响应；它不能产生嵌套——若两个中断抢占优先级相同，后到的必须等前者执行完。\n3. 相同且同时发生：抢占、响应都相同（或未配置）时，按中断向量表中的 IRQ 编号小者先响应（如 TIM1 的 IRQ 25 早于 USART1 的 IRQ 37）。\n4. 分组：4 位可分配为 (0,4)、(1,3)、(2,2)、(3,1)、(4,0) 共 5 组，对应\"抢占位数:响应位数\"；一旦分组改变，已配置的优先级需要按新分组重新换算，否则会出现意外的抢占关系。", "explain": "① 抢占优先级决定嵌套（高抢占可打断低抢占）② 响应优先级只决定同抢占级下同时挂起时的先后 ③ 加分：相同优先级时按 IRQ 编号裁决、5 种分组、数值越小级别越高。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-425", "kind": "subjective", "kind_name": "主观题", "num": 425, "stem": "硬实时任务和软实时任务的概念理解。", "options": [], "answer": "1. 硬实时（hard real-time）：任务的截止时间（deadline）是刚性约束，一旦超过时限就会造成严重后果（人身安全、设备损坏、重大经济损失）。其响应时间要求通常在 ms 甚至 μs 级，必须用可证明的最坏情况响应时间（WCET + 中断延迟）来保证。\n2. 软实时（soft real-time）：超时不会造成严重后果，只是体验变差或价值降低；系统统计意义上满足时限即可（如平均延迟、95 分位延迟达标）。\n3. 举例：核电站/汽车安全气囊/飞控/工业安全联锁属硬实时（超时可能致命）；视频播放器/VCD、音视频流的普通卡顿、网络游戏属软实时（超时只是用户觉得卡）。\n4. 工程做法：①硬实时系统选可抢占内核 RTOS（µC/OS、FreeRTOS），严格划分优先级、禁止长临界区、关闭不必要的中断嵌套、避免动态内存分配与不可重入函数；②软实时可用 Linux/桌面系统 + 更宽松的调度；③混合系统用\"硬实时内核 + 非实时任务（如 GUI/网络）\"分层。", "explain": "① 硬实时＝超时限造成严重后果、时限刚性、响应时间 ms/μs 级 ② 软实时＝超时仅体验受损、统计意义满足 ③ 加分：举出核电站/气囊 vs 视频播放 的对比，或说明硬实时的设计手段（可抢占 RTOS、禁止长临界区等）。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-426", "kind": "subjective", "kind_name": "主观题", "num": 426, "stem": "在程序中，使用宏定义有哪些优缺点？", "options": [], "answer": "一、优点\n1. 可读性与可维护性：把魔数/魔法串变成有意义的名字（如 `#define MAX_BUF 256`），改一处即全局生效。\n2. 运行效率高：宏是预处理期的文本替换、没有函数调用的入栈/出栈与参数压栈开销（尤其适合频繁调用的小操作，如 `#define MIN(a,b) ((a)<(b)?(a):(b))`）。\n3. 能做编译器做不到的事：`##` 连接符、`#` 字符串化、条件编译（`#if/#ifdef`）、跨平台开关、生成重复代码等，是编译期无法替代的能力。\n4. 无类型限制：同一宏可用于多种类型（类似\"泛型\"），例如 MAX 宏对 int/float/指针都适用。\n二、缺点\n1. 无类型检查：只是文本替换，参数类型不受约束 → 安全隐患（如 `MAX(i++, j)` 会导致 i 被自增两次）。\n2. 优先级/括号陷阱：`#define NUM 2*M+1` 之类展开后语义错乱，必须给参数和整体都加括号。\n3. 调试不友好：宏在预处理阶段消失，调试器看不到、报错定位到展开后的位置，符号表里也没有。\n4. 代码体积膨胀：每次展开都复制代码，嵌套/大宏会显著增大体积，降低指令缓存命中率。\n5. 无作用域/命名污染：全局文本替换可能意外替换同名标识符。\n三、结论：常量、条件编译、连接/字符串化用宏；需要类型检查或复杂逻辑时用 `const`、`static inline` 函数或枚举替代（C++ 更倾向 `constexpr`/模板）。", "explain": "① 优点≥2（可读性/维护性、无调用开销、可做条件编译与 ## 等编译期操作）② 缺点≥2（无类型检查、括号/优先级陷阱、难调试、代码膨胀）③ 加分：给出 `static inline`/const 替代方案或 `MAX(i++,j)` 的副作用例子。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-427", "kind": "subjective", "kind_name": "主观题", "num": 427, "stem": "看门狗的作用是什么？", "options": [], "answer": "看门狗（Watchdog，WDT）用于防止程序跑飞或死循环导致系统永久失效：其硬件本质是一个独立运行的定时器，定时时间到（溢出）就产生系统复位，让程序重新从头开始运行。\n1. 工作机制：程序正常运行时必须周期性\"喂狗\"（重装载计数值，如 `IWDG_ReloadCounter()`）；一旦程序跑飞、卡死、进入死循环而无法按时喂狗，计数器溢出就把 MCU 复位，从而把系统从异常状态抢救回来，避免设备\"假死\"。\n2. 两类看门狗：①独立看门狗 IWDG：使用独立的 LSI（约 32kHz）时钟，主时钟失效时仍有效，只要求\"别喂得太晚\"；②窗口看门狗 WWDG：挂在 APCLK 上、带窗口约束，喂得太早也会复位，能同时检测\"程序跑得太快/乱跳\"（如漏执行、提前返回）的情况。\n3. 使用要点：①喂狗应在主循环等\"程序确实正常走完一圈\"的位置，且不要在中断里无条件喂狗（否则主循环死了中断还在喂 → 失去保护作用）；②长耗时任务要按 WCET 放大超时时间，或在任务内部合理分段喂狗；③调试时常先关看门狗或用调试冻结位，避免单步调试被复位；④看门狗只是\"兜底恢复\"，不能替代合理的错误处理与异常捕获。", "explain": "① 作用＝监测程序跑飞/死循环并复位恢复 ② 机制＝定时器溢出 + 需周期性喂狗 ③ 加分：区分 IWDG（LSI、只防太晚）与 WWDG（防太早/太晚）、不在中断里盲目喂狗。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-428", "kind": "subjective", "kind_name": "主观题", "num": 428, "stem": "请简述 UART、I2C、SPI 的通信线分别是什么？三者的区别？", "options": [], "answer": "一、通信线\n1. UART：异步串口，至少 2 根信号线 —— TX（发送）、RX（接收）（另需共地 GND；可选 RTS/CTS 做流控）。无时钟线，靠约定波特率同步。\n2. I2C：SCL（时钟）+ SDA（数据） 两根线，开漏结构需外接上拉电阻；多主多从、有地址与 ACK 应答、支持总线仲裁。\n3. SPI：SCLK（时钟）+ MOSI（主出从入）+ MISO（主入从出）+ CS/SS（片选） 四根线（多从机时每个从机一根 CS）；全双工、无地址无应答、主机唯一。\n二、主要区别\n| 项目 | UART | I2C | SPI |\n| --- | --- | --- | --- |\n| 同步方式 | 异步（无时钟线） | 同步 | 同步 |\n| 线数 | 2（+GND） | 2 | 4（+每从机 CS） |\n| 双工 | 全双工 | 半双工 | 全双工 |\n| 速度 | 常见 9.6k~几 Mbps | 100k/400k/3.4MHz | 几 MHz~几十 MHz |\n| 寻址 | 点对点/无地址 | 7/10 位器件地址 | 片选选设备 |\n| 应答 | 无（可加校验位） | 每字节 ACK | 无 |\n| 多主机 | 否 | 支持仲裁 | 否 |\n| 适用 | 与 PC/模块通信、调试口 | 多器件、低速控制（EEPROM/传感器） | 高速大数据（Flash/LCD/ADC） |\n三、结构差异补充：UART 由波特率发生器、发送器、接收器组成，因异步一般比两个同步总线结构更复杂（要求收发双方波特率误差在 ±2%~3% 内）；I2C 的 SDA 在起始/停止条件时有特殊边沿要求。", "explain": "① 三种总线的线名与数量 ② 同步/异步、全双工/半双工差异 ③ 速度与寻址方式差异 ④ 加分：应答机制、多主仲裁、适用选型或 UART 波特率误差要求。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-429", "kind": "subjective", "kind_name": "主观题", "num": 429, "stem": "推挽输出的概念与作用。", "options": [], "answer": "1. 概念：推挽输出（push-pull）由两个互补控制的 MOS 管（或三极管）组成，上管接电源、下管接地，二者始终一个导通、一个截止。输出高电平时上管导通（把引脚拉到 VDD），输出低电平时下管导通（把引脚拉到 GND）。\n2. 作用/特点：①能真正输出高电平和低电平，且在两种电平下都具备驱动（灌电流/拉电流）能力，可直接点亮 LED、驱动小功率器件；②输出阻抗低、边沿快、速度快，适合高速信号（SPI/时钟/PWM）；③电平由内部决定，不需要外部上拉即可给出确定的\"1\"。\n3. 局限：①不能把两个推挽输出直接连在一起（一个输出高、一个输出低会形成低阻通路，产生大电流\"倒灌\"而损坏器件），因此推挽输出无法做多器件共享的总线；②高电平强度取决于 VDD，若需要与更高电压器件对接则不方便。\n对比：开漏输出只能输出低电平（高电平靠外部上拉），但可做线与、可做电平转换。", "explain": "① 结构＝两个互补管子一导一截 ② 能力＝高低电平均有驱动能力、可真正输出高电平 ③ 加分：指出推挽不能线与/不能直接并联（会倒灌），或说明适用于高速驱动场景。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-430", "kind": "subjective", "kind_name": "主观题", "num": 430, "stem": "开漏输出的概念与作用。", "options": [], "answer": "1. 概念：开漏输出（open-drain，MOS 管）／开集（open-collector，三极管）只保留下管：输出低电平时管子导通把引脚拉低；输出高电平时管子截止，引脚处于高阻（悬空）状态，必须借助外部上拉电阻才能得到高电平。因此开漏无法真正输出高电平，高电平时没有驱动能力。\n2. 作用：①方便做电平转换：输出高电平由外部上拉所接的电源决定，3.3V 器件可上拉到 5V，从而实现跨电压域通信；②实现\"线与\"（wired-AND）：多个开漏输出可直接接在同一根线上，只有全部为高时总线才为高，任一为低总线即被拉低——这正是 I2C 总线（SCL/SDA）、多器件共用中断线、I2C 多主仲裁的基础；③便于双向总线与\"总线忙\"检测；④上拉电阻同时限流，可保护器件。\n3. 注意：①上拉电阻取值需折中：太小则低电平灌电流大、功耗高，太大则上升沿变慢（RC 充电），与总线电容共同决定速率上限；②普通推挽输出不能做线与：若两个推挽输出一高一低直接相连，会出现电流倒灌，可能永久损坏器件；③DMA/总线上的开漏信号（如 I2C）速度受限于上拉与容性负载。", "explain": "① 概念＝高阻 + 外部上拉才能得高电平、高电平无驱动能力 ② 作用＝电平转换、线与（I2C/多器件共享线）③ 加分：上拉电阻的折中取值，或强调推挽不能线与（会倒灌损坏器件）。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-431", "kind": "subjective", "kind_name": "主观题", "num": 431, "stem": "三极管与 CMOS 管的作用与区别。", "options": [], "answer": "1. 三极管（BJT，双极型晶体管）：由两个 PN 结构成（NPN/PNP），电流控制电流的器件——基极电流 Ib 控制集电极电流 Ic（Ic≈β·Ib）。作用：①放大微弱信号；②作无触点电子开关。特点：输入阻抗低、需要基极驱动电流、有静态功耗、温度特性与 β 离散性需注意（偏置电路要稳定工作点）；在功率驱动、模拟放大、低成本场合仍大量使用。\n2. CMOS 管（MOSFET，场效应管）：由 PMOS 与 NMOS 构成，电压控制电流的器件——栅极电压 Vgs 控制沟道导通。作用：①作高速开关（数字电路基本单元）；②构成反相器/逻辑门/传输门；③用于 RAM、CPU 等大规模集成电路制造（互补结构的静态功耗极低）。特点：输入阻抗极高（栅极几乎不取电流）、开关速度快、功耗低（静态几乎不耗电，仅翻转时耗功）、但栅极易受静电击穿、驱动大电容时需考虑开关损耗，且体二极管带来寄生效应。\n3. 本质区别：①控制量不同——三极管是电流控制、CMOS 是电压控制；②载流子不同——BJT 用电子和空穴（双极），MOSFET 只用多数载流子（单极）；③功耗与集成度——CMOS 低功耗高集成度，BJT 驱动能力强、跨导高，适合模拟与功率级。\n4. 选型：数字逻辑/大规模集成用 CMOS；模拟放大、大电流驱动/功率电路常用 BJT 或 IGBT（BJT 与 MOS 复合）；两者也常组合使用（如达林顿、推挽输出级）。", "explain": "① 三极管＝电流控制电流、可放大可作开关 ② CMOS＝电压控制电流、低功耗、适合数字集成 ③ 加分：双极/单极载流子差异、输入阻抗与功耗对比、CMOS 静电敏感。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-432", "kind": "subjective", "kind_name": "主观题", "num": 432, "stem": "无源晶振与有源晶振的区别。", "options": [], "answer": "1. 无源晶振（晶体谐振器，passive crystal）：本身只是一个石英晶体谐振元件，不能自己起振，必须配合 MCU 内部的振荡器电路并加上负载电容（C1/C2）以及可能需要的反馈/限流电阻才能产生时钟。特点：价格低、体积小、通用性强；缺点是需要 MCU 内部配套振荡电路，起振时间较长、驱动能力与频率精度受外部电路和负载电容匹配影响，参数挑错（负载电容不匹配、PCB 走线长）容易不起振或频率偏。\n2. 有源晶振（晶体振荡器，XO/TCXO，active crystal）：内部集成晶体 + 振荡 + 整形电路（通常还带使能/输出脚），通电即输出稳定的方波时钟（如 8MHz、25MHz 方波）。特点：省时方便、起振快、频率精度与稳定性高（TCXO/OCXO 更高），驱动能力强、可直接送 MCU 外部时钟输入或其它芯片；缺点是价格高、体积大、功耗较高、通常需要额外电源与滤波（甚至需要 OE/待机控制）。\n3. 选型建议：考虑成本 → 选无源晶振（量产消费类电子常用）；考虑性能与开发效率（要求高精度/快速起振/EMI 敏感） → 选有源晶振，省去调试负载电容与起振裕度。对时间/频率精度要求极高的场合（通信基站、GNSS、仪器）采用 TCXO/OCXO 等带温度补偿的有源晶振。", "explain": "① 无源需外部振荡电路/负载电容、成本低 ② 有源通电即输出、精度与稳定度高、成本高 ③ 加分：给出\"重成本选无源、重性能选有源\"的选型结论，或提到 TCXO/OCXO 与起振时间/负载电容匹配问题。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-433", "kind": "subjective", "kind_name": "主观题", "num": 433, "stem": "实时系统中出现互斥锁死锁的原因，以及如何解除死锁。", "options": [], "answer": "一、死锁原因（四个必要条件，同时满足才死锁）\n1. 互斥：资源同一时刻只允许一个任务/进程占用；\n2. 占有且等待（请求并保持）：已持有部分资源，又在等待其他被占用的资源；\n3. 不可抢占：别人持有的资源不能被强行夺走，只能由持有者主动释放；\n4. 循环等待：存在一条\"任务 A 等 B 持有的资源、B 等 C……最后又等 A\"的环。\n结果：相关任务永远阻塞，所持资源无法释放，CPU 吞吐量下降、系统（部分功能）停滞。\n二、解除/预防方法（破坏任一必要条件即可）\n1. 破坏\"占有且等待\"：①要求任务在运行前一次性申请全部资源，全有才启动（简单安全，但资源利用率低、易饥饿）；②改进：允许先申请初期所需资源，运行中逐步释放已用完的资源再申请新的（提高利用率）。\n2. 破坏\"不可抢占\"：请求新资源失败时，释放已持有的全部资源，需要时再重新申请（代价大、易造成任务反复申请释放、周转期长）。\n3. 破坏\"循环等待\"：给资源统一编号，规定只能按编号递增顺序申请（例如先锁 A 再锁 B，全系统统一），从根上消除环。\n4. 工程做法（RTOS 实践）：①`OSTaskCreate`/`xTaskCreate` 中统一锁顺序、缩短持锁临界区；②用带超时的获取接口（`OSTimeDly`+超时、`xSemaphoreTake(..., timeout)`）超时后释放并重试，避免无限等待；③用单一锁或消息队列/事件标志替代多锁嵌套（避免锁 A 再等 B）；④优先级反转用优先级继承（µC/OS-III 互斥量支持 PRIO 属性）或优先级天花板解决，注意\"死锁≠优先级反转\"；⑤必要时加看门狗/监控任务检测长时间阻塞并复位或重启故障任务。", "explain": "① 四个必要条件（互斥、占有且等待、不可抢占、循环等待）② 至少两种破坏方法（一次性申请/释放重申请/资源编号递增）③ 加分：RTOS 实践中统一加锁顺序、带超时获取、优先用单一锁或队列，或提到优先级继承。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-434", "kind": "subjective", "kind_name": "主观题", "num": 434, "stem": "何谓临界区？", "options": [], "answer": "进程中访问临界资源的那段代码称为临界区（critical section）。所谓临界资源是\"一次仅允许一个进程/任务使用\"的资源（共享变量、队列、串口、EEPROM、外设寄存器等），因此临界区必须满足互斥访问：同一时刻只允许一个任务进入，进入后其他试图进入的任务必须等待。\n实现要点：①常见保护手段有关中断/开中断、互斥量（Mutex）、信号量、调度器上锁（`OSSchedLock()`）、自旋锁等；②临界区应尽可能短（只包住必要的共享访问，耗时操作、printf、延时、等锁一律放到外面），否则关闭时间过长会增大中断延迟、破坏实时性（对关中断实现尤为致命）；③多个任务涉及同一临界资源的临界区互为\"相关临界区\"，必须用同一把锁保护；④在 RTOS 中，关中断的保护粒度为 CPU 级、互斥量只保护任务级竞争（ISR 一般不能用互斥量，需用信号量/关中断/临界段宏 `taskENTER_CRITICAL()`）。", "explain": "① 定义＝访问临界资源的那段代码、必须互斥 ② 常见实现手段（关中断、互斥量/信号量、调度器上锁）③ 加分：临界区要短、需用同一把锁、ISR 与任务竞争的处理差异。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-435", "kind": "subjective", "kind_name": "主观题", "num": 435, "stem": "实时操作系统的任务调度点（在哪些时机发生任务调度）？", "options": [], "answer": "µC/OS 系列的任务调度点（会调用 `OSSched()` 或等价调度入口）主要包括：\n1. 释放信号量、释放互斥量、发送消息（消息队列/邮箱）：这些操作可能唤醒更高优先级任务从而触发调度（也可通过选项参数配置为不立即调度）。\n2. 任务主动延时：`OSTimeDly()`、`OSTimeDlyHMSM()`。\n3. 任务等待的事件尚未发生：等待信号量、消息队列、事件标志组、互斥量等而阻塞时。\n4. 取消等待：任务被唤醒/等待被取消（如 `OSTimeDlyResume()`、`OSTaskSemPendAbort()` 等）导致优先级变化。\n5. 创建任务（`OSTaskCreate()`）、删除任务（`OSTaskDel()`）。\n6. 删除内核对象（信号量/队列/事件标志/内存分区等）。\n7. 改变任务优先级：任务修改自身或其他任务的优先级（`OSTaskChangePrio()`）。\n8. 任务挂起/解挂：`OSTaskSuspend()` 挂起自身、`OSTaskResume()` 解挂其他任务。\n9. 退出所有嵌套中断（中断服务程序返回时才允许调度；µC/OS 中在 ISR 退出点调用 `OSIntExit()` 触发）。\n10. 调度器解锁：`OSSchedUnlock()`；让出时间片：`OSSchedRoundRobinYield()`；用户显式调用 `OSSched()`。\n11. 其他：`OSTimeTick()`（时钟节拍中断处理）在节拍唤醒延时任务时也可能引发调度。\n要点：调度发生的根本条件是\"有更高优先级任务就绪\"，且当前处于非临界区（未上锁、未关调度器）、不在中断嵌套中（中断退出时才切换）。任务内部若不含上述任一点，会一直占用 CPU（因此长任务需主动插入延时或让出）。", "explain": "① 列出≥5 个调度点（信号量/消息、延时、等待事件、创建/删除任务、改优先级、挂起/解挂、中断退出、调度器解锁/让出时间片）② 说明根本条件＝更高优先级任务就绪、非临界区且中断退出时才切换 ③ 加分：提到 `OSIntExit()`/`OSSchedRoundRobinYield()` 或节拍处理。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-436", "kind": "subjective", "kind_name": "主观题", "num": 436, "stem": "SPI 中的 CPOL 与 CPHA 的含义。", "options": [], "answer": "1. CPOL（Clock Polarity，时钟极性）：定义 SCK 在空闲（没有数据传输）时的电平。CPOL=0 表示空闲时为低电平（第一个边沿为上升沿、第二个为下降沿）；CPOL=1 表示空闲时为高电平（第一个边沿为下降沿）。\n2. CPHA（Clock Phase，时钟相位）：定义数据在哪一个时钟边沿被采样（锁存）、哪一个边沿输出/切换。CPHA=0：在 SCK 的第一个边沿采样输入数据（MISO），第二个边沿输出数据（MOSI）；CPHA=1：在第二个边沿采样，第一个边沿输出/切换数据。\n3. 四种模式组合：Mode0 (CPOL=0,CPHA=0)、Mode1 (0,1)、Mode2 (1,0)、Mode3 (1,1)——主机与从机必须配置相同的模式，否则数据错位读不到正确值（表现为读到 0x00/0xFF 或数据整体偏移一位）。\n4. 记忆与调试：①CPHA=0 时\"首个边沿即采样\"，此时数据必须在片选有效后提前准备好（或由主机在前一边沿切换）；②CPHA=1 时首边沿切换、次边沿采样，对时序裕量更友好，是很多器件的默认（如部分 Flash、SD 卡 SPI 模式）；③遇到 SPI 通信异常，第一件事就是对照从机 datasheet 的 SPI 时序图核对 CPOL/CPHA 与位序（MSB/LSB first）。", "explain": "① CPOL＝空闲时时钟电平（0 低 / 1 高）② CPHA＝在第一个/第二个边沿采样（0 首沿 / 1 次沿）③ 加分：给出 4 种模式，并强调主从模式必须一致、否则数据错位。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-437", "kind": "subjective", "kind_name": "主观题", "num": 437, "stem": "请描述 I2C 总线中的起始条件、停止条件中 SDA 与 SCL 引脚电平的变化。", "options": [], "answer": "1. 空闲状态：总线不被占用时，SCL 与 SDA 都被上拉电阻拉为高电平。\n2. 起始条件（Start, S）：在 SCL 保持高电平期间，SDA 由高变低（高→低的下降沿）——因为数据位传输时 SDA 只允许在 SCL 低电平期间变化，所以\"SCL 高时 SDA 下降\"这一组合就是起始信号。\n3. 停止条件（Stop, P）：在 SCL 保持高电平期间，SDA 由低变高（低→高的上升沿）。\n4. 注意点：①数据传输期间 SDA 的变化必须发生在 SCL 低电平期间，SCL 高电平期间 SDA 必须稳定（这就是能区分起始/停止与普通数据位的关键）；②重复起始条件（Sr）是在不发出停止条件的前提下再次发出起始条件，用于\"先写地址再读数据\"的复合传输；③时序上有最小建立/保持时间要求（标准模式 4.7μs/4.0μs 等），且上拉电阻与总线电容决定上升沿速度。", "explain": "① 空闲时 SCL、SDA 均为高 ② 起始＝SCL 高时 SDA 高→低 ③ 停止＝SCL 高时 SDA 低→高 ④ 加分：说明\"SCL 高时 SDA 必须稳定\"这一判别依据，或提到重复起始条件 Sr。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-438", "kind": "subjective", "kind_name": "主观题", "num": 438, "stem": "在项目代码中，如何提高程序的抗干扰能力？", "options": [], "answer": "1. 数字滤波（软件滤波）：对模拟量多次采样后用算法提取真实值，比硬件滤波更灵活、参数可调。常用方法：中值滤波（去脉冲干扰）、算术平均/滑动平均（平滑随机噪声）、去极值平均、一阶低通（惯性）滤波、加权平均、限幅滤波（限制单次变化幅度）、卡尔曼滤波等。选择原则：脉冲干扰用中值+平均，缓慢变化量用惯性滤波，要求实时性时用限幅+单点。\n2. 软件拦截技术（程序跑飞后的补救）：当干扰作用于 CPU、破坏 PC（程序计数器）导致程序\"乱飞\"或陷入死循环时，用①在未使用的 Flash/中断向量处填充跳转指令（如指向重启或错误处理的指令）；②在每个函数/模块入口加标志位检查（\"令牌\"法）——程序必须按正常路径写入令牌，否则判定跑飞并复位；③对关键分支加 if 校验与状态机校验，及时发现非法状态。\n3. 软件看门狗（WDT）技术：软硬件结合的抗跑飞措施。独立定时器溢出即复位 CPU；正常程序周期性清零（喂狗），一旦跑飞无法按时喂狗就触发复位恢复运行。要点：喂狗位置要在主循环等\"确证正常\"的地方，不能在中断里无条件喂（否则主循环死了仍被喂），并按最长任务执行时间设定超时时间。\n4. 其他工程手段：①关键数据做校验与冗余（CRC、双备份 + 标志字翻转识别）、Flash 存储加校验和；②对输入信号做多次采样确认/去抖（按键、开关量）与超时重试、错误重发；③异常与故障分级处理（记录故障码、断电重启、安全状态切换），用 `assert`/参数合法性检查及早发现非法输入；④配合硬件手段：电源滤波与去耦、TVS/ESD 保护、参考地平面与隔离、看门狗芯片（外部 WDT）。", "explain": "① 数字滤波（至少 2 种算法及其适用场景）② 软件拦截/令牌法 ③ 软件看门狗（喂狗位置与超时设定要点）④ 加分：数据校验冗余、输入去抖重试、故障分级处理或配合硬件保护措施。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-439", "kind": "subjective", "kind_name": "主观题", "num": 439, "stem": "请谈谈对 AT 指令的了解程度。", "options": [], "answer": "1. 定义与作用：AT 指令（Attention Command，以 \"AT\" 开头）是用来控制 TE（终端设备，如 MCU/PC）与 MT（移动终端，如 4G/5G 模块、WiFi/蓝牙模块）之间交互的一套文本命令规则；在物联网中广泛用于设备控制与调测、通信模块入网（拨号/PDP 激活）、短信/电话、数据业务等。典型：`AT`（握手）、`AT+CGMR`（查版本）、`AT+CSQ`（查信号质量）、`AT+CGREG?`（查网络注册）、`AT+CIPSTART`（建 TCP 连接，ESP 系列）、`AT+CREG?` 等。\n2. 三类语法：\n   - 执行命令：`AT+<cmd>=<参数>`（带参数设置，如 `AT+CGDCONT=1,\"IP\",\"cmnet\"`）；无参数时 `AT+<cmd>` 执行动作（如 `AT+CGATT=1`）。\n   - 测试命令：`AT+<cmd>=?` 列出该命令支持的合法参数范围。\n   - 查询命令：`AT+<cmd>?` 查询当前设置的属性值（如 `AT+CGDCONT?`）。\n3. 返回与流程：正常返回 `OK`，错误返回 `ERROR`，查询/执行结果以 `<CR><LF>…<CR><LF>` 包裹；收到 `AT` 返回 `OK` 是\"模块在线可通信\"的最小验证；对耗时命令（如入网、发送）需等待最终结果码（`CONNECT`/`+CMGS: 12` 等）或超时重试。\n4. 编程实现要点：①串口 + 环形缓冲区 + 状态机解析（不能依赖阻塞式 `strstr` 死等，需超时机制）；②命令与响应成对管理（每条命令有超时、重试次数、结果判定），必要时用独立任务或 DMA 接收；③注意模块的流控（RTS/CTS）与波特率自适应（`AT+IPR`）；④关键操作（入网、收短信）加状态查询与异常恢复（模块重启 `AT+CFUN`、复位引脚控制）。", "explain": "① AT 指令用于 TE/MT 交互、模块控制与入网 ② 三类语法（执行 AT+x=…/测试 AT+x=?/查询 AT+x?）③ 返回 OK/ERROR 与超时重试、缓冲区+状态机解析 ④ 加分：举出具体命令（AT+CSQ、AT+CIPSTART 等）或描述编程实现的超时与重试机制。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-440", "kind": "subjective", "kind_name": "主观题", "num": 440, "stem": "上拉电阻、下拉电阻的作用是什么？", "options": [], "answer": "1. 基本概念：上拉就是用电阻把不确定的信号钳位（拉到）高电平，下拉就是钳位到低电平；电阻同时起限流作用。\n2. 主要作用：\n   ①避免引脚悬空（浮空）：输入引脚若不接上/下拉，电平不确定、易受干扰导致误触发（如按键输入、复位引脚、片选空闲态），加上/下拉可给出确定的默认电平；\n   ②提高驱动能力/保证电平达标：MCU 输出高电平受后续电路影响达不到 VCC 时接上拉；输出低电平达不到 GND 时接下拉；\n   ③为开漏/开集输出提供高电平通路：I2C 总线、开漏输出必须依赖上拉才能输出高电平，同时上拉值决定总线上升沿速度与灌电流；\n   ④确定器件工作状态：如 I2C 地址引脚、Boot 模式引脚、使能/片选（CS）引脚空闲时保持无效电平；\n   ⑤电流设定与分压：与 LED、三极管基极限流配合使用。\n3. 取值权衡：上拉电阻越小 → 上升沿越快、抗干扰强，但静态电流与低电平灌电流越大、功耗越高；越大 → 省电但边沿变慢、易受干扰。常用 4.7k~10k（I2C 快速模式常用 2.2k~4.7k，按键/复位 10k），长线或高容性负载需适当减小。\n4. 注意：内部上拉（MCU 内置 `GPIO_Mode_IPU`）约 30~50kΩ，驱动能力弱、仅适合慢速信号；对时序要求高的开漏总线需外接较小阻值上拉。", "explain": "① 概念（钳位到高/低电平 + 限流）② 作用≥3 条（避免浮空、提高驱动/保证电平、开漏输出与 I2C 上拉、确定器件默认状态）③ 加分：上拉取值与功耗/速度的权衡，或说明内部上拉阻值大、不适合高速开漏总线。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-441", "kind": "subjective", "kind_name": "主观题", "num": 441, "stem": "限流电阻的作用是什么？", "options": [], "answer": "限流电阻是串联在电路中用来限制支路电流大小的电阻，防止电流过大烧坏所串联的元器件，同时它也会分压（串阻上会有压降）。\n典型场景：①LED 限流：LED 是电流型器件，正向压降约 1.8~3.2V，必须串电阻把电流限制在设计值（如 `R=(VCC-Vf)/I`，5V 驱红 LED 取 (5-1.8)/10mA≈320Ω）；②三极管/MOS 基极限流：限制基极或栅极电流、控制饱和深度；③端口保护：MCU 引脚与外部信号之间串小阻值（如 100Ω~1kΩ），限制灌入/拉出电流、抑制浪涌与振铃（配合 ESD 器件），把异常电流挡在芯片之外；④总线/信号串阻：抑制反射与过冲（源端匹配）；⑤分压与偏置：与其它电阻构成分压网络（如 ADC 采样、光耦驱动）。\n注意：①限流电阻有功率要求，需 `P=I²R` 核算，必要时用更大封装或多颗并联；②它会造成压降与功耗，不能无限增大（否则被驱动器件得不到足够电压/电流）；③与\"上拉/下拉\"的区别：上拉/下拉是给信号提供确定的高/低电平（并联到电源或地），限流电阻是串联限制电流。", "explain": "① 作用＝串联限流、防烧器件，兼有分压作用 ② 举例（LED 限流、三极管基极限流、端口保护串阻）③ 加分：说明功率核算 `P=I²R` 或与上拉/下拉电阻的区别。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-442", "kind": "subjective", "kind_name": "主观题", "num": 442, "stem": "电容的定义与作用是什么？", "options": [], "answer": "1. 定义：电容（capacitance，C）是表征电容器容纳电荷本领的物理量，`C=Q/U`，单位法拉（F），常见 μF/nF/pF。从物理上看它是一种静态电荷存储介质（两片导体夹绝缘介质），充好电后电荷可以长期保存，其特性是电压不能突变（`i=C·du/dt`）。\n2. 主要作用：①电源滤波/去耦：滤除电源纹波，为芯片提供就近的电荷储备（去耦电容要多点分布、尽量靠近引脚）；②信号滤波：与电阻/电感组成 RC/LC 低通、高通、带通滤波；③信号耦合：隔直流、传交流（如音频耦合）；④谐振：与电感组成 LC 谐振回路（振荡器、选频）；⑤补偿：相位/频率补偿（运放补偿、晶振负载电容）；⑥储能与充放电：如电源的储能电容、电荷泵、闪光灯升压；⑦隔直：阻断直流分量保护后级；⑧上电复位/延时：RC 延时产生复位信号。\n3. 工程要点：①不同类型电容特性差异大——电解电容容量大但有极性与 ESR、钽电容稳定、陶瓷电容高频特性好（MLCC 用于去耦），选型要兼顾容量、耐压、ESR、温度特性；②去耦电容应\"一大一小\"配合（如 10μF + 100nF），大电容管低频、小电容管高频；③电容通交流、隔直流（阻抗 Zc=1/(2πfC)，频率越高阻抗越小）；④注意耐压余量（一般 ≥1.5 倍工作电压）与极性（电解反向会损坏/爆炸）。", "explain": "① 定义（容纳电荷的物理量 C=Q/U、静态电荷存储介质、电压不能突变）② 作用≥3 条（滤波/去耦、耦合、谐振、储能、隔直、补偿）③ 加分：提到 Zc=1/(2πfC) 通交流隔直流，或去耦电容大小搭配与耐压极性注意项。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-443", "kind": "subjective", "kind_name": "主观题", "num": 443, "stem": "电感的定义与作用是什么？", "options": [], "answer": "1. 定义：电感器（Inductor）是能把电能转化为磁能并存储起来的元件，结构类似于变压器但只有一个绕组，单位亨利（H），常见 μH/mH。其特性是电流不能突变（`u=L·di/dt`），对电流变化有阻碍作用。\n2. 核心特性——\"阻交通直\"（通直流、阻交流）：对直流相当于短路（只留导线电阻）；对交流有阻抗 `X L=2πfL`，频率越高阻碍越大。\n3. 主要作用：①滤波：与电容组成 LC/π 型滤波（电源、EMI 滤波）；②储能与开关电源：Buck/Boost 中的储能与续流元件，是 DC-DC 的核心；③变压与隔离：变压器（互感）实现电压变换与电气隔离；④谐振/选频：与电容组成谐振回路（振荡器、选频网络、天线匹配）；⑤抑制干扰：共模电感、磁珠用于抑制 EMI 与尖峰；⑥RL 低通/高通滤波器；⑦延时与续流：继电器/电机线圈的续流二极管正是为电感电流提供通路（否则关断瞬间 `di/dt` 极大会产生高压尖峰损坏开关管）。\n4. 工程要点：①电感有饱和电流与额定电流限制，超流会饱和失效；②有直流电阻 DCR，会带来损耗与压降；③关断感性负载必须加续流二极管/RC 吸收，否则产生高压毛刺击穿器件；④磁芯材料与绕线方式决定损耗与频率特性（铁氧体高频、硅钢片低频大功率）；⑤电感会带来涡流/漏磁干扰，布局时远离敏感信号与晶振。", "explain": "① 定义（电能→磁能存储、单绕组、电流不能突变）② 作用≥3 条（滤波、储能与开关电源、变压隔离、谐振、抑制 EMI、续流）③ 加分：指出\"阻交通直\"（X L=2πfL）、饱和/额定电流、感性负载必须加续流二极管。", "sec": "3.3 笔试题1（填空题 1 题、简答题 46 题、翻译题 2 题）", "sec_group": "三、附加面试题（2026 补充试卷）", "imgs": []}, {"id": "sub-444", "kind": "subjective", "kind_name": "主观题", "num": 444, "stem": "请说明堆和栈的区别。", "options": [], "answer": "1. 栈（stack）：由编译器/CPU 自动分配和释放，存放函数参数、局部（非 static）变量、返回地址与寄存器现场；空间小（一般几百字节~几 KB，可配置），分配是移动栈指针（O(1)，速度极快）；后进先出；函数返回即回收；栈溢出（递归过深、大数组放栈上）会导致跑飞或 HardFault；多线程/RTOS 中每个任务有自己独立的栈。\n2. 堆（heap）：由程序员手动申请/释放（malloc/free、new/delete）、或由 RTOS 内存管理器从内存池分配；空间大（几乎可用 RAM 减去栈与静态区），分配需要查找空闲块，有碎片与泄漏风险，速度慢于栈，且需

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>面试刷题 · 主观题（手机版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(165deg,#e8f0fa 0%,#f6f8fc 45%,#eaf6ef 100%)}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
/* 顶部 */
header{background:linear-gradient(135deg,#14486e 0%,#1a5276 55%,#2980b9 100%);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 3px 12px rgba(26,82,118,.28)}
header .title{font-size:16px;font-weight:bold;letter-spacing:.5px}
header .stat{font-size:11px;opacity:.95;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px}
/* 板块栏 */
.tabs{display:flex;background:#2c3e50}
.tabs button{flex:1;padding:11px 0;border:none;background:transparent;color:#bdc3c7;font-size:14px;cursor:pointer;transition:color .25s,background .25s}
.tabs button.active{background:#1a5276;color:#fff;font-weight:bold;box-shadow:inset 0 -3px 0 #58d68d}
/* 考试栏 */
#examBar{display:none;background:#34495e;padding:6px 8px;gap:6px}
#examBar button{flex:1;border:none;border-radius:8px;padding:9px;color:#fff;font-size:13px;cursor:pointer;transition:transform .12s,filter .2s}
#examBar button:active{transform:scale(.96);filter:brightness(.92)}
/* 主体 */
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{color:#1a5276;font-size:13px;font-weight:bold}
.stem{background:#fff;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 12px rgba(0,0,0,.07)}
/* 题目配图 */
.qimg{width:100%;border-radius:10px;margin:6px 0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);animation:fadeSlide .3s ease;cursor:zoom-in}
.qimg-tip{font-size:11px;color:#7f8c8d;text-align:center;margin:-2px 0 6px}
/* 配图全屏查看（可拖动 / 捏合缩放 / 双击放大） */
#imgView{position:fixed;left:0;right:0;top:0;bottom:58px;background:#0d0d0d;display:none;overflow:hidden;z-index:150;touch-action:none;-webkit-user-select:none;user-select:none}
#imgView.show{display:block}
#imgView img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;background:#fff;border-radius:4px;box-shadow:0 6px 28px rgba(0,0,0,.55)}
#imgHint{position:fixed;left:0;right:0;bottom:58px;text-align:center;color:#cfd8dc;font-size:11px;padding:5px;background:rgba(0,0,0,.42);z-index:150;display:none}
#imgBar{position:fixed;left:0;right:0;bottom:0;display:none;gap:6px;padding:8px;background:rgba(26,82,118,.97);z-index:151}
#imgBar button{flex:1;border:none;border-radius:9px;padding:12px 2px;font-size:13px;color:#fff;background:#2471a3;cursor:pointer}
#imgBar button:last-child{background:#c62828}
/* 作答区 */
.anslab{background:#fdf6e3;color:#7b5804;font-size:12px;font-weight:bold;padding:8px 12px;border-radius:10px 10px 0 0}
#myans{width:100%;min-height:120px;border:none;border-radius:0 0 10px 10px;padding:10px 12px;font-size:14px;font-family:inherit;line-height:1.7;background:#fffdf5;resize:vertical;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:box-shadow .2s}
#myans:focus{box-shadow:0 0 0 2px #aed6f1,0 2px 10px rgba(0,0,0,.08)}
#myans:disabled{background:#f4f6f7;color:#666}
/* 参考答案区 */
#ansBox{display:none;background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.75;box-shadow:0 2px 10px rgba(0,0,0,.06);animation:fadeSlide .3s ease;white-space:pre-wrap;word-break:break-word}
#ansBox .h-ans{color:#1a7f37;font-weight:bold}
#ansBox .h-exp{color:#8e44ad;font-weight:bold;margin-top:8px}
/* 成绩页题号按钮 */
.chip{border:none;border-radius:20px;padding:7px 13px;margin:3px;background:linear-gradient(135deg,#1a7f37,#27ae60);color:#fff;font-size:12px;cursor:pointer;transition:transform .12s,filter .2s;box-shadow:0 2px 6px rgba(26,127,55,.25)}
.chip.gray{background:linear-gradient(135deg,#7f8c8d,#95a5a6);box-shadow:0 2px 6px rgba(127,140,141,.25)}
.chip:active{transform:scale(.94)}
/* 底部操作栏 */
footer{background:#fff;padding:9px;display:flex;gap:6px;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
footer button{flex:1;border:none;border-radius:10px;padding:12px 2px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .2s}
footer button:active{transform:scale(.95);filter:brightness(.92)}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1200;animation:fadeIn .18s ease}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;width:86%;max-width:360px;padding:18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:zoomIn .25s ease}
.mbox h3{font-size:16px;margin-bottom:8px}
.mbox p{font-size:14px;line-height:1.6;color:#333;margin-bottom:14px;white-space:pre-wrap;text-align:left}
.mbox .btns{display:flex;gap:10px;justify-content:center}
.mbox button{border:none;border-radius:10px;padding:10px 22px;font-size:14px;color:#fff;cursor:pointer;transition:transform .12s,filter .2s}
.mbox button:active{transform:scale(.95)}
/* 动画 */
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🎯 面试刷题（主观题）</div>
    <div class="stat" id="stat">-</div>
  </header>
  <div class="tabs" id="tabs">
    <button data-mode="顺序" class="active">顺序练习</button>
    <button data-mode="收藏">收藏</button>
    <button data-mode="考试">模拟考试</button>
  </div>
  <div style="display:flex;justify-content:flex-end;padding:0 10px 6px">
    <button onclick="openSections()" style="border:none;border-radius:8px;padding:6px 12px;font-size:12px;background:#34495e;color:#fff;cursor:pointer">📂 分区跳转</button>
  </div>
  <div id="examBar"></div>
  <main id="main">
    <div class="head" id="head"></div>
    <div class="stem" id="stem"></div>
    <div id="imgs"></div>
    <div id="ansWrap">
      <div class="anslab" id="anslab">✍️ 我的作答（打字作答，自动保存；不判对错）</div>
      <textarea id="myans" placeholder="在此输入你的作答…"></textarea>
    </div>
    <div id="ansBox"></div>
  </main>
  <footer id="footer"></footer>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<!-- 分区跳转面板 -->
<div id="secPanel" style="display:none"><div id="secBox"></div></div>
<!-- 配图全屏查看 -->
<div id="imgView"><img id="imgViewImg" src="" alt="题目配图"></div>
<div id="imgHint">单指拖动 · 双指缩放 · 双击放大/还原</div>
<div id="imgBar">
  <button onclick="imgZoom(1.35)">＋ 放大</button>
  <button onclick="imgZoom(1/1.35)">－ 缩小</button>
  <button onclick="imgFit()">适应屏幕</button>
  <button onclick="imgOneToOne()">1:1</button>
  <button onclick="closeImgView()">✕ 关闭</button>
</div>

<script>
const BANK=[{"id": "sub-1", "kind": "subjective", "kind_name": "主观题", "num": 1, "stem": "C 语言中的 volatile 关键字有何作用？", "options": [], "answer": "volatile 的作用：告诉编译器该变量的值可能在程序控制流之外被改变（硬件寄存器、中断服务程序中修改的变量、多线程共享变量），从而禁止一切访问优化——不得缓存到寄存器、不得合并或删除访问、不得把访问移出循环，每次访问都必须真正访问内存。典型场景：`while (!flag);` 轮询标志位，flag 由 ISR 修改；若不加 volatile，编译器在 -O2 下可能只读一次寄存器，造成死循环。注意两点：①volatile 只保证访问不被优化，不保证原子性（并发写需互斥或原子操作）；②它也不是内存屏障，跨核/与外设间的访问顺序需另行用 barrier 约束。", "explain": "①防优化（不缓存寄存器、不合并/删除访问）②每次访问均真正读写内存 ③适用场景：硬件寄存器、ISR 与主循环共享变量、多线程共享变量 ④加分：不保证原子性与内存屏障。", "sec": "2022面试题1", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-2", "kind": "subjective", "kind_name": "主观题", "num": 2, "stem": "以下 C 程序片段的执行结果是什么？\nunsigned char tt;\ntt = ~0 << 2;\nprintf(\"%X\\n\\r\", tt);", "options": [], "answer": "输出 `FC`。推导：①~0 按 int 处理得到 -1，即 0xFFFFFFFF；②左移 2 位得 0xFFFFFFFC；③赋给 8 位的 unsigned char 时按模 256 截断，只保留最低 8 位 0xFC；④printf 用 %X 按十六进制输出，即 FC。补充：严格按 C 标准，对负的有符号数左移属于未定义行为；但主流实现（补码机、-O0/-O2，GCC 实测）结果均为 0xFFFFFFFC，再截断得 0xFC，故笔试答案仍为 FC。", "explain": "①输出 FC ②关键换算链：~0=0xFFFFFFFF → 左移 2 位 → 截断为 8 位 0xFC ③加分：指出负值左移的未定义行为与常见实现结果。", "sec": "2022面试题1", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-3", "kind": "subjective", "kind_name": "主观题", "num": 3, "stem": "HTTP 协议中的 GET、POST 方法有何差异？RFC 2109 中建议 HTTP Cookie 大小为 4096 字节。如果希望通过 Cookie 存储超过 4096 字节的内容，有什么方法？", "options": [], "answer": "GET 与 POST 的差异：①参数位置：GET 把参数拼在 URL 查询串中，POST 放在请求体；②长度：GET 受 URL/浏览器/服务器限制（一般几 KB），POST 基本不受限；③语义：GET 是安全且幂等的（多次请求结果相同），POST 通常非幂等（会改变服务器状态）；④缓存与书签：GET 可被缓存、可收藏、可留在历史记录，POST 一般不可；⑤安全：GET 参数会出现在 URL、日志与历史记录中，敏感数据应用 POST + HTTPS。\nCookie 超过 4096 字节（RFC 2109 建议的单 Cookie 上限，指名字+值+属性的总长）的办法：①拆成多个 Cookie 分装（仍受每域 Cookie 数量限制，且每次请求都会携带、浪费带宽）；②大块数据放服务端 Session/数据库，Cookie 只存 Session ID；③前端改存 localStorage/IndexedDB，需要随请求发送时再用表单/XHR 提交；④先压缩（如 gzip）或改用更紧凑的编码再存。", "explain": "①GET/POST 至少 2 点差异（位置、长度、幂等、缓存、安全性）②Cookie 超 4096 字节至少 1 种方案（拆分 Cookie/服务端 Session/本地存储/压缩）③加分：说明 Cookie 每次请求都会随身携带，不宜存大数据。", "sec": "2022面试题1", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-4", "kind": "subjective", "kind_name": "主观题", "num": 4, "stem": "触发器（flip-flop）与锁存器（latch）有什么区别？", "options": [], "answer": "①触发方式：锁存器（latch）是电平敏感——使能电平有效期间输出跟随输入（透明），输入一变输出就跟着变；触发器（flip-flop）是边沿敏感——只在时钟上升/下降沿采样一次，其余时间输出保持不变。②抗干扰：锁存器透明期间会把输入上的毛刺直接传到输出，触发器因边沿采样可挡住沿外毛刺，时序行为确定、便于静态时序分析（STA）。③结构：一个边沿 D 触发器通常由主从两级电平灵敏锁存器构成。④使用：同步设计普遍用触发器；锁存器多用于面积/功耗敏感或跨时钟接口场景，但需要额外的时序与毛刺分析。", "explain": "①电平触发 vs 边沿触发 ②锁存器透明（输入直达输出）；触发器只在时钟沿更新 ③触发器抗毛刺、时序确定，同步设计中更常用 ④加分：D 触发器可由主从两级锁存器构成。", "sec": "2022面试题1", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-5", "kind": "subjective", "kind_name": "主观题", "num": 5, "stem": "为何 H.264 编码实时编码 SoC，通常只会输出 I 帧、P 帧，而不支持 B 帧的输出？为何网上下载的 h.264 编码文件，通常同时包含 I、P、B 三种类型的帧？", "options": [], "answer": "①B 帧采用双向预测：既参考已编码的过去帧，也参考尚未编码的未来帧；实时编码器为了拿到未来帧必须缓存后续图像、推迟输出，产生帧级延迟与重排序开销，还要占用更大的参考帧缓冲（DPB）和更高的内存带宽/运算量，通话、直播等低延迟场景无法接受；实时 SoC 的硬件流水线通常只支持 I/P，故一般只输出 I 帧和 P 帧。②网上下载的 H.264 文件是离线编码：允许编码器慢速多遍分析、也允许播放器缓冲重排，延迟不再是约束；而 B 帧压缩效率明显高于 P 帧（同质量下码率更低），所以文件编码普遍采用 I/P/B 混合以追求压缩率。", "explain": "①B 帧需要未来参考帧→缓存/延迟/复杂度/带宽 ②实时编码不能容忍延迟（且硬件流水线多只支持 I/P）③离线文件编码可容忍延迟，B 帧压缩率更高 ④加分：解码端也需要重排序缓冲。", "sec": "2022面试题1", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-9", "kind": "subjective", "kind_name": "主观题", "num": 9, "stem": "英译中（Memory-mapped I/O and port I/O）：", "options": [], "answer": "内存映射 I/O（Memory-mapped I/O，MMIO）与端口 I/O（Port-mapped I/O，PMIO）是实现 CPU 与外设之间输入/输出的两种互补方式。内存映射 I/O 用同一条地址总线同时寻址内存与 I/O 设备，访问内存的 CPU 指令同样可用来访问设备：每个 I/O 设备都监听 CPU 的地址总线，当 CPU 访问分配给该设备的地址空间时便作出响应，把数据总线连接到相应的设备硬件寄存器上。端口映射 I/O 则使用一类专门执行 I/O 的 CPU 指令（Intel 微处理器上即 IN/OUT 指令，可对 I/O 设备按字节读写）；设备拥有与普通内存相互独立的地址空间，通过 CPU 物理接口上额外的 I/O 引脚或一整条专用的 I/O 总线来访问。", "explain": "关键术语准确：内存映射 I/O（MMIO）/端口 I/O（PMIO）、统一地址总线、IN/OUT 指令、设备硬件寄存器、独立的 I/O 地址空间、专用 I/O 引脚或总线。", "sec": "2022面试题1", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-10", "kind": "subjective", "kind_name": "主观题", "num": 10, "stem": "下面三种变量声明有何区别？(1) `int const *m;` (2) `int *const m;` (3) `int *const *m`", "options": [], "answer": "(1) `int const *m;`（等价于 `const int *m;`）：指向常量的指针。不能通过 m 修改所指对象（`*m = 1;` 非法），但 m 本身可以改指向别处。const 在 * 左边，修饰的是所指的值。\n(2) `int *const m;`：指针常量。m 本身只读，定义时必须初始化，不能改指向；但可以修改所指对象（`*m = 1;` 合法）。\n(3) `int *const *m;`：指向“指针常量”的指针。m 是二级指针、本身可改；它所指向的一级指针（`*m`）是常量、不可改；而一级指针所指的对象（`m`）可改。该写法常见于函数参数，表示“不修改调用者传入的指针”。\n判别口诀：const 在 * 左侧修饰所指的值，在 * 右侧修饰指针自身（也可从变量名向外读）。", "explain": "①(1) 所指值不可改、指针可改 ②(2) 指针不可改（须初始化）、所指值可改 ③(3) 二级指针，其所指的一级指针是常量 ④加分：给出 const 位置判别口诀。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-11", "kind": "subjective", "kind_name": "主观题", "num": 11, "stem": "全局变量与局部变量在内存中是否有区别，是什么区别？", "options": [], "answer": "有区别，主要体现在存储位置、生命周期与作用域：①全局变量存放在静态存储区——已初始化的在 .data 段、未初始化的在 .bss 段（装入时清零），编译后地址固定，程序启动即存在、直到进程结束，默认初值为 0；②普通局部变量存放在栈上，随函数调用建立栈帧时分配、函数返回即释放，未初始化时为随机值，生命周期只覆盖函数执行期间；③作用域与链接性不同：全局变量默认外部链接，可被多个文件引用（可用 static 限制为本文件），局部变量只在函数内可见。补充：函数内加 static 的局部变量改存静态存储区、生命周期与程序同长，但作用域仍限于该函数。", "explain": "①存储区：全局在静态区（.data/.bss），局部在栈 ②生命周期：全局贯穿程序，局部随函数返回销毁 ③加分：默认初值不同（全局为 0，局部未初始化是垃圾值）、函数内 static 局部变量在静态区。 ④合并说明：同第 418 题（附加面试题·笔试题1 简答题第 8 题），重复题已合并。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-12", "kind": "subjective", "kind_name": "主观题", "num": 12, "stem": "进程和线程的区别？", "options": [], "answer": "①单位不同：进程是资源分配与拥有的基本单位（独立 PCB、地址空间、文件描述符表等）；线程是 CPU 调度与执行的基本单位，是进程内的一条执行流，线程间共享进程的代码段、数据段、堆和打开的文件，只各自拥有独立的栈、寄存器现场和 TCB（还有线程局部存储）。②隔离性：进程间地址空间隔离，一个进程崩溃一般不影响其他进程；线程共享同一地址空间，一个线程崩溃可能拖垮整个进程，共享数据的访问必须加锁/信号量保护，否则出现竞态。③开销：进程创建/切换需切地址空间（页表、TLB 失效），开销大；线程切换只保存/恢复栈与寄存器，开销小。④通信：进程间依赖管道、共享内存、socket 等 IPC，成本高；线程直接读写共享变量即可，方便但需同步。⑤并行性：多线程在多核上可真正并行，提升吞吐与响应性。", "explain": "①进程＝资源分配单位、线程＝调度单位 ②地址空间：进程独立、线程共享（自己只独占栈/寄存器）③创建与切换开销：进程大于线程 ④加分：进程隔离性好；线程共享数据需同步保护。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-13", "kind": "subjective", "kind_name": "主观题", "num": 13, "stem": "多线程的优缺点？", "options": [], "answer": "优点：①提高 CPU 利用率与吞吐——一个线程等待 I/O 时其他线程可继续执行，多核上还能真正并行；②响应性好——GUI/服务端用工作线程处理耗时任务，主线程保持可交互；③线程共享地址空间，通信（共享变量、队列）比进程间 IPC 简单高效；④创建与切换开销比进程小得多。缺点：①同步复杂——共享数据存在竞态条件，需加锁/信号量，易引入死锁、优先级反转等问题；②可靠性差——一个线程越界或崩溃会带走整个进程；③调试困难——时序相关缺陷难以复现；④调度与锁本身有开销，线程过多时上下文切换反而降低性能。", "explain": "①优点至少 2 点（提高 CPU 利用率/响应性好/共享内存通信方便/开销小于多进程）②缺点至少 2 点（竞态与同步复杂/一个线程崩溃影响全进程/调试困难/切换与锁开销）。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-14", "kind": "subjective", "kind_name": "主观题", "num": 14, "stem": "关键字 static 的作用是什么？", "options": [], "answer": "static 的含义随位置变化，C 中三种用法的本质是“改变生命周期或链接性”：①修饰局部变量：变量改存静态存储区（.data/.bss），生命周期延长到整个程序，只在第一次进入函数时初始化一次（未显式初始化则为 0），但作用域仍限于该函数，多次调用之间保留上次的值；②修饰全局变量：链接性变为当前文件内部（内部链接），其他文件即使 extern 也访问不到，避免重名冲突；③修饰函数：函数只在本文件内可见，其他文件无法调用；④C++ 中额外用法：修饰类的数据成员（全类共享）、修饰成员函数（无 this 指针、只能访问静态成员）。", "explain": "①局部变量：生命周期延长、只初始化一次、作用域不变 ②全局变量：文件内可见（内部链接）③函数：文件内可见 ④加分：C++ 类静态成员/静态成员函数。 ⑤合并说明：同 附加面试题·面试题7 第 1 题（static 关键字有什么作用）与第 5 题（C 的 static 与 C++ 的 static 有什么区别），重复题已合并。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-15", "kind": "subjective", "kind_name": "主观题", "num": 15, "stem": "malloc 分配的是物理地址还是虚拟地址？", "options": [], "answer": "malloc 返回的是虚拟地址（堆区虚拟地址）。用户态程序只能看到进程的虚拟地址空间，malloc 只是从进程堆的空闲区划出一段连续的虚拟地址；这段地址在真正读写时才由页表（MMU/缺页异常）逐页映射到物理页，因此“虚拟地址连续”不等于“物理内存连续”。补充：驱动中做 DMA 时不能直接用 malloc 返回的地址，需要做虚拟地址到物理地址的转换（如 virt_to_phys/dma_map_single），否则 DMA 会访问到错误的物理位置。", "explain": "①结论：虚拟地址（用户态只见虚拟地址空间）②由 MMU/页表映射到物理内存、物理页按需分配 ③加分：DMA 场景需物理地址或做地址转换。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-16", "kind": "subjective", "kind_name": "主观题", "num": 16, "stem": "用变量 m 给出下面的定义：a) 一个整型数 b) 一个指向整型数的指针 c) 一个指向指针的的指针，它指向的指针是指向一个整型数 d) 一个有 10 个整型数的数组 e) 一个由 10 个指针的数组，该指针是指向一个整型数的 f) 一个指向有 10 个整型数数组的指针 g) 一个指向函数的指针，该函数有一个整型参数并返回一个整型数 h) 一个有 10 个指针的数组，该指针指向一个函数，该函数有一个整型参数并返回一个整型数", "options": [], "answer": "a) 整型数：`int m;`\nb) 指向整型数的指针：`int *m;`\nc) 指向指针的指针，它指向的指针指向整型数：`int m;`\nd) 10 个整型数的数组：`int m[10];`\ne) 10 个指针的数组，每个指针指向整型数：`int *m[10];`（[] 优先级高，m 先与 [] 结合）\nf) 指向“10 个整型数数组”的指针：`int (*m)[10];`（括号强制 * 先结合）\ng) 指向函数的指针，函数有一个 int 参数并返回 int：`int (*m)(int);`\nh) 10 个函数指针的数组，每个函数有一个 int 参数并返回 int：`int (*m[10])(int);`\n分辨 e/f 与 h 的关键：看变量名先与谁结合——先与 [] 结合是“数组”，先与 * 结合是“指针”。", "explain": "①a~h 每项写法正确（每项 1 分）②e 为指针数组、f 为数组指针，能区分二者 ③h 为函数指针数组。", "sec": "2022面试题2（嵌入式软件设计工程师笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-17", "kind": "subjective", "kind_name": "主观题", "num": 17, "stem": "请简单描述函数与宏的区别。", "options": [], "answer": "①处理时机：宏在预处理阶段做纯文本替换，函数由调用指令在运行期执行；②类型安全：宏没有参数类型检查、不遵循作用域规则，函数有参数类型检查与作用域；③副作用：宏的参数在展开后可能被求值多次（如 `#define MAX(a,b) ((a)>(b)?(a):(b))` 中 a、b 各出现两次，传 `MAX(i++, j)` 会多次自增），函数参数只求值一次；④开销：宏无函数调用开销（无栈帧/跳转）但会造成代码膨胀、不能取地址；函数有调用开销，但只保留一份代码、可递归、可断点调试（宏在调试器中不可见）；⑤用法：宏靠括号、`#`、`##`、do{}while(0) 等技巧书写，易出错，现代 C 更推荐用 `static inline` 函数替代简单宏。", "explain": "①展开时机：预处理文本替换 vs 运行期函数调用 ②类型检查与作用域：宏没有、函数有 ③副作用：宏参数可能被多次求值 ④开销：宏无调用开销但代码膨胀、不易调试 ⑤加分：宏参数需加括号、可用 static inline 替代。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-18", "kind": "subjective", "kind_name": "主观题", "num": 18, "stem": "引用与指针有什么区别？", "options": [], "answer": "①初始化与改绑：引用是别名，定义时必须绑定一个对象且终身不能改绑；指针是独立变量，可不初始化（危险）、可重新赋值指向别处。②空值：指针可以为 NULL/nullptr，使用前需判空；引用语法上不能为空。③使用与运算：引用像普通变量一样直接使用；指针需用 * 解引用，可做 +1/比较等指针运算，支持多级（）。④sizeof：sizeof(引用) 得到所指对象的大小，sizeof(指针) 得到地址宽度（32 位为 4、64 位为 8）。⑤安全与灵活：引用更安全简洁，作为函数参数可避免空指针和解引用遗漏；指针更灵活，适合表示“可选指向”、遍历数组/链表等动态结构。⑥其他：引用没有引用的数组、不能取引用，指针可以；引用底层通常仍用地址实现。", "explain": "①必须初始化且不可改绑 vs 可空、可改指向 ②直接使用 vs 需解引用与指针运算（含 sizeof 差异）③引用更安全简洁、指针更灵活——至少答出 2 点。 ③合并说明：同 附加面试题·面试题7 第 14 题（简要描述 C++ 指针和引用的区别），重复题已合并。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-19", "kind": "subjective", "kind_name": "主观题", "num": 19, "stem": "全局变量和局部变量分别保存在哪个位置（堆栈），函数内 static 定义的变量是存放在哪里的？堆栈有什么区别？", "options": [], "answer": "存储位置：①普通局部变量、函数参数和返回地址保存在栈上；②全局变量在静态存储区——已初始化的放 .data，未初始化的放 .bss；③函数内 static 变量同样在静态存储区，生命周期到程序结束，只是作用域限于函数。\n堆与栈的区别：①管理方式：栈由编译器和 CPU 自动管理（进入函数分配栈帧、返回自动收回）；堆由程序员手动管理，malloc/free（或 new/delete）必须配对。②空间与增长方向：栈空间较小（一般几 MB）、向低地址增长，越界会栈溢出；堆空间大、向高地址增长。③效率与碎片：栈分配只是移动栈指针，很快且不会碎片；堆分配要查找空闲链表、加边界标记，较慢，频繁申请释放会产生碎片。④内容与生命周期：栈上放生命周期受调用约束的局部数据，堆上放生命周期灵活的动态数据。⑤典型错误：堆忘记释放会造成内存泄漏，重复释放/越界会破坏堆结构；栈溢出会踩坏相邻变量或返回地址。", "explain": "①存储位置：局部→栈，全局与 static→静态区（.data/.bss）②堆栈对比：自动 vs 手动管理、空间大小、分配效率与碎片、增长方向 ③加分：栈溢出与内存泄漏后果。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-20", "kind": "subjective", "kind_name": "主观题", "num": 20, "stem": "class 和 struct 的区别？", "options": [], "answer": "C++ 中二者的区别只有默认访问权限和默认继承方式：①class 的成员默认 private、默认继承 private；struct 的成员默认 public、默认继承 public。②功能上完全等价：struct 也可以有构造函数、成员函数、虚函数、继承与多态、静态成员。③使用惯例：struct 常用于纯数据聚合/POD 类型（与 C 兼容的结构体、值对象），class 用于封装行为与不变量的抽象类型；模板元编程中为省去 public: 也常用 struct。④注意：C 语言只有 struct，没有 class，且 C 的结构体不能有成员函数与访问控制。", "explain": "①默认成员访问权限：class=private、struct=public ②默认继承方式：class=private、struct=public ③加分：功能等价、使用惯例不同（struct 常作数据聚合）。 ③合并说明：同 附加面试题·面试题5 第 11 题（C++ 中 struct 和 class 的区别），重复题已合并。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-21", "kind": "subjective", "kind_name": "主观题", "num": 21, "stem": "C++ 中的空类，默认产生哪些类成员函数？", "options": [], "answer": "空类并非真的“空”，当程序用到时编译器会按需隐式生成：①默认构造函数；②拷贝构造函数；③拷贝赋值运算符 operator=；④析构函数；⑤两个取地址运算符 operator&（普通版与 const 版）。C++11 起还会在条件满足时生成⑥移动构造函数、⑦移动赋值运算符。要点：这些函数是“被使用时才生成”（被 odr-use）；只要用户自己声明了其中一个（如自定义析构函数），其余相关的默认版本就不再隐式生成（取地址运算符除外）；默认拷贝构造/赋值只做逐成员浅拷贝，成员含裸指针时必须自定义（Rule of Three/Five）。", "explain": "①默认构造 ②拷贝构造 ③析构 ④拷贝赋值 ⑤两个取地址运算符（至少答出前 4 个）⑥加分：C++11 移动构造/移动赋值、浅拷贝风险。 ⑦合并说明：同 附加面试题·面试题5 第 18 题（C++ 的空类默认产生哪些类成员函数），重复题已合并。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-22", "kind": "subjective", "kind_name": "主观题", "num": 22, "stem": "const 有什么用途？（请至少说明两种）", "options": [], "answer": "①修饰变量→只读，初始化后不可改，可替代 #define 获得类型检查与作用域（如 `const int BUF = 100;`）；②修饰函数参数→防止函数内部误改实参，同时表达接口承诺、避免大对象拷贝（如 `const char *s`、`const T &x`）；③修饰返回值→防止调用方修改返回的引用/指针所指内容；④修饰成员函数→承诺不修改对象状态（const 对象只能调用 const 成员函数）；⑤修饰成员变量→常数据成员，必须在构造函数的初始化列表中初始化。补充：const 与 #define 不同——有类型、有作用域、可参与调试；成员函数中若确需修改个别成员（缓存、锁），可用 mutable 修饰该成员。", "explain": "至少答出 2 种用途：只读变量/函数参数/返回值/成员函数/成员变量 ⑥加分：与 #define 的区别、mutable 例外、const 成员函数与 this 的关系。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-23", "kind": "subjective", "kind_name": "主观题", "num": 23, "stem": "在 C++ 程序中调用被 C 编译器编译后的函数，为什么要加 `extern \"C\"` 声明？", "options": [], "answer": "原因是两种语言的“名字修饰”（name mangling）规则不同：C++ 为支持函数重载，会把参数类型等信息编码进符号名（如 GCC 下 `void foo(int)` 生成符号 `_Z3fooi`），而 C 编译器不做修饰，符号就是 `foo`。用 C 编译器编译的目标文件中符号为 `foo`，C++ 代码若按默认规则引用就会生成 `_Z3fooi`，链接时找不到该符号（undefined reference）。加 `extern \"C\"` 后，C++ 对这些声明按 C 的链接规则生成/引用符号，双方才能对上。惯用写法是在头文件中包一层 `#ifdef __cplusplus` / `extern \"C\" {` / `#endif`，使头文件同时被 C 与 C++ 使用；被 C++ 编译的 C 函数定义处同样建议加 extern \"C\" 以保证符号名一致。", "explain": "①C++ 有名字修饰（为支持重载）、C 没有 ②extern \"C\" 使声明按 C 链接规则处理，避免未定义符号 ③加分：头文件用 __cplusplus 宏包裹 extern \"C\" 的惯用法。 ③合并说明：同 附加面试题·面试题5 第 15 题（在 C++ 中调用被 C 编译器编译的函数为什么要加 extern \"C\"），重复题已合并。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-24", "kind": "subjective", "kind_name": "主观题", "num": 24, "stem": "给定一个整型变量 `int a`，写两行代码，设置第三位和清除第三位，保持其它位不变。\n设置 a 的 bit 3 为 1：____________\n清除 a 的 bit 3 为 0：____________", "options": [], "answer": "置位（bit 3 置 1）：`a |= (1 << 3);`；清位（bit 3 清 0）：`a &= ~(1 << 3);`。\n原理：`1 << 3` 得到只有 bit 3 为 1 的掩码 0x08。置位用“或”——其余位 0|x 保持原值、bit3 被强制置 1；清位用“与上取反的掩码”（~(1<<3)=0xF7）——bit3 被清零、其余位 1&x 保持原值。\n注意：①这是“读—改—写”三步操作，不是原子操作，若 a 会被中断/多线程同时访问，需临界区保护；②掩码建议写 `(1u << 3)` 避免有符号移位；③可用宏或结构体位域提高可读性。", "explain": "①置位 `a |= (1 << 3);` ②清位 `a &= ~(1 << 3);` ③说明只影响 bit3、其余位不变 ④加分：指出非原子操作需保护。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-25", "kind": "subjective", "kind_name": "主观题", "num": 25, "stem": "What will be printed as the result of the operation below, why?\nvoid foo(void)\n{\n    unsigned int a = 6;\n    int b = -20;\n    (a+b > 6) ? puts(\"> 6\") : puts(\"<= 6\");\n}", "options": [], "answer": "输出 \"> 6\"。原因：a 是 unsigned int，做 a+b 时发生“常用算术转换”——int 类型的 b 被转换为 unsigned int，-20 的补码表示变为 2³²−20 = 4294967276，相加得 4294967282（无符号模运算），远大于 6，于是条件为真，打印 \"> 6\"。教训：有符号与无符号混合运算/比较是常见坑，编译器可能给出 -Wsign-compare 警告；应显式转换类型（如 `(int)a + b`）或统一使用有符号类型。", "explain": "①输出 \"> 6\" ②原因：a 为 unsigned int，b 被隐式转换为无符号大数参与运算 ③加分：指出混合比较的风险与修正方法。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-26", "kind": "subjective", "kind_name": "主观题", "num": 26, "stem": "What will be printed as the result of the operation below:\nmain()\n{\n    int x=10, y=15;\n    x = x++;\n    y = ++y;\n    printf(\"%d %d\\n\",x,y);\n}", "options": [], "answer": "常见实现（GCC -O0/-O2 实测）输出 `10 16`。①`x = x++;`：同一表达式中对 x 既自增又赋值，两个修改之间没有先后顺序约束，属于未定义行为（UB），标准不保证结果；多数编译器取到自增前的旧值，故 x 仍为 10，但换编译器/优化选项可能得到 11 或其它结果。②`y = ++y;`：先自增再赋值，逻辑上 y 变为 16；严格说该写法在 C 与 C++11/14 中同属未定义行为（C++17 起才规定右操作数先求值）。结论：笔试标准答案为 10 16；实际编程应拆成两行（`x++;`、`y++;`），不要在同一表达式里对同一变量既读又写。", "explain": "①16 必答 ②x 的值 10（注明是 UB、不可移植）③加分：说明 UB 原因与正确写法。", "sec": "2022面试题3（C/C++ 笔试试卷）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-27", "kind": "subjective", "kind_name": "主观题", "num": 27, "stem": "下列程序在 32 位 Linux 或 Unix 中的结果是什么？\nfunc(char *str)\n{\n    printf(\"%d\",sizeof(str));\n    printf(\"%d\",strlen(str));\n}\nmain()\n{\n    char a[]=\"123456789\";\n    printf(\"%d\",sizeof(a));\n    printf(\"%d\",strlen(a));\n    func(a);\n}", "options": [], "answer": "依次输出 `10 9 4 9`（32 位 Linux；若 64 位系统，第三个数是 8）。\n分析：①`char a[]=\"123456789\";` 是数组，sizeof(a)=10（9 个字符 + '\\0'），strlen(a)=9（不计 '\\0'）；②数组作为实参传给 func 后退化为 char*，函数内 sizeof(str) 是指针大小，32 位下为 4；③strlen(str) 从指针所指内容数到 '\\0'，仍为 9，且 strlen 不包含终止符。\n提示：函数内部无法用 sizeof 求数组长度，必须额外传长度参数；求字符串长度用 strlen（O(n)），求数组总字节数用 sizeof。", "explain": "①10、9、4、9 四个数值全对 ②区分 sizeof（含 '\\0'/按类型）与 strlen（到 '\\0' 为止）③加分：说明数组传参退化为指针。", "sec": "2022面试题4（C/C++/Java 笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-28", "kind": "subjective", "kind_name": "主观题", "num": 28, "stem": "写出下述程序结果：\nint m[][3] = {1, 4, 7, 2, 5, 8, 3, 6, 9};\nint i, j, k = 2;\nfor (i = 0; i < 3; i++) {\n    printf(\" %d\", m[k][i]);\n}", "options": [], "answer": "输出 `3 6 9`（数字前各带一个空格）。分析：`int m[][3] = {1,4,7,2,5,8,3,6,9};` 是 3 行 3 列的二维数组，按行优先初始化：m[0]={1,4,7}、m[1]={2,5,8}、m[2]={3,6,9}。循环固定 k=2，i 从 0 到 2 依次输出 m[2][0]~m[2][2]，即 3 6 9。要点：二维数组按行优先存储；printf 格式串是 \" %d\"，所以每个数前有一个前导空格。", "explain": "①结果 3 6 9 ②说明按行优先初始化与 m[2] 的含义 ③加分：指出前导空格（格式串 \" %d\"）。", "sec": "2022面试题4（C/C++/Java 笔试题）", "sec_group": "一、2022 年", "imgs": []}, {"id": "sub-30", "kind": "subjective", "kind_name": "主观题", "num": 30, "stem": "请编程判断数组的元素个数。", "options": [], "answer": "思路：数组总字节数除以单个元素字节数：`int n = sizeof(a) / sizeof(a[0]);`（要求 a 是真正的数组名、且与 sizeof 处于同一作用域，尚未作为参数退化为指针）。\n说明：sizeof 是编译期运算符，数组名求值为整个数组大小（如 int a[10] → 40 字节），除以 sizeof(a[0])（4 字节）得到元素个数；也可写 sizeof(a)/sizeof(int)。若 a 是函数参数（已退化为指针）或由 malloc 得到的指针，此法无效，必须另外传递长度；C++ 中可用 `std::size(a)` 或范围 for 更安全。该技巧常封装为宏 `#define ARRAY_SIZE(a) (sizeof(a)/sizeof((a)[0]))`。", "explain": "①`sizeof(a)/sizeof(a[0])` 写法正确 ②说明只对真数组有效、对指针无效 ③加分：编译期求值、可封装成宏。 ④合并说明：同 附加面试题·面试题7 第 17 题（定义宏 NA 求数组元素个数：`#define NA(a) (sizeof(a)/sizeof((a)[0]))`），重复题已合并。", "sec": "2023面试题-1（期末考试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-31", "kind": "subjective", "kind_name": "主观题", "num": 31, "stem": "请简述嵌入式系统中中断处理的一般流程。", "options": [], "answer": "嵌入式中断处理的一般流程（以 ARM Cortex-M 为例）：①中断源产生请求（外设置中断标志），中断控制器（NVIC）按优先级判断是否响应该中断；②若符合响应条件，CPU 完成当前指令后自动“压栈保护现场”（保存 PC、LR、R0~R3 等），并读取中断向量表，跳转到对应 ISR；③进入 ISR 后先清除外设中断标志（防止重复进入），再读取/处理数据；④必要时通过任务通知/信号量/队列通知任务，把耗时处理交给其它上下文；⑤中断返回：弹栈恢复现场，CPU 回到被中断处继续执行。要点：ISR 应尽量短、不阻塞、不使用不可重入的非中断安全 API；高优先级中断可抢占低优先级 ISR（嵌套）。", "explain": "①请求与优先级判定（NVIC）②自动保护现场、按中断向量表跳转 ③ISR 中清标志并处理数据 ④恢复现场、中断返回 ⑤加分：ISR 要短、注意嵌套与重入问题。", "sec": "2023面试题-1（期末考试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-34", "kind": "subjective", "kind_name": "主观题", "num": 34, "stem": "程序功能是将各个平方根值放入数组中（找错误）：\n#include <stdio.h>\nvoid main()\n{\n    int max, a, i;\n    scanf( \"%d%d\" , max, a);\n    double x[max];\n    for (i=0; i<max; i++)\n        x[i]=sqrt(a*i);\n}", "options": [], "answer": "该程序有多处错误：①最严重的是 `scanf(\"%d%d\", max, a);` 传的是变量值而不是地址，应为 `scanf(\"%d%d\", &max, &a);`，否则运行必然崩溃；②`double x[max];` 是变长数组（VLA），C90 不合法、C99 起才允许，且 max 直到运行期输入后才确定，MSVC 等编译器不支持；③未包含 `<math.h>`，sqrt 没有声明（C99 后隐式声明非法，会报错）；④main 返回类型应为 int 且缺 return 0；⑤未检查 scanf 返回值与 max 的合法性（max<=0 时数组非法）；⑥平均意义上“平方根值”不是整数，类型用 double 是对的，但应写 `sqrt((double)a*i)` 明确传达；⑦程序没有任何输出。", "explain": "①scanf 缺取地址符（必答）②至少再答出 1 个问题（未包含 math.h / VLA 限制 / void main / 未校验输入）③加分：给出修改后的正确写法思路。", "sec": "2023面试题-1（期末考试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-35", "kind": "subjective", "kind_name": "主观题", "num": 35, "stem": "嵌入式多任务操作系统按照任务调度的方式可以分为哪两类？请简要描述它们的特点。（12 分）", "options": [], "answer": "按调度时机可分为两类：①可剥夺（抢占）式调度：内核可在任意时刻（有更高优先级任务就绪、时间片到、中断返回）剥夺当前任务的 CPU，交给更高优先级/就绪任务；特点是高优先级任务响应快、实时性好，但内核要处理共享数据的可重入与临界区保护，实现复杂；典型如 FreeRTOS、uC/OS-II 的抢占模式。②不可剥夺（非抢占）式调度：任务一直运行到自愿放弃（延时、等待信号量、主动调度）才发生切换；特点是内核与任务代码简单、上下文切换少、共享数据冲突少，但高优先级任务的响应时间不确定（最坏要等当前任务让出），实时性差，适用于协作型/简单控制场景。多数 RTOS 支持两种方式的组合配置。", "explain": "①两类名称正确：可剥夺（抢占）式 vs 不可剥夺（非抢占）式 ②各自特点：抢占=响应快/实时性好但需临界区保护；非抢占=简单、切换少但响应不确定 ③加分：举例 RTOS 或说明混合模式。", "sec": "2023面试题-1（期末考试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-36", "kind": "subjective", "kind_name": "主观题", "num": 36, "stem": "嵌入式多任务操作系统任务间同步和通信的方式有哪些？（8 分）", "options": [], "answer": "嵌入式 RTOS 常见的任务间同步与通信机制：①信号量：二值/计数信号量用于同步（中断释放、任务获取），互斥量（Mutex）用于互斥保护共享资源，支持优先级继承；②事件标志组：等待一个或多个事件位（或/与等待），适合多条件同步；③消息队列：任务/中断之间传递定长消息，先进先出、可阻塞等待，是任务间传送数据的主力；④邮箱：消息队列的特例（长度 1），用于传一个指针/小消息；⑤任务通知（FreeRTOS）：更轻量更快，可替代信号量与队列的常见用法；⑥其它：管道、流缓冲/消息缓冲、共享内存+信号量（数据量大时）、全局变量+临界区（简单场合）。使用原则：中断中只能用带 FromISR 后缀的 API；共享资源访问用互斥量/临界区保护。", "explain": "①至少答出 3 种：信号量/互斥量、事件标志组、消息队列、邮箱、任务通知、管道、共享内存 ②区分同步（信号量/事件）与通信（队列/邮箱/共享内存）③加分：FromISR 限制、优先级继承等使用注意。", "sec": "2023面试题-1（期末考试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-37", "kind": "subjective", "kind_name": "主观题", "num": 37, "stem": "Linux 内核分为哪四个子系统？", "options": [], "answer": "Linux 内核分为四大子系统：①进程调度（Process Scheduler）：决定哪个进程/线程何时占用 CPU，是内核最核心的部分，含调度器、上下文切换与进程管理；②内存管理（Memory Management）：虚拟内存、页表映射、缺页处理、物理页分配与 slab 分配器；③虚拟文件系统（VFS）：为 ext4、nfs、proc、sysfs 等不同文件系统提供统一接口，并管理块设备、页缓存与文件描述符；④网络接口（Network）：实现 TCP/IP 协议栈与网络设备驱动接口。补充：POSIX 也把进程间通信（IPC）单列为一块，内核中它分散在 VFS/进程管理等部分。", "explain": "①四个子系统名称：进程调度、内存管理、虚拟文件系统、网络接口 ②各自一句职责 ③加分：提及 IPC 也可单列。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-38", "kind": "subjective", "kind_name": "主观题", "num": 38, "stem": "在 Windows 环境下共享 Unix/Linux 中的用户目录的一个工具是？", "options": [], "answer": "常见答案是 Samba（或挂载工具 mount）：①在 Unix/Linux 服务器上安装配置 Samba（SMB/CIFS 服务），把用户目录（如 /home/user）导出为共享，Windows 端通过 \\\\主机名\\共享名 访问，或“映射网络驱动器”、`net use` 挂载；②也可从 Linux 侧主动挂载 Windows 共享：`mount -t cifs //server/share /mnt -o username=...`；③还可用 SSHFS（基于 SFTP）把远程 Unix 目录挂到本地，或 smbclient 工具。\n本质：让 Windows 能透明读写 Unix 用户目录，靠的是 SMB/CIFS 协议与 Samba 服务。", "explain": "①Samba（SMB/CIFS）或 mount -t cifs、SSHFS 任一 ②说明作用：把 Unix 用户目录共享给 Windows 访问。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-39", "kind": "subjective", "kind_name": "主观题", "num": 39, "stem": "Linux 系统下的软链接和硬链接有什么异同？", "options": [], "answer": "相同点：都让多个路径名访问同一份数据（都与 inode 相关）。\n不同点：①硬链接（ln）是同一 inode 的另一个目录项，与源文件地位平等、指向同一 inode，inode 链接计数加 1；删除其中任意一个只是计数减 1，数据仍在；不能跨文件系统（inode 号只在同一 fs 内唯一），一般不能给目录建硬链接（防目录树成环）；`ls -li` 可看到两者 inode 相同。②软链接（ln -s，符号链接）是独立文件，内容是目标路径字符串，有自己的 inode；可跨文件系统、可指向目录、可指向不存在的路径；目标删除后软链接悬空，访问报错；相对路径相对于链接所在目录解析。③使用场景：硬链接用于同一文件多目录项/镜像备份计数；软链接用于灵活的路径别名、版本切换（如 libxxx.so → libxxx.so.1.2）。", "explain": "①相同：都指向已有文件、与 inode 关联 ②硬链接：同 inode、不可跨 fs、不可链目录、删除源不影响 ③软链接：独立文件存路径、可跨 fs/链目录、源删后悬空失效 ④加分：ls -li 验证 inode、典型使用场景。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-40", "kind": "subjective", "kind_name": "主观题", "num": 40, "stem": "经过下面这一段程序的计算后，a、b 的值分别是什么？\na = a ^ b;\nb = b ^ a;\na = a ^ b;", "options": [], "answer": "三步执行后 a、b 的值互换。推导（记原始值为 A、B）：①a = A^B；②b = B^a = B^(A^B) = A；③a = a^b = (A^B)^A = B。利用了异或的交换律、结合律与 x^x=0、x^0=x。\n注意：①该技巧要求两个操作数不是同一对象（若 &a==&b 或宏参数重复传同一变量，第一步就把值清零）；②属“聪明代码”，现代编译器的三变量交换同样高效，工程上更推荐 `t=a; a=b; b=t;`，可读性好且不依赖位运算特性与“a、b 不相交”前提；③位运算技巧常用于笔试面试与无临时变量约束的场景。", "explain": "①结论：a、b 互换 ②至少给出一步正确推导（如 b=B^(A^B)=A）③加分：指出前提与局限（不能同一变量、可读性问题）。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-41", "kind": "subjective", "kind_name": "主观题", "num": 41, "stem": "Linux 内核的多线程同步机制有哪些？", "options": [], "answer": "Linux 内核主要同步机制：①原子操作（atomic_t/atomic64_t）——单一计数、标志位，无锁；②自旋锁 spinlock——忙等，适合极短临界区，可在中断上下文使用（配 spin_lock_irqsave 防中断死锁）；③读写锁 rwlock——读并发、写独占，适合读多写少；④顺序锁 seqlock——写侧不阻塞读者、读侧乐观重试，适合读多写少且数据简单；⑤互斥体 mutex——可睡眠，适合较长临界区，只能进程上下文；⑥信号量 semaphore——计数式，可睡眠，用于同步与限流；⑦完成量 completion——等待某事件完成的轻量同步；⑧RCU——读侧几乎零开销、延迟回收，适合链表等读多写少结构；⑨其它：内存屏障 barrier/smp_mb、per-CPU 变量。选择原则：能否睡眠（中断上下文只能用自旋锁）、临界区长短、读写比例。", "explain": "①至少答出 3 种（原子操作、自旋锁、读写锁/seqlock、mutex、信号量、RCU、completion）②加分：区分能否睡眠与适用上下文。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-42", "kind": "subjective", "kind_name": "主观题", "num": 42, "stem": "请写出 Linux 指令实现在当前目录下查找文件名以 lib 开头的文件。", "options": [], "answer": "`find . -name \"lib*\"`\n说明：`.` 表示当前目录，-name \"lib*\" 按文件名通配匹配，find 默认递归子目录；只查当前层可加 `-maxdepth 1`；也可用 `ls lib*`（只列当前目录、不递归）。补充：只找普通文件加 `-type f`；通配符要加引号防止被 shell 先展开；可通过 `-path ./out -prune` 排除不需搜索的目录。", "explain": "①`find . -name \"lib*\"`（find -name 用法）②说明递归与通配符引号 ③加分：maxdepth/type f 等细化写法。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-43", "kind": "subjective", "kind_name": "主观题", "num": 43, "stem": "调用 `fork()` 在子进程中返回值为什么？", "options": [], "answer": "在子进程中 fork() 返回 0；在父进程中返回新创建子进程的 PID（>0）；调用失败时在父进程返回 -1 并设置 errno（如 EAGAIN 资源不足）。父子进程正是靠返回值区分身份：`pid_t pid = fork(); if (pid == 0) { /* 子进程 */ } else if (pid > 0) { /* 父进程 */ } else { perror(\"fork\"); }`。\n补充：fork 后子进程是父进程的完整拷贝（采用写时复制 COW），继承已打开的文件描述符、信号处理等；子进程结束后若父进程未 wait/waitpid，会留下僵尸进程；fork 前建议 fflush，避免缓冲区内容被复制导致重复输出。", "explain": "①子进程返回 0 ②父进程返回子进程 PID、失败返回 -1 ③加分：用 if (fork()==0) 区分父子进程、COW/僵尸进程等补充。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-44", "kind": "subjective", "kind_name": "主观题", "num": 44, "stem": "请简述对 DMA 操作的认识和理解。", "options": [], "answer": "DMA（Direct Memory Access，直接内存访问）是由专用控制器在外设与内存之间直接搬移数据的机制，搬移过程 CPU 不逐字节参与：①CPU 先把“源地址、目的地址、传输长度、访问宽度、是否循环、完成中断”等参数配置给 DMA 通道；②外设（或内存）产生请求后，DMA 控制器接管总线，在源与目的之间搬数据；③搬完设定长度后产生完成中断/置标志，通知 CPU 处理。优点：大数据块传输吞吐率高、CPU 占用极低，CPU 可并行执行其它任务；常用于 ADC 连续采样、串口/SPI 收发、LCD 刷屏、内存到内存拷贝等。\n注意：①DMA 使用物理地址（或经 IOMMU 映射的地址），不能直接用 malloc 的虚拟地址；②DMA 改过的内存要与 CPU 缓存做一致性维护（clean/invalidate cache）；③要处理完成/半完成中断与错误标志。", "explain": "①概念：外设与内存直接搬数据，不经过 CPU 逐字节干预 ②效率高、CPU 占用低 ③使用要点：配置源/目的/长度、完成中断 ④加分：物理地址/缓存一致性等注意点。 ⑤合并说明：同第 422 题（附加面试题·笔试题1 简答题第 12 题），重复题已合并。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-45", "kind": "subjective", "kind_name": "主观题", "num": 45, "stem": "请写出 Linux 指令实现在当前目录中递归查找包含字符串\"string\"的文件，但不搜索\".svn\"目录。", "options": [], "answer": "`grep -rn \"string\" . --exclude-dir=.svn`\n说明：-r 递归子目录、-n 显示行号、`.` 表示当前目录、--exclude-dir=.svn 排除 .svn 目录；若要同时排除 .git 等可写 `--exclude-dir={.svn,.git}`。等效的 find 写法：`find . -path ./.svn -prune -o -type f -print | xargs grep -n \"string\"`。补充：-i 忽略大小写、-l 只列文件名、-w 全词匹配。", "explain": "①grep -r 递归查找 ②排除目录（--exclude-dir 或 find -prune）③加分：说明 -n/-i/-l 等选项或组合写法。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-46", "kind": "subjective", "kind_name": "主观题", "num": 46, "stem": "char 型设备驱动需要实现的接口通常包括哪些？", "options": [], "answer": "字符设备驱动需要实现两部分：①文件操作接口 file_operations 结构体，核心是 open、release（对应 close）、read、write 四个，按需实现 ioctl（设备控制）、llseek（定位）、poll（多路复用）、mmap（映射）、fasync（异步通知）等；②设备注册与加载：模块初始化里申请设备号并注册——旧接口 register_chrdev，新式接口 alloc_chrdev_region + cdev_init + cdev_add；卸载时 cdev_del + unregister_chrdev_region；③与用户态交换数据必须用 copy_to_user/copy_from_user（不能直接解引用用户指针），必要时用 capable() 做权限检查；④可选：通过 class_create/device_create 让 udev/mdev 自动创建 /dev 节点。\n要点：read/write 返回实际读写字节数、文件位置由内核维护；驱动要处理并发（自旋锁/mutex）与阻塞/非阻塞语义。", "explain": "①file_operations：open/release/read/write（核心四件套，可加 ioctl 等）②设备注册：register_chrdev 或 alloc_chrdev_region+cdev_add ③加分：copy_to_user/copy_from_user、并发保护、/dev 节点创建。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-47", "kind": "subjective", "kind_name": "主观题", "num": 47, "stem": "阅读 Linux 内核从系统调用返回到用户态的 ARM 汇编代码（ret_fast_syscall），简要描述 Linux 从核心态返回用户态时所作的工作。", "options": [], "answer": "ret_fast_syscall 是 ARM Linux 从系统调用（内核态）返回用户态的快速路径，主要工作：①先关中断（cpsid i），检查当前任务的线程标志 _TIF_WORK_MASK——是否有待处理的重调度、信号、单步等“慢速工作”，若有则跳转 slow_work_pending（bl do_work_pending）处理完再返回；②没有待办工作时走快速路径：从内核栈上恢复用户态现场——恢复 r0~r12 等通用寄存器、sp（用户栈指针）、lr、pc（用户指令地址）与 cpsr（由 SPSR 恢复）；③通过 `movs pc, lr`（或 ldm 同时弹栈 pc 与 cpsr）把 PC 与 CPSR 写回，处理器由 SVC 模式切回用户模式，从系统调用下一条指令继续执行。\n要点：为什么要先关中断——检查与恢复过程不能被中断打断；保存/恢复的是“用户态现场”（含 PC 与状态寄存器）；慢速路径专门处理重调度、信号投递等不能在内核态错过的事件。", "explain": "①关中断并检查 _TIF_WORK_MASK，有挂起工作走慢路径（work_pending）②快速路径恢复用户寄存器/栈指针/PC/SPSR ③movs pc, lr 与 SPSR→CPSR 完成模式切换返回用户态 ④加分：说明关中断与“慢速工作”的原因。", "sec": "2023面试题-2（Anyka 笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-48", "kind": "subjective", "kind_name": "主观题", "num": 48, "stem": "以下程序运行后的输出结果是？\nmain()\n{ int a;\na=(int)((double)(3/2)+0.5+(int)1.99*2);\nprintf(\"%d\\n\",a);\n}", "options": [], "answer": "输出 `3`。计算过程：①3/2 是整数除法得 1，再转 double 为 1.0；②(int)1.99 把 1.99 截断（向 0 取整）为 1，乘 2 得 2（整型）；③1.0 + 0.5 + 2 先做隐式类型提升得到 3.5（double）；④外层 (int)3.5 截断为 3，printf 以 %d 输出 3。\n要点：整数除法会丢小数（3/2 不等于 1.5）；(int) 强制转换对正数截断、不四舍五入；混合运算向精度高的类型自动提升。", "explain": "①结果 3 ②关键步骤：3/2=1、(int)1.99=1、1.0+0.5+2=3.5 最后截断 ③加分：指出整数除法与截断规则。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-49", "kind": "subjective", "kind_name": "主观题", "num": 49, "stem": "指针和引用的区别（请至少说明两种）。", "options": [], "answer": "①初始化与改绑：引用定义时必须初始化、之后不能改绑到其它对象；指针可以不初始化（危险）或置空，并可随时改指向。②空值：指针可为 NULL/nullptr，引用不能为空，使用引用无需判空。③访问方式：引用像普通变量一样直接使用；指针要用 * 解引用，可进行 +1、相减、比较等指针运算，还支持多级（）。④sizeof：sizeof(引用) 得到所指对象大小，sizeof(指针) 得到地址宽度（32 位 4、64 位 8）。⑤语义与底层：引用是对象的别名，编译器通常用地址实现，但语言层面更安全简洁，常作为函数参数（避免拷贝、避免空指针）；指针更灵活，适合表达可选的指向、动态结构与数组遍历。", "explain": "至少 2 点：①必须初始化且不可改绑 vs 可空/可改指向 ②直接使用 vs 解引用与指针运算 ③sizeof 不同 ④引用更安全、指针更灵活。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-52", "kind": "subjective", "kind_name": "主观题", "num": 52, "stem": "找出下面这段代码的运行错误：\nvoid test1()\n{\n    char string[10];\n    char* str1 = \"0123456789\";\n    strcpy( string, str1 );\n}", "options": [], "answer": "错误是 strcpy 造成缓冲区越界：字符串字面量 \"0123456789\" 有 10 个可见字符，加上结尾的 '\\0' 共占 11 字节，而 char string[10] 只有 10 字节；strcpy 会把 11 字节全部拷入，多出的 '\\0' 越界写到 string 数组之外（踩坏栈上相邻变量/返回地址），是典型的栈缓冲区溢出，可能触发栈保护报错或随机崩溃。修正：把数组开成 `char string[11]`（或更大），或改用 `strncpy/strlcpy/snprintf` 限定长度并手动补 '\\0'（C++ 可直接用 std::string）。", "explain": "①指出 '\\0' 使实际长度 11 字节、超出 string[10]（越界）②说明后果（踩坏栈、崩溃）③加分：给出 strncpy/snprintf 等修正写法。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-53", "kind": "subjective", "kind_name": "主观题", "num": 53, "stem": "找出下面这段代码的运行错误：\nvoid GetMemory( char*p )\n{\n    p = (char*) malloc( 100 );\n}\nvoid Test( void )\n{\n    char*str = NULL;\n    GetMemory( str );\n    strcpy( str, \"hello world\" );\n    printf( str );\n}", "options": [], "answer": "问题出在参数按值传递：GetMemory 的形参 p 只是 str 的副本，函数内 `p = malloc(100);` 只改变了副本，函数返回后 str 仍为 NULL；随后 `strcpy(str, \"hello world\")` 对空指针写入，段错误/崩溃。此外 malloc 的内存在示例中从未 free。修正：①用二级指针 `void GetMemory(char p){ *p = malloc(100); }`，调用 `GetMemory(&str);`；②或让函数返回指针 `char *GetMemory(void){ return malloc(100); }`，调用 `str = GetMemory();`；③调用处检查返回值是否为 NULL。顺带指出：`printf(str)` 应写成 `printf(\"%s\", str)`，否则字符串中出现 % 会被当作格式符解析，存在格式化字符串漏洞。", "explain": "①指出值传递导致 str 仍为 NULL ②给出二重指针（或返回指针）的修正 ③加分：malloc 判空/释放、printf(str) 格式化字符串问题。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-54", "kind": "subjective", "kind_name": "主观题", "num": 54, "stem": "找出下面这段代码的运行错误：\nchar*GetMemory( void )\n{\n    char p[] =\"hello world\";\n    return p;\n}\nvoid Test( void )\n{\n    char*str = NULL;\n    str = GetMemory();\n    printf( str );\n}", "options": [], "answer": "GetMemory 中 `char p[] = \"hello world\";` 是函数内的栈上局部数组，函数返回时其栈帧被回收、p 所占空间失效；把它的地址返回给调用者得到悬空指针（dangling pointer），再用它 printf 属于未定义行为——可能“看起来正常”（栈内容尚未被覆盖）也可能乱码或崩溃。修正：①改为 `static char p[] = \"hello world\";`（数据在静态区，但不可重入、多次调用返回同一地址）；②用 malloc 分配，由调用者负责 free；③直接返回字符串字面量 `return \"hello world\";`（位于只读数据区、生命周期为整个程序，但不能修改其内容）。", "explain": "①指出返回栈上局部数组的地址（悬空指针）②说明后果属未定义行为 ③加分：给出 static/动态分配/字符串字面量三种修正。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-55", "kind": "subjective", "kind_name": "主观题", "num": 55, "stem": "用变量 a 给出下面的定义（a~h 八项：整型数/整型指针/二级指针/10 元素整型数组/10 元素指针数组/数组指针/函数指针/函数指针数组）。", "options": [], "answer": "a) 整型数：`int a;`　b) 指向整型数的指针：`int *a;`　c) 指向指针的指针（它指向的指针指向整型数）：`int a;`　d) 10 个整型数的数组：`int a[10];`　e) 10 个指针的数组，指针指向整型数：`int *a[10];`　f) 指向有 10 个整型数数组的指针：`int (*a)[10];`　g) 指向函数的指针，函数有一个整型参数并返回整型数：`int (*a)(int);`　h) 10 个指针的数组，指针指向函数，函数有一个整型参数并返回整型数：`int (*a[10])(int);`\n区分口诀：看变量名先与 [] 还是 * 结合——e) 先结合 [] 是指针数组，f) 有括号先结合 * 是数组指针；h) 是“数组的每个元素都是函数指针”。", "explain": "①a~h 每项写法正确（每项 1 分）②e 指针数组/f 数组指针能区分 ③h 函数指针数组。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-56", "kind": "subjective", "kind_name": "主观题", "num": 56, "stem": "[英语翻译] There are two forms of Bluetooth wireless technology systems: Basic Rate(BR) and Low Energy (LE). …", "options": [], "answer": "蓝牙无线技术系统有两种形式：基本速率（BR）与低功耗（LE）。两种系统均包含设备发现、连接建立与连接机制。基本速率系统包含可选的增强数据速率（EDR）替代媒体访问控制（MAC）与物理层（PHY）扩展。基本速率系统提供同步与异步连接：基本速率的数据速率为 721.2 kb/s，增强数据速率为 2.1 Mb/s，与 802.11 AMP 配合的高速工作可达 54 Mb/s。LE 系统具有旨在支持比 BR/EDR 更低电流消耗、更低复杂度与更低成本产品的特性；LE 系统还面向更低数据率与更低占空比的使用场景与应用。根据用例或应用不同，包含任意可选部分的某一系统可能比另一系统更适用。", "explain": "①关键术语准确：BR/LE、EDR、MAC/PHY、同步与异步连接、数据率（721.2 kb/s、2.1 Mb/s、54 Mb/s）、占空比 ②语句通顺、无漏译。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-57", "kind": "subjective", "kind_name": "主观题", "num": 57, "stem": "Watchdog 有什么作用？", "options": [], "answer": "看门狗（Watchdog）是一个独立/低功耗的定时器，用于在程序跑飞、死锁或任务卡死时自动复位系统：正常运行的程序必须周期性“喂狗”（写特定寄存器或翻转 WDI 引脚）；若因异常未能及时喂狗，计数器溢出并触发复位（也可先中断警告），设备重新启动恢复工作，从而提高无人值守设备的可靠性。\n使用要点：①喂狗动作应放在“只有所有关键任务都健康才可能执行到”的位置，避免在中断里无脑喂狗、掩盖任务挂死；②窗口看门狗（WWDG）还要求喂狗不能太早也不能太晚；③调试时暂停内核常会触发复位，可临时关闭看门狗；④喂狗间隔要小于超时时间并留足余量。", "explain": "①作用：监控程序是否正常，超时未喂则复位系统 ②原理：定时器周期喂狗、溢出触发复位 ③加分：喂狗位置、窗口看门狗、调试注意事项。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-59", "kind": "subjective", "kind_name": "主观题", "num": 59, "stem": "简述你对内存泄漏的理解，它会在什么情况下产生？可以怎么检测和避免？", "options": [], "answer": "内存泄漏指程序动态申请的内存失去引用后仍未归还给系统，进程运行越久占用越大，最终可能耗尽内存导致 OOM/申请失败。产生场景：①malloc/new 之后忘记 free/delete；②函数提前 return 或抛异常，绕过释放代码；③指针被重新赋值，丢失了唯一引用；④容器里存放堆对象指针，容器清空时只删指针未 delete 对象；⑤智能指针循环引用导致引用计数不归零。检测：valgrind（Linux）、AddressSanitizer/LeakSanitizer、Windows CRT 调试堆、IDE 内存分析工具，配合代码审查与长时间压测。避免：遵循“谁申请谁释放”、用 RAII/智能指针、统一封装分配释放接口、保证异常安全（RAII 自动释放）、长生命周期对象改为内存池/预分配。", "explain": "①定义：申请的内存失去引用后未释放 ②产生场景至少 1 点（忘记释放/提前 return/丢失指针/容器未释放对象）③检测手段至少 1 点（valgrind/ASan/代码审查）④避免方法至少 1 点（RAII/智能指针/谁申请谁释放）。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-60", "kind": "subjective", "kind_name": "主观题", "num": 60, "stem": "什么函数不能声明为虚函数？", "options": [], "answer": "不能声明为虚函数的有：①普通（非成员）函数——虚函数机制依赖对象的 this 与 vptr，非成员函数没有；②静态成员函数——不属于对象、没有 this，无法动态绑定；③构造函数——创建对象时 vptr 尚未建立，无法通过虚表调用（语法上也不允许）；④友元函数——不是类成员，不能是虚函数（若友元是别的类的成员函数，可在其所属类中被声明为虚）；⑤内联函数：可以声明为 virtual，但被动态绑定（多态）调用时会失去内联效果，实际不建议；⑥注意：析构函数可以且通常应当是虚函数——基类指针 delete 派生类对象时，只有虚析构才能正确调用派生类析构，否则只析构基类部分（资源泄漏、未定义行为）。", "explain": "至少列出 3 类不能为虚：非成员函数、静态成员函数、构造函数、友元函数（内联可虚但失去内联意义）②加分：析构函数可且应为虚（基类）、override 关键字。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-61", "kind": "subjective", "kind_name": "主观题", "num": 61, "stem": "C++ 中什么数据分配在栈或堆中，New 分配数据是在近堆还是远堆中？", "options": [], "answer": "①分配位置：函数的局部变量、形参、返回地址等随栈帧分配在栈上；new/malloc 申请的对象在堆（C++ 称自由存储区，底层通常也由 malloc/内存池实现）；全局变量、静态变量、字符串字面量在静态存储区（.data/.bss/只读段）。②区别：栈由编译器自动管理、速度快、空间有限；堆由程序手动管理（new/delete 配对）、空间大但分配慢、要防泄漏与碎片。③new 分配的是普通堆内存：它先调用 operator new 申请内存，再调用构造函数。近堆/远堆只是 16 位 x86 段式寻址时代的 near/far 概念，现代 32/64 位系统中没有这种区分，new 得到的就是常规堆地址。", "explain": "①栈：局部变量/函数帧 ②堆：new/malloc（自由存储区）③静态区：全局/静态 ④加分：new 分配普通堆内存；近/远堆是 16 位段式概念、现代系统无此区分。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-62", "kind": "subjective", "kind_name": "主观题", "num": 62, "stem": "多态类中的虚函数表是 Compile-Time 还是 Run-Time 时建立的？为什么？", "options": [], "answer": "虚函数表（vtable）本身是编译期建立的：编译器为每个含虚函数的类生成一张静态表（放在只读数据段），表项是该类各虚函数的最终地址，编译时即确定其布局与内容。运行期发生的只有“绑定/查表”：对象构造时由构造函数设置 vptr（虚表指针）指向所属类的 vtable，通过基类指针/引用调用虚函数时执行 vptr[index] 间接调用，实现动态绑定；对象的动态类型决定 vptr 指向哪张表。换句话说：表在编译期生成，动态绑定在运行期发生（不是运行期才生成表）。派生类若新增虚函数会扩充本类 vtable（通常接在基类表项后面），多重继承则可能有多个 vptr。", "explain": "①vtable 编译期由编译器生成（每个多态类一张）②vptr 运行期在构造时设置、指向对应表 ③动态绑定=运行期查表间址调用 ④加分：多重继承多 vptr、派生类表布局。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-63", "kind": "subjective", "kind_name": "主观题", "num": 63, "stem": "类成员函数的重载、覆盖和隐藏区别？", "options": [], "answer": "①重载（overload）：同一作用域内函数同名、参数列表（个数/类型/顺序）不同，编译期根据实参选择版本，与 virtual 无关；返回值不同不能构成重载。②覆盖/重写（override）：派生类重新定义基类的虚函数，要求函数名、参数列表、返回类型（协变例外）与 cv 限定一致，基类指针/引用调用时运行期动态绑定到派生类版本；C++11 可用 override 关键字让编译器检查。③隐藏（hide/name hiding）：派生类中出现与基类同名的成员（函数或变量），基类同名成员在派生类作用域被屏蔽；即使参数不同（本意想重载）也会隐藏基类所有同名函数——若想保留基类重载版本，需 `using Base::func;` 引入。三者核心区别：作用域（同类 vs 派生类）、是否要求虚函数、绑定时机（编译期 vs 运行期）。", "explain": "①重载：同作用域、同名不同参数、编译期决议 ②覆盖：派生类重写基类虚函数、签名一致、运行期多态 ③隐藏：派生类同名成员屏蔽基类成员（可用 using 解蔽）④加分：override 关键字、返回类型协变。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-64", "kind": "subjective", "kind_name": "主观题", "num": 64, "stem": "Linux 中对不太熟悉的命令提供帮助解释的方法？", "options": [], "answer": "常用方式：①`man cmd` 查看手册（man 2 系统调用、man 3 库函数、man 8 系统管理；`man -k 关键字`/`apropos` 按关键字找命令，`man -f` 看短说明）；②`cmd --help` 或 `cmd -h` 快速查看用法与选项；③`info cmd` 看 GNU 文档（比 man 更详细）；④其他：`whatis`、`/usr/share/doc/` 下的官方文档、`which/whereis` 定位程序路径。", "explain": "①man（含 man -k/章节）②命令行 --help ③加分：info、apropos、which/whereis、/usr/share/doc。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-65", "kind": "subjective", "kind_name": "主观题", "num": 65, "stem": "在 Linux 系统中怎样修改文件的属性（例如读写和可执行的权限）？", "options": [], "answer": "用 chmod 修改文件的读/写/执行权限：①符号方式：`chmod u+x file`（给属主加执行）、`chmod g-w,o-r file`；②数字方式：`chmod 755 file`，每位=r(4)+w(2)+x(1) 之和，755 表示属主 rwx、同组 r-x、其他人 r-x；目录的执行位表示可进入；③递归改：`chmod -R 755 dir`；④更改所有者/所属组：`chown user:group file`、`chgrp group file`（一般需 root）；⑤新建文件的默认权限还受 umask 控制（实际权限=要求权限 & ~umask）。", "explain": "①chmod 用法（符号或数字方式之一，如 755/u+x）②r/w/x 与数字含义 ③加分：chown/chgrp、umask。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-66", "kind": "subjective", "kind_name": "主观题", "num": 66, "stem": "`ls | grep bin` 的作用？", "options": [], "answer": "`ls | grep bin` 的作用：先执行 `ls` 列出当前目录内容，`|`（管道）把 ls 的标准输出交给 `grep bin` 作为输入，只显示“名称中包含字符串 bin”的行（如 bin、sbin、mybin.txt 都会被匹配）。要点：①管道把前一命令的 stdout 连到后一命令的 stdin；②这是文本“包含”匹配而非“前缀”匹配，精确匹配可写 `grep '^bin$'`；③ls 输出多列时可能按列拼接影响匹配，脚本中应写 `ls -1 | grep bin`；④按文件名找文件可用 `ls -d bin*` 或 `find . -maxdepth 1 -name \"bin*\"`。", "explain": "①管道：ls 输出作为 grep 输入 ②过滤效果：显示名称含 bin 的项 ③加分：-1/^bin$/find 等更严谨写法。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-67", "kind": "subjective", "kind_name": "主观题", "num": 67, "stem": "怎样设置 Linux 的环境变量？", "options": [], "answer": "①当前会话临时设置：`export VAR=value`（仅对该 shell 及子进程有效）；只对一条命令生效可写 `VAR=value cmd`；②对当前用户永久生效：把 export 写进 ~/.bashrc（每次打开交互式 shell 执行）或 ~/.profile/~/.bash_profile；③对所有用户永久生效：写进 /etc/profile 或 /etc/environment（/etc/profile.d/*.sh），改完 source 或重新登录；④追加路径：`export PATH=$PATH:/opt/tools/bin`；⑤查看：`echo $VAR`、`env`、`printenv VAR`；取消：`unset VAR`。", "explain": "①export 临时设置（或 VAR=value cmd）②永久写入配置文件（~/.bashrc、/etc/profile）③加分：PATH 追加、查看/取消命令。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-68", "kind": "subjective", "kind_name": "主观题", "num": 68, "stem": "gcc 的编译流程？", "options": [], "answer": "GCC 编译流程分四个阶段：①预处理（`gcc -E`）：展开宏、处理 #include/#if 等，生成 .i 文件；②编译（`gcc -S`）：把 C 代码翻译成汇编 .s（含语法分析与优化）；③汇编（`gcc -c`）：把汇编翻译成机器码目标文件 .o（可重定位目标）；④链接：把多个 .o 与用到的静态库/动态库（-l）合并，完成符号解析与地址重定位，生成可执行文件。`-o` 可指定输出，`-v` 可查看中间过程。理解四阶段便于定位错误：预处理错误（缺头文件/宏）、编译错误（语法/类型）、链接错误（未定义引用/重复定义）。", "explain": "①四阶段顺序与产物：预处理 .i→编译 .s→汇编 .o→链接可执行文件 ②各阶段对应选项 -E/-S/-c ③加分：能按阶段定位预处理器/编译/链接错误。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-69", "kind": "subjective", "kind_name": "主观题", "num": 69, "stem": "Linux 系统进程的通信方式有哪些？", "options": [], "answer": "Linux 进程间通信（IPC）方式：①管道（匿名 pipe，仅亲缘进程）与命名管道（FIFO，有文件路径、无亲缘要求），半双工、字节流；②信号（signal）：异步通知，用于事件告知（如 SIGTERM/SIGUSR1），不传大量数据；③消息队列：内核中按消息组织的链表，可存不同长度的消息；④共享内存：最快——多进程映射同一物理内存，但必须配信号量/互斥锁同步；⑤信号量（POSIX/System V）：用于同步与互斥，本身不传数据；⑥套接字 socket：Unix 域 socket 可本机通信、AF_INET 可跨主机通信，是唯一的跨网络方式。选择建议：数据量大用共享内存+信号量，简单传递用管道/消息队列，跨主机用 socket。", "explain": "①至少答出 4 种（管道/FIFO、信号、消息队列、共享内存、信号量、socket）②加分：每种应用场景或选用原则（如共享内存最快需同步、socket 可跨主机）。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-70", "kind": "subjective", "kind_name": "主观题", "num": 70, "stem": "在 Linux 下怎样访问硬件设备？", "options": [], "answer": "用户态一般通过内核驱动提供的统一接口访问硬件：①设备文件：/dev 下的字符设备/块设备，用 open/read/write/ioctl/mmap 操作（如串口 /dev/ttyS0、I2C /dev/i2c-1、GPIO /dev/gpiochipN）；②sysfs（/sys）与 procfs、debugfs：查看/设置设备属性（如 /sys/class/leds）；③mmap 把设备内存/寄存器映射到用户空间直接读写（如 /dev/mem，需谨慎）；④库/框架封装：libgpiod、alsa、v4l2 等。内核态则直接 ioremap 寄存器地址后用 readl/writel 访问，或调用子系统 API。要点：用户程序不应直接碰物理地址，必须通过驱动/内核提供的接口，以保证抽象、权限与并发安全。", "explain": "①通过 /dev 设备文件 + 驱动（open/read/write/ioctl）②sysfs/procfs、mmap 等方式 ③加分：内核态 ioremap+readl/writel、安全/权限说明。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-71", "kind": "subjective", "kind_name": "主观题", "num": 71, "stem": "熟悉哪块 arm 芯片，这种芯片有哪些功能？（开放题）", "options": [], "answer": "开放题，按“芯片型号 + 内核架构 + 主频/存储 + 外设清单 + 项目中的应用”作答，例如：①STM32F103（ARM Cortex-M3，72 MHz，64~128 KB Flash/20 KB SRAM）：GPIO、USART×3、SPI×2、I2C×2、12 位 ADC×2（多通道）、通用/高级定时器（PWM、输入捕获）、DMA 通道、CAN、USB、RTC、看门狗；项目中用于电机 PWM 驱动 + ADC 采样 + 串口通信；②S5PV210（Cortex-A8，1 GHz）：MMU、DDR2、NAND/SD 启动、LCD 控制器、以太网、USB OTG、I2S 等，用于 Linux 系统移植/多媒体板卡；③也可答 STM32F407、IMX6ULL 等。答法建议：挑最熟的一款，说清外设资源 + 用过的模块（如“用 TIM 输出 PWM 调速、DMA+ADC 采电流、I2C 读传感器”），体现真实性。", "explain": "①说出具体芯片型号与内核（Cortex-M3/M4/A8 等）②至少列举 4 项片上功能/外设 ③加分：结合项目说明外设的实际用法。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-72", "kind": "subjective", "kind_name": "主观题", "num": 72, "stem": "I2C、SPI、UART 通信协议的特点？", "options": [], "answer": "①I2C：两线 SCL（时钟）+ SDA（数据），总线需上拉电阻（开漏输出），支持多主多从，靠 7/10 位设备地址寻址，半双工；标准模式 100 kbit/s、快速模式 400 kbit/s、高速模式 3.4 Mbit/s；有 ACK 应答、起始/停止条件，适合连接传感器、EEPROM 等低速器件，引脚省、抗干扰与速度一般。②SPI：四线 SCK、MOSI、MISO、CS（片选），全双工，主从架构、无地址（靠 CS 选择从机），速率高（数 MHz~数十 MHz），用 CPOL/CPHA 定义采样时刻（模式 0~3）；适合 Flash、显示屏、高速 ADC，线多占引脚、无硬件应答。③UART：异步通信、无时钟线，TX/RX 交叉连接，点对点全双工，双方必须约定相同波特率与数据位/校验位/停止位（如 115200-8-N-1）；TTL 传输距离短，可经 RS-232/RS-485 延长；结构简单、无寻址与仲裁。", "explain": "①I2C：两线、半双工、地址寻址、速度档位、需上拉 ②SPI：四线、全双工、无地址靠片选、速度快 ③UART：异步无时钟线、点对点、约定波特率与帧格式——每项至少 1 个特征。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-73", "kind": "subjective", "kind_name": "主观题", "num": 73, "stem": "动态库与静态库的概念和区别？", "options": [], "answer": "①概念：静态库（Linux .a / Windows .lib）是一组 .o 的归档，链接时被复制进可执行文件；动态库（共享库，Linux .so / Windows .dll）在链接时只记录依赖，运行时由动态链接器加载共享。②链接与运行：静态库在链接期（ld）解析符号；动态库链接期只需存在导入信息，运行期须能找到库文件（-L 指路径、-l 指库名，运行时用 rpath、LD_LIBRARY_PATH 或 /etc/ld.so.conf+ldconfig 定位）。③优缺点：静态库无运行时依赖、部署简单、启动略快，但可执行文件大、内存不共享、库更新需重新链接；动态库体积小、多进程共享代码段节省内存、升级只换库文件，但存在版本兼容（ABI）与依赖查找问题，可用 ldd 检查依赖。④实践中常“静态链接调试验证 + 动态链接发布”。", "explain": "①概念与扩展名（.a vs .so）②链接时机：复制进可执行文件 vs 运行时加载 ③优缺点对比：体积/依赖/共享/升级 ④加分：-L/-l、LD_LIBRARY_PATH/rpath、ldd。 ⑤合并说明：同 附加面试题·面试题7 第 2 题（静态链接和动态链接有什么区别），重复题已合并。", "sec": "2023面试题-3（软件试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-74", "kind": "subjective", "kind_name": "主观题", "num": 74, "stem": "程序输出结果是什么？\nint a[6] = {1,2,3,4,5,6};\nprintf(\"%d\\n\",*((int*)(&a+1)-1));", "options": [], "answer": "输出 `6`。分析：a 是 int[6]，`&a` 的类型是“指向 6 个 int 的数组指针”int(*)[6]，`&a + 1` 按所指类型步长跳过整个数组（6×4=24 字节），指向数组末尾之后；把它强制转换为 int* 后再 −1，退回到最后一个元素 a[5]，即 6。要点：指针加减以“所指类型的大小”为步长；`&a`（数组指针）与 `a`（首元素指针）类型不同——a+1 只跳 4 字节，&a+1 跳 24 字节。", "explain": "①结果 6 ②&a+1 按整个数组步长跳过、强转后 -1 得 a[5] ③加分：区分 &a 与 a 的类型/步长。", "sec": "2023面试题-4（嵌入式笔试测试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-76", "kind": "subjective", "kind_name": "主观题", "num": 76, "stem": "如何避免头文件被重复包含？", "options": [], "answer": "两种方法：①包含卫士（include guard）：在头文件开头写 `#ifndef XXX_H` → `#define XXX_H`，文件末尾 `#endif`；第二次包含时宏已定义，整个文件体被条件编译跳过，从而避免重复包含导致的重复定义/类型重定义告警。宏名要唯一并加项目/文件前缀，避免不同头文件撞名。②`#pragma once`：由编译器保证同一文件只被包含一次，写法简单；它是非标准扩展但 GCC/Clang/MSVC 都支持；对同一文件被硬链接/多路径访问的去重不如 include guard 严格。工程上二者常同时写以兼容不同编译器，或用 `#pragma once` 简化。", "explain": "①#ifndef/#define/#endif 卫士（宏名唯一）②#pragma once ③加分：防重复定义的作用原理、两种方式取舍。", "sec": "2023面试题-4（嵌入式笔试测试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-77", "kind": "subjective", "kind_name": "主观题", "num": 77, "stem": "设计宏定义 `STR(x)`，将 `USART_RATE` 转换成字符串并打印：\n#define USART_RATE 115200\n#define STR(x)____?\nprintf(\"usart rate = %s\\n\",STR(USART_RATE));", "options": [], "answer": "写法（两级宏）：`#define _STR(x) #x` 与 `#define STR(x) _STR(x)`，即先用 _STR 把参数串化，再由外层 STR 先展开参数、后调用 _STR。\n原因：字符串化运算符 # 直接作用在宏参数上时，参数不会先被展开——若只写 `#define STR(x) #x`，`STR(USART_RATE)` 得到的是字符串 \"USART_RATE\"；而两级宏的展开顺序是：外层 STR(USART_RATE) 先把参数展开成 115200，再把 115200 传给 _STR 做 #x，最终得到 \"115200\"，printf 才能打印 usart rate = 115200。要点：# 只能用于宏定义中；## 用于记号拼接；字符串化时不展开是标准规定，所以需要“中间层”宏。", "explain": "①给出 `#define _STR(x) #x` + `#define STR(x) _STR(x)` 两级写法 ②解释单级 #x 不会展开参数、只能得到 \"USART_RATE\" ③加分：#、## 运算符的作用。", "sec": "2023面试题-4（嵌入式笔试测试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-78", "kind": "subjective", "kind_name": "主观题", "num": 78, "stem": "请写出输出结果：\nint main(int argc,char *argv[])\n{\n  char *buff[] ={\"char\",\"int\",\"double\"};\n  printf(\"%c\\n\",*(buff+1)[1]);\n  return 0;\n}", "options": [], "answer": "输出 `d`（经 gcc 实测验证）。关键在于运算符优先级：下标 [] 的优先级高于解引用 *，所以 `*(buff+1)[1]` 实际解析为 `*((buff+1)[1])`：先算 `(buff+1)[1] = *(buff+1+1) = buff[2]`，得到指向字符串 \"double\" 的指针，再 * 解引用取首字符，即 'd'。\n反例提醒：若想得到 \"int\" 中的 'n'，应写 `*(*(buff+1)+1)` 或 `buff[1][1]`；若把表达式误当成 buff[1][1] 就会错答 'n'。考试解析表达式时务必按 C 的优先级/结合性规则来。", "explain": "①结果 'd' ②说明 [] 优先级高于 *，表达式等价于 *((buff+1)[1]) = *(buff[2]) ③加分：指出想取 'n' 的正确写法。", "sec": "2023面试题-4（嵌入式笔试测试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-79", "kind": "subjective", "kind_name": "主观题", "num": 79, "stem": "下面的代码输出什么？为什么？\nvoid foo(void)\n{\n  unsigned int a = 6;\n  int b = -20;\n  (a+b>6)?puts(\">6\"):puts(\"<=6\");\n}", "options": [], "answer": "输出 `>6`。原因：a 是 unsigned int，表达式中 b（int，-20）被隐式转换为 unsigned int：-20 变成 2³²−20，于是 a+b = 6 + (2³²−20) = 2³²−14，作为无符号数远大于 6，条件为真打印 \">6\"。注意此处并不是“a+b 溢出”——运算按模 2³² 进行、结果未溢出，只是 b 被解释成了无符号大数；这类有符号/无符号混用极易出错，应显式转换或统一类型。", "explain": "①结果 \">6\" ②原因：b 被隐式转换为无符号大数参与比较 ③加分：指出属类型转换陷阱（非溢出）与修正方法 ④备注：同 2022面试题3 编程题第 1 题。 ⑤合并说明：同第 242 题（2025面试题-6）与第 25 题（英文版），重复题已合并。", "sec": "2023面试题-4（嵌入式笔试测试卷）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-80", "kind": "subjective", "kind_name": "主观题", "num": 80, "stem": "下面的 C 语言程序有什么错？(a)\nchar *str1=\"123123\"\nchar str2[256];\nchar *str3;\nstrcpy(str2,str1);\nstrcpy(str3,str2);", "options": [], "answer": "该段代码有两处错误：①`char *str1=\"123123\"` 行末缺少分号，语法错误；②`char *str3;` 只定义了一个未初始化的指针（野指针），没有为它分配任何空间，`strcpy(str3,str2)` 会向未知地址写入，导致段错误/内存破坏。修正：给 str3 分配空间——`char str3[256];` 或 `str3 = (char *)malloc(256);`（记得判空与 free）。另可指出：strcpy 无长度检查，工程上应优先用 strncpy/snprintf 并保证目标容量足够。", "explain": "①缺少分号 ②str3 未初始化/未分配空间就 strcpy（野指针）③加分：给出修正写法、strcpy 安全性提醒。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-81", "kind": "subjective", "kind_name": "主观题", "num": 81, "stem": "下面的 C 语言程序有什么错？(b)\nvoid func1(void)\n{\n    int i;\n    for(i=0;i<100;i++)\n    {\n        printf(\"%d\",i);\n        int *p=malloc(sizeof(int));\n        *p=i%10;\n        printf(\"%d\",*p);\n    }\n}", "options": [], "answer": "主要错误：①循环里每次 `malloc(sizeof(int))` 之后从不 free，循环 100 次就泄漏 100 块内存（4×100 字节），循环次数大或长期运行时内存会被耗尽；②未包含 `<stdlib.h>`，malloc 没有声明（C99 起隐式声明非法，编译告警/报错，且返回值类型可能被错误假设）；③未检查 malloc 返回值是否为 NULL；④malloc 在循环内进行也会降低效率。修正：把分配移到循环外，或每轮用完 `free(p);`；也可用普通局部变量替代动态分配。", "explain": "①内存泄漏（循环内 malloc 未 free）②至少再答出 1 点（缺 stdlib.h/未判空）③加分：给出修正方式（循环内 free 或移出循环）。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-82", "kind": "subjective", "kind_name": "主观题", "num": 82, "stem": "下面的 C 语言程序有什么错？(c)\nvoid func1(int i)\n{\n    if(i>100) printf(\"%d\",i)\n    i--;\n    func1(i);\n}", "options": [], "answer": "错误：①递归没有终止条件——无论 i 是多少都会继续调用 func1(i)，单步递减永不到头，最终栈空间耗尽崩溃（栈溢出/Stack Overflow）；②`if(i>100) printf(\"%d\",i)` 缺大括号，且 printf 语句缺分号，属语法错误（编译不过）；③递归参数写法不当，应为 `func1(i-1)` 并给递归加上出口：如 `if (i <= 1) return;` 之后再调用（或按题意当 i>100 时打印并返回）；④函数返回类型应为 void（示例写法不完整）。要点：写递归必须“有出口 + 每次向出口收敛 + 规模递减”。", "explain": "①无限递归（无终止条件）导致栈溢出（必答）②缺大括号/printf 缺分号 ③加分：给出正确写法（结束条件 + func1(i-1)）。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-83", "kind": "subjective", "kind_name": "主观题", "num": 83, "stem": "移植某一平台（arm 架构如 omap2 系列）的 linux 系统，修改的板卡资源的文件大概在源码的什么位置？", "options": [], "answer": "板级资源（内存/时钟/引脚复用/外设注册）在源码树中的位置：①老式（板级文件时代）：`arch/arm/mach-omap2/`，如 board-*.c（设备资源定义、板上 i2c/spi 设备、引脚 mux 配置），同时修改同目录 Kconfig、Makefile，并在 arch/arm/configs/ 的 defconfig 中打开配置；②设备树（DT）时代（现代内核）：`arch/arm/boot/dts/`（也常见于 arch/arm/boot/dts/<厂商>/）下的 omap*.dts/*.dtsi，节点属性描述板卡资源；③具体到 OMAP2：`arch/arm/mach-omap2/board-*.c`、旧内核的 `arch/arm/plat-omap/`、以及 `arch/arm/boot/dts/omap2*.dts`；编译验证：`make ARCH=arm CROSS_COMPILE=arm-linux- dtbs`（或 zImage）。", "explain": "①给出关键目录：arch/arm/mach-omap2（board-*.c）或 arch/arm/boot/dts ②说明修改的文件类型（板级文件/Kconfig/Makefile 或 dts）③加分：区分老内核板级文件与新内核设备树两种方式。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-84", "kind": "subjective", "kind_name": "主观题", "num": 84, "stem": "嵌入式 Linux 根文件系统的制作方法？", "options": [], "answer": "以 BusyBox 手工制作为例：①交叉编译安装 BusyBox（make install 生成 bin/sbin/usr 与 linuxrc），也可用 buildroot/yocto 自动生成；②创建目录骨架 /bin /sbin /lib /usr /etc /dev /proc /sys /tmp /var 等；③把交叉工具链的 C 库（glibc/uClibc/musl、动态库与 ld-linux）拷入 /lib；④配置 /etc：inittab、fstab、init.d/rcS、mdev.conf，设备节点可静态创建或由 mdev/devtmpfs 动态生成，并设置权限/用户组；⑤打包为镜像：ext4（SD/U 盘）、jffs2/ubifs（Nor/Nand）、squashfs（只读压缩），用相应 mkfs 工具生成并烧写；⑥在内核 cmdline 里配好 root= 与 rootfstype=，让内核挂载该根文件系统。", "explain": "①BusyBox（或 buildroot/yocto）生成基本命令 ②目录结构与 /lib 库拷贝 ③inittab/rcS、/dev 节点、fstab 等配置 ④打包为 ext4/jffs2/ubifs/squashfs 镜像 ⑤加分：内核 cmdline root=/rootfstype= 配套设置。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-85", "kind": "subjective", "kind_name": "主观题", "num": 85, "stem": "嵌入式 Linux 启动流程及各个流程作用？", "options": [], "answer": "嵌入式 Linux 典型启动流程及各阶段作用：①上电复位/BootROM：执行芯片内固化代码，按启动配置从 SD、Nand、eMMC、串口等介质查找并加载第一级引导程序；②Bootloader 第一阶段（SPL）：初始化时钟、DDR/内存控制器等最基础硬件，把完整 U-Boot 载入内存；③Bootloader 第二阶段（U-Boot）：初始化串口/网络等，读环境变量，把内核镜像（zImage/uImage）与设备树（dtb）加载到内存，按 bootargs 启动内核；④内核启动：解压、start_kernel 初始化体系结构与各子系统（MMU、调度、驱动、中断），挂载根文件系统，最后启动第一个用户进程 init；⑤init 阶段：读取 /etc/inittab、执行 /etc/init.d/rcS，启动服务、创建设备节点，进入命令行或启动应用；⑥用户应用/上层服务运行。总结：BootROM→SPL→U-Boot→内核→init→应用，每级负责初始化部分硬件并把控制权交给下一级。", "explain": "①阶段齐全：BootROM→bootloader(SPL+U-Boot)→内核→init→应用 ②各阶段作用（初始化时钟/内存、加载内核与 dtb、挂载 rootfs、启动服务）③加分：提及设备树 dtb/bootargs、SPL 与 U-Boot 的分工。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-86", "kind": "subjective", "kind_name": "主观题", "num": 86, "stem": "Linux 第一个启动程式是？", "options": [], "answer": "严格地说，芯片复位后第一个执行的程序是芯片内部固化的 BootROM 引导代码（位于复位向量处，负责最基本的初始化并把第一级引导从存储介质加载进来）；软件层面意义上的“第一个启动程序”通常指 bootloader（如 U-Boot，含 SPL 阶段），它初始化时钟/DDR、加载内核与设备树，再往后是内核与 init。若题目语境是 PC（x86），则第一阶段是 BIOS/UEFI。答题建议：先答 BootROM 固化引导，再答 bootloader（U-Boot/SPL），并简短说明各自职责。", "explain": "①BootROM 固化代码最先运行 ②bootloader（U-Boot/SPL）是软件层面第一阶段（或 x86 的 BIOS/UEFI）③加分：各自职责简述。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-87", "kind": "subjective", "kind_name": "主观题", "num": 87, "stem": "Linux 系统中中断的分上半部分和下半部分的原因？", "options": [], "answer": "分为上半部（top half，硬中断处理）和下半部（bottom half）的原因：①中断处理期间通常会关闭本 CPU 中断（或至少屏蔽同级中断），处理时间越长，其他中断就无法及时响应，系统实时性与吞吐都会恶化；②中断上下文不能睡眠、不能调用可能阻塞的函数，也不宜长时间占用 CPU。所以约定：上半部只做“必须立即完成”的少量工作——应答硬件、清中断标志、保存关键数据（拷到缓冲区/入队列），然后尽快返回；耗时、可延后的处理放到下半部在合适时机执行（软中断 softirq、tasklet、工作队列 workqueue、线程化中断 threaded IRQ 等）。③下半部机制区别：softirq 可并发、性能高但使用受限；tasklet 基于 softirq、每个 CPU 串行、仍处中断上下文不支持睡眠；工作队列运行在进程上下文、可以睡眠，适合耗时或需访问用户态的操作。", "explain": "①原因：缩短中断关闭时间、中断上下文不能睡眠/阻塞、提高实时性与吞吐 ②上半部做最紧急少量工作、下半部延后处理 ③列举下半部机制（softirq/tasklet/workqueue/threaded IRQ）④加分：区分工作队列可睡眠、tasklet 不可睡眠。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-88", "kind": "subjective", "kind_name": "主观题", "num": 88, "stem": "Linux 下进程间通讯的方法有哪些？", "options": [], "answer": "Linux 进程间通信（IPC）常见方式：①管道 pipe（匿名，仅亲缘进程）与命名管道 FIFO（有路径名，任意进程可打开）；②信号 signal：异步事件通知（如 SIGTERM/SIGUSR1），不传大数据；③消息队列：内核维护的消息链表，可按类型取消息；④共享内存：最快，多进程映射同一块内存，但需配信号量/互斥锁同步；⑤信号量：用于同步与互斥（POSIX/System V），本身不传数据；⑥套接字 socket：Unix 域用于本机、AF_INET 可跨主机。选用建议：数据量大→共享内存+信号量；简单传递→管道/消息队列；跨主机→socket。", "explain": "①至少答出 4 种（管道/FIFO、信号、消息队列、共享内存、信号量、socket）②加分：各自特点或选用原则（同第 69 题）。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-89", "kind": "subjective", "kind_name": "主观题", "num": 89, "stem": "Linux 系统中通过什么参数或方法调用动态库？", "options": [], "answer": "①编译链接时：用 `-lxxx` 指定库名（libxxx.so）、`-L<dir>` 指定库搜索路径；需要时用 `-Wl,-rpath=<dir>` 把运行时搜索路径写进可执行文件（$ORIGIN 可表示程序所在目录）；②运行时查找：环境变量 `LD_LIBRARY_PATH=<dir>` 临时添加搜索路径，或把目录写进 /etc/ld.so.conf.d/*.conf 后执行 `ldconfig` 刷新缓存；③运行时手动加载：`dlopen()` 打开库、`dlsym()` 取函数地址、`dlclose()` 关闭（可配合配置实现插件）；④检查：`ldd app`/`readelf -d app` 查看依赖与搜索路径。要点：链接期“找得到库”与运行期“找得到库”是两件事，常见错误是编译通过但运行报 cannot open shared object file。", "explain": "①编译/链接：-l、-L、rpath ②运行时：LD_LIBRARY_PATH、/etc/ld.so.conf+ldconfig ③动态加载：dlopen/dlsym ④加分：ldd 检查依赖、“编译过但运行找不到库”的原因。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-90", "kind": "subjective", "kind_name": "主观题", "num": 90, "stem": "关键字 volatile 有什么含意？", "options": [], "answer": "volatile 的意思是“易变的”：告诉编译器该变量可能在程序控制流之外被改变（硬件寄存器、中断服务程序中修改的变量、多线程共享变量），禁止对其访问做优化——不得缓存到寄存器、不得合并或删除访问、不得把访问移出循环，每次读写都必须真正访问内存。例：`while (!flag);` 若 flag 不加 volatile，编译器在 -O2 下可能只读一次寄存器造成死循环；加上后每轮都从内存读取。注意：volatile 只保证“访问不被优化”，不保证原子性（多字节/多线程并发写仍需互斥或原子操作），也不能替代内存屏障；另外 const volatile 可以组合使用（如只读状态寄存器）。\n（同第 1 题）", "explain": "①防优化（不缓存、不合并访问）②每次访问均真正读写内存 ③适用场景：硬件寄存器/ISR 共享变量 ④加分：不保证原子性与屏障。", "sec": "2023面试题-5（Linux 系统移植工程师试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-91", "kind": "subjective", "kind_name": "主观题", "num": 91, "stem": "求结构体大小（含位域与 packed）：\ntypedef struct data{\n    char m:3;\n    char n:5;\n    short s;\n    union{\n        int a;\n        char b;\n    };\n    int h;\n}__attribute__((packed)) data", "options": [], "answer": "大小是 11 字节。逐项计算：①`char m:3; char n:5;` 两个位域共 8 bit，正好占 1 字节（同一位域存储单元的邻接位域可合并）；②`short s` 占 2 字节；③匿名 union `{int a; char b;}` 取最大成员，占 4 字节；④`int h` 占 4 字节。由于加了 `__attribute__((packed))`，结构体不做对齐填充，直接相加：1+2+4+4 = 11，sizeof = 11。\n注意：packed 的代价是成员可能未对齐（如 short s 在偏移 1、int h 在偏移 3），在 ARM 等平台未对齐访问可能触发异常或明显变慢，编译器会生成逐字节拼接的代码；跨平台协议帧常用 packed，而 MCU 内部尽量让编译器自然对齐。", "explain": "①各成员大小：位域共 1 字节、short 2、union 4、int 4 ②packed 不做填充，合计 11 字节 ③加分：指出未对齐访问的代价与适用场景。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-92", "kind": "subjective", "kind_name": "主观题", "num": 92, "stem": "函数指针数组可以解决哪些问题，主要的应用场景在哪？举例说明。", "options": [], "answer": "函数指针数组的核心价值是“表驱动”（用查表取代分支或大量 if/switch）：①命令/协议分发表——按命令码查表调用处理函数，新增命令只需加表项，不必改 switch 结构；②状态机跳转表——state×event 二维表指向动作函数，清晰且好维护；③中断向量表/驱动操作表——本质就是函数指针数组（如 file_operations）；④回调注册——事件/菜单项与处理函数绑定；⑤屏蔽字（bitmask）配合时还可用掩码做位处理。示例：`void (*handler[])(void) = {fn0, fn1}; handler[cmd]();`（下标要先做范围检查，防止越界调用）。优点：执行快（一次间接跳转）、可读性好、易扩展；缺点：间接调用影响部分调试/优化（如不能被内联）。", "explain": "①表驱动思想（替代 switch/if 链）②举出至少 1 个应用（命令表/状态机/中断向量表/回调）③加分：给出代码示例或优缺点（越界检查、调试影响）。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-93", "kind": "subjective", "kind_name": "主观题", "num": 93, "stem": "写出 matrix 矩阵元素的值（未赋值部分默认为 0）：\nint matrix[3][5];\narrPtr = matrix;\n(*arrPtr)[0] = 5;\narrPtr[2][5] = 6;\n++arrPtr;\n(*arrPtr)[1] = 7;", "options": [], "answer": "row0: [5, 0, 0, 0, 0]\nrow1: [0, 7, 0, 0, 0]\nrow2: [0, 0, 0, 0, 0]\n推导：arrPtr 是 int(*)[5]，`(*arrPtr)[0]=5` 写 matrix[0][0]；`arrPtr[2][5]=6` 即 *(*(arrPtr+2)+5)，列下标 5 已越界（合法列只有 0~4），是越界写（UB）；`++arrPtr` 后指向第 1 行，`(*arrPtr)[1]=7` 写 matrix[1][1]。因此只有 5、7 两个位置被写入矩阵内。\n说明：①题设“未赋值部分默认为 0”便于作答；实际若是局部数组，未初始化元素是随机值（只有全局/静态数组才默认清零）；②`arrPtr[2][5]=6` 是典型的数组越界，会破坏相邻内存，应避免写出这种代码。", "explain": "①5 与 7 的位置正确（row0 首列、row1 第 2 列）②指出 arrPtr[2][5] 越界 ③加分：说明局部数组未初始化不保证为 0。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-94", "kind": "subjective", "kind_name": "主观题", "num": 94, "stem": "如何理解堆和栈？", "options": [], "answer": "①栈（stack）：由编译器与 CPU 自动管理——函数调用时建立栈帧（放参数、局部变量、返回地址、保存的寄存器），函数返回自动收回；空间连续、分配只是移动栈指针所以很快；空间较小（Linux 线程栈一般 8 MB，RTOS 任务栈按需配置），越界会栈溢出、踩坏返回地址或相邻数据。②堆（heap）：由程序员手动管理——malloc/free、new/delete 必须配对；空间大、地址不保证连续、分配要查找空闲块所以较慢；频繁申请释放会产生碎片，忘记释放会造成内存泄漏，越界/重复释放会破坏堆结构。③选择：生命周期与作用域局部的数据用栈；需要跨函数存活、运行时确定大小或大数据（缓冲、对象池）用堆，并优先用 RAII/智能指针等自动管理手段。", "explain": "①栈：自动管理、栈帧/局部变量、连续快速、空间小 ②堆：手动管理 malloc/free、空间大、慢、碎片与泄漏风险 ③加分：选择原则（生命周期/大小/RAII 自动管理）。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-95", "kind": "subjective", "kind_name": "主观题", "num": 95, "stem": "IIC、SPI、UART 通信的作用和区别？", "options": [], "answer": "①I2C：用两根线连接多个低速器件（传感器、EEPROM、RTC）——SCL+SDA、开漏需上拉、半双工、靠 7/10 位地址寻址、多主多从、100k/400k/3.4M 速率档、有 ACK 应答。②SPI：用于高速全双工外设（Flash、LCD、高速 ADC）——SCK/MOSI/MISO/CS 四线、全双工、无地址靠片选、速率可达数十 MHz、由 CPOL/CPHA 组成 4 种模式。③UART：点对点异步串行通信（调试口、GPS/蓝牙模块）——TX/RX 两线、异步无时钟线、全双工、双方须约定相同波特率与帧格式（如 115200-8-N-1）、无寻址、TTL 距离短可经 RS-232/RS-485 延长。对比：线数 I2C 最省、SPI 最多；同步方式 I2C/SPI 有时钟而 UART 异步；双工 SPI/UART 全双工而 I2C 半双工；速度典型 SPI>I2C>UART；多设备分别靠地址/片选/点对点。", "explain": "①三者各自的作用与典型器件 ②至少 3 点对比（线数、同步/异步、双工、速度、多设备方式）③加分：各举一个应用场景。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-96", "kind": "subjective", "kind_name": "主观题", "num": 96, "stem": "列出 STM32 定时器初始化及开启的步骤。", "options": [], "answer": "以 STM32 标准外设库/寄存器为例，初始化并开启通用定时器的步骤：①使能定时器时钟（RCC 的 APB1/APB2 对应 TIMxEN）；②配置时基：设置预分频器 PSC 与自动重装值 ARR（溢出周期 T=(PSC+1)(ARR+1)/TIM_CLK）、计数模式（向上/向下/中央对齐）与时钟分频；③（如需）打开更新中断：TIM_ITConfig + NVIC 优先级配置；④（PWM 场景）配置输出比较/通道：设置 CCR、使能 OCxEN、配置对应 GPIO 复用；⑤使能定时器：TIM_Cmd(TIMx, ENABLE)（寄存器 CR1.CEN=1）；⑥运行中在中断里判断 TIM_GetITStatus、用 TIM_ClearITPendingBit 清标志。顺序要点：先开时钟再配置寄存器，最后开 CEN；PSC/ARR 决定周期与分辨率的折中。", "explain": "①使能时钟（RCC）②配置时基 PSC/ARR、计数模式 ③中断/DMA/PWM 通道配置（按需）④使能定时器（CEN/TIM_Cmd）⑤加分：写出溢出周期公式或说明“先时钟后配置”的顺序。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-97", "kind": "subjective", "kind_name": "主观题", "num": 97, "stem": "外部中断 1 和外部中断 2 的中断处理函数中调用了同一个消息队列，发送了相同的消息，外部中断 1 触发时消息队列可以发送成功，外部中断 2 触发时单片机跑飞死机，请分析可能的原因。", "options": [], "answer": "最可能的原因是两个中断在“优先级”或“API 版本”上不同，触发了 FreeRTOS 的硬性限制：①ISR 必须用带 FromISR 后缀的 API（xQueueSendFromISR 而非 xQueueSend），非 FromISR 版本会做调度/临界区操作，在中断里调用会破坏内核状态、触发断言或跑飞；②调用 FreeRTOS API 的中断，优先级数值必须 ≥ configMAX_SYSCALL_INTERRUPT_PRIORITY（逻辑优先级不高于该阈值）；若外部中断 2 的优先级高于阈值（数值更小），调用 FromISR API 同样非法，在 Cortex-M 上极易死机——这正是两个 ISR 表现不同的典型原因；③FromISR 版本还要传 `pxHigherPriorityTaskWoken` 并在退出前用 `portYIELD_FROM_ISR()` 触发切换；④其他排查点：队列句柄是否在使用前创建、是否共用未保护的共享变量、中断标志是否清除（重复进入）、栈/堆是否耗尽、是否调用了 printf 等不可重入函数。排查：开 configASSERT/栈检测，比较两个 ISR 的 NVIC 优先级配置，核对 ISR 内 API 是否都带 FromISR。", "explain": "①ISR 必须用 FromISR 系列 API ②中断优先级数值 ≥ configMAX_SYSCALL_INTERRUPT_PRIORITY ③pxHigherPriorityTaskWoken/portYIELD_FROM_ISR ④加分：其他排查点。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-98", "kind": "subjective", "kind_name": "主观题", "num": 98, "stem": "二值信号量和互斥量的区别，分别适合什么应用场景？", "options": [], "answer": "①用途不同：二值信号量本质是“同步/事件通知”——任务等待某事件（如中断服务、数据到来），ISR/生产者 give、等待者 take，take 之后信号量变空，适合任务与中断、任务与任务之间的同步；互斥量（Mutex）本质是“互斥锁”——用于保护共享资源临界区，谁上锁谁解锁，保证同一时刻只有一个任务访问资源。②所有权与优先级：互斥量有“持有者”概念，支持优先级继承（低优先级任务持锁时被高优先级任务抢，临时提升其优先级，避免优先级反转）与递归（同一任务可多次获取）；二值信号量没有所有者与优先级继承。③使用禁忌：互斥量不能在 ISR 中使用（会睡眠/挂起），二值信号量可以在 ISR 中用 FromISR 版本 give。④选择建议：保护共享资源→Mutex（优先选带优先级继承的）；事件/状态同步、中断→任务→二值（或计数）信号量。", "explain": "①二值信号量：同步/事件通知，无所有者与优先级继承，可在 ISR 使用 ②互斥量：保护临界区，有所有者、优先级继承（防优先级反转），不可在 ISR 使用 ③各自适用场景 ④加分：递归互斥量、优先级反转的解释。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-99", "kind": "subjective", "kind_name": "主观题", "num": 99, "stem": "xTaskCreate 创建任务时，栈的大小如何设计？", "options": [], "answer": "xTaskCreate 的栈大小参数单位是“字（StackType_t）”而不是字节（Cortex-M 上 1 字=4 字节），设计方法：①静态估算：统计任务内局部变量/数组、函数调用链每层的栈帧（参数、保存寄存器、临时变量）、库函数（printf/sprintf 链很深）与浮点运算的需求，再加中断嵌套可能占用的量；②留足余量：初值给足（如估算的 1.5~2 倍），避免卡边界值；③运行验证：用 `uxTaskGetStackHighWaterMark()` 查看历史最小空闲量，太小就加大；④开启检测：configCHECK_FOR_STACK_OVERFLOW=2，配置钩子 vApplicationStackOverflowHook，把栈填充特定模式（0xA5）后观察残留；⑤递归/深调用与“在栈上定义大数组/大结构体”应改为动态分配或 static，必要时把大缓冲区移出栈；⑥中断若在任务栈上运行（Cortex-M 中断用主栈/PSP，视配置）也要计入。结论：先估后测、以实测水位为准，保留 20%~30% 余量。", "explain": "①按局部变量/调用深度/库函数估算 ②预留余量并用 uxTaskGetStackHighWaterMark 实测调整 ③开启 configCHECK_FOR_STACK_OVERFLOW/栈溢出钩子 ④加分：栈单位是字、中断栈影响、大缓冲区不放栈上。", "sec": "2023面试题-6（嵌入式软件笔试题）", "sec_group": "二、2023 年", "imgs": []}, {"id": "sub-100", "kind": "subjective", "kind_name": "主观题", "num": 100, "stem": "嵌入式系统中，寄存器是 CPU 与硬件外设通信的接口，通常通过\\_\\_\\_\\_（填\"地址\"或\"名称\"）直接访问。", "options": [], "answer": "应填“地址”。CPU 访问外设寄存器走的是存储器映射：每个寄存器都位于外设地址空间中一个固定地址上，程序通过该地址读写寄存器（名称只是人可读的别名/宏）。C 语言中通常写成 `*(volatile uint32_t *)0x40020014 = value;`，或使用厂商头文件宏（如 `GPIOA->MODER`）与库函数；关键要加 volatile，防止编译器优化寄存器访问。", "explain": "①填“地址”②能说明通过地址（存储器映射）访问寄存器、名称只是别名 ③加分：给出 volatile 指针访问方式或宏访问示例。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-101", "kind": "subjective", "kind_name": "主观题", "num": 101, "stem": "中断服务函数（ISR）中通常不能使用\\_\\_\\_\\_（填\"循环\"或\"浮点运算\"），以免阻塞系统。", "options": [], "answer": "填“浮点运算”。原因：51、无 FPU 的 STM32 等 MCU 里浮点由软件库模拟，一次乘除可能消耗几百个时钟周期，在 ISR 中执行会长时间占用 CPU、破坏实时性。补充边界：ISR 并非禁止一切循环，遍历小缓冲区的短循环是允许的；真正要避免的是长耗时、可能阻塞的操作（死等循环、软件延时、printf、浮点运算、动态内存分配等）。ISR 原则是“快进快出”，耗时工作应放到主循环或任务中完成。", "explain": "①填“浮点运算” ②说明耗时原因（无 FPU 时软件模拟、占用 CPU 时间长） ③加分：指出短循环可以接受，禁的是长耗时/阻塞操作。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-102", "kind": "subjective", "kind_name": "主观题", "num": 102, "stem": "STM32 中，配置 GPIO 为输出模式时，需设置\\_\\_\\_\\_寄存器（填寄存器缩写，如 GPIOx_XXX）。", "options": [], "answer": "GPIOx_MODER。该寄存器每 2 位控制 1 个引脚，写入 01 即配置为通用输出模式。输出还需配合：GPIOx_OTYPER（推挽/开漏）、GPIOx_OSPEEDR（翻转速度）、GPIOx_PUPDR（上/下拉）；输出电平写 GPIOx_ODR，或用 GPIOx_BSRR 原子置位/复位。使用前先使能对应 GPIO 时钟（RCC）。", "explain": "①GPIOx_MODER ②01=通用输出 ③加分：OTYPER/OSPEEDR/BSRR，或“先使能 RCC 时钟”。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-103", "kind": "subjective", "kind_name": "主观题", "num": 103, "stem": "串口通信的基本参数包括波特率、数据位、\\_\\_\\_\\_和\\_\\_\\_\\_。", "options": [], "answer": "校验位、停止位。串口一帧的完整格式参数为：波特率、数据位（常见 8/9 位）、校验位（无/奇/偶）、停止位（1/1.5/2 位）。例如“9600 8-N-1”表示 9600bps、8 位数据、无校验、1 位停止位；收发双方这四项必须一致才能正确通信。", "explain": "①校验位 ②停止位 ③加分：举例 8-N-1，或说明参数不一致会通信失败。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-104", "kind": "subjective", "kind_name": "主观题", "num": 104, "stem": "SPI 通信协议有\\_\\_\\_\\_根信号线，分别是\\_\\_\\_\\_、\\_\\_\\_\\_、\\_\\_\\_\\_和\\_\\_\\_\\_。", "options": [], "answer": "4 根；SCK（串行时钟）、MOSI（主出从入）、MISO（主入从出）、CS/NSS（片选，低有效）。SPI 是同步、全双工、一主多从总线：主机提供 SCK 节拍，数据在 MOSI/MISO 上同时收发，靠 CS 选中目标从机。速率可达数十 MHz，适合 Flash、LCD、传感器等短距高速通信；挂多个从机时每片从机各占一根 CS。", "explain": "①4 根 ②四根线名称及方向 ③加分：说明同步/全双工或片选的选通作用。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-105", "kind": "subjective", "kind_name": "主观题", "num": 105, "stem": "I2C 通信协议的起始信号是在\\_\\_\\_\\_为高电平时，\\_\\_\\_\\_由高电平跳到低电平。I2C 通信协议中，每个从设备都有一个唯一的\\_\\_\\_\\_。在嵌入式 C 语言中，static 关键字用于修饰函数时，表示该函数\\_\\_\\_\\_。", "options": [], "answer": "SCL；SDA；设备地址；仅在本文件内可见（内部链接）。要点：①起始/停止条件——SCL 为高时 SDA 由高跳低为起始、由低跳高为停止；②主机靠唯一的从机地址（7 位或 10 位）寻址并指定读写方向；③static 修饰函数时该函数只在本编译单元（.c 文件）内可见，防止多文件重名。", "explain": "每空 1 分：SCL / SDA / 设备地址 / 内部链接（仅本文件可见）。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-106", "kind": "subjective", "kind_name": "主观题", "num": 106, "stem": "对 inline 函数的理解。", "options": [], "answer": "inline 是给编译器的“建议”：把函数体直接展开到调用处，省去压栈、跳转、返回等调用开销，适合短小且频繁调用的函数。它不是强制命令，编译器可以忽略；复杂函数（含循环、递归、体积大）不宜内联，否则代码膨胀、指令缓存命中率下降，反而变慢。补充：头文件中通常写成 static inline；一旦取函数地址，编译器必须生成实体函数。", "explain": "①“建议编译器展开”的机制 ②适用场景（短小高频） ③代价（代码膨胀、可被忽略） ④加分：static inline 或取地址场景。 ⑤合并说明：同 附加面试题·面试题7 第 6 题（频繁使用的短小函数用什么实现、有什么优缺点），重复题已合并。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-107", "kind": "subjective", "kind_name": "主观题", "num": 107, "stem": "do......while 和 while......do 有什么区别？", "options": [], "answer": "区别在“先判断还是先执行”：do-while 先执行一次循环体、再判断条件，循环体至少执行一次；while 先判断条件，条件不成立时循环体一次都不执行。C 语言没有 while...do 语法，题中说法就是 while 循环。适用建议：菜单显示、输入校验等“至少执行一次”的场合用 do-while 更自然，其余循环用 while/for。", "explain": "①执行顺序不同（先执行/先判断） ②do-while 至少执行一次、while 可能 0 次 ③加分：指出 C 无 while...do 语法并给出适用场景。 ④合并说明：同第 396 题；另见第 225 题（填空形式）。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-108", "kind": "subjective", "kind_name": "主观题", "num": 108, "stem": "对中断的理解。", "options": [], "answer": "中断是 CPU 响应异步事件的机制：事件触发（外设置标志、引脚电平变化等）→ CPU 执行完当前指令后保存现场（PC、标志、必要寄存器自动压栈）→ 查向量表跳转执行对应 ISR → 清除中断标志 → 恢复现场返回断点。优点是无需轮询、实时性好、CPU 利用率高。使用要点：ISR 应短小（快进快出）、共享变量加 volatile、临界区保护，耗时工作用标志/队列交主循环或任务处理。", "explain": "①触发→保存现场→执行 ISR→恢复返回 ②免轮询、实时性好的优点 ③加分：ISR 短小、volatile、用队列/标志卸载耗时处理。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-109", "kind": "subjective", "kind_name": "主观题", "num": 109, "stem": "对 a++ 和 ++a 的区别。", "options": [], "answer": "①a++（后置）：表达式先取 a 的原值参与运算，之后 a 再自增 1；②++a（前置）：a 先自增 1，表达式使用自增后的新值。示例：a=5 时 b=a++ 得 b=5、a=6；b=++a 得 a=6、b=6。单独成为一条语句时两者效果相同（都令 a 增 1）；注意同一表达式中不要对同一变量多次自增/自减，属未定义行为。", "explain": "①先取值后自增 / 先自增后取值 ②举例 ③加分：单语句等价、避免同一表达式重复修改同一变量。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-110", "kind": "subjective", "kind_name": "主观题", "num": 110, "stem": "对关键字 static 的理解。", "options": [], "answer": "C 中 static 有三种用法：①修饰局部变量：存于静态存储区，生命周期为整个程序，多次调用间保留数值，只初始化一次（未初始化自动清 0）；②修饰全局变量：链接属性变为内部链接，只在本文件可见，避免多文件重名冲突；③修饰函数：函数只在本文件内可调用，实现“文件私有”封装。嵌入式常用它保存模块内部状态（如调用计数、单例标志）。", "explain": "①局部变量延长生命周期、只初始化一次 ②全局变量限本文件可见（内部链接） ③函数限本文件可见 ④加分：举例（计数器、模块封装）。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-111", "kind": "subjective", "kind_name": "主观题", "num": 111, "stem": "（原图顶部截断）……说明 51 单片机定时器 / 计数器的工作原理。", "options": [], "answer": "51 的定时器/计数器本质是加 1 计数器：对内部机器周期计数就是“定时”，对外部引脚（T0/T1）脉冲计数就是“计数”。工作过程：把初值装入 THx/TLx，每个计数脉冲使计数值加 1，计满（溢出）后硬件自动置位 TFx 标志；程序可查询 TFx，也可开中断在溢出时进入 ISR 处理。工作方式由 TMOD 选择（模式 0：13 位；模式 1：16 位；模式 2：8 位自动重装；模式 3：拆分），启停由 TCON 的 TRx 控制。定时时间 =（满量程 − 初值）× 机器周期。", "explain": "①加 1 计数（定时=数机器周期，计数=数外部脉冲） ②溢出置 TF 标志，可查询或产生中断 ③TH/TL 初值、TMOD/TCON 控制 ④加分：写出定时公式或说明四种工作方式。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-112", "kind": "subjective", "kind_name": "主观题", "num": 112, "stem": "Typedef 与 #define 定义结构体指针，哪种方法更好呢？为什么？\n#define dPS struct s *\ntypedef struct s * tPS;", "options": [], "answer": "推荐 typedef。①typedef 定义的是类型别名，编译器按类型语义处理：tPS a, b; 中 a、b 都是 struct s * 指针；②#define 是预处理文本替换：dPS a, b; 会展开成 struct s *a, b;，只有 a 是指针、b 是普通结构体变量，容易埋雷；③typedef 受编译器类型检查、参与调试信息，而宏无类型检查。现代 C 更推荐 typedef（如 typedef struct s { ... } s_t;）。", "explain": "①指出 #define 展开后只有 a 是指针（文本替换缺陷） ②typedef 是类型别名、a、b 均为指针 ③加分：类型检查/调试信息，或推荐写法。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-113", "kind": "subjective", "kind_name": "主观题", "num": 113, "stem": "下面结构合法吗？如果是它做些什么？`int a = 5, b = 7, c; c = a+++b;`", "options": [], "answer": "合法。C 词法分析采用“最长匹配”原则：a+++b 会被切分为 a ++ + b，即 (a++) + b。因此 c = 5 + 7 = 12，运算后 a 变为 6、b 仍为 7。提示：书写这类复合表达式容易产生歧义，想表达 a+(++b) 必须加括号。", "explain": "①按最长匹配解析为 (a++)+b ②结果 c=12、a=6 ③加分：建议加括号避免歧义。", "sec": "2024面试题-1（嵌入式笔试题）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-114", "kind": "subjective", "kind_name": "主观题", "num": 114, "stem": "战士每次挥刀有 20% 的几率出现会心一击（任何两次挥刀没有关联），求战士挥刀 10 次，在此过程中发生过会心一击的几率，给出计算公式即可。", "options": [], "answer": "1 − (1−0.2)¹⁰ = 1 − 0.8¹⁰ ≈ 1 − 0.1074 = 0.8926，即约 89.26%。思路（对立事件法）：10 次挥刀相互独立，10 次都不出会心的概率是 0.8¹⁰；“至少出现一次”即用 1 减去全不出现的概率。", "explain": "①对立事件公式 1 − 0.8¹⁰ ②结果约 0.8926（89.26%） ③加分：说明“各次独立”的前提。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-115", "kind": "subjective", "kind_name": "主观题", "num": 115, "stem": "逻辑题（海盗分金）：五名海盗等级 1~5，等级最高先提方案，获得至少一半（含自己）同意则通过，否则被抛下船。海盗优先级：生存 > 金币 > 杀人。现有 100 枚金币，1 号应如何分配？", "options": [], "answer": "1 号应提出 98/0/1/0/1：1 号 98 枚、2 号 0 枚、3 号 1 枚、4 号 0 枚、5 号 1 枚。倒推：①剩 4、5 号时，4 号自己一票即过半（2 人需 1 票），4 号独得 100；②剩 3、4、5 号时需 2 票，3 号收买“下一轮得 0”的 5 号（给 1 枚）即通过，方案 99/0/1；③剩 2~5 号时需 2 票，2 号收买下一轮得 0 的 4 号（给 1 枚），方案 99/0/1/0。故轮到 1 号时，3 号与 5 号若否决最多得 0，各给 1 枚即可买票，加上自己共 3 票（5 人至少一半即 ≥3 票）通过。", "explain": "①方案 98/0/1/0/1 ②倒推各子博弈，说明“只收买下一轮收益为 0 者” ③加分：解释 3 票过半的票数要求。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-116", "kind": "subjective", "kind_name": "主观题", "num": 116, "stem": "十六进制数 0x2A 转换为二进制数是\\_\\_\\_\\_。", "options": [], "answer": "0b00101010。方法：十六进制每一位展开成 4 位二进制——2→0010、A(10)→1010，拼接得 0010 1010。验算：0x2A = 2×16+10 = 42 = 32+8+2。", "explain": "①0b00101010（或 0010 1010） ②加分：用“每位十六进制=4 位二进制”或十进制验算说明。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-117", "kind": "subjective", "kind_name": "主观题", "num": 117, "stem": "若 `unsigned char e = 0b11001100;`，将其右移 3 位后的值用二进制表示是\\_\\_\\_\\_。", "options": [], "answer": "0b00011001。unsigned char 是无符号类型，右移 3 位属于逻辑右移、高位补 0：11001100 → 00011001（即 0x19 = 25）。对比：有符号负数是算术右移（补符号位），本题不受影响。", "explain": "①0b00011001 ②说明无符号右移高位补 0（逻辑右移）。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-118", "kind": "subjective", "kind_name": "主观题", "num": 118, "stem": "一个传感器输出的电压范围是 0 - 5V，对应物理量范围是 0 - 100，当传感器输出电压 2.5V 时，对应的物理量值是\\_\\_\\_\\_。", "options": [], "answer": "50。线性映射：物理量 = 满量程物理量 × 输入电压/满量程电压 = 100 × 2.5/5 = 50。", "explain": "①结果 50 ②写出 2.5/5×100 的比例式。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-119", "kind": "subjective", "kind_name": "主观题", "num": 119, "stem": "UART 的波特率为 9600 时，按照无校验，1 位停止位计算，传输 1Byte 所需要花费的时间是多少，单位秒。", "options": [], "answer": "约 1.04ms（0.00104s）。无校验、1 位停止位时一帧共 10 位：1 位起始 + 8 位数据 + 1 位停止。每位时间 = 1/9600 s ≈ 104.17µs，故 1 字节时间 t = 10/9600 ≈ 1.042×10⁻³ s ≈ 1.04ms，相当于约 960 字节/秒。", "explain": "①帧长 10 位并说明组成 ②t = 10/9600 ≈ 1.04ms ③加分：换算约 960 字节/秒。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-120", "kind": "subjective", "kind_name": "主观题", "num": 120, "stem": "下面的代码输出是什么，为什么？\nVoid foo(void)\n{\n    Unsigned int a = 10;\n    Int b = -15;\n    a = a + b;\n    (a>10)?puts(\">10\"):puts(\"<=10\");\n}", "options": [], "answer": "输出 `>10`。原因：a 是 unsigned int，表达式 a+b 中 b（int，−15）先被转换为 unsigned int（0xFFFFFFF1），再与 10 相加得 0xFFFFFFFB（约 42.9 亿），远大于 10，条件为真。这就是“有符号与无符号混合运算按无符号规则”的典型坑；另注意题面代码中 Void/Unsigned/Int 的大小写笔误。", "explain": "①结果 >10 ②说明混合运算按无符号转换、负数变大正数 ③加分：指出大小写笔误或避免有符号/无符号混算。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-121", "kind": "subjective", "kind_name": "主观题", "num": 121, "stem": "（15 分）某智能电表在偏远地区频繁出现通信断连，可能的原因有哪些？请从硬件设计（天线、电源）、软件配置（重传机制、信号强度检测）、环境因素（遮挡、电磁干扰）方面分析，并提出至少两种优化方案。", "options": [], "answer": "原因分析（三方面）：\n① 硬件：天线增益低/驻波比差、馈线损耗大、安装位置被金属遮挡；电池供电时电压跌落导致发射功率不足；模块与天线阻抗不匹配。\n② 软件：无重传或重传次数/退避策略不合理；缺少 RSSI/SNR 等信号质量检测与切换、发射功率自适应；心跳与断线重连机制不健全。\n③ 环境：山区/地下室信号弱、雨衰与温度影响、周围电磁或同频干扰、基站覆盖与负载波动。\n优化方案（≥2）：A. 天线外置/换高增益天线并做匹配调试，保证方向与高度；B. 电源侧加储能电容，降低发射瞬间压降；C. 软件增加重传（指数退避）、心跳保活、数据缓存补传，避免丢数据；D. 信号质量低于阈值时告警或自适应降速/提功率；E. 必要时改用穿透力更强的 NB-IoT/LoRa 或加中继。", "explain": "①硬件、软件、环境三方面各至少 1 点 ②优化方案至少 2 种并说明效果 ③加分：数据补传/告警等运维手段。", "sec": "2024面试题-2（拓阳科技面试题-1）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-122", "kind": "subjective", "kind_name": "主观题", "num": 122, "stem": "学习/使用过什么芯片？（开放题）", "options": [], "answer": "开放题，按“型号 → 资源 → 用途”的结构作答并保持真实，例如：STM32F103C8T6（Cortex-M3、72MHz、64KB Flash/20KB SRAM，含 3 路 USART、2 路 SPI、2 路 I2C、12 位 ADC），项目中用 SPI 驱动 W25Q64、用 USART+DMA 与上位机通信；也使用过 STC89C52（51 内核）做数码管/按键小系统；ESP32（WiFi/BLE）用于联网数据采集。要点：熟悉其中 1~2 款即可，能说出内核、主频、存储、常用外设和实际用途最加分。", "explain": "①给出芯片型号 ②说出资源（内核/主频/存储/外设） ③结合实际项目说明用途。", "sec": "2024面试题-3（4 份试卷合集）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-123", "kind": "subjective", "kind_name": "主观题", "num": 123, "stem": "上面你使用过的芯片，它有几种 IO 模式？", "options": [], "answer": "STM32 的 GPIO 共有 8 种模式：①输入 4 种——浮空、上拉、下拉、模拟输入；②输出 2 种——推挽输出、开漏输出；③复用功能 2 种——复用推挽、复用开漏。它们由 MODER 配合 OTYPER、PUPDR 组合配置。典型应用：ADC 通道引脚用模拟输入；I2C 用复用开漏（需外部上拉）；驱动 LED 用推挽输出；按键用上拉或浮空输入。", "explain": "①8 种模式分类说全 ②点名“推挽/开漏、复用” ③加分：配置寄存器或典型应用举例。", "sec": "2024面试题-3（4 份试卷合集）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-126", "kind": "subjective", "kind_name": "主观题", "num": 126, "stem": "如果要读取热敏电阻的温度，应该使用什么外设？", "options": [], "answer": "使用 ADC。热敏电阻阻值随温度变化，把它与一个固定电阻分压，将分压点电压送入 ADC 采样，再由阻值-温度关系换算温度：可由分压式反推 Rt，然后查表或套用 B 值公式（1/T = 1/T0 + ln(Rt/R0)/B）。加分点：分压电阻选与热敏电阻同量级使灵敏度最高；ADC 参考电压要稳定；若用 DS18B20 这类数字传感器则改走单总线，不需要 ADC。", "explain": "①ADC ②分压采样+换算流程 ③加分：B 值公式/查表或参考电压要求。 ④合并说明：同第 203 题（2025面试题-8），重复题已合并。", "sec": "2024面试题-3（4 份试卷合集）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-127", "kind": "subjective", "kind_name": "主观题", "num": 127, "stem": "UART 是几线的？哪几线？", "options": [], "answer": "两线：TX（发送，Transmit）与 RX（接收，Receive）。连接时两端交叉：A 的 TX 接 B 的 RX、A 的 RX 接 B 的 TX；此外还要共地（GND）作为电平基准。UART 是异步全双工：无时钟线，靠约定的波特率同步。进阶：需要硬件流控时可加 RTS/CTS，这两根属于扩展信号线。", "explain": "①TX、RX ②加分：交叉连接（TX→RX）与共地，或说明全双工异步。 ④合并说明：同第 204 题（2025面试题-8），重复题已合并。", "sec": "2024面试题-3（4 份试卷合集）", "sec_group": "三、2024 年", "imgs": []}, {"id": "sub-128", "kind": "subjective", "kind_name": "主观题", "num": 128, "stem": "RS485 是 A

# ============================================================
#  utils_gui 主题配色配置（参照 VS Code Dark+ 风格）
#  修改后保存，重新打开程序即可生效（无需重新编译）
#
#  颜色格式: RRGGBB（十六进制，无 # 前缀）
#  以 # 开头的行是注释
# ============================================================

[theme]
name=Dark Plus (VS Code 风格)

# 详情窗格背景（暗色）
background=1E1E1E

# 普通文本
default=D4D4D4

# 元信息（函数名/分类/示例等说明文字，使用亮绿色注释风格）
meta=8BC34A

# 类型关键字：int / void / uint8_t / struct / typedef ...
keyword=569CD6

# 控制关键字：if / for / while / return / switch ...
control=C586C0

# 类型名（struct/enum/union 后的名字）
type=4EC9B0

# 函数名
func=DCDCAA

# 形参
param=9CDCFE

# 字符串 / 字符
string=CE9178

# 数字
number=B5CEA8

# 注释
comment=6A9955

# 宏 / 预处理指令
macro=C586C0

# 头文件（#include <...>）
header=CE9178
